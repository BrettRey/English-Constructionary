id: how-come-explanation-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>How come</i>"
  summary: "<i>How come</i> asks for an explanation of something that seems to be the case."
  body: |-
    <i>How come the gate is open?</i> asks why the gate is open. It treats the open gate as a fact that needs explaining.

    The pattern differs from an ordinary <i>why</i> question. <i>Why is the gate open?</i> puts the verb before the subject. <i>How come</i> keeps the subject first: <i>how come the gate is open</i>.
  examples:
    - text: '[How come the gate is open?]'
      from: entry
    - text: Why is the gate open?
      from: entry
  try: Ask the same question with <i>Why</i> and with <i>How come</i>. Which word order does each one use?
teacher:
  summary: Shows learners <i>how come</i> as a way to ask for an explanation, with different word order from <i>why</i>.
  explain: '<i>How come</i> plus a subject and finite predicate asks for an explanation of an actual or apparently actual state of affairs: <i>How come the gate is open?</i> An ordinary <i>why</i> question allows <i>Why is the gate open?</i>, with the verb before the subject. <i>How come</i> normally keeps subject-before-auxiliary order in the corresponding main-clause question. This dictionary relates it to open interrogative clauses and marks the analysis as provisional.'
  terms: Open interrogative is this dictionary’s term for questions with a question word, traditionally <i>wh</i>-questions.
  examples:
    - text: '[How come the gate is open?]'
      from: entry
    - text: Why is the gate open?
      from: entry
  contrasts:
    - text: Why is the gate open?
      from: entry
      note: Verb before subject.
    - text: How come the gate is open?
      from: entry
      note: Subject first.
  watch_for:
    - A learner might read <i>How come</i> as asking in what way something happened.
    - A learner might put the verb first after <i>how come</i>, as after <i>why</i>.
  activity: Give students a set of observed situations (a light on, a late bus). They ask each with <i>Why</i> and with <i>How come</i>, and mark where the subject sits.
child:
  hook: What is another way to ask why?
  explain: "<i>How come</i> can ask why. <i>How come the gate is open?</i> means the same as asking why it is open. <i>How come</i> starts the question, then the gate comes next."
  examples:
    - text: '[How come the gate is open?]'
      from: entry
    - text: Why is the gate open?
      from: entry
  play: Ask a friend about something odd you see with <i>How come</i>. Then ask with <i>Why</i> and notice which words move.
