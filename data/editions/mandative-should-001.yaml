id: mandative-should-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Should</i> after a strong requirement
  summary: After a word that states a strong requirement, a <i>that</i>-clause can use <i>should</i> to say what is required.
  body: |-
    In <i>It is essential that the gate should remain closed</i>, the <i>should</i> is part of the requirement. The clause after <i>that</i> tells us what has to happen to the gate.

    A word like <i>essential</i> strongly requires something, and <i>should</i> can follow it in this way. The <i>should</i> doesn't weaken the requirement. It doesn't turn the sentence into a mild piece of advice.

    This dictionary also has a related entry for a version without <i>should</i>, which can replace it in the same kind of sentence.
  examples:
    - text: It is essential [that the gate should remain closed].
      from: entry
  try: Say <i>It is essential that the gate should remain closed</i>. Is the requirement strong or weak?
teacher:
  summary: Helps explain <i>should</i> in <i>that</i>-clauses after strongly requiring words like <i>essential</i>, and why it doesn't soften the requirement.
  explain: 'In a mandative content clause, <i>should</i> can follow the subject and take a plain-form VP: <i>that the gate should remain closed</i>. The pattern realizes a requirement or recommendation. <i>Should</i> is possible with strongly requiring predicates such as <i>essential</i>, and the modal need not weaken the strength of the matrix requirement. This dictionary has a separate entry for the alternating form without <i>should</i>. This dictionary marks the analysis as provisional and short.'
  terms: Mandative construction is the usual name. The related form without <i>should</i> is called the subjunctive mandative in this dictionary.
  examples:
    - text: It is essential [that the gate should remain closed].
      from: entry
  contrasts:
    - text: It is essential that the gate should remain closed.
      from: entry
      note: Strongly requiring predicate with should; the requirement isn't weakened.
  watch_for:
    - A learner might hear <i>should</i> as mild advice, when here it need not weaken the strength of the requirement.
    - A learner might read <i>should</i> as a prediction about the gate, when it states what is required.
  activity: Students complete sentences beginning <i>It is essential that ...</i> with a subject and <i>should</i> plus a plain verb, then discuss how strong each requirement feels.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
