id: demonstrative-distance-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: This one or that one
  summary: <i>This</i>, <i>that</i>, <i>these</i> and <i>those</i> direct attention to something and can present it as near or far.
  body: |-
    In <i>Could you pass me that blue folder over there?</i>, <i>that</i> points to one folder among others, and <i>over there</i> adds where it is. The demonstrative words are <i>this</i> and <i>that</i>, with <i>these</i> and <i>those</i> for more than one. They present the thing as near or far in some relevant dimension.

    Distance in space is one such dimension, but it isn't required. <i>This</i> and <i>that</i> can also pick out different candidates without any earlier noun phrase to point back to, and they can refer to things said earlier. This dictionary treats the analysis as provisional.
  examples:
    - text: Could you pass me [that blue folder] over there?
      from: entry
    - text: I'll take [these shoes].
      from: constructed
  try: Point at two similar objects, one near and one farther away. Which would you call <i>this one</i> and which <i>that one</i>?
teacher:
  summary: Helps explain <i>this</i>, <i>that</i>, <i>these</i> and <i>those</i> as words that direct attention and mark proximal or distal position.
  explain: 'The pattern is an NP with a demonstrative determiner: <i>this</i> or <i>that</i> with a singular, <i>these</i> or <i>those</i> with a plural. It directs attention to a referent and presents it as proximal or distal in a relevant deictic dimension. <i>This</i> and <i>that</i> can select different candidates without a prior noun-phrase antecedent. Spatial distance is one dimension and isn''t obligatory in discourse-deictic uses. The determiner function is realized by determinatives: <i>this</i>, <i>that</i>, <i>these</i> and <i>those</i>. The analysis is provisional.'
  terms: Traditional grammars call <i>this</i>, <i>that</i>, <i>these</i> and <i>those</i> demonstrative adjectives or demonstrative pronouns. In this grammar they are determinatives, and Determiner is their function.
  examples:
    - text: Could you pass me [that blue folder] over there?
      from: entry
    - text: I'll take [these shoes].
      from: constructed
  contrasts:
    - text: Could you pass me that blue folder over there?
      from: entry
      note: Distal demonstrative, with spatial distance.
    - text: Could you pass me this blue folder?
      from: constructed
      note: Proximal demonstrative.
  watch_for:
    - A learner might think <i>this</i> and <i>that</i> must mark physical distance, when the dimension can be something else in discourse.
    - A learner might use a singular <i>this</i> or <i>that</i> where the noun is plural, instead of <i>these</i> or <i>those</i>.
  activity: Place several similar objects around the room, some near and some farther away. Students ask a partner to pass or point to particular ones using <i>this</i>, <i>that</i>, <i>these</i> and <i>those</i>, and discuss what each choice picks out.
child:
  hook: When do you say <i>this one</i> and when do you say <i>that one</i>?
  explain: Words like <i>this</i> and <i>that</i> help you point out one thing. You might use <i>this</i> for something close and <i>that</i> for something farther away. For more than one, say <i>these</i> or <i>those</i>.
  examples:
    - text: Could you pass me [that blue folder] over there?
      from: entry
    - text: I'll take [these shoes].
      from: constructed
  play: Put two toys on a table, one close and one far. Ask a friend to pass one using <i>this</i> or <i>that</i>. Then add more toys and use <i>these</i> and <i>those</i>.
