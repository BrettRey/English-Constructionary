id: demonstrative-distance-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: This one or that one
  summary: This, that, these and those direct attention to something and can present it as near or far.
  body: |-
    In Could you pass me that blue folder over there?, that points to one folder among others, and over there adds where it is. The demonstrative words are this and that, with these and those for more than one. They present the thing as near or far in some relevant dimension.

    Distance in space is one such dimension, but it isn't required. This and that can also pick out different candidates without any earlier noun phrase to point back to, and they can refer to things said earlier. This dictionary treats the analysis as provisional.
  examples:
    - text: Could you pass me [that blue folder] over there?
      from: entry
    - text: I'll take [these shoes].
      from: constructed
  try: Point at two similar objects, one near and one farther away. Which would you call this one and which that one?
teacher:
  summary: Helps explain this, that, these and those as words that direct attention and mark proximal or distal position.
  explain: 'The pattern is an NP with a demonstrative determiner: this or that with a singular, these or those with a plural. It directs attention to a referent and presents it as proximal or distal in a relevant deictic dimension. This and that can select different candidates without a prior noun-phrase antecedent. Spatial distance is one dimension and isn''t obligatory in discourse-deictic uses. The determiner function is realized by determinatives: this, that, these and those. The analysis is provisional.'
  terms: Traditional grammars call this, that, these and those demonstrative adjectives or demonstrative pronouns. In this grammar they are determinatives, and Determiner is their function.
  examples:
    - text: Could you pass me [that blue folder] over there?
      from: entry
    - text: I'll take [these shoes].
      from: constructed
  contrasts:
    - text: Could you pass me that blue folder over there?
      from: entry
      note: Distal demonstrative, with spatial distance.
    - text: Could you pass me this blue folder?
      from: constructed
      note: Proximal demonstrative.
  watch_for:
    - A learner might think this and that must mark physical distance, when the dimension can be something else in discourse.
    - A learner might use a singular this or that where the noun is plural, instead of these or those.
  activity: Place several similar objects around the room, some near and some farther away. Students ask a partner to pass or point to particular ones using this, that, these and those, and discuss what each choice picks out.
child:
  hook: When do you say this one and when do you say that one?
  explain: Words like this and that help you point out one thing. You might use this for something close and that for something farther away. For more than one, say these or those.
  examples:
    - text: Could you pass me [that blue folder] over there?
      from: entry
    - text: I'll take [these shoes].
      from: constructed
  play: Put two toys on a table, one close and one far. Ask a friend to pass one using this or that. Then add more toys and use these and those.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
