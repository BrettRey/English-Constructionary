id: comparative-er-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Comparing with -er
  summary: Adding -er to a word like tall says that one thing ranks higher than another on a scale.
  body: |-
    Taller, deeper, sooner, nearer and fewer all compare two points on a scale. The -er form can also say by how much, as in much taller or two inches taller, and it can name what is being compared with, as in taller than Bill.

    Sometimes the comparison is left to context, as in the taller building. The same idea can come out as more with another adjective, as in more expensive. Which adjectives take -er varies from word to word.
  examples:
    - text: '[taller]'
      from: entry
    - text: '[much taller]'
      from: entry
    - text: '[two inches taller]'
      from: entry
    - text: '[taller than Bill]'
      from: entry
  try: Compare two things near you with taller, deeper or nearer. Can you say by how much, and than what?
teacher:
  summary: Useful for explaining -er comparatives, the than-phrase, and how a difference like two inches can be added.
  explain: 'A comparative with -er compares two points on the scale named by its base: taller, deeper, sooner, nearer and fewer. It can also express a difference (much taller, two inches taller) and the basis of comparison, whether explicit (taller than Bill) or contextual (the taller building). The same comparative relation can be expressed by a suffix with tall or by more with expensive; the suffix does not freely spread from one gradable adjective to another. Either form can introduce a than-standard and accept a differential where the adjective allows it.'
  terms: 'Comparative: the traditional name. Standard of comparison: what follows than. Differential: the measured difference, as in two inches taller.'
  examples:
    - text: '[taller]'
      from: entry
    - text: '[two inches taller]'
      from: entry
    - text: '[taller than Bill]'
      from: entry
    - text: '[the taller building]'
      from: entry
  contrasts:
    - text: taller than Bill
      from: entry
      note: Suffix comparative with an explicit standard.
    - text: more expensive than the book
      from: constructed
      note: The same relation expressed with more.
  watch_for:
    - A learner might expect -er wherever a comparison is wanted, though more expensive expresses the same relation with expensive.
    - A learner might read taller in the taller building as having no basis of comparison, when context supplies one.
  activity: Students compare classroom objects. They use -er or more, add a measured difference (two inches taller), and add a than-phrase.
child:
  hook: Which is taller, you or your teacher?
  explain: Add -er to words like tall and deep to compare two things. Tall becomes taller. Deep becomes deeper. Then say what you compare it with, like taller than Bill.
  examples:
    - text: '[taller than Bill]'
      from: entry
    - text: The pool is [deeper] than the pond.
      from: constructed
  play: Compare two things in the room with an -er word. Add than and name the other thing.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: child.explain now limits -er to words like tall and deep, as the entry says the suffix does not freely spread (more expensive).'
