id: it-auxiliary-clitic-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: The <i>'s</i> in <i>it's</i> can stand for <i>is</i> or <i>has</i>
  summary: The short form <i>it's</i> can mean <i>it is</i> or <i>it has</i>, and a participle after <i>it</i>, such as <i>been</i> or <i>being</i>, can show which.
  body: |-
    The <i>'s</i> in <i>It's been repaired</i> stands for <i>has</i>, so it means <i>It has been repaired</i>. The <i>'s</i> in <i>It's being repaired</i> stands for <i>is</i>, so it means <i>It is being repaired</i>. The participle after the <i>'s</i>, <i>been</i> or <i>being</i>, helps you work out which one it is.

    Don't confuse either of these with <i>its</i>, the word that goes before a noun to show belonging. It has no apostrophe and doesn't stand for <i>is</i> or <i>has</i>.
  examples:
    - text: '[It’s] been repaired.'
      from: entry
    - text: '[It’s] being repaired.'
      from: constructed
  try: Say <i>It's been repaired</i> and <i>It's being repaired</i>, then say each one in full. Which short word did you put back in each?
teacher:
  summary: Helps learners decide whether <i>'s</i> after <i>it</i> is <i>is</i> or <i>has</i>, and keep <i>it's</i> apart from <i>its</i>.
  explain: 'After the pronoun <i>it</i>, <i>''s</i> can be a reduced auxiliary, either <i>is</i> or <i>has</i>. The host (<i>it</i>) and the participial form that follows together distinguish them. A following participle such as <i>been</i> signals <i>has</i> (<i>It’s been repaired</i>), while <i>being</i> signals <i>is</i> (<i>It’s being repaired</i>). The genitive <i>its</i> is different: it combines with a nominal in its ordinary dependent use and isn''t a reduced auxiliary. The analysis is marked provisional and rests on two cited CGEL sections and a constructed illustration, so keep the explanation to these two contrasts.'
  terms: 'Contraction of <i>is</i> or <i>has</i>. In this dictionary, a clitic: a reduced auxiliary attached to <i>it</i>. The genitive <i>its</i> is a separate word.'
  examples:
    - text: '[It’s] been repaired.'
      from: entry
    - text: '[It’s] being repaired.'
      from: constructed
  contrasts:
    - text: It’s been repaired.
      from: entry
      note: The <i>'s</i> is <i>has</i>, because <i>been</i> follows.
    - text: It’s being repaired.
      from: constructed
      note: The <i>'s</i> is <i>is</i>, because <i>being</i> follows.
  watch_for:
    - A learner might read the <i>'s</i> in <i>It's been repaired</i> as <i>is</i>, when the following participle signals <i>has</i>.
    - A learner might write <i>it's</i> where the genitive <i>its</i> belongs, though only <i>its</i> combines with a following noun as a dependent.
  activity: Give students sentences with <i>it's</i> followed by different forms. They expand each <i>'s</i> to <i>is</i> or <i>has</i>, circle the participle (<i>been</i> or <i>being</i>) that told them where there is one, and then add one sentence using the genitive <i>its</i>.
child:
  hook: What two words can hide inside <i>it's</i>?
  explain: <i>It's</i> can be short for <i>it is</i> or for <i>it has</i>. Words like <i>been</i> and <i>being</i> can show which. <i>It's been repaired</i> means <i>it has been repaired</i>. <i>It's being repaired</i> means <i>it is being repaired</i>.
  examples:
    - text: '[It’s] been repaired.'
      from: entry
    - text: '[It’s] being repaired.'
      from: constructed
  play: Say each example, then say it again with the short word spelled out in full. Look at <i>been</i> or <i>being</i> after <i>it's</i>. Does it help you choose between <i>is</i> and <i>has</i>?
