id: since-time-anchor-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Where a stretch of time begins
  summary: "<i>Since</i> marks the starting point of the period being talked about."
  body: |-
    In <i>They've lived abroad since the factory closed</i>, the closing of the factory is the starting point. The period in question runs from then up to the later time we're talking about, which here is now.

    The part after <i>since</i> can be a date, a noun phrase or a whole clause. Swapping <i>since</i> for <i>because</i> changes things. <i>Because</i> can keep a cause-and-effect reading in some cases, but it drops the contribution of marking when the period began. This dictionary marks the analysis as provisional.
  examples:
    - text: They've lived abroad [since the factory closed].
      from: entry
    - text: We've been friends [since 2015].
      from: constructed
  try: Finish the sentence <i>I've known my best friend since ...</i> in two ways, with an event and with a date.
teacher:
  summary: Helps explain <i>since</i> as the earlier boundary of an interval, and how it differs from because.
  explain: A PP headed by <i>since</i> supplies the earlier boundary of the interval under discussion, relative to a later reference time. Its complement can be a date, an NP or a finite clause. In <i>They've lived abroad since the factory closed</i>, the closure anchors the beginning of the relevant span. Substituting <i>because</i> preserves a causal interpretation in some cases but removes this temporal-bounding contribution. This dictionary treats the pattern as a specialization of the PP and marks the analysis as provisional.
  terms: "<i>Since</i> here is a preposition in CGEL's sense, including when its complement is a clause."
  examples:
    - text: They've lived abroad [since the factory closed].
      from: entry
    - text: We've been friends [since 2015].
      from: constructed
  contrasts:
    - text: They've lived abroad since the factory closed.
      from: entry
      note: The closing marks the start of the span.
    - text: They've lived abroad because the factory closed.
      from: constructed
      note: "<i>Because</i> gives a reason and doesn't mark the start of the span."
  watch_for:
    - A learner might read <i>since the factory closed</i> as giving a reason, as <i>because</i> would.
    - A learner might leave out the later reference time that the period runs up to.
  activity: Students put an event on a timeline and write one <i>since</i> sentence marking the start of the period. A partner draws the span from the <i>since</i> point to the reference time.
child:
  hook: When did something start? How do you say it?
  explain: "<i>Since</i> tells when a long stretch of time began. <i>They've lived abroad since the factory closed.</i> The closing was the start."
  examples:
    - text: They've lived abroad [since the factory closed].
      from: entry
    - text: We've been friends [since 2015].
      from: constructed
  play: Say how long you've done something using <i>since</i> and the day it began, like <i>since my birthday</i>.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
