id: since-time-anchor-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Where a stretch of time begins
  summary: Since marks the starting point of the period being talked about.
  body: |-
    In They've lived abroad since the factory closed, the closing of the factory is the starting point. The period in question runs from then up to the later time we're talking about, which here is now.

    The part after since can be a date, a noun phrase or a whole clause. Swapping since for because changes things. Because can keep a cause-and-effect reading in some cases, but it drops the contribution of marking when the period began. This dictionary marks the analysis as provisional.
  examples:
    - text: They've lived abroad [since the factory closed].
      from: entry
    - text: We've been friends [since 2015].
      from: constructed
  try: Finish the sentence I've known my best friend since ... in two ways, with an event and with a date.
teacher:
  summary: Helps explain since as the earlier boundary of an interval, and how it differs from because.
  explain: A PP headed by since supplies the earlier boundary of the interval under discussion, relative to a later reference time. Its complement can be a date, an NP or a finite clause. In They've lived abroad since the factory closed, the closure anchors the beginning of the relevant span. Substituting because preserves a causal interpretation in some cases but removes this temporal-bounding contribution. This dictionary treats the pattern as a specialization of the PP and marks the analysis as provisional.
  terms: Since here is a preposition in CGEL's sense, including when its complement is a clause.
  examples:
    - text: They've lived abroad [since the factory closed].
      from: entry
    - text: We've been friends [since 2015].
      from: constructed
  contrasts:
    - text: They've lived abroad since the factory closed.
      from: entry
      note: The closing marks the start of the span.
    - text: They've lived abroad because the factory closed.
      from: constructed
      note: Because gives a reason and doesn't mark the start of the span.
  watch_for:
    - A learner might read since the factory closed as giving a reason, as because would.
    - A learner might leave out the later reference time that the period runs up to.
  activity: Students put an event on a timeline and write one since sentence marking the start of the period. A partner draws the span from the since point to the reference time.
child:
  hook: When did something start? How do you say it?
  explain: Since tells when a long stretch of time began. They've lived abroad since the factory closed. The closing was the start.
  examples:
    - text: They've lived abroad [since the factory closed].
      from: entry
    - text: We've been friends [since 2015].
      from: constructed
  play: Say how long you've done something using since and the day it began, like since my birthday.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
