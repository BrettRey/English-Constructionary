id: let-permissive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Letting someone do something
  summary: <i>Let</i> can be followed by a person and then a plain verb to say that an action is allowed to go ahead.
  body: |-
    In <i>They let Jo use the key</i>, the speakers allow Jo to do something. The pattern is <i>let</i>, then the person, then the verb in its plain form, as in <i>use</i>.

    The meaning is permission. The action is presented as allowed to proceed. Some other ways of giving permission work a little differently. For example, you can say <i>Jo was allowed to use the key</i>, but the ordinary passive with <i>let</i> and <i>to</i> isn't available in this use.
  examples:
    - text: They [let Jo use the key].
      from: entry
    - text: Jo was allowed to use the key.
      from: entry
  try: Say <i>They let Jo use the key</i>. Who is giving permission, and who gets to act?
teacher:
  summary: Helps explain <i>let</i> plus a person plus a plain verb as permission, and why it lacks the passive that <i>allow</i> has.
  explain: 'In this use, <i>let</i> takes an NP and a bare infinitival: <i>let Jo use the key</i>. The sentence presents an action as permitted or allowed to proceed. The verb after the NP is in the plain form, and <i>let</i> licenses it directly. The passive behaves differently from other permission verbs. An ordinary verbal passive with <i>let</i> and <i>to</i> is unavailable in this use, unlike <i>Jo was allowed to use the key</i>. Teaching <i>let</i> beside <i>allow</i> makes the difference easy to see.'
  terms: The bare infinitival is sometimes called a bare infinitive. This dictionary also calls the form after <i>Jo</i> the plain form of the verb.
  examples:
    - text: They [let Jo use the key].
      from: entry
  contrasts:
    - text: They let Jo use the key.
      from: entry
      note: <i>Let</i> with a plain form after <i>Jo</i>.
    - text: Jo was allowed to use the key.
      from: entry
      note: <i>Allow</i> has an ordinary passive with <i>to</i>.
  watch_for:
    - A learner might put <i>to</i> before the verb after <i>Jo</i> because <i>allow</i> takes <i>to</i> in <i>Jo was allowed to use the key</i>.
    - A learner might try to form the passive of <i>let</i> in this use the way the passive of <i>allow</i> is formed.
  activity: Students write four sentences about permission at school with <i>let</i> followed by a person and a plain verb. A partner rewrites each one with <i>allow</i> and compares the two verbs.
child:
  hook: What do you call it when a grown-up says you can do something?
  explain: When someone lets you do something, they allow it. Say <i>let</i>, then who gets to do it, then the action. <i>Dad lets Mia use his bike</i>. The action word stays plain.
  examples:
    - text: Dad [lets Mia use his bike].
      from: constructed
    - text: They [let Jo use the key].
      from: entry
  play: Finish this sentence three ways, with a different person and a different action each time. <i>My teacher lets ...</i> Then read your three sentences aloud to a friend.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
