id: deverbal-noun-of-argument-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Event nouns followed by <i>of</i>
  summary: A noun made from a verb can be followed by <i>of</i> and a phrase naming someone or something involved in the event.
  body: |-
    In <i>the arrival of the guests</i>, <i>arrival</i> names an event, and <i>of the guests</i> says who arrived. In <i>the destruction of the city</i>, the city is the thing destroyed. The <i>of</i>-phrase names a participant in the event, and the noun decides which role that participant has.

    When the event has someone who does it, that person can come first with <i>'s</i>, as in <i>the enemy's destruction of the city</i>: the enemy did the destroying, and the city was destroyed. The <i>of</i>-phrase can also help pin down which event is meant, as in <i>the failure of Washington Mutual</i>.
  examples:
    - text: '[the failure of Washington Mutual]'
      from: entry
    - text: '[the arrival of the guests]'
      from: entry
    - text: '[the destruction of the city]'
      from: entry
    - text: '[the death of the king]'
      from: entry
    - text: '[the enemy''s destruction of the city]'
      from: entry
  try: Turn a verb you know into a noun (<i>arrive</i>, <i>fail</i>, <i>destroy</i>). Which words can follow it with <i>of</i>?
teacher:
  summary: Helps explain how an <i>of</i>-phrase after a deverbal noun carries a participant of the underlying verb.
  explain: In an NP with a deverbal noun head, the <i>of</i>-PP is a complement that expresses a semantic argument of the underlying verb, such as the entity that arrived or the entity destroyed. The noun and the construction select the role. With a transitive source, a genitive can express the agent and the <i>of</i>-phrase the affected participant (<i>the enemy's destruction of the city</i>). The <i>of</i>-complement can help identify the event, and an indefinite determiner remains possible (<i>a repainting of the hall</i>). This dictionary notes that the genitive form alternates with the <i>of</i>-form (<i>the failure of WM</i> and <i>WM's failure</i>), with the genitive preferred for agents and the <i>of</i>-PP for non-agentive arguments.
  terms: Traditional grammars may call such nouns nominalizations or verbal nouns.
  examples:
    - text: '[the arrival of the guests]'
      from: entry
    - text: '[the destruction of the city]'
      from: entry
    - text: '[the enemy''s destruction of the city]'
      from: entry
    - text: '[a repainting of the hall]'
      from: entry
  contrasts:
    - text: the failure of Washington Mutual
      from: entry
      note: The <i>of</i>-phrase names the entity that failed.
    - text: Washington Mutual's failure
      from: constructed
      note: The genitive alternative for the same participant.
  watch_for:
    - A learner might read the <i>of</i>-phrase in <i>the destruction of the city</i> as the one doing the destroying, when it is the thing destroyed.
    - A learner might think a noun with an <i>of</i>-argument must be definite, though <i>a repainting of the hall</i> has an indefinite determiner.
  activity: Give students event nouns (<i>arrival</i>, <i>destruction</i>, <i>death</i>, <i>failure</i>). They add an <i>of</i>-phrase to each and say who or what it names and what role that participant has in the event.
