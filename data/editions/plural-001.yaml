id: plural-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Words that mean more than one
  summary: Plural forms mark more than one thing, or a group of things taken together, and they trigger matching forms elsewhere in a sentence.
  body: |-
    Plural forms appear in nouns, pronouns and some other small words, not just nouns: <i>cats</i>, <i>they</i> and <i>these</i> all point to more than one. Some plurals name a group, as in <i>Kennedys</i>, or types rather than a mass, as in <i>wines</i>. Others mark recurring instances, as in <i>headaches</i>.

    The plural form controls ordinary plural agreement, as in <i>The scissors are blunt</i>. Yet the description can be about one instrument. So the plural form tells us how the grammar treats the word, not strictly how many objects there are.
  examples:
    - text: '[cats]'
      from: entry
    - text: '[they]'
      from: entry
    - text: '[these]'
      from: entry
    - text: '[Kennedys]'
      from: entry
    - text: '[wines]'
      from: entry
    - text: The [scissors] are blunt.
      from: constructed
  try: Name something you use that is described with a plural word but is a single object. What verb goes with it?
teacher:
  summary: Overview of plural forms across nouns, pronouns and determinatives, and what they signal.
  explain: 'Plural morphology (<i>-s</i>, <i>-es</i>, irregular, zero) applies to common and proper nouns, pronouns and determinatives. It signals non-singular construal and triggers agreement. This dictionary lists four uses: non-singular entities (<i>cats</i>, <i>they</i>, <i>these</i>), countable aggregates (<i>Kennedys</i>, <i>many</i>), countable taxonomic categories, that is, types rather than non-count (<i>wines</i>), and recurring instances (<i>headaches</i>). Form and number of referents can come apart: <i>the scissors are blunt</i> has plural agreement but can describe one instrument, because grammatical number is separate from the number of objects described. This dictionary marks this as provisional, with medium confidence.'
  terms: Words like <i>scissors</i> are sometimes called plural-only nouns. This dictionary contrasts plural with singular.
  examples:
    - text: '[cats]'
      from: entry
    - text: '[they]'
      from: entry
    - text: '[these]'
      from: entry
    - text: '[Kennedys]'
      from: entry
    - text: '[many]'
      from: entry
    - text: '[wines]'
      from: entry
    - text: '[headaches]'
      from: entry
  contrasts:
    - text: The scissors are blunt.
      from: constructed
      note: Plural agreement, though the description can be about one instrument.
  watch_for:
    - A learner might assume a plural form must mean more than one object.
    - A learner might read <i>wines</i> as several bottles only, when it can mean types of wine.
  activity: Students sort words (<i>cats</i>, <i>they</i>, <i>these</i>, <i>Kennedys</i>, <i>wines</i>, <i>headaches</i>) by which use of the plural they show, then add one example of their own for each use.
child:
  hook: Why do we say <i>the scissors are</i>, when you hold only one pair?
  explain: Plural words like <i>cats</i> and <i>they</i> mean more than one. Some words, like <i>scissors</i>, look plural even when you mean one tool. We say <i>The scissors are blunt</i>.
  examples:
    - text: The cats are asleep.
      from: constructed
    - text: The scissors are blunt.
      from: constructed
  play: Make a list of plural words. Which ones go with <i>are</i>? Find something you use that is one thing but has a plural word.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
