id: np-pron-reciprocal-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Each other</i> and <i>one another</i>
  summary: <i>Each other</i> and <i>one another</i> say that the members of a group do the same thing to one another.
  body: |-
    In <i>Kim and Pat defended each other</i>, Kim defended Pat and Pat defended Kim. The phrase <i>each other</i> points back to the group, and it works as the object of the verb.

    It also has an owner form, <i>each other's</i>, as in <i>They blamed each other's parents</i>. For bigger groups the meaning can be looser: the relation might hold only between neighbours in a line. The other form is <i>one another</i>.
  examples:
    - text: Kim and Pat defended [each other].
      from: entry
    - text: They blamed [each other's] parents.
      from: entry
  try: Say <i>Kim and Pat defended each other</i>. Who defended whom? Does it change if you use <i>one another</i>?
teacher:
  summary: Explains <i>each other</i> and <i>one another</i> as reciprocal anaphors and contrasts them with reflexives.
  explain: A reciprocal anaphor relates members of an antecedent group to other members of that group. In <i>Kim and Pat defended each other</i>, the ordinary reading is that Kim defended Pat and Pat defended Kim. <i>Each other</i> and <i>one another</i> can occur as genitive determiners, as in <i>each other's parents</i>, whereas reflexives lack corresponding genitives. For larger groups, weaker readings occur, such as relations only between neighbours in a line, so full pairwise reciprocity is too strong in some cases. A reflexive links a pronoun to its own referent, while a reciprocal relates group members. The dictionary marks this account as provisional.
  terms: Reciprocal pronoun is the usual name for <i>each other</i> and <i>one another</i>. This grammar groups them as a reciprocal anaphor.
  examples:
    - text: Kim and Pat defended [each other].
      from: entry
    - text: They blamed [each other's] parents.
      from: entry
  contrasts:
    - text: Kim and Pat defended [each other].
      from: entry
      note: Reciprocal; each defends the other.
    - text: Sue defended [herself].
      from: constructed
      note: Reflexive; the object is the same person as the subject.
  watch_for:
    - A learner might use <i>each other</i> when the object is the same person as the subject.
    - A learner might think a reciprocal means every member relates to every other member, when larger groups can have weaker readings.
  activity: Students stand in pairs and say what they did to <i>each other</i> (high-fived, thanked). Then groups of five say what happened and decide whether each person really did it to every other person.
child:
  hook: What do two friends do to <i>each other</i>?
  explain: <i>Each other</i> says that two people do the same thing to one another. If <i>Kim and Pat defended each other</i>, Kim defended Pat and Pat defended Kim.
  examples:
    - text: Kim and Pat defended [each other].
      from: entry
    - text: The two friends hugged [each other].
      from: constructed
  play: Pick two friends. Say what they did, using <i>each other</i>. Then say the same thing with <i>one another</i>.
