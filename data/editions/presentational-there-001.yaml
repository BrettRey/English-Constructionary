id: presentational-there-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>There</i> introducing something that appears
  summary: A sentence can begin with <i>there</i>, then a verb of appearing, then the thing that appears.
  body: |-
    In <i>There appeared a crack in the plaster</i>, the word <i>there</i> doesn't point to a place. It opens the sentence, the verb <i>appeared</i> follows, and then comes the thing being introduced, a crack.

    The pattern introduces something through an event of appearance, presence or emergence. Only certain verbs fit this frame, and the opening <i>there</i> need not say where the crack is. This dictionary marks the account as provisional.
  examples:
    - text: '[There appeared a crack in the plaster].'
      from: entry
  try: Can you think of other verbs about appearing or emerging that could follow <i>there</i> at the start of a sentence?
teacher:
  summary: For advanced classes, <i>there</i> plus a lexical verb of appearance introducing a new entity.
  explain: Here dummy <i>there</i> is followed by a lexical verb and a postverbal NP, as in <i>There appeared a crack in the plaster</i>. The pattern introduces an entity through an event of appearance, presence or emergence. Only certain lexical predicates license dummy <i>there</i> in this frame, and the opening <i>there</i> needn't locate the crack. This dictionary says ordinary event-transitive verbs are excluded. The analysis is provisional, and this dictionary gives only one illustration, so check examples with a reference before teaching others as equivalents.
  terms: Sometimes called existential or presentational <i>there</i>; this dictionary calls this one presentational <i>there</i> with a lexical verb.
  examples:
    - text: '[There appeared a crack in the plaster].'
      from: entry
  watch_for:
    - A learner might read <i>there</i> as a place adverb meaning in that location.
    - A learner might assume any verb can follow dummy <i>there</i>.
  activity: Show the sentence and ask students to say where the crack is. Discuss that the information about location comes from the phrase <i>in the plaster</i>, not from <i>there</i>.
