id: unless-exceptive-conditional-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>Unless</i> as an exception"
  summary: A phrase starting with unless presents a condition as an exception to the main claim.
  body: |-
    In <i>The door will stay locked unless Lee comes back</i>, the part with <i>unless</i> presents a condition as the exception. Outside the cases in which Lee comes back, the door remains locked.

    The sentence doesn't need to say what happens if Lee does return. It only tells us what to expect in the ordinary case, and flags the exception.

    The dictionary marks this account as provisional.
  examples:
    - text: The door will stay locked [unless Lee comes back].
      from: entry
    - text: We'll eat outside [unless it rains].
      from: constructed
  try: Say what you expect to happen on Saturday, then add an <i>unless</i> part naming an exception.
teacher:
  summary: Helps explain <i>unless</i> as marking the exception to the main claim.
  explain: The pattern is a prepositional phrase headed by <i>unless</i> plus a finite clause. It presents the condition as an exception to the main claim. In <i>The door will stay locked unless Lee comes back</i>, the door remains locked outside cases in which Lee comes back, and the sentence need not determine what happens if Lee does return. This dictionary marks its analysis as provisional and relates it to the <i>if</i>-conditional. Teach it as an exception marker with its own meaning, and compare it with <i>if</i>.
  terms: "<i>Unless</i> is a preposition here."
  examples:
    - text: The door will stay locked [unless Lee comes back].
      from: entry
    - text: We'll eat outside [unless it rains].
      from: constructed
  contrasts:
    - text: The door will stay locked unless Lee comes back.
      from: entry
      note: Names the exception; the return case is left open.
  watch_for:
    - A learner might think the sentence says what happens when Lee does return, though this dictionary says it need not.
    - A learner might treat <i>unless</i> as a plain synonym of <i>if not</i>.
  activity: Students write a rule for the classroom with <i>unless</i>, then swap and identify the exception in each other's rule.
child:
  hook: What could change your plan?
  explain: The word <i>unless</i> names an exception. <i>We'll eat outside unless it rains</i>. Rain is the exception.
  examples:
    - text: We'll eat outside [unless it rains].
      from: constructed
    - text: The door will stay locked [unless Lee comes back].
      from: entry
  play: Say a plan, then add <i>unless</i> and an exception. Take turns, and make the exceptions silly but possible.
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: "Fixed: curious.summary and curious.try no longer say the unless phrase names the one case in which the claim fails or that it changes the outcome (the entry leaves open what happens if the condition is met); 'one exception' changed to 'an exception' in the title, child.hook and child.explain. Also fixed (unflagged): removed the 'negative conditional' term; 'the entry' replaced by 'this dictionary'."
