id: quasi-modal-be-to-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Are to</i>, for rules and arrangements
  summary: A form of <i>be</i> followed by <i>to</i> and a verb can express a requirement, an official arrangement or a planned event.
  body: |-
    In <i>Staff are to report at eight</i>, the words <i>are to</i> tell staff what's required or arranged. There's no ordinary adjective or noun after <i>are</i>; the <i>to</i> plus verb carries the meaning.

    The same pattern can use <i>was</i> or <i>were</i> for an arrangement made in the past, and that doesn't assert the arrangement was carried out. This dictionary marks the account as provisional.
  examples:
    - text: Staff [are to report] at eight.
      from: entry
  try: Think of an instruction that might be posted at a workplace or school. Can you put it in the form <i>people are to do something</i>?
teacher:
  summary: Explains <i>be</i> plus to-infinitive for requirements, arrangements and projected events.
  explain: 'A finite form of <i>be</i> followed by a <i>to</i>-infinitival can present a requirement, an official arrangement or a projected event: <i>Staff are to report at eight</i>. The required or arranged reading occurs without a predicative NP or adjective. It can use preterite <i>was</i> or <i>were</i> for a past arrangement without asserting fulfilment. This dictionary marks the analysis provisional and calls this a quasi-modal, a VP of finite <i>be</i> plus a <i>to</i>-infinitival.'
  terms: Sometimes called a semi-modal or periphrastic modal; this dictionary calls it quasi-modal be to.
  examples:
    - text: Staff [are to report] at eight.
      from: entry
  watch_for:
    - A learner might read <i>are to</i> as plain <i>be</i> plus a preposition <i>to</i>.
    - A learner might think a past form such as <i>was to</i> means the event happened.
  activity: Students rewrite a short list of rules as <i>are to</i> sentences, such as <i>visitors are to sign in</i>, and discuss who is giving the instruction.
