id: definite-cardinal-of-pronoun-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: The two of us, the four of us
  summary: The, a number and of plus a pronoun together name a group and say how many are in it.
  body: |-
    I was there with Jo, Lee and Pat. The four of us shared a tent. The phrase the four of us can point to a group of four that includes the speaker, and it gives the group's size at the same time. When a larger group is also in the picture, the phrase needs a set of four the listener can pick out.

    Without the, it works differently. In There were six of us, and four of us had bikes, four of us picks out some of a larger group rather than naming the whole group. This dictionary treats the analysis as provisional.
  examples:
    - text: I was there with Jo, Lee and Pat. [The four of us] shared a tent.
      from: entry
    - text: There were six of us, and [four of us] had bikes.
      from: entry
  try: Think of a group you were part of. How would you name it with the, a number and of us? What if only some of the group did something?
teacher:
  summary: Helps explain the four of us (a recoverable group of four) versus four of us (an unspecified subset of a larger group).
  explain: The pattern is NP[the + cardinal + of + personal pronoun], as in the four of us. It identifies a group while explicitly giving its size, and the article determines the whole NP. The numeral must match a contextually recoverable group, so the four of us can describe the group of four that includes the speaker. Without the, four of us can simply pick an unspecified subset of a larger us-group. Cardinals with of-phrases can also occur in ordinary partitive syntax. The analysis is provisional.
  terms: The is a determinative (often called the definite article).
  examples:
    - text: I was there with Jo, Lee and Pat. [The four of us] shared a tent.
      from: entry
    - text: There were six of us, and [four of us] had bikes.
      from: entry
  contrasts:
    - text: The four of us shared a tent.
      from: entry
      note: Definite; the numeral matches the contextually salient group.
    - text: Four of us had bikes.
      from: constructed
      note: No the; can pick an unspecified subset of a larger group.
  watch_for:
    - A learner might read four of us, without the, as naming a whole group of four, when it can pick an unspecified subset of a larger group.
    - A learner might use the two of us for a pair that isn't the contextually identified group.
  activity: Describe a picture of a group of six, with three friends sitting together. Students write sentences about the whole group and about parts of it, with and without the, and say which group each sentence names.
child:
  hook: What can you call a group of friends and say how many without naming each one?
  explain: You can name a group by saying the, a number and of us. The four of us shared a tent. It points to a group of four that you can pick out from the situation.
  examples:
    - text: '[The four of us] shared a tent.'
      from: entry
    - text: '[The two of us] walked home.'
      from: constructed
  play: Pick a group you were in, like a team or a table at lunch. Say how many were in it using the number and of us. Then say what some of the group did.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: teacher summary and watch_for no longer say the four of us names the whole group (the entry allows it to pick a recoverable set of four within a larger salient group, and says four of us without the can pick an unspecified subset); contrast note reworded; ''can describe'' replaces ''describes''; child explanation now says the group can be picked out from the situation. Dismissed: none.'
