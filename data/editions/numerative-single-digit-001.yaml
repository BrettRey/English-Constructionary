id: numerative-single-digit-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: The words for zero to nine
  summary: The single-word numbers from zero to nine can do any job a number word does, though they don't all behave alike.
  body: |-
    The numbers from zero to nine are single words: <i>one</i>, <i>two</i>, <i>three</i> and so on up to <i>nine</i>, plus <i>zero</i>. They can stand in front of a noun, multiply a bigger number, or be added to one, as in <i>forty-two</i>.

    They don't all act the same. <i>One</i> goes with a singular noun, while <i>zero</i> can go with a plural, as in <i>zero defects</i>. This dictionary says that being a single-digit number doesn't tell you how a word will agree or what kind of noun follows it.
  examples:
    - text: '[one]'
      from: entry
    - text: '[five]'
      from: entry
    - text: '[zero] defects'
      from: constructed
    - text: I read [one] chapter.
      from: constructed
  try: Say <i>one apple</i>, then <i>zero apples</i>. Which has a plural ending on the noun?
teacher:
  summary: Covers the digit words zero to nine, and why they don't all select the same kind of noun.
  explain: Single-digit numeratives are the monomorphemic lexemes <i>zero</i> to <i>nine</i>. They specify cardinality and can function as a factor, as an addend or as a determiner, and they combine freely in compounds. They don't predict uniform agreement or determiner selection. Zero participates as the lexeme <i>zero</i> and can determine a plural (<i>zero defects</i>). <i>One</i> selects a singular count nominal. This dictionary separates the numerical representation, the digit, from grammatical number. It is provisional.
  terms: Numeral, or cardinal numeral, is the traditional name. Digit refers to the written symbol 0 to 9, which this dictionary distinguishes from the lexeme.
  examples:
    - text: '[one]'
      from: entry
    - text: '[five]'
      from: entry
    - text: '[zero] defects'
      from: constructed
    - text: '[one] chapter'
      from: constructed
  watch_for:
    - A learner might expect <i>one</i> to go with a plural noun in the way <i>five</i> does.
    - A learner might think <i>zero</i> must go with a singular noun, because it stands for none.
  activity: Students write a noun phrase for each word from zero to nine (for example <i>zero defects</i>, <i>one chapter</i>, <i>five dogs</i>) and sort them by whether the noun is singular or plural.
