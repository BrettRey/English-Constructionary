id: nom-adjp-mod-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Describing words in front of a noun
  summary: An adjective phrase placed before a noun says something about it, as in old men.
  body: |-
    In old men, the word old says something about the men: they are old. The describing word comes before the noun it describes.

    Not every case is that direct. In other men, the property depends on the context. And in a former president, former doesn't describe the person in the way old describes men. It modifies the relation that president expresses. This dictionary notes that an adjective placed before a noun doesn't have to work in the same way after the verb be.
  examples:
    - text: '[old] men'
      from: entry
    - text: '[other] men'
      from: entry
    - text: a [former] president
      from: constructed
  try: Say an adjective before a noun, such as old men. Then try the adjective after is or are. Does it still say the same thing?
teacher:
  summary: Teaches pre-head adjective phrases in the nominal, and why attributive adjectives need not have predicative uses.
  explain: 'A pre-head adjective phrase attributes a property to the head noun: in old men, old attributes age to the men. Other men is a special case where the property is relative to context, with a complement-set relation. The modifier must be an adjective phrase headed by an adjective, in pre-head position in the nominal. A pre-head adjective needn''t have a matching predicative use: in a former president, former modifies the relation expressed by president, and the president is former doesn''t give the same reading. This dictionary treats this as a specific type of pre-head modification.'
  terms: Attributive adjective is the traditional term for an adjective before the noun; predicative adjective is the traditional term for one after a verb such as be.
  examples:
    - text: '[old] men'
      from: entry
    - text: '[other] men'
      from: entry
    - text: a [former] president
      from: constructed
  contrasts:
    - text: old men
      from: entry
      note: Direct property attribution.
    - text: other men
      from: entry
      note: Property relative to context; complement-set relation.
  watch_for:
    - A learner might think every adjective before a noun can also follow be with the same meaning.
    - A learner might read other in other men as describing a property of the men themselves, as old does.
  activity: Students write short noun phrases with an adjective before the noun. For each, they decide whether the adjective states a plain property or depends on context, and compare answers.
child:
  hook: Which word tells you more about the men in old men?
  explain: A describing word can come before a noun. In old men, the word old tells us about the men. The describing word comes first.
  examples:
    - text: The [old] men sat down.
      from: constructed
    - text: '[old] men'
      from: entry
  play: Pick a noun, like dog or house. Add a describing word before it. Then try a different one, and see how the picture changes.
