id: np-pron-personal-gen-indep-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Mine, yours, hers and the rest
  summary: The words mine, yours, his, hers, ours and theirs can stand alone as a full phrase, with no noun after them.
  body: |-
    In The red one is mine, the word mine says whose the red one is, and nothing follows it. Those seats are theirs works the same way. Each of these words fills a whole phrase's spot on its own.

    Compare my. It goes before a noun, as in my book. The word his is the same in both uses: his book and The book is his.
  examples:
    - text: The red one is [mine].
      from: entry
    - text: Those seats are [theirs].
      from: entry
    - text: '[Mine] fell.'
      from: constructed
  try: Say my book. Now say whose book it is using just one word and no noun.
teacher:
  summary: Teaches the stand-alone forms mine, yours, his, hers, ours, theirs and how they differ from my, your and their before a noun.
  explain: An independent personal genitive pronoun is one of mine, yours, his, hers, ours or theirs, functioning as an NP. A form such as mine can occupy an NP slot without an overt noun, as in Mine fell. The dependent counterpart, such as my, requires a nominal. His is formally shared across the two slots. The dictionary lists independent and dependent forms and shows their different distributions. It marks this account as provisional.
  terms: Sometimes called absolute possessive pronouns or possessive pronouns. This grammar uses genitive, not possessive, and calls my, your and the like dependent genitive pronouns.
  examples:
    - text: The red one is [mine].
      from: entry
    - text: Those seats are [theirs].
      from: entry
    - text: '[Mine] fell.'
      from: constructed
  contrasts:
    - text: This is [my] book.
      from: constructed
      note: Dependent form, followed by a noun.
    - text: This book is [mine].
      from: constructed
      note: Independent form, no noun follows.
    - text: That is [his] book. That book is [his].
      from: constructed
      note: The same form fills both slots.
  watch_for:
    - A learner might add a noun after mine, yours or theirs.
    - A learner might expect his to change form between the two uses, when it stays the same.
  activity: Give students pairs of sentences with my, your, her and their before a noun. They rewrite each with the stand-alone form and no noun.
child:
  hook: Can one little word say who owns the whole thing?
  explain: Words like mine, yours and theirs can stand alone. They say who owns something without naming it. The red one is mine.
  examples:
    - text: The red one is [mine].
      from: entry
    - text: Those seats are [theirs].
      from: entry
  play: Point to things in the room. Say who owns each one using only mine, yours, his, hers, ours or theirs.
