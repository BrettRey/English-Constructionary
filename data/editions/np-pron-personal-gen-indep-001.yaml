id: np-pron-personal-gen-indep-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Mine</i>, <i>yours</i>, <i>hers</i> and the rest
  summary: The words <i>mine</i>, <i>yours</i>, <i>his</i>, <i>hers</i>, <i>ours</i> and <i>theirs</i> can stand alone as a full phrase, with no noun after them.
  body: |-
    In <i>The red one is mine</i>, the word <i>mine</i> says whose the red one is, and nothing follows it. <i>Those seats are theirs</i> works the same way. Each of these words fills a whole phrase's spot on its own.

    Compare <i>my</i>. It goes before a noun, as in <i>my book</i>. The word <i>his</i> is the same in both uses: <i>his book</i> and <i>The book is his</i>.
  examples:
    - text: The red one is [mine].
      from: entry
    - text: Those seats are [theirs].
      from: entry
    - text: '[Mine] fell.'
      from: constructed
  try: Say <i>my book</i>. Now say whose book it is using just one word and no noun.
teacher:
  summary: Teaches the stand-alone forms <i>mine</i>, <i>yours</i>, <i>his</i>, <i>hers</i>, <i>ours</i>, <i>theirs</i> and how they differ from <i>my</i>, <i>your</i> and <i>their</i> before a noun.
  explain: An independent personal genitive pronoun is one of <i>mine</i>, <i>yours</i>, <i>his</i>, <i>hers</i>, <i>ours</i> or <i>theirs</i>, functioning as an NP. A form such as <i>mine</i> can occupy an NP slot without an overt noun, as in <i>Mine fell</i>. The dependent counterpart, such as <i>my</i>, requires a nominal. <i>His</i> is formally shared across the two slots. The dictionary lists independent and dependent forms and shows their different distributions. It marks this account as provisional.
  terms: Sometimes called absolute possessive pronouns or possessive pronouns. This grammar uses genitive, not possessive, and calls <i>my</i>, <i>your</i> and the like dependent genitive pronouns.
  examples:
    - text: The red one is [mine].
      from: entry
    - text: Those seats are [theirs].
      from: entry
    - text: '[Mine] fell.'
      from: constructed
  contrasts:
    - text: This is [my] book.
      from: constructed
      note: Dependent form, followed by a noun.
    - text: This book is [mine].
      from: constructed
      note: Independent form, no noun follows.
    - text: That is [his] book. That book is [his].
      from: constructed
      note: The same form fills both slots.
  watch_for:
    - A learner might add a noun after <i>mine</i>, <i>yours</i> or <i>theirs</i>.
    - A learner might expect <i>his</i> to change form between the two uses, when it stays the same.
  activity: Give students pairs of sentences with <i>my</i>, <i>your</i>, <i>her</i> and <i>their</i> before a noun. They rewrite each with the stand-alone form and no noun.
child:
  hook: Can one little word say who owns the whole thing?
  explain: Words like <i>mine</i>, <i>yours</i> and <i>theirs</i> can stand alone. They say who owns something without naming it. <i>The red one is mine.</i>
  examples:
    - text: The red one is [mine].
      from: entry
    - text: Those seats are [theirs].
      from: entry
  play: Point to things in the room. Say who owns each one using only <i>mine</i>, <i>yours</i>, <i>his</i>, <i>hers</i>, <i>ours</i> or <i>theirs</i>.
