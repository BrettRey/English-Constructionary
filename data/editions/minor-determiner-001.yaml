id: minor-determiner-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Whole phrases that sit before a noun
  summary: In a few frames, a phrase such as what size or over thirty can come before a noun the way a small word like the or some does.
  body: |-
    In what size hat, the words what size ask about the hat. In this size shoes, this size tells us which size of shoes. In over thirty ties, over thirty sets a lower limit on how many ties. Each of these opening groups is a whole phrase, not a single small word, yet it works in the slot before the noun where words like the and some work.

    This dictionary treats the pattern as restricted. It shows up in questions about size and in frames that measure or count, so it doesn't turn any phrase at all into an opener for a noun.
  examples:
    - text: '[what size] hat'
      from: entry
    - text: '[this size] shoes'
      from: entry
    - text: '[over thirty] ties'
      from: entry
  try: Ask a shop assistant's question about size, beginning with what size. Which noun follows it?
teacher:
  summary: For advanced classes, phrases rather than single words that fill the determiner slot in a few frames such as what size hat.
  explain: 'Determiner is a function; determinatives like the and some are the words that fill it elsewhere. Here the function is filled by a phrase instead: a plain noun phrase (what size, this size) or a prepositional phrase (over thirty) before the noun. This dictionary''s pattern is a noun phrase or prepositional phrase plus a noun, and it is restricted to certain noun-phrase types: interrogatives and measure or quantity frames. What size hat asks for the hat''s size. Over thirty ties sets a lower boundary on the number of ties. Present it as a limited set of frames, not as a general rule.'
  terms: Minor determiner is this dictionary's label for a phrase, not a determinative word, in determiner function. Property-value noun phrase is the CGEL term for the what size hat type.
  examples:
    - text: '[what size] hat'
      from: entry
    - text: '[this size] shoes'
      from: entry
    - text: '[over thirty] ties'
      from: entry
  contrasts:
    - text: '[over thirty] hats'
      from: constructed
      note: The prepositional phrase over thirty sets a lower boundary on the number of hats.
    - text: '[what size] hat'
      from: entry
      note: The noun phrase what size asks for the size of the hat.
  watch_for:
    - A learner might take what size or over thirty to be a single determinative word like the.
    - A learner might assume any phrase can fill the determiner slot, when this dictionary restricts it to interrogative and measure or quantity frames.
  activity: Give students shop-sign prompts (a hat shop, a shoe shop, a tie sale). They write one question with what size and one statement with over thirty, then circle the phrase that comes before each noun.
