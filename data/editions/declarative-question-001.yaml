id: declarative-question-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Asking by tone of voice
  summary: A statement-shaped sentence said with a questioning tone can ask for confirmation of something the speaker already expects.
  body: |-
    <i>They've finished?</i> has the word order of a statement. In speech, the questioning tone turns it into a question. The speaker expects the answer yes, and a reply like <i>That's right</i> fits naturally.

    The expectation matches the sentence. A positive one, <i>They've finished?</i>, expects a positive answer, and a negative one, <i>They haven't finished?</i>, expects a negative answer. This isn't the neutral question of <i>Have they finished?</i>, which leaves the answer more open. In writing, the question mark does the work of the tone.
  examples:
    - text: '[They''ve finished?]'
      from: entry
    - text: '[They haven''t finished?]'
      from: entry
    - text: '[And the manager has been informed, of course?]'
      from: entry
    - text: '[There isn''t any chance of her changing her mind, I take it?]'
      from: entry
  try: Say <i>You're coming tonight?</i> as a question. What answer do you expect? Now say <i>Are you coming tonight?</i> Does the expectation change?
teacher:
  summary: Helps explain statement-order questions that expect confirmation, as in <i>They've finished?</i>
  explain: 'A declarative question keeps declarative syntax, with no subject-auxiliary inversion, and gets its question interpretation from question intonation, or question punctuation in writing. It''s a closed question strongly biased toward the answer with the same propositional content and polarity as the declarative: positive toward positive, negative toward negative. Confirmatory responses such as <i>That''s right</i>, <i>Exactly</i> and <i>Quite so</i> are especially natural. The host clause stays declarative, and question is a semantic category applied to the whole form. It is not an echo question, since it needn''t repeat or query the wording of a prior utterance. The analysis is provisional.'
  terms: Traditional grammars may call these statement questions or rising-intonation questions. Closed interrogative is the inverted form (<i>Have they finished?</i>), which can be neutral.
  examples:
    - text: '[They''ve finished?]'
      from: entry
    - text: '[They haven''t finished?]'
      from: entry
    - text: '[And the manager has been informed, of course?]'
      from: entry
    - text: '[There isn''t any chance of her changing her mind, I take it?]'
      from: entry
  contrasts:
    - text: They've finished?
      from: entry
      note: Declarative syntax; biased toward a positive answer.
    - text: Have they finished?
      from: constructed
      note: Closed interrogative with inversion; can be neutral.
  watch_for:
    - A learner might treat <i>They've finished?</i> as a neutral question, when it is biased toward a positive answer.
    - A learner might take <i>They haven't finished?</i> to expect yes, when it expects the negative answer, that they haven't.
    - A learner might think a declarative question must echo something just said, when no prior utterance is required.
  activity: Students role-play checking a fact they half-know (a friend's plans, a test date). They ask once with an inverted question and once with a declarative question, then say how much each one assumes the answer.
child:
  hook: How can you ask a question without changing any words?
  explain: You can say a sentence in a questioning voice. <i>They've finished?</i> You think they have, and you want to check. The other person can answer, "<i>That's right.</i>"
  examples:
    - text: '[They''ve finished?]'
      from: entry
    - text: '[They haven''t finished?]'
      from: entry
  play: Say "<i>You're hungry</i>" two ways, as a plain statement and then as a question. Ask a friend to listen. Can they hear which one you want an answer to?
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
