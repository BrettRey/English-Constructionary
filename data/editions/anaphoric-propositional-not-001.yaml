id: anaphoric-propositional-not-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>I hope not</i>"
  summary: After a word like <i>hope</i>, <i>not</i> can stand in for a whole statement, the negative of something just raised in the conversation.
  body: |-
    Asked <i>Is the screen broken?</i>, someone can answer <i>I hope not</i>. The word <i>not</i> here stands in for the content <i>the screen is not broken</i>. So the answer means <i>I hope the screen is not broken</i>.

    This isn't the same as <i>I don't hope so</i>, which can instead deny that the speaker hopes. Not every attitude word allows the short answer, and which ones do depends on the word.
  examples:
    - text: “Is the screen broken?” “I [hope not].”
      from: entry
  try: Answer a yes-or-no question with <i>I hope not</i>. Then say what the full sentence would be.
teacher:
  summary: Shows how <i>not</i> can pick up a negative proposition after an attitude predicate, as in <i>I hope not</i>.
  explain: In this pattern <i>not</i> follows a licensed predicate and picks up the negative counterpart of a proposition already in the discourse. In the exchange <i>Is the screen broken?</i> <i>I hope not</i>, <i>not</i> supplies the content that <i>the screen is not broken</i>. <i>I don't hope so</i> can instead negate the hoping. Whether the standalone <i>not</i> is compatible depends on the predicate, so each predicate has to be checked. This dictionary relates it to negative raising.
  terms: '<i>Not</i> here is anaphoric: it picks up the negative counterpart of an earlier proposition. This dictionary names the pattern anaphoric <i>not</i> with an attitude predicate.'
  examples:
    - text: “Is the screen broken?” “I [hope not].”
      from: entry
  contrasts:
    - text: I hope not.
      from: constructed
      note: "<i>Not</i> supplies the content that <i>the screen is not broken</i>."
    - text: I don't hope so.
      from: entry
      note: Can instead negate the hoping.
  watch_for:
    - A learner might read <i>I hope not</i> as saying the speaker doesn't hope, when <i>not</i> supplies the negative content that is hoped for.
    - A learner might assume every attitude predicate can be followed by standalone <i>not</i>, when compatibility varies by predicate.
  activity: Students ask each other yes-or-no questions and answer with <i>I hope so</i> and <i>I hope not</i>. They then write out the full sentence each short answer stands for.
child:
  hook: When someone says "<i>I hope not</i>", what do they hope?
  explain: Someone asks, "<i>Is the screen broken?</i>" You answer, "<i>I hope not</i>." <i>Not</i> stands for the whole idea that <i>the screen is not broken</i>. It saves you from saying the whole sentence.
  examples:
    - text: “Is the screen broken?” “I [hope not].”
      from: entry
    - text: “Is it raining?” “I [hope not].”
      from: constructed
  play: Ask a partner a yes-or-no question. They answer with <i>I hope not</i>. Then they say the whole sentence that those words stand for.
checked:
  date: "2026-11-19"
  model: claude-opus-5-5 (resolving glm-5.3 flags)
