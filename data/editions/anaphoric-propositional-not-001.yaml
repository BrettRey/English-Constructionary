id: anaphoric-propositional-not-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: I hope not
  summary: After a word like hope, not can stand in for a whole statement, the negative of something just raised in the conversation.
  body: |-
    Asked Is the screen broken?, someone can answer I hope not. The word not here stands in for the content the screen is not broken. So the answer means I hope the screen is not broken.

    This isn't the same as I don't hope so, which can instead deny that the speaker hopes. Not every attitude word allows the short answer, and which ones do depends on the word.
  examples:
    - text: “Is the screen broken?” “I [hope not].”
      from: entry
  try: Answer a yes-or-no question with I hope not. Then say what the full sentence would be.
teacher:
  summary: Shows how not can pick up a negative proposition after an attitude predicate, as in I hope not.
  explain: In this pattern not follows a licensed predicate and picks up the negative counterpart of a proposition already in the discourse. In the exchange Is the screen broken? I hope not, not supplies the content that the screen is not broken. I don't hope so can instead negate the hoping. Whether the standalone not is compatible depends on the predicate, so each predicate has to be checked. This dictionary relates it to negative raising.
  terms: 'Not here is anaphoric: it picks up the negative counterpart of an earlier proposition. This dictionary names the pattern anaphoric not with an attitude predicate.'
  examples:
    - text: “Is the screen broken?” “I [hope not].”
      from: entry
  contrasts:
    - text: I hope not.
      from: constructed
      note: Not supplies the content that the screen is not broken.
    - text: I don't hope so.
      from: entry
      note: Can instead negate the hoping.
  watch_for:
    - A learner might read I hope not as saying the speaker doesn't hope, when not supplies the negative content that is hoped for.
    - A learner might assume every attitude predicate can be followed by standalone not, when compatibility varies by predicate.
  activity: Students ask each other yes-or-no questions and answer with I hope so and I hope not. They then write out the full sentence each short answer stands for.
child:
  hook: When someone says "I hope not", what do they hope?
  explain: Someone asks, "Is the screen broken?" You answer, "I hope not." Not stands for the whole idea that the screen is not broken. It saves you from saying the whole sentence.
  examples:
    - text: “Is the screen broken?” “I [hope not].”
      from: entry
    - text: “Is it raining?” “I [hope not].”
      from: constructed
  play: Ask a partner a yes-or-no question. They answer with I hope not. Then they say the whole sentence that those words stand for.
