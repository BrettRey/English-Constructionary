id: independent-genitive-pronoun-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Mine, yours and theirs
  summary: Words like mine, yours, hers and theirs can stand on their own as a whole phrase, where my, your, her and their need a noun after them.
  body: |-
    My copy needs a noun to lean on. Mine doesn't. In This is mine, the word stands alone. Words in this group include mine, yours, his, hers, ours, theirs and whose, as in Whose is this?

    Some of these look the same whether or not they stand alone. His and whose are examples. Its is a special case: standing alone it is rare, but it isn't ruled out. The dictionary notes that the relationship between the person and the thing can be ownership, but can also be something broader.
  examples:
    - text: That car is [mine].
      from: entry
    - text: These policies are [theirs].
      from: entry
    - text: '[Whose] is this?'
      from: entry
  try: Say This is my copy and then This is mine. What did you drop, and what did mine do for you?
teacher:
  summary: Helps explain the stand-alone forms mine, yours, hers, ours, theirs against the forms that precede a noun.
  explain: 'The independent genitive pronouns are mine, yours, his, hers, its, ours, theirs and whose. They contrast with dependent forms: This is mine versus my copy. CGEL separates dependent and independent genitive realizations. Some forms, such as his and whose, can look identical in both slots. This dictionary treats independent its as rare rather than ruled out, and CGEL''s warning about the exceptional distribution of its limits any paradigm-wide prediction. The relationship expressed can be ownership or control, as in That car is mine and These policies are theirs. This dictionary marks the analysis as provisional.'
  terms: Mine, yours, theirs and the like are sometimes called possessive pronouns. In this dictionary's terms they're independent genitive pronouns, and the forms before a noun are dependent genitives.
  examples:
    - text: That car is [mine].
      from: entry
    - text: These policies are [theirs].
      from: entry
    - text: '[Whose] is this?'
      from: entry
    - text: The decision was [yours].
      from: entry
  contrasts:
    - text: That car is mine.
      from: entry
      note: Independent form, no noun follows.
    - text: That is my car.
      from: constructed
      note: Dependent form, a noun follows.
  watch_for:
    - A learner might add a noun after mine, yours or theirs, as one would after my, your or their.
    - A learner might assume the independent form of every genitive differs from the dependent form, though his and whose can look the same in both slots.
  activity: Students take pairs of sentences with my/your/their and a noun and rewrite them with mine/yours/theirs and no noun. They then find two forms that stay the same.
child:
  hook: What is the difference between "my book" and "the book is mine"?
  explain: My needs a word after it, like my book. Mine can stand alone. You can say the book is mine.
  examples:
    - text: That car is [mine].
      from: entry
    - text: The red bike is [hers].
      from: constructed
    - text: '[Whose] is this?'
      from: entry
  play: Point to things in the room and say whose they are. Try it two ways, such as "my pencil" and "this pencil is mine."
