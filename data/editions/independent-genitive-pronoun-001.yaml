id: independent-genitive-pronoun-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Mine</i>, <i>yours</i> and <i>theirs</i>
  summary: Words like <i>mine</i>, <i>yours</i>, <i>hers</i> and <i>theirs</i> can stand on their own as a whole phrase, where <i>my</i>, <i>your</i>, <i>her</i> and <i>their</i> need a noun after them.
  body: |-
    <i>My copy</i> needs a noun to lean on. <i>Mine</i> doesn't. In <i>This is mine</i>, the word stands alone. Words in this group include <i>mine</i>, <i>yours</i>, <i>his</i>, <i>hers</i>, <i>ours</i>, <i>theirs</i> and <i>whose</i>, as in <i>Whose is this?</i>

    Some of these look the same whether or not they stand alone. <i>His</i> and <i>whose</i> are examples. <i>Its</i> is a special case: standing alone it is rare, but it isn't ruled out. The dictionary notes that the relationship between the person and the thing can be ownership, but can also be something broader.
  examples:
    - text: That car is [mine].
      from: entry
    - text: These policies are [theirs].
      from: entry
    - text: '[Whose] is this?'
      from: entry
  try: Say <i>This is my copy</i> and then <i>This is mine</i>. What did you drop, and what did <i>mine</i> do for you?
teacher:
  summary: Helps explain the stand-alone forms <i>mine</i>, <i>yours</i>, <i>hers</i>, <i>ours</i>, <i>theirs</i> against the forms that precede a noun.
  explain: 'The independent genitive pronouns are <i>mine</i>, <i>yours</i>, <i>his</i>, <i>hers</i>, <i>its</i>, <i>ours</i>, <i>theirs</i> and <i>whose</i>. They contrast with dependent forms: <i>This is mine</i> versus <i>my copy</i>. CGEL separates dependent and independent genitive realizations. Some forms, such as <i>his</i> and <i>whose</i>, can look identical in both slots. This dictionary treats independent <i>its</i> as rare rather than ruled out, and CGEL''s warning about the exceptional distribution of <i>its</i> limits any paradigm-wide prediction. The relationship expressed can be ownership or control, as in <i>That car is mine</i> and <i>These policies are theirs</i>. This dictionary marks the analysis as provisional.'
  terms: <i>Mine</i>, <i>yours</i>, <i>theirs</i> and the like are sometimes called possessive pronouns. In this dictionary's terms they're independent genitive pronouns, and the forms before a noun are dependent genitives.
  examples:
    - text: That car is [mine].
      from: entry
    - text: These policies are [theirs].
      from: entry
    - text: '[Whose] is this?'
      from: entry
    - text: The decision was [yours].
      from: entry
  contrasts:
    - text: That car is mine.
      from: entry
      note: Independent form, no noun follows.
    - text: That is my car.
      from: constructed
      note: Dependent form, a noun follows.
  watch_for:
    - A learner might add a noun after <i>mine</i>, <i>yours</i> or <i>theirs</i>, as one would after <i>my</i>, <i>your</i> or <i>their</i>.
    - A learner might assume the independent form of every genitive differs from the dependent form, though <i>his</i> and <i>whose</i> can look the same in both slots.
  activity: Students take pairs of sentences with <i>my</i>/<i>your</i>/<i>their</i> and a noun and rewrite them with <i>mine</i>/<i>yours</i>/<i>theirs</i> and no noun. They then find two forms that stay the same.
child:
  hook: What is the difference between "<i>my book</i>" and "<i>the book is mine</i>"?
  explain: <i>My</i> needs a word after it, like <i>my book</i>. <i>Mine</i> can stand alone. You can say <i>the book is mine</i>.
  examples:
    - text: That car is [mine].
      from: entry
    - text: The red bike is [hers].
      from: constructed
    - text: '[Whose] is this?'
      from: entry
  play: Point to things in the room and say whose they are. Try it two ways, such as "<i>my pencil</i>" and "<i>this pencil is mine</i>."
