id: irregular-ablaut-verb-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>Sing</i>, <i>sang</i>, <i>sung</i>"
  summary: Some verbs show different forms by changing the vowel inside the word, and the changes belong to each verb.
  body: |-
    In <i>Jo sang yesterday and has sung twice today</i>, the vowel in the middle of the word changes: <i>sing</i>, <i>sang</i>, <i>sung</i>. Each form fills a different slot. <i>Sang</i> is the past form, and <i>sung</i> is the form that goes after <i>has</i>.

    Other verbs can use one form for more than one slot, so the exact pattern belongs to each verb individually.
  examples:
    - text: Jo [sang] yesterday and has [sung] twice today.
      from: entry
  try: Say <i>Jo sings today</i>, <i>Jo sang yesterday</i>, <i>Jo has sung</i>. Which vowel changes at each step?
teacher:
  summary: Covers verbs whose past and participle forms are marked by a stem vowel change, as in <i>sing</i>, <i>sang</i>, <i>sung</i>.
  explain: This dictionary describes selected verb stems with present, preterite and participial vowel alternants. The changes are lexicalized and distinguish verbal inflectional forms. For <i>sing</i>, <i>sang</i> and <i>sung</i> correspond to different slots. The perfect selects the past participle, here <i>sung</i>. Other verbs can share one form across those slots, so the exact mapping is lexical, and each verb has to be learned. This dictionary relates the pattern to regular <i>-ed</i> past tense and to the perfect with <i>have</i>. It is provisional.
  terms: Traditional grammars sometimes call these strong verbs, a label that may be broader than this pattern, and ablaut is a textbook word for stem-vowel change of this kind. This dictionary calls the pattern vowel alternation in irregular verb inflection.
  examples:
    - text: Jo [sang] yesterday and has [sung] twice today.
      from: entry
  contrasts:
    - text: Jo sang yesterday.
      from: constructed
      note: The preterite form.
    - text: Jo has sung twice today.
      from: constructed
      note: The past participle after <i>has</i>.
  watch_for:
    - A learner might mix up which of <i>sang</i> and <i>sung</i> fills which slot.
    - A learner might expect every verb to add <i>-ed</i> for its past.
  activity: Students list verbs with a vowel change and write each in a pair of sentences, one with the past form and one with <i>has</i> and the participle. They note any verb that uses one form for both.
child:
  hook: What changes in the word <i>sing</i> when you say <i>yesterday</i>?
  explain: Some words change their middle sound. <i>Today I sing</i>. <i>Yesterday I sang</i>. <i>Today I have sung</i>. Each word has its own pattern.
  examples:
    - text: Jo [sang] yesterday and has [sung] twice today.
      from: entry
    - text: Today I sing, yesterday I [sang].
      from: constructed
  play: Say <i>sing</i>, <i>sang</i> and <i>sung</i> with a partner. Find other words whose middle sound changes, and test each one.
