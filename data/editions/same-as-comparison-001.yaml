id: same-as-comparison-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Being the same as something else
  summary: "<i>The same</i> followed by <i>as</i> compares two things and says they match."
  body: |-
    In We chose the same model as Lee, the phrase after <i>as</i> is the standard we compare with. The two choices are the same model, but we needn't have bought one and the same physical object. It means the kind matches.

    So <i>the same</i> can point to a shared kind of thing or to a single shared thing. The word <i>as</i> introduces what we compare against. This dictionary marks the analysis as provisional.
  examples:
    - text: We chose [the same model as Lee].
      from: entry
    - text: She ordered [the same soup as Ravi].
      from: constructed
  try: Say what you have in common with a friend using <i>the same ... as</i>.
teacher:
  summary: Helps explain <i>the same + noun + as</i> for identity of referent or of type.
  explain: "<i>The same</i> plus a noun, followed by an <i>as</i>-phrase, compares items for identity of referent or identity of relevant type. In <i>We chose the same model as Lee</i>, <i>the same model</i> can identify a shared model without asserting that we bought one and the same physical object. <i>As</i> supplies the standard of comparison. This dictionary relates the pattern to the equative <i>as ... as</i> construction, and marks the analysis as provisional."
  terms: Related in this dictionary to the equative <i>as ... as</i> comparison.
  examples:
    - text: We chose [the same model as Lee].
      from: entry
    - text: She ordered [the same soup as Ravi].
      from: constructed
  watch_for:
    - A learner might read <i>the same model as</i> meaning one single physical object, when it can mean the same type.
    - A learner might leave out <i>as</i> before the standard of comparison.
  activity: Students write sentences about what they share with a partner (<i>the same colour</i>, <i>the same bus</i>) using <i>the same ... as</i>. Then they decide whether each shows one shared object or a shared type.
child:
  hook: How can two people have the same lunch?
  explain: "<i>The same ... as</i> tells you two things match. <i>We chose the same model as Lee</i>. We each chose that kind, so they match."
  examples:
    - text: We chose [the same model as Lee].
      from: entry
    - text: She ordered [the same soup as Ravi].
      from: constructed
  play: Look at a friend's bag, shoes or lunch. Say what's the same using <i>the same ... as</i>.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
