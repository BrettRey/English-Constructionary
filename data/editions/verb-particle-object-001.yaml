id: verb-particle-object-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Little words before or after an object
  summary: A short word like <i>down</i> or <i>off</i> can come before or after the object of a verb, as in <i>brought down the bed</i> and <i>brought the bed down</i>.
  body: |-
    In <i>She brought down the bed</i>, the small word <i>down</i> goes with the verb <i>brought</i>, and the bed is what she brought. The same thing can be said the other way: <i>She brought the bed down</i>.

    In the dictionary's account, <i>down</i> isn't the start of a phrase <i>down the bed</i>. It stands on its own beside the verb, and the bed is a separate object.

    The dictionary marks this account as provisional, and says no single test works in every case.
  examples:
    - text: She [brought down the bed].
      from: entry
    - text: She [brought the bed down].
      from: entry
    - text: She [took the label off].
      from: entry
  try: Say <i>took the label off</i>, then try replacing <i>the label</i> with <i>it</i>. Where does <i>it</i> go?
teacher:
  summary: Helps explain verb-particle combinations with an object, including word-order flexibility and the pronoun restriction.
  explain: 'In this construction a verb takes a separate noun phrase as direct object and a one-word prepositional phrase complement in particle use. The particle is a syntactic use, not a word category. In <i>She took off the label</i>, <i>off</i> is a complement of <i>take</i> and the label is a separate direct object. This differs from <i>She jumped off the wall</i>, where <i>off</i> heads a prepositional phrase containing its own object. An ordinary object generally allows both orders, but an unstressed personal-pronoun object must immediately follow the verb: <i>take it off</i>. This dictionary marks its analysis provisional, and notes that heavy objects and fixed idioms can obscure the alternation.'
  terms: Sometimes called a verb-particle combination or a phrasal verb; the second label also covers cases without an object. In this grammar the particle is a one-word prepositional phrase complement of the verb.
  examples:
    - text: She [brought down the bed].
      from: entry
    - text: She [brought the bed down].
      from: entry
    - text: She [took the label off].
      from: entry
  contrasts:
    - text: She brought down the bed.
      from: entry
      note: Verb, particle, object.
    - text: She brought the bed down.
      from: entry
      note: Verb, object, particle.
    - text: took off it
      from: entry
      acceptable: false
      note: An unstressed pronoun object cannot follow the particle; this dictionary gives <i>take it off</i>.
  watch_for:
    - A learner might read <i>down the bed</i> in <i>brought down the bed</i> as a single phrase, when this dictionary treats <i>down</i> and <i>the bed</i> as separate.
    - A learner might treat <i>take off it</i> like <i>take off the label</i>, though an unstressed pronoun must come before the particle.
  activity: Give students phrasal verbs on cards (<i>take off</i>, <i>bring down</i>, <i>put on</i>). They build sentences with a noun object in both orders, then replace the object with <i>it</i> and say where the particle must go.
child:
  hook: Can you say "<i>took the label off</i>" and "<i>took off the label</i>"?
  explain: Some small words like <i>off</i> and <i>down</i> can go before or after the object. <i>She took the label off</i>. <i>She took off the label</i>. With <i>it</i>, the little word goes after <i>it</i>.
  examples:
    - text: She [took the label off].
      from: entry
    - text: She [brought the bed down].
      from: entry
  play: Take a sticker off a page and say what you did two ways. Then say what you did with it, like "<i>I took it off</i>."
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: "Fixed: child explanation no longer says the particle goes on either side of 'what the verb moves' (many combinations involve no movement); now says before or after the object; curious title reworded likewise; 'the entry' replaced by 'this dictionary'; phrasal verb hedged as a broader label. Second round: fixed child.explain, comes last changed to goes after it (the entry requires the particle to follow an unstressed pronoun object, not to end the sentence); cut the curious claim that separateness is why both orders are possible; teacher.explain now says an ordinary object generally allows both orders, as the entry does."
