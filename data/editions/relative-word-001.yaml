id: relative-word-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Question words that link a description to a noun
  summary: Words like <i>who</i>, <i>which</i> and <i>where</i> can tie a description to the noun it describes.
  body: |-
    In <i>the woman who called</i>, the word <i>who</i> links the description <i>called</i> to <i>the woman</i>. The same family of words, which also asks questions, does this job: <i>who</i>, <i>whom</i>, <i>whose</i>, <i>which</i>, <i>where</i>, <i>when</i> and <i>why</i>. Not all of them fit every slot. <i>Why</i>, for instance, is limited: <i>the reason why she left</i> works.

    Related words, such as <i>whatever</i>, work in a different way. In <i>I'll take whatever you're offering</i>, the whole phrase <i>whatever you're offering</i> names the thing taken, with no separate noun before it. The details of this analysis are marked provisional in this dictionary.
  examples:
    - text: the woman [who] called
      from: entry
    - text: the reason [why] she left
      from: entry
    - text: I'll take [whatever] you're offering.
      from: entry
  try: Finish the phrase <i>the person who ...</i> in three different ways. Then try <i>the place where ...</i> and <i>the time when ...</i>
teacher:
  summary: Helps explain how question words work as relative words, and which ones are excluded from ordinary relatives.
  explain: 'A restricted subset of the question-word series (<i>who</i>, <i>whom</i>, <i>whose</i>, <i>which</i>, <i>where</i>, <i>when</i>, <i>why</i>) works as relative words, with the open variable bound by the head noun (integrated relatives). Fused relatives, which supply their own head, use <i>what</i>, <i>how</i> and the <i>-ever</i> series (<i>what she saw</i>, <i>whatever you choose</i>). Membership differs from the question use: <i>what</i> and <i>how</i> are excluded from integrated relatives, and <i>why</i> is limited (as in <i>the reason why</i>). Following CGEL, relative <i>that</i> isn''t treated as part of this series. A relative can also front a larger phrase, as in <i>the writer whose essay won</i>. This dictionary marks the analysis as provisional.'
  terms: In these relative uses, <i>who</i>, <i>whom</i>, <i>whose</i> and <i>which</i> are sometimes called relative pronouns, and <i>where</i>, <i>when</i> and <i>why</i> relative adverbs. In this dictionary they are the relative use of the indeterminate series. Fused relatives are sometimes called nominal or free relatives.
  examples:
    - text: the woman [who] called
      from: entry
    - text: the reason [why] she left
      from: entry
    - text: I'll take [whatever] you're offering.
      from: entry
    - text: the writer [whose essay] won
      from: constructed
  contrasts:
    - text: the thing what he said
      from: entry
      acceptable: false
      note: Excluded in standard English, according to this dictionary.
  watch_for:
    - A learner might carry the question uses of <i>what</i> and <i>how</i> over into integrated relatives.
    - A learner might treat <i>that</i> in <i>the woman that called</i> as the same kind of word as <i>who</i>.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: curious.body no longer says the relative word builds a noun phrase by itself or stands in for the thing offered (in the fused relative the whole expression supplies the head); teacher.explain no longer says why is limited to the reason why, only that it is limited, with that as the example. Second round: fixed teacher.explain, which assigned fused relatives to the seven listed words; it now ties those words to integrated relatives and what, how and the -ever series to fused relatives, as this dictionary does. Teacher.terms now applies the traditional labels to the relative uses only. Also fixed (unflagged): curious.body said whatever was one of the listed words, and said only some of them fit every slot; it now calls whatever a related word and says not all of them fit every slot.'
