id: prepositional-passive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Passives that leave a small word behind
  summary: The thing that follows a preposition can become the subject of a passive sentence, leaving the preposition behind after the verb.
  body: |-
    In <i>This proposal was referred to repeatedly</i>, the subject, <i>this proposal</i>, would follow <i>to</i> in an ordinary active sentence. In the passive it becomes the subject, and <i>to</i> stays behind after the verb.

    Selected prepositions, the ones a verb takes, are a major source of this pattern. <i>Jo was spoken to</i> works the same way. This dictionary also notes that some other prepositional phrases can take part under restricted conditions.
  examples:
    - text: This proposal [was referred to] repeatedly.
      from: entry
    - text: Jo [was spoken to].
      from: constructed
  try: Turn <i>Someone spoke to Jo</i> into a sentence that starts with <i>Jo</i>. What word is left at the end?
teacher:
  summary: Covers passives whose subject corresponds to the complement of a preposition, with the preposition stranded.
  explain: 'In a prepositional passive the complement of a preposition corresponds to the subject of the passive: <i>This proposal was referred to repeatedly</i>. The preposition is stranded after the verb and remains part of the passive VP. Selection by the verb strongly supports the construction, and some independently licensed adjunct PPs can also occur under restricted conditions. This dictionary treats the pattern as a specialization of the <i>be</i>-passive, and marks it provisional, with medium confidence.'
  terms: Textbooks sometimes call this the pseudo-passive or passive with a stranded preposition.
  examples:
    - text: This proposal [was referred to] repeatedly.
      from: entry
    - text: Jo [was spoken to].
      from: constructed
  contrasts:
    - text: They referred to this proposal repeatedly.
      from: constructed
      note: Active; <i>this proposal</i> follows <i>to</i>.
    - text: This proposal was referred to repeatedly.
      from: entry
      note: Passive; <i>this proposal</i> is the subject and <i>to</i> is left behind.
  watch_for:
    - A learner might drop <i>to</i> from <i>was referred to</i>, when it remains part of the passive VP.
    - A learner might think any adverbial phrase can be turned into a passive subject, when this dictionary notes this works under restricted conditions.
  activity: Students rewrite active sentences with a selected preposition (<i>They referred to this proposal</i>) as passives, then underline the preposition that is left behind.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: curious summary no longer says the preposition ends the sentence (the entry''s own example continues with repeatedly). Also fixed (unflagged): removed the ''To whom Jo spoke'' comparison, which the entry does not support, and replaced it with an active/passive contrast built on the entry''s example; ''the entry'' replaced by ''this dictionary''.'
