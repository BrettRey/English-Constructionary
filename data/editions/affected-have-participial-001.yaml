id: affected-have-participial-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Having something done
  summary: "<i>Have</i> plus a noun phrase and a past-participle word presents an outcome as arranged by, or happening to, the subject."
  body: |-
    In <i>We had the roof replaced in June</i>, the roof is understood as the thing that got replaced, and we are the ones who arranged it. The same pattern can describe something unwanted that happened to the subject: <i>Maya had her bag stolen on the train</i>.

    So the subject can be an arranger, but it can also be the person affected. The noun phrase after <i>have</i> (<i>the roof</i>, <i>her bag</i>) is understood as the thing the action affected.
  examples:
    - text: We [had the roof replaced] in June.
      from: entry
    - text: Maya [had her bag stolen] on the train.
      from: constructed
  try: Say <i>We had the roof replaced</i>. Then say <i>Maya had her bag stolen</i>. In which one did the subject arrange it?
teacher:
  summary: Shows <i>have</i> plus an NP plus a past participle, which can mean arranged or experienced.
  explain: The pattern is <i>have</i> plus an NP plus a past-participial predicate (<i>had the roof replaced</i>). It presents an outcome as arranged by or affecting the subject. The subject can be an arranger, as in the roof example, but <i>had her bag stolen</i> can describe an unwanted event she experienced. The NP after <i>have</i> is understood as the affected participant of the participial. This dictionary treats the pattern as a specialization of the verb phrase and relates it to the <i>be</i>-passive. It is marked provisional.
  examples:
    - text: We [had the roof replaced] in June.
      from: entry
    - text: Maya [had her bag stolen] on the train.
      from: constructed
  contrasts:
    - text: We had the roof replaced in June.
      from: entry
      note: The subject arranged the outcome.
    - text: Maya had her bag stolen on the train.
      from: constructed
      note: The subject experienced an unwanted event.
  watch_for:
    - A learner might read <i>had her bag stolen</i> as meaning she arranged the theft, when it can describe an unwanted event.
    - A learner might take <i>the roof</i> in <i>had the roof replaced</i> as the thing that does the replacing, when it is the affected participant.
  activity: Give students short sentences with <i>have</i> plus an NP plus a participle. They mark each as arranged or experienced and underline the affected noun phrase.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
