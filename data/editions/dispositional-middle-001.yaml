id: dispositional-middle-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Things that wash well
  summary: A sentence with an ordinary verb can describe how an action can be carried out on something.
  body: |-
    <i>This fabric washes well</i> describes the fabric, and the verb <i>washes</i> looks like any active verb. But the sentence is about a quality of the fabric: how an action can be carried out on it. The sentence suggests someone doing the washing.

    Compare <i>The fabric was washed at noon</i>. That reports a particular event on a particular occasion, so it isn't a statement about the fabric's qualities.
  examples:
    - text: '[This fabric washes well].'
      from: entry
    - text: The fabric [was washed at noon].
      from: entry
  try: Think of an object around you and a verb for something done to it. Can you say how well it does under that action, as in <i>This fabric washes well</i>?
teacher:
  summary: Helps explain active-form clauses that describe a property of the subject, not an event, and contrast them with passives.
  explain: The dispositional middle is a clause whose subject is the theme, with an active transitive-capable verb and an optional ease or manner modifier. It presents a referent as having a disposition affecting how an action can be carried out on it. This fabric washes well attributes a disposition with active verb forms; <i>This fabric was washed at noon</i> reports a particular event in the passive. This dictionary notes that <i>This fabric washes well</i> invites an interpretation involving a washer, unlike <i>The door opened</i>, which can simply report a change of state without an implicit opener.
  terms: Sometimes called the middle construction, or simply the middle.
  examples:
    - text: '[This fabric washes well].'
      from: entry
  contrasts:
    - text: The fabric [was washed at noon].
      from: entry
      note: An eventive passive with a specific occasion.
    - text: The door opened.
      from: constructed
      note: Can simply report a change of state without an implicit opener.
  watch_for:
    - A learner might read <i>This fabric washes well</i> as describing something the fabric does by itself.
    - A learner might treat <i>This fabric washes well</i> and <i>This fabric was washed at noon</i> as the same, though the first attributes a disposition and the second reports a particular event.
  activity: Give students sentences about objects (<i>the bread cuts easily</i>, <i>the tickets were sold yesterday</i>) and ask them to sort them into disposition statements and event reports.
