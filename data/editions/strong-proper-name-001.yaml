id: strong-proper-name-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Names that stand alone
  summary: Names like <i>Kim</i> and <i>New York</i> need no <i>the</i>, <i>a</i> or <i>my</i> in front of them, and some family words can work the same way.
  body: |-
    A name like <i>Kim</i> or <i>New York</i> stands on its own in a sentence: <i>Kim called</i>. <i>She lives in New York</i>. A family word can do the same job when it works as a name. <i>Mom called</i> uses <i>Mom</i> as her name, while <i>my mom called</i> uses the same word to say what she is to me, and then it needs a determiner such as <i>my</i> in front.

    A few feeling words, such as <i>poor</i>, can also sit in front of a name with nothing else: <i>Poor Henry needs a rest</i>. Names that take <i>the</i>, such as <i>the Thames</i>, belong to a different kind. Calling out someone's name, as in <i>Sally!</i>, is also a separate matter.

    This dictionary marks the analysis as provisional.
  examples:
    - text: '[Kim] called.'
      from: entry
    - text: She lives in [New York].
      from: entry
    - text: '[Mom] called.'
      from: entry
    - text: '[Poor Henry] needs a rest.'
      from: entry
  try: Say <i>Mom called</i> and then <i>my mom called</i>. In which one is <i>Mom</i> what you call her?
teacher:
  summary: Helps explain why names appear without a determiner, including a family word like <i>Mom</i> when it is used as a name.
  explain: 'The construction is a singular NP with no determiner, naming semantics, and referential use in an argument function (subject, object in a VP, object in a PP). Its head may be a proper noun (<i>Kim</i>, <i>Ukraine</i>) or a common noun in naming use (<i>Mom</i>, <i>Grandma</i>). Naming semantics means a conventional name, not mere identifiability: <i>the doctor</i> can identify someone without being a name. Names with the article (<i>the Thames</i>) are weak proper names and outside the construction. So are bare vocatives, whose bareness comes from the vocative function (<i>Waiter!</i>). A small set of emotive adjectives can embellish a strong name without a determiner. This dictionary marks the analysis as provisional and departs from CGEL''s usage: it treats proper name as a semantic classification and the NP as the unit with a head.'
  terms: 'CGEL: strong proper names (no determiner) and weak ones (with <i>the</i>, as in <i>the Thames</i>). Proper name is a semantic category; proper nouns are the word class specialized for heading such NPs. Kin terms used as names remain common nouns on CGEL''s analysis.'
  examples:
    - text: '[Kim] called.'
      from: entry
    - text: She lives in [New York].
      from: entry
    - text: You wanna roll the ball to [Mommy]?
      from: entry
    - text: '[Poor Mom] needs a rest.'
      from: entry
  contrasts:
    - text: Mom called.
      from: entry
      note: Naming use; no determiner.
    - text: My mom called.
      from: entry
      note: Relational use; the same noun takes a determiner.
    - text: The poor dog needs a rest.
      from: entry
      note: An ordinary singular count noun takes the same adjective with a determiner.
    - text: They walked along the Thames.
      from: constructed
      note: A weak proper name, with the article; outside this construction.
  watch_for:
    - A learner might assume <i>Mom</i> must take a determiner like any other singular count noun.
    - A learner might treat a bare vocative such as <i>Waiter!</i> as an instance, when its bareness comes from the vocative function.
    - A learner might treat <i>the Thames</i> as the same kind of name as <i>Kim</i>.
  activity: Students list names from their lives (people, places, family words). They test each in a subject slot and in a relational version with <i>my</i>, then sort into names that stand alone and nouns that need a determiner.
child:
  hook: Why do we say <i>Mom called</i> but <i>my mom called</i>?
  explain: Names like <i>Kim</i> and <i>New York</i> stand on their own. <i>Mom</i> can be a name too, when it's what you call her. When you say <i>my mom</i>, you're saying who she is to you.
  examples:
    - text: '[Kim] called.'
      from: entry
    - text: '[Mom] called.'
      from: entry
    - text: My mom called.
      from: entry
  play: Say <i>Kim called</i>. Then put <i>Grandma</i> in place of <i>Kim</i>. Then try <i>my grandma called</i>. Which ones can stand alone?
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
