id: object-control-infinitival-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Persuading someone to do something
  summary: In Jo persuaded Kai to stay, Kai is both the person persuaded and the one who stays.
  body: |-
    In Jo persuaded Kai to stay, one person does two jobs. Kai is the person who was persuaded, and Kai is also the one who stays, even though stay has no subject of its own.

    The same holds when the second part is negative: in They persuaded Kai not to wait, the not applies to waiting, and Kai is still the person persuaded. This dictionary calls the pattern object control, because the object of the first verb controls who does the second action.
  examples:
    - text: Jo [persuaded Kai to stay].
      from: entry
    - text: They [persuaded Kai not to wait].
      from: entry
  try: Say Jo persuaded Kai to stay. Who was persuaded? Who stays?
teacher:
  summary: Explains verbs like persuade, where the object is also the understood subject of the infinitive.
  explain: In object control, the NP after the verb is a selected object that is also interpreted as the subject of the to-infinitival. Kai is the person persuaded and the one who stays. Because the object is a participant in the main verb's situation, persuaded Kai to stay requires a persuadee, so dummy there can't fill the slot. Negation in the infinitival applies to the subordinate situation (persuaded Kai not to wait). It differs from object raising, as in expected there to be trouble, where the corresponding position permits dummy there. This dictionary marks the analysis as provisional.
  terms: Object control is the term used here. Equi is another textbook name for this idea.
  examples:
    - text: Jo [persuaded Kai to stay].
      from: entry
    - text: They [persuaded Kai not to wait].
      from: entry
  contrasts:
    - text: They persuaded Kai not to wait.
      from: entry
      note: The negation applies to waiting. Kai remains the persuadee.
    - text: They expected there to be trouble.
      from: constructed
      note: Object raising. The corresponding position permits dummy there.
  watch_for:
    - A learner might read Kai in persuaded Kai to stay as only the subject of stay, when Kai is also the person persuaded.
    - A learner might read the negation in persuaded Kai not to wait as applying to the persuading, when it applies to waiting.
  activity: Students write sentences with persuade, a person and an infinitive. They then underline who was persuaded and who does the second action, and confirm these are the same person.
child:
  hook: In Jo persuaded Kai to stay, who is going to stay?
  explain: Kai is the one who gets persuaded. Kai is also the one who stays. One person does both jobs in the sentence.
  examples:
    - text: Jo [persuaded Kai to stay].
      from: entry
    - text: They [persuaded Kai not to wait].
      from: entry
  play: Make up a sentence with persuaded, a friend's name, to, and something to do. Then ask who gets persuaded and who does the thing.
