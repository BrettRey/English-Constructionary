id: domain-wise-adjunct-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Narrowing a claim with <i>-wise</i>
  summary: A word ending in <i>-wise</i> at the start of a sentence says which aspect the rest of the sentence is about.
  body: |-
    In <i>Cost-wise, the smaller van is better</i>, the opening word <i>cost-wise</i> limits the claim. The smaller van is better as far as cost goes, and the sentence doesn't say it is better in every way.

    The opening expression sets the dimension within which the following claim is judged. It stands at the front of the sentence, apart from the main statement.
  examples:
    - text: '[Cost-wise], the smaller van is better.'
      from: entry
    - text: '[Price-wise], the first offer is better.'
      from: constructed
  try: Take a choice you've made recently. Can you say which aspect it was better in, starting with a word in <i>-wise</i>?
teacher:
  summary: Helps explain a front-placed <i>-wise</i> word that restricts the dimension of a claim.
  explain: A domain adjunct in <i>-wise</i> is an initial expression in <i>-wise</i> followed by a clause. It restricts the dimension within which the following claim is assessed. In <i>Cost-wise, the smaller van is better</i>, the claim holds for cost. This dictionary relates the pattern to gradation and cites CGEL's treatment of adverbial word formation.
  examples:
    - text: '[Cost-wise], the smaller van is better.'
      from: entry
    - text: '[Price-wise], the first offer is better.'
      from: constructed
  watch_for:
    - A learner might read the <i>-wise</i> word as describing the van, when it names the dimension of the comparison.
    - A learner might read the claim as holding in every respect, when the <i>-wise</i> word limits it.
  activity: Students compare two options (two phones, two routes) and write two <i>-wise</i> sentences, each naming a different dimension where a different option wins.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
