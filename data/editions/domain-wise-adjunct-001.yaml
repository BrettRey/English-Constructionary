id: domain-wise-adjunct-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Narrowing a claim with -wise
  summary: A word ending in -wise at the start of a sentence says which aspect the rest of the sentence is about.
  body: |-
    In Cost-wise, the smaller van is better, the opening word cost-wise limits the claim. The smaller van is better as far as cost goes, and the sentence doesn't say it is better in every way.

    The opening expression sets the dimension within which the following claim is judged. It stands at the front of the sentence, apart from the main statement.
  examples:
    - text: '[Cost-wise], the smaller van is better.'
      from: entry
    - text: '[Price-wise], the first offer is better.'
      from: constructed
  try: Take a choice you've made recently. Can you say which aspect it was better in, starting with a word in -wise?
teacher:
  summary: Helps explain a front-placed -wise word that restricts the dimension of a claim.
  explain: A domain adjunct in -wise is an initial expression in -wise followed by a clause. It restricts the dimension within which the following claim is assessed. In Cost-wise, the smaller van is better, the claim holds for cost. This dictionary relates the pattern to gradation and cites CGEL's treatment of adverbial word formation.
  examples:
    - text: '[Cost-wise], the smaller van is better.'
      from: entry
    - text: '[Price-wise], the first offer is better.'
      from: constructed
  watch_for:
    - A learner might read the -wise word as describing the van, when it names the dimension of the comparison.
    - A learner might read the claim as holding in every respect, when the -wise word limits it.
  activity: Students compare two options (two phones, two routes) and write two -wise sentences, each naming a different dimension where a different option wins.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
