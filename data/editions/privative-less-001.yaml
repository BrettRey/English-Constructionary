id: privative-less-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Words ending in <i>-less</i>
  summary: Adding <i>-less</i> to a noun makes an adjective meaning that something lacks what the noun names.
  body: |-
    In <i>The room was windowless</i>, the adjective <i>windowless</i> is built from the noun <i>window</i> plus the ending <i>-less</i>. It describes a room with no windows.

    The ending says that what the noun names is missing. Context and the history of a particular word can sometimes shift the meaning toward a judgment of someone, as with <i>careless</i>, rather than only a literal absence. This dictionary marks the account as provisional.
  examples:
    - text: The room was [windowless].
      from: entry
  try: Take a noun like <i>door</i> or <i>sun</i> and add <i>-less</i>. What would the new word describe?
teacher:
  summary: Shows how <i>-less</i> turns a noun into an adjective meaning without that thing.
  explain: The pattern is an adjective formed from a noun base plus <i>-less</i>, and it characterizes something by the absence of a feature or entity named by the noun. The default interpretation of <i>The room was windowless</i> is a room with no windows. Context and lexicalization can supply an evaluative reading, as with <i>careless</i>, rather than literal absence alone. This dictionary marks the analysis as provisional and gives one constructed example, so treat other <i>-less</i> words as separate vocabulary items and check them.
  terms: Sometimes called a privative suffix; this dictionary calls the pattern a privative adjective in <i>-less</i>.
  examples:
    - text: The room was [windowless].
      from: entry
    - text: The family was [homeless] for a month.
      from: constructed
  watch_for:
    - A learner might read <i>careless</i> as literally lacking care rather than as an evaluation of a person.
    - A learner might assume every noun can take <i>-less</i>.
  activity: Students list nouns and add <i>-less</i>, then write a sentence for each new word and a partner says whether the word means literally without the noun.
child:
  hook: What do you call a room with no windows?
  explain: Some words end in <i>-less</i>. The ending tells you something is missing. A windowless room has no windows.
  examples:
    - text: The room was [windowless].
      from: entry
    - text: The old house was [doorless].
      from: constructed
  play: Put <i>-less</i> on the end of a noun, like <i>sun</i> or <i>roof</i>. Say what the new word would describe. Make up a sentence with it.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
  note: "Frequency pass: added the constructed teacher example The family was homeless for a month (homeless about 4,800th in SUBTLEX-UK, with the literal without reading the block gives as the default) beside the entry's windowless (about 57,700th); activity already has students choose their own nouns, so left as is."
