id: privative-less-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Words ending in -less
  summary: Adding -less to a noun makes an adjective meaning that something lacks what the noun names.
  body: |-
    In The room was windowless, the adjective windowless is built from the noun window plus the ending -less. It describes a room with no windows.

    The ending says that what the noun names is missing. Context and the history of a particular word can sometimes shift the meaning toward a judgment of someone, as with careless, rather than only a literal absence. This dictionary marks the account as provisional.
  examples:
    - text: The room was [windowless].
      from: entry
  try: Take a noun like door or sun and add -less. What would the new word describe?
teacher:
  summary: Shows how -less turns a noun into an adjective meaning without that thing.
  explain: The pattern is an adjective formed from a noun base plus -less, and it characterizes something by the absence of a feature or entity named by the noun. The default interpretation of The room was windowless is a room with no windows. Context and lexicalization can supply an evaluative reading, as with careless, rather than literal absence alone. This dictionary marks the analysis as provisional and gives one constructed example, so treat other -less words as separate vocabulary items and check them.
  terms: Sometimes called a privative suffix; this dictionary calls the pattern a privative adjective in -less.
  examples:
    - text: The room was [windowless].
      from: entry
  watch_for:
    - A learner might read careless as literally lacking care rather than as an evaluation of a person.
    - A learner might assume every noun can take -less.
  activity: Students list nouns and add -less, then write a sentence for each new word and a partner says whether the word means literally without the noun.
child:
  hook: What do you call a room with no windows?
  explain: Some words end in -less. The ending tells you something is missing. A windowless room has no windows.
  examples:
    - text: The room was [windowless].
      from: entry
    - text: The old house was [doorless].
      from: constructed
  play: Put -less on the end of a noun, like sun or roof. Say what the new word would describe. Make up a sentence with it.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
