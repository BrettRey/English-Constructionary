id: of-genitive-own-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>A car of my own</i>
  summary: A phrase like <i>a car of my own</i> presents something as set aside for your ownership or use.
  body: |-
    <i>A car of my own</i> presents the car as set aside for someone's ownership or independent use. The pattern is a noun, then <i>of</i>, then a genitive pronoun such as <i>my</i>, then <i>own</i>. The same idea without <i>own</i> uses a different pronoun form: <i>a car of mine</i>.

    It needn't mean legal ownership. Someone imagining renting a room to sleep and paint in can still call it <i>a room of my own</i>. The word <i>all</i> can add emphasis, as in <i>a room all of my own</i>.
  examples:
    - text: I've got [a car of my own].
      from: entry
    - text: '[a room all of my own]'
      from: entry
    - text: rent [a room of my own]
      from: entry
  try: 'Finish the sentence: <i>I''d like a ___ of my own</i>. Does your phrase mean you own it, or only that you can use it?'
teacher:
  summary: Explains the pattern <i>a room of my own</i> and how it contrasts with <i>a room of mine</i>.
  explain: 'The pattern is a noun followed by <i>of</i> plus a dependent genitive pronoun and <i>own</i> (<i>a car of my own</i>). It presents an entity as set aside for someone''s ownership or independent use, and it can describe independent use without legal ownership. CGEL contrasts <i>a car of my own</i> with <i>a car of mine</i>: <i>my own</i> uses the dependent genitive form, where the simple pattern uses the independent form <i>mine</i>. <i>All</i> can emphasize the relation (<i>a room all of my own</i>). This dictionary proposes comparing <i>a room of her own</i>, <i>her own room</i> and <i>a room of hers</i> in a new rental context, but that remains a proposed test. It is provisional.'
  terms: Traditional grammar calls <i>my</i> a possessive adjective or determiner and <i>mine</i> a possessive pronoun. This dictionary says dependent genitive and independent genitive.
  examples:
    - text: I've got [a car of my own].
      from: entry
    - text: '[a room all of my own]'
      from: entry
    - text: rent [a room of my own]
      from: entry
  contrasts:
    - text: a car of my own
      from: entry
      note: Dependent genitive plus <i>own</i>, after <i>of</i>.
    - text: a car of mine
      from: entry
      note: Independent genitive, without <i>own</i>.
    - text: her own room
      from: constructed
      note: The comparison phrase this dictionary proposes; no claim made here about the difference.
  watch_for:
    - A learner might assume <i>a car of my own</i> requires legal ownership, when it can describe independent use.
    - A learner might blend the two patterns, when this dictionary pairs <i>my own</i> with <i>of</i> and <i>mine</i> with the pattern without <i>own</i>.
  activity: Students complete sentences such as <i>I'd like a ___ of my own</i> with a noun of their choice. They then rewrite each with <i>of mine</i> and discuss whether they still mean set aside for me.
child:
  hook: What does <i>a room of your own</i> mean?
  explain: <i>A room of my own</i> is a room that's just for me. After <i>of</i>, we say <i>my own</i>. Without <i>own</i>, we say <i>mine</i>, as in <i>a room of mine</i>.
  examples:
    - text: I've got [a car of my own].
      from: entry
    - text: She wants [a room of her own].
      from: constructed
  play: Finish the sentence for yourself. <i>I'd like a ___ of my own</i>. Then ask a friend what they'd pick.
