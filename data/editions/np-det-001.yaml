id: np-det-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Noun phrases that start with a pointing or counting word
  summary: Some noun phrases begin with a small word or phrase that tells us which one or how much.
  body: |-
    In the new car, the word the points to a car we can pick out. In one new car, the word one counts it. In Ally's new car, Ally's does the same job, and in what size hat, the words what size ask about the hat.

    The words that do this are all in the same slot in front of the rest of the phrase. Singular nouns like car generally need something there. Plural nouns and non-count nouns can sometimes go without it.
  examples:
    - text: '[the new car]'
      from: entry
    - text: '[one new car]'
      from: entry
    - text: '[Ally''s new car]'
      from: entry
    - text: '[what size hat]'
      from: entry
  try: Take the phrase new car and add different words at the front. How does the meaning change?
teacher:
  summary: Shows that the determiner slot can be filled by different kinds of words and phrases, not only the and a.
  explain: In a determined NP, a determiner function is filled in front of a nominal, and the NP is marked as definite or indefinite. The determiner can be realized by a determinative (the, one), by a genitive NP (Ally's), or by a plain NP in interrogatives (what size hat). Singular count nominals generally require determination; bare plural and non-count nominals can be determinerless in some contexts. Following CGEL, determinative is a word category and determiner is a function. The dictionary marks this account as provisional.
  terms: The and a are determinatives, often called articles. Ally's is a genitive NP, sometimes called a possessive. Determiner function is sometimes called determination.
  examples:
    - text: '[the new car]'
      from: entry
    - text: '[one new car]'
      from: entry
    - text: '[Ally''s new car]'
      from: entry
    - text: '[what size hat]'
      from: entry
  watch_for:
    - A learner might think the only words that can fill this slot are the and a.
    - A learner might treat the position as a word class, when it's a function that different words and phrases can fill.
  activity: Give students a nominal such as new car. They add as many different front-slot words as they can (the, one, Ally's, my), then sort them by kind.
