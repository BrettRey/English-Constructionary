id: np-det-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Noun phrases that start with a pointing or counting word
  summary: Some noun phrases begin with a small word or phrase that tells us which one or how much.
  body: |-
    In <i>the new car</i>, the word <i>the</i> points to a car we can pick out. In <i>one new car</i>, the word <i>one</i> counts it. In <i>Ally's new car</i>, <i>Ally's</i> does the same job, and in <i>what size hat</i>, the words <i>what size</i> ask about the hat.

    The words that do this are all in the same slot in front of the rest of the phrase. Singular nouns like <i>car</i> generally need something there. Plural nouns and non-count nouns can sometimes go without it.
  examples:
    - text: '[the new car]'
      from: entry
    - text: '[one new car]'
      from: entry
    - text: '[Ally''s new car]'
      from: entry
    - text: '[what size hat]'
      from: entry
  try: Take the phrase <i>new car</i> and add different words at the front. How does the meaning change?
teacher:
  summary: Shows that the determiner slot can be filled by different kinds of words and phrases, not only <i>the</i> and <i>a</i>.
  explain: In a determined NP, a determiner function is filled in front of a nominal, and the NP is marked as definite or indefinite. The determiner can be realized by a determinative (<i>the</i>, <i>one</i>), by a genitive NP (<i>Ally's</i>), or by a plain NP in interrogatives (<i>what size hat</i>). Singular count nominals generally require determination; bare plural and non-count nominals can be determinerless in some contexts. Following CGEL, determinative is a word category and determiner is a function. The dictionary marks this account as provisional.
  terms: <i>The</i> and <i>a</i> are determinatives, often called articles. <i>Ally's</i> is a genitive NP, sometimes called a possessive. Determiner function is sometimes called determination.
  examples:
    - text: '[the new car]'
      from: entry
    - text: '[one new car]'
      from: entry
    - text: '[Ally''s new car]'
      from: entry
    - text: '[what size hat]'
      from: entry
  watch_for:
    - A learner might think the only words that can fill this slot are <i>the</i> and <i>a</i>.
    - A learner might treat the position as a word class, when it's a function that different words and phrases can fill.
  activity: Give students a nominal such as <i>new car</i>. They add as many different front-slot words as they can (<i>the</i>, <i>one</i>, <i>Ally's</i>, <i>my</i>), then sort them by kind.
