id: pseudo-cleft-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>What I need is...</i>
  summary: A sentence can start with a <i>what</i> clause, then a form of <i>be</i>, and finish with the thing being named.
  body: |-
    In <i>What I need is a long cool drink</i>, the first part sets up a gap: what is it that I need? The last part fills it in: a long cool drink. Putting the answer last gives it emphasis.

    The order can be flipped, as in <i>A long cool drink is what I need</i>. The answer can also be an action, as in <i>What you must do is apply for special leave</i>. This dictionary marks the account as provisional.
  examples:
    - text: '[What I need is a long cool drink.]'
      from: entry
    - text: '[A long cool drink is what I need.]'
      from: entry
    - text: '[What you must do is apply for special leave.]'
      from: entry
  try: Start with <i>what I want is</i>, and finish with the thing you want. Then flip it around.
teacher:
  summary: Covers sentences like <i>What I need is a drink</i>, where a <i>what</i> clause is paired with the value that completes it.
  explain: A pseudo-cleft specifies the value of a variable defined by a fused relative. In <i>What I need is a long cool drink</i>, <i>what I need</i> defines what is to be identified, and the drink supplies the value. The value can precede <i>be</i> in the reversed version (<i>A long cool drink is what I need</i>). Clausal values are common, including a bare or <i>to</i>-infinitival when the relative has <i>do</i> (<i>What you must do is apply for special leave</i>; <i>to</i> is also possible). This dictionary says the <i>do</i> pseudo-cleft can take an infinitival value which the corresponding <i>it</i>-cleft generally excludes. It's marked provisional.
  terms: Sometimes called a wh-cleft; the part beginning with <i>what</i> is a fused relative in this dictionary's terms.
  examples:
    - text: '[What I need is a long cool drink.]'
      from: entry
    - text: '[A long cool drink is what I need.]'
      from: entry
    - text: '[What you must do is apply for special leave.]'
      from: entry
  contrasts:
    - text: What they did was a disgrace.
      from: constructed
      note: A copular clause that evaluates what they did, not one that specifies the action.
  watch_for:
    - A learner might treat <i>What they did was a disgrace</i> as a pseudo-cleft, when it evaluates the action instead of naming it.
    - A learner might leave out the <i>be</i> that links the two parts.
  activity: Students turn plain sentences such as <i>I need a long cool drink</i> into pseudo-clefts and then into the reversed version, and say which part is the value.
