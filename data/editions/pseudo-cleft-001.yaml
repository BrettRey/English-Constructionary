id: pseudo-cleft-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: What I need is...
  summary: A sentence can start with a what clause, then a form of be, and finish with the thing being named.
  body: |-
    In What I need is a long cool drink, the first part sets up a gap: what is it that I need? The last part fills it in: a long cool drink. Putting the answer last gives it emphasis.

    The order can be flipped, as in A long cool drink is what I need. The answer can also be an action, as in What you must do is apply for special leave. This dictionary marks the account as provisional.
  examples:
    - text: '[What I need is a long cool drink.]'
      from: entry
    - text: '[A long cool drink is what I need.]'
      from: entry
    - text: '[What you must do is apply for special leave.]'
      from: entry
  try: Start with what I want is, and finish with the thing you want. Then flip it around.
teacher:
  summary: Covers sentences like What I need is a drink, where a what clause is paired with the value that completes it.
  explain: A pseudo-cleft specifies the value of a variable defined by a fused relative. In What I need is a long cool drink, what I need defines what is to be identified, and the drink supplies the value. The value can precede be in the reversed version (A long cool drink is what I need). Clausal values are common, including a bare or to-infinitival when the relative has do (What you must do is apply for special leave; to is also possible). This dictionary says the do pseudo-cleft can take an infinitival value which the corresponding it-cleft generally excludes. It's marked provisional.
  terms: Sometimes called a wh-cleft; the part beginning with what is a fused relative in this dictionary's terms.
  examples:
    - text: '[What I need is a long cool drink.]'
      from: entry
    - text: '[A long cool drink is what I need.]'
      from: entry
    - text: '[What you must do is apply for special leave.]'
      from: entry
  contrasts:
    - text: What they did was a disgrace.
      from: constructed
      note: A copular clause that evaluates what they did, not one that specifies the action.
  watch_for:
    - A learner might treat What they did was a disgrace as a pseudo-cleft, when it evaluates the action instead of naming it.
    - A learner might leave out the be that links the two parts.
  activity: Students turn plain sentences such as I need a long cool drink into pseudo-clefts and then into the reversed version, and say which part is the value.
checked:
