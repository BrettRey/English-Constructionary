id: relative-clausal-which-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Which pointing back at a whole situation
  summary: A which can follow a statement and refer back to the whole situation it describes, not to a single thing in it.
  body: |-
    In The train had already left, which was unfortunate, the word which doesn't point at the train. It points at the whole situation: the fact that the train had already left. That's what was unfortunate.

    The pattern is a comment tacked onto the end of a statement. It's a special case of a larger family of add-on remarks that begin with which. This dictionary marks the analysis as provisional, so treat the details as a working proposal.
  examples:
    - text: The train had already left, [which was unfortunate].
      from: entry
    - text: The shop was closed, [which surprised us].
      from: constructed
  try: Add a which remark to the end of a sentence you just said. What exactly is the which referring to?
teacher:
  summary: Helps explain why which can refer to a whole preceding statement, not just a noun.
  explain: A supplementary relative clause beginning with which can take as its anchor a clause (or a longer stretch of discourse), not only a noun phrase. In The train had already left, which was unfortunate, which refers to the departure situation as a whole. Number on a noun phrase inside the anchor, such as the singular noun train, doesn't determine what which refers to. This dictionary treats the pattern as a specialization of the ordinary supplementary relative, and marks the analysis as provisional.
  terms: 'Sometimes called a sentential relative. In this dictionary: supplementary relative with a clausal anchor.'
  examples:
    - text: The train had already left, [which was unfortunate].
      from: entry
    - text: The shop was closed, [which surprised us].
      from: constructed
  watch_for:
    - A learner might take which to refer only to the nearest noun, such as the train, when it refers to the whole situation.
  activity: Give pairs a short statement on a card. Each student adds a which comment, then partners say aloud what which stands for. Collect a few and discuss which ones refer to the whole situation.
