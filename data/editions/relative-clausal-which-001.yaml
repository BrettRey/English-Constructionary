id: relative-clausal-which-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Which</i> pointing back at a whole situation
  summary: A <i>which</i> can follow a statement and refer back to the whole situation it describes, not to a single thing in it.
  body: |-
    In <i>The train had already left, which was unfortunate</i>, the word <i>which</i> doesn't point at the train. It points at the whole situation: the fact that the train had already left. That's what was unfortunate.

    The pattern is a comment tacked onto the end of a statement. It's a special case of a larger family of add-on remarks that begin with <i>which</i>. This dictionary marks the analysis as provisional, so treat the details as a working proposal.
  examples:
    - text: The train had already left, [which was unfortunate].
      from: entry
    - text: The shop was closed, [which surprised us].
      from: constructed
  try: Add a <i>which</i> remark to the end of a sentence you just said. What exactly is the <i>which</i> referring to?
teacher:
  summary: Helps explain why <i>which</i> can refer to a whole preceding statement, not just a noun.
  explain: A supplementary relative clause beginning with <i>which</i> can take as its anchor a clause (or a longer stretch of discourse), not only a noun phrase. In <i>The train had already left, which was unfortunate</i>, <i>which</i> refers to the departure situation as a whole. Number on a noun phrase inside the anchor, such as the singular noun <i>train</i>, doesn't determine what <i>which</i> refers to. This dictionary treats the pattern as a specialization of the ordinary supplementary relative, and marks the analysis as provisional.
  terms: 'Sometimes called a sentential relative. In this dictionary: supplementary relative with a clausal anchor.'
  examples:
    - text: The train had already left, [which was unfortunate].
      from: entry
    - text: The shop was closed, [which surprised us].
      from: constructed
  watch_for:
    - A learner might take <i>which</i> to refer only to the nearest noun, such as <i>the train</i>, when it refers to the whole situation.
  activity: Give pairs a short statement on a card. Each student adds a <i>which</i> comment, then partners say aloud what <i>which</i> stands for. Collect a few and discuss which ones refer to the whole situation.
