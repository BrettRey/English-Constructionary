id: difference-than-from-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: What something is different from
  summary: The word <i>different</i> can be followed by a phrase that names what something differs from.
  body: |-
    In <i>The result was different from what we expected</i>, the phrase after <i>different</i> says what the result is compared with. This dictionary's pattern lists three small words that can introduce that phrase: <i>from</i>, <i>to</i> and <i>than</i>.

    The phrase can name a thing or a whole situation. Here it is <i>what we expected</i>, a situation the result is measured against.
  examples:
    - text: The result was [different from what we expected].
      from: entry
    - text: This road is [different from the old one].
      from: constructed
  try: Finish the sentence <i>My day today was different from ...</i> in your own words. What did you compare it with?
teacher:
  summary: Gives the pattern for the standard of comparison after different.
  explain: <i>Different</i> heads an AdjP whose complement specifies the referent or situation from which something differs. The pattern in this dictionary lists <i>from</i>, <i>to</i> and <i>than</i> as introducers of that standard. The standard can be a plain NP or a clause-like expression, as in <i>different from what we expected</i>. This dictionary gives only one illustration and relates the pattern to same-as comparison and to than-reduced clauses.
  examples:
    - text: The result was [different from what we expected].
      from: entry
    - text: This road is [different from the old one].
      from: constructed
  watch_for:
    - A learner might not realize that the standard of comparison is what the phrase after <i>different</i> supplies.
  activity: Show two pictures. Students write one sentence about each difference using <i>different from</i>, naming the picture the first thing is compared with.
