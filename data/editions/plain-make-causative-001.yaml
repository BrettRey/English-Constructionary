id: plain-make-causative-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Making someone do something
  summary: Make, a person or thing, and a plain verb together present one participant as causing another to do or go through something.
  body: |-
    In The joke made Lee laugh, the joke causes Lee to laugh, and Lee is still the one who laughs. The verb after Lee is in its plain form, with no to.

    The passive version does use to: Lee was made to laugh. The to is required there. Compare They made Kai wait and Kai was made to wait.
  examples:
    - text: The joke [made Lee laugh].
      from: entry
    - text: They [made Kai wait].
      from: constructed
    - text: Lee was made to laugh.
      from: constructed
  try: Say The joke made Lee laugh. Now turn it around starting with Lee. Where does to appear?
teacher:
  summary: Explains make plus an NP and a plain verb, and the to that appears in the passive.
  explain: 'In the active, make takes an NP followed by a bare infinitival: The joke made Lee laugh. The sentence presents one participant as causing the other to undertake or undergo a situation, and Lee remains the laugher. In the passive counterpart the infinitival marker is required: Lee was made to laugh. Make shares the NP plus bare infinitival shape with let (let Kai wait); make presents a cause and let presents permission or non-prevention. This dictionary marks the pattern as provisional, with medium confidence.'
  terms: Textbooks sometimes call this the causative use of make, or make plus bare infinitive.
  examples:
    - text: The joke [made Lee laugh].
      from: entry
    - text: They [made Kai wait].
      from: constructed
  contrasts:
    - text: They made Kai wait.
      from: constructed
      note: Active, plain verb after the NP.
    - text: Kai was made to wait.
      from: constructed
      note: Passive, with to.
    - text: They let Kai wait.
      from: constructed
      note: Same shape with let, which presents permission or non-prevention rather than a cause.
  watch_for:
    - A learner might add to after the NP in the active, when the active selects the plain form.
    - A learner might leave out to in the passive, though the infinitival marker is required there.
  activity: Give students five active make-sentences. They rewrite each as a passive and mark where to appears, then add one sentence with let and say how its meaning differs.
child:
  hook: When something makes you laugh, who is the one laughing?
  explain: 'Make can be followed by a name and then a plain verb. The joke made Lee laugh. Lee is the one who laughs. If you start with Lee, you add to: Lee was made to laugh.'
  examples:
    - text: The joke made Lee laugh.
      from: entry
    - text: They made Kai wait.
      from: constructed
    - text: Lee was made to laugh.
      from: constructed
  play: Make up sentences with made, a name and a plain verb. Then turn each one around so it starts with the name, and add to.
