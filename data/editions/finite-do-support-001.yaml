id: finite-do-support-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: The helper word <i>do</i>
  summary: When a sentence needs a helper verb and has none, English supplies <i>did</i>, <i>does</i> or <i>do</i>.
  body: |-
    In <i>Did you check the hinge?</i>, the question starts with <i>did</i>, and <i>check</i> stays in its plain form. The <i>did</i> is the helper, and it carries the past tense. English supplies it when a question or a negative needs a helper and the sentence has only an ordinary verb.

    If a helper such as <i>can</i> is already there, no <i>do</i> is needed: <i>Can you check the hinge?</i> The same goes for <i>Has Jo left?</i>, where the helper <i>has</i> is already present. For a negative, <i>Jo didn't leave</i> uses <i>do</i> to carry the <i>not</i>, while <i>Jo hasn't left</i> uses the helper that's already there.
  examples:
    - text: '[Did you check] the hinge?'
      from: entry
    - text: '[Can you check] the hinge?'
      from: entry
    - text: Jo [didn't leave].
      from: constructed
  try: Turn <i>Jo left</i> into a question. Which little word do you add, and what happens to left?
teacher:
  summary: Helps explain when English adds finite <i>do</i>, in questions and negatives, and when an existing auxiliary does the job.
  explain: 'Finite <i>do</i> support supplies a finite auxiliary when the construction (inversion or clause negation) requires one and the positive clause has a lexical verb. The tense is expressed on <i>do</i> and the verb is plain: <i>Did you check the hinge?</i> If a finite modal is available, it occupies the auxiliary position directly: <i>Can you check the hinge?</i> Likewise <i>Has Jo left?</i> inverts the auxiliary already present, and <i>Jo hasn''t left</i> uses the existing auxiliary, whereas <i>Did Jo leave?</i> and <i>Jo didn''t leave</i> insert <i>do</i>. Imperative <i>do</i> also occurs before <i>be</i>. This dictionary marks the analysis as provisional, with medium confidence.'
  terms: Also called <i>do</i>-support. The finite auxiliary that inverts or hosts negation is sometimes called the operator.
  examples:
    - text: '[Did you check] the hinge?'
      from: entry
    - text: '[Can you check] the hinge?'
      from: entry
  contrasts:
    - text: Did you check the hinge?
      from: entry
      note: No other auxiliary, so <i>do</i> is supplied and <i>check</i> is plain.
    - text: Can you check the hinge?
      from: entry
      note: The modal already occupies the finite auxiliary position.
    - text: Has Jo left?
      from: constructed
      note: The existing auxiliary inverts, so no do.
  watch_for:
    - A learner might put the tense on both <i>did</i> and <i>check</i>.
    - A learner might add <i>did</i> when a modal or another auxiliary is already present.
  activity: Students get statements with plain verbs (<i>Jo left</i>, <i>You checked</i>) and with auxiliaries (<i>Jo has left</i>, <i>You can check</i>). They turn each into a question and a negative, and sort the results by whether <i>do</i> was added.
child:
  hook: Which little word helps you ask <i>Did you check the hinge?</i>
  explain: In <i>Did you check the hinge?</i>, the question begins with <i>did</i>, and <i>check</i> stays plain. English adds <i>did</i> when the question needs a helper word and there isn't one. With <i>can</i>, you don't need <i>did</i>.
  examples:
    - text: '[Did you check] the hinge?'
      from: entry
    - text: '[Can you check] the hinge?'
      from: entry
    - text: '[Did Jo leave]?'
      from: constructed
  play: Take a statement like <i>Jo left</i> and ask it as a question starting with <i>did</i>. What happens to <i>left</i>? Then ask <i>Jo can swim</i> as a question. Do you need <i>did</i>?
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: "Fixed: child explanation no longer says do-support applies to every question about an ordinary verb, no longer says did shows 'it happened before' (the entry puts the tense on do, in constructions that require an auxiliary), and the play task now states the plain-form change (Did Jo leave?). Dismissed: none."
