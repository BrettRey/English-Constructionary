id: prenominal-modifier-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Plural nouns with an adjective in front
  summary: A plural noun with an adjective before it, such as <i>old men</i>, can stand as a subject without a word like <i>the</i> or <i>a</i>.
  body: |-
    In <i>old men</i>, the adjective <i>old</i> tells us a property of the men, here their age. In <i>other men</i>, the adjective needs a surrounding set of men to make sense, because <i>other</i> points to the rest of a set.

    A plural noun like this can be a sentence subject without a small word in front: <i>Old men were waiting</i>. A single man isn't the same: in the same kind of sentence, <i>an old man</i> needs the article <i>a</i>. Adding words such as <i>very</i> to the adjective, as in <i>very old men</i>, doesn't change that.
  examples:
    - text: '[old men]'
      from: entry
    - text: '[other men]'
      from: entry
    - text: '[Old men] were waiting.'
      from: constructed
  try: Say <i>Old men were waiting</i>. Then try it with one man. What word do you need to add?
teacher:
  summary: Covers plural nouns modified by a prenominal adjective, which can serve as subjects with no article.
  explain: 'The pattern is a plural noun as lexical head of a nominal, with an AdjP modifier before it: <i>old men</i>. It expresses category or kind modification with property attribution. <i>Old men</i> is direct property modification (an age attribute); <i>other men</i> requires a contextual reference set and expresses a complementary-set relation. The modifier must be an AdjP and the head must be plural. In an episodic clause such as <i>Old men were waiting</i>, the modified bare plural can be an ordinary subject without an article, while <i>an old man</i> needs the article. The licensing follows the head''s count and number profile and survives expansion to <i>very old</i>. This dictionary marks this as provisional, with medium confidence.'
  terms: Textbooks sometimes call the modifying adjective an attributive adjective. This dictionary also calls <i>old men</i> a bare plural with a prenominal modifier.
  examples:
    - text: '[old men]'
      from: entry
    - text: '[other men]'
      from: entry
    - text: '[Old men] were waiting.'
      from: constructed
  contrasts:
    - text: The old men were waiting.
      from: constructed
      note: The same modification inside an NP marked with <i>the</i>.
  watch_for:
    - A learner might think a subject needs <i>the</i> or <i>a</i>, when a plural noun with a modifier can stand alone as a subject.
    - A learner might read <i>other men</i> as simply more men, when <i>other</i> needs a contextual reference set.
  activity: Students list plural noun phrases with an adjective (<i>old men</i>, <i>tall trees</i>) and use each as a bare subject, then mark in each one whether the adjective attributes a property or points to a set.
