id: goal-complement-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Phrases that say where the movement ends
  summary: With a verb of movement, a short phrase can say where the movement ends, as in <i>go to the shop</i>.
  body: |-
    In <i>go to the shop</i>, <i>to the shop</i> says where the going ends up. The same job is done by <i>go home</i>, where one word names the place, and by <i>run into the garden</i>.

    The frame can also bring the movement itself. In <i>The bottle floated into the cave</i>, <i>floated</i> says how the bottle moved, and <i>into the cave</i> gives the direction and the end point. The same happens with <i>The fly buzzed into the room</i> and <i>She danced into the hall</i>, even though <i>buzzed</i> and <i>danced</i> don't themselves carry a direction or a goal.
  examples:
    - text: go [to the shop]
      from: entry
    - text: go [home]
      from: entry
    - text: The sailors went [ashore].
      from: entry
    - text: The bottle floated [into the cave].
      from: entry
    - text: The fly buzzed [into the room].
      from: entry
    - text: She danced [into the hall].
      from: entry
  try: Compare <i>The fly buzzed</i> with <i>The fly buzzed into the room</i>. What does the second one add?
teacher:
  summary: Helps explain how a place phrase after a verb marks the end point of movement, including with manner verbs like <i>float</i>.
  explain: 'The goal role is a semantic role; the syntactic function is locative complement. This dictionary lists three realizations: <i>to</i>-PPs (<i>go to the shop</i>), compound goal PPs headed by <i>into</i> or <i>onto</i> (<i>run into the garden</i>), and one-word PPs headed by a complementless preposition (<i>go home</i>, <i>head abroad</i>). Direction PPs headed by <i>towards</i> or compass terms are a distinct category. With manner or emission verbs the frame itself supplies the directed motion: <i>floated into the cave</i>. The PP is a complement integrated into the motion VP, not an adjunct.'
  terms: Goal is the semantic role. Locative complement is the CGEL function. This dictionary cites Goldberg for the intransitive-motion construction that supplies the motion reading with manner verbs.
  examples:
    - text: go [to the shop]
      from: entry
    - text: go [to church]
      from: entry
    - text: go [home]
      from: entry
    - text: The sailors went [ashore].
      from: entry
    - text: The bottle floated [into the cave].
      from: entry
    - text: She danced [into the hall].
      from: entry
  watch_for:
    - A learner might put <i>to</i> before <i>home</i>, when this dictionary treats <i>go home</i> as a goal PP of one word, with <i>to</i>-PPs a separate realization.
    - A learner might read <i>danced into the hall</i> as two actions, dancing and entering, when the frame supplies the movement.
  activity: Give students a list of verbs (<i>float</i>, <i>buzz</i>, <i>dance</i>, <i>go</i>, <i>run</i>). They pair each with a goal phrase (<i>into the room</i>, <i>home</i>, <i>to the shop</i>) and say which verbs already carry a direction or goal and which get it from the frame.
checked:
  date: '2026-11-19'
