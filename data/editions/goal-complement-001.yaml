id: goal-complement-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Phrases that say where the movement ends
  summary: With a verb of movement, a short phrase can say where the movement ends, as in go to the shop.
  body: |-
    In go to the shop, to the shop says where the going ends up. The same job is done by go home, where one word names the place, and by run into the garden.

    The frame can also bring the movement itself. In The bottle floated into the cave, floated says how the bottle moved, and into the cave gives the direction and the end point. The same happens with The fly buzzed into the room and She danced into the hall, even though buzzed and danced don't themselves carry a direction or a goal.
  examples:
    - text: go [to the shop]
      from: entry
    - text: go [home]
      from: entry
    - text: The sailors went [ashore].
      from: entry
    - text: The bottle floated [into the cave].
      from: entry
    - text: The fly buzzed [into the room].
      from: entry
    - text: She danced [into the hall].
      from: entry
  try: Compare The fly buzzed with The fly buzzed into the room. What does the second one add?
teacher:
  summary: Helps explain how a place phrase after a verb marks the end point of movement, including with manner verbs like float.
  explain: 'The goal role is a semantic role; the syntactic function is locative complement. This dictionary lists three realizations: to-PPs (go to the shop), compound goal PPs headed by into or onto (run into the garden), and one-word PPs headed by a complementless preposition (go home, head abroad). Direction PPs headed by towards or compass terms are a distinct category. With manner or emission verbs the frame itself supplies the directed motion: floated into the cave. The PP is a complement integrated into the motion VP, not an adjunct.'
  terms: Goal is the semantic role. Locative complement is the CGEL function. This dictionary cites Goldberg for the intransitive-motion construction that supplies the motion reading with manner verbs.
  examples:
    - text: go [to the shop]
      from: entry
    - text: go [to church]
      from: entry
    - text: go [home]
      from: entry
    - text: The sailors went [ashore].
      from: entry
    - text: The bottle floated [into the cave].
      from: entry
    - text: She danced [into the hall].
      from: entry
  watch_for:
    - A learner might put to before home, when this dictionary treats go home as a goal PP of one word, with to-PPs a separate realization.
    - A learner might read danced into the hall as two actions, dancing and entering, when the frame supplies the movement.
  activity: Give students a list of verbs (float, buzz, dance, go, run). They pair each with a goal phrase (into the cave, home, ashore) and say which verbs already carry a direction or goal and which get it from the frame.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: curious.body now says buzzed and danced lack lexical direction or a goal (not that they can''t describe movement); title and teacher.activity now speak of where movement ends and of direction or goal rather than movement itself; replaced the try prompt with a pair the entry exemplifies; replaced ''the entry'' with this dictionary.'
