id: singular-anaphoric-they-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>They</i> for one person
  summary: <i>They</i>, <i>them</i> and <i>their</i> can point back to a single person, and the verb still agrees as it does with <i>they</i>.
  body: |-
    In <i>Every applicant said they were ready</i>, the word <i>they</i> refers back to every applicant, taken one at a time. The verb is <i>were</i>, the same form used when <i>they</i> means several people.

    The pattern is also compatible with they for a specific person in a suitable context. The word that <i>they</i> refers back to is singular, while the pronoun still takes its usual <i>they</i> forms. This dictionary marks the analysis as provisional.
  examples:
    - text: Every applicant said [they were] ready.
      from: entry
    - text: Each guest said [they were] hungry.
      from: constructed
  try: Say a sentence beginning <i>Everyone said ...</i> and finish it with <i>they</i>. Which verb form follows?
teacher:
  summary: Helps explain <i>they</i>, <i>them</i> and <i>their</i> with a singular antecedent.
  explain: The <i>they</i> paradigm (<i>they</i>, <i>them</i>, <i>their</i>) can have a singular antecedent, including a bound-variable reading (as with every applicant) or a known person. In <i>Every applicant said they were ready</i>, the antecedent is singular, yet <i>they</i> takes ordinary <i>they</i>-agreement, such as <i>were</i>. The pattern is compatible with bound readings and with specific references in suitable contexts. This dictionary treats it as a specialization of the personal pronoun NP and relates it to verb number agreement. The analysis is marked provisional.
  terms: 'Sometimes called singular <i>they</i>. In this dictionary: singular anaphoric <i>they</i>.'
  examples:
    - text: Every applicant said [they were] ready.
      from: entry
    - text: Each guest said [they were] hungry.
      from: constructed
  watch_for:
    - A learner might expect the verb to agree with the singular antecedent (<i>every applicant</i>), when <i>they</i> takes ordinary <i>they</i>-agreement, such as <i>were</i>.
    - A learner might assume <i>they</i> can only refer to more than one person.
  activity: Students complete sentences starting <i>Each student said ...</i> and <i>Every player thought ...</i> using <i>they</i>, then circle the verb and discuss its form.
child:
  hook: Can <i>they</i> ever mean just one person?
  explain: Sometimes <i>they</i> points back to one person at a time. <i>Every applicant said they were ready.</i> The verb is <i>were</i>, just like when <i>they</i> means a group.
  examples:
    - text: Every applicant said [they were] ready.
      from: entry
    - text: Each guest said [they were] hungry.
      from: constructed
  play: Start a sentence with <i>Every kid said</i> or <i>Each player said</i>. Finish it using <i>they</i> and a verb.
