id: deictic-here-there-inversion-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Here comes the bus
  summary: Starting a sentence with a stressed <i>here</i> or <i>there</i>, then the verb, points out something arriving, present or leaving.
  body: |-
    In <i>Here comes the bus</i>, <i>here</i> points to the place you are, the verb comes next, and the thing arriving comes last. The sentence draws attention to an arrival, a presence or a departure in what you can see or hear around you. The word <i>here</i> can get pointing stress, as if the speaker were pointing.

    When the arriving thing is a pronoun, the order is the ordinary one: <i>Here it comes</i>. A full noun phrase, like <i>the bus</i>, follows the verb. This dictionary treats the analysis as provisional.
  examples:
    - text: '[Here comes the bus].'
      from: entry
    - text: '[Here it comes].'
      from: entry
  try: Say <i>Here comes the bus</i>, then <i>Here it comes</i>. Where does the thing arriving go in each?
teacher:
  summary: Helps explain <i>Here comes the bus</i> and <i>Here it comes</i>, where <i>here</i> or <i>there</i> with inversion draws attention to what is in view.
  explain: 'The pattern has a stressed locative <i>here</i> or <i>there</i>, a verb and a full NP: <i>Here comes the bus</i>. It draws attention to an arrival, presence or departure in the perceptual setting. When the subject is a personal pronoun, the order is ordinary, with the pronoun before the verb: <i>Here it comes</i>. A full NP typically follows <i>come</i>. The locative can receive pointing stress, unlike the dummy subject of an existential. Compare presentational <i>there</i>, where <i>there</i> is a dummy subject. The analysis is provisional.'
  terms: Traditional grammars may describe <i>here</i> or <i>there</i> at the start as adverbs. This dictionary describes the locative as a deictic, pointing to the setting.
  examples:
    - text: '[Here comes the bus].'
      from: entry
    - text: '[Here it comes].'
      from: entry
  contrasts:
    - text: Here comes the bus.
      from: entry
      note: Full NP follows the verb.
    - text: Here it comes.
      from: entry
      note: Pronoun subject in ordinary order.
  watch_for:
    - A learner might treat <i>here</i> in <i>Here comes the bus</i> as a dummy subject like existential <i>there</i>, when it can take pointing stress.
    - A learner might think a pronoun should follow the verb in the same way a full noun phrase does.
  activity: Students look out a window or at a picture and describe what is arriving or leaving with <i>Here comes</i> or <i>There goes</i>, using both a full noun phrase and a pronoun. They note where the stress falls.
child:
  hook: What do you say when you spot the bus coming?
  explain: You can point at something with the word <i>here</i> at the start. <i>Here comes the bus</i>. When you use a word like <i>it</i>, <i>it</i> goes before the verb. <i>Here it comes</i>.
  examples:
    - text: '[Here comes the bus].'
      from: entry
    - text: '[Here it comes].'
      from: entry
  play: Stand at a window and watch. When something arrives, point and describe it with <i>Here comes</i> and the thing. Then say it again with just <i>it</i>.
