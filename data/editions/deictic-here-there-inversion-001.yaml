id: deictic-here-there-inversion-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Here comes the bus
  summary: Starting a sentence with a stressed here or there, then the verb, points out something arriving, present or leaving.
  body: |-
    In Here comes the bus, here points to the place you are, the verb comes next, and the thing arriving comes last. The sentence draws attention to an arrival, a presence or a departure in what you can see or hear around you. The word here can get pointing stress, as if the speaker were pointing.

    When the arriving thing is a pronoun, the order is the ordinary one: Here it comes. A full noun phrase, like the bus, follows the verb. This dictionary treats the analysis as provisional.
  examples:
    - text: '[Here comes the bus].'
      from: entry
    - text: '[Here it comes].'
      from: entry
  try: Say Here comes the bus, then Here it comes. Where does the thing arriving go in each?
teacher:
  summary: Helps explain Here comes the bus and Here it comes, where here or there with inversion draws attention to what is in view.
  explain: 'The pattern has a stressed locative here or there, a verb and a full NP: Here comes the bus. It draws attention to an arrival, presence or departure in the perceptual setting. When the subject is a personal pronoun, the order is ordinary, with the pronoun before the verb: Here it comes. A full NP typically follows come. The locative can receive pointing stress, unlike the dummy subject of an existential. Compare presentational there, where there is a dummy subject. The analysis is provisional.'
  terms: Traditional grammars may describe here or there at the start as adverbs. This dictionary describes the locative as a deictic, pointing to the setting.
  examples:
    - text: '[Here comes the bus].'
      from: entry
    - text: '[Here it comes].'
      from: entry
  contrasts:
    - text: Here comes the bus.
      from: entry
      note: Full NP follows the verb.
    - text: Here it comes.
      from: entry
      note: Pronoun subject in ordinary order.
  watch_for:
    - A learner might treat here in Here comes the bus as a dummy subject like existential there, when it can take pointing stress.
    - A learner might think a pronoun should follow the verb in the same way a full noun phrase does.
  activity: Students look out a window or at a picture and describe what is arriving or leaving with Here comes or There goes, using both a full noun phrase and a pronoun. They note where the stress falls.
child:
  hook: What do you say when you spot the bus coming?
  explain: You can point at something with the word here at the start. Here comes the bus. When you use a word like it, it goes before the verb. Here it comes.
  examples:
    - text: '[Here comes the bus].'
      from: entry
    - text: '[Here it comes].'
      from: entry
  play: Stand at a window and watch. When something arrives, point and describe it with Here comes and the thing. Then say it again with just it.
