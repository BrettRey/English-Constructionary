id: object-resultative-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Doing something until the object ends up a certain way
  summary: In <i>He painted the fence blue</i>, the last word says what state the fence ends up in.
  body: |-
    In <i>He painted the fence blue</i>, the fence comes to be blue as a result of the painting. The word <i>blue</i> describes the fence, and it describes the outcome. <i>He washed it clean</i> works the same way: it ends up clean.

    There's a related pattern with a reflexive word. In <i>He talked himself hoarse</i>, the talking leaves him hoarse. This dictionary says it works only with a reflexive, not with any affected person. It's different from describing how something is while the action goes on, as in <i>He ate the steak almost raw</i>.
  examples:
    - text: He [washed it clean].
      from: entry
    - text: He [painted the fence blue].
      from: entry
    - text: He [talked himself hoarse].
      from: entry
  try: After someone paints a fence blue, what colour is the fence? Does the word <i>blue</i> describe the fence before or after the painting?
teacher:
  summary: Explains a result state attached to the direct object, and how it differs from depictives and from state-goal PPs.
  explain: The object-oriented resultative is a verb with a direct object (Od) followed by a predicative complement (an AdjP or NP) that is predicated of that object. The Od is in the state the predicative names at the end of the verbal process. Unlike a depictive, a resultative entails a change culminating in that state. An optional resultative still counts as a complement, while an optional depictive such as <i>almost raw</i> in <i>ate the steak almost raw</i> is an adjunct. Marked state goals such as <i>to sleep</i> are locative complements. This dictionary marks the analysis as provisional.
  terms: Resultative is the traditional name. The predicative is also sometimes called an object complement. Depictive is the name for a description that holds during the event.
  examples:
    - text: He [washed it clean].
      from: entry
    - text: He [painted the fence blue].
      from: entry
    - text: He [talked himself hoarse].
      from: entry
  contrasts:
    - text: He painted the fence blue.
      from: entry
      note: Resultative. The fence comes to be blue as a result of the painting.
    - text: He ate the steak almost raw.
      from: constructed
      note: Depictive. <i>Almost raw</i> describes the steak while he ate it, and it's an adjunct.
    - text: She cried herself to sleep.
      from: constructed
      note: "<i>To sleep</i> is a marked state goal, a locative complement, so it isn't a resultative predicative."
  watch_for:
    - A learner might read <i>painted the fence blue</i> as having two objects, when <i>blue</i> describes the fence.
    - A learner might treat <i>cried herself to sleep</i> as the same pattern as <i>talked himself hoarse</i>, when <i>to sleep</i> is a locative complement.
    - A learner might take <i>almost raw</i> in <i>ate the steak almost raw</i> as a result, when it describes the steak during the eating.
  activity: Give students sentences with a verb, an object and a descriptive word. They ask whether the object ends up in that state because of the action (resultative) or is simply that way while the action happens (depictive), and sort them.
child:
  hook: After someone paints a fence blue, what colour is it?
  explain: In <i>He painted the fence blue</i>, the last word tells how the fence ended up. The painting made it blue. The word comes after the thing and says what it became.
  examples:
    - text: He [painted the fence blue].
      from: entry
    - text: He [washed it clean].
      from: entry
    - text: She [wiped the table dry].
      from: constructed
  play: Pick a job, like wiping or painting. Say the thing, then a word for how it ends up. For example, <i>wiped the table dry</i>. Trade turns with a friend.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
