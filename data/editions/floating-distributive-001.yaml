id: floating-distributive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>Each</i>, placed away from its group"
  summary: The word <i>each</i> can sit after a group of people or things and say the action applies to every member separately.
  body: |-
    In <i>The three hikers each carried a radio</i>, <i>each</i> isn't stuck to a noun. It sits later and says the carrying applies to the hikers one by one: every hiker carried a radio.

    The word can follow the subject even across a helper verb, as in <i>The hikers had each carried a radio</i>. The group it's linked to can have its own <i>the</i>, and the group isn't contained inside <i>each</i>.
  examples:
    - text: The three hikers [each carried a radio].
      from: entry
    - text: The hikers had [each carried a radio].
      from: entry
    - text: The two sisters [each wrote a letter].
      from: constructed
  try: Say <i>The three hikers each carried a radio</i>. Then say <i>Each of the hikers carried a radio</i>. Is the meaning the same?
teacher:
  summary: Helps explain floating <i>each</i>, which distributes an action over the members of a nearby plural noun phrase.
  explain: 'Floating <i>each</i> is separately positioned from the plural participant NP it is associated with, and it distributes the predication over the individual members: <i>The three hikers each carried a radio</i>. <i>Each</i> can follow the subject across a finite auxiliary, as in <i>The hikers had each carried a radio</i>. The linked NP can have its own determiner and isn''t contained in <i>each</i>. This dictionary relates the pattern to the each-of partitive and to <i>each</i> in subject determiner function, and marks it provisional, with medium confidence.'
  terms: "<i>Each</i> in this position is sometimes called a floating quantifier. Distributive <i>each</i> is used for its meaning."
  examples:
    - text: The three hikers [each carried a radio].
      from: entry
    - text: The hikers had [each carried a radio].
      from: entry
  contrasts:
    - text: The three hikers each carried a radio.
      from: entry
      note: "<i>Each</i> sits away from the group it distributes over."
    - text: Each of the hikers carried a radio.
      from: constructed
      note: "<i>Each</i> heads a partitive and is next to the group."
  watch_for:
    - A learner might read <i>each</i> as modifying <i>radio</i> rather than distributing over the hikers.
    - A learner might think <i>each</i> has to sit right next to its subject.
  activity: Students write sentences about a group (<i>the three hikers</i>, <i>two sisters</i>) and place <i>each</i> in different spots, before and after a helper verb. They check that it still distributes over the group.
