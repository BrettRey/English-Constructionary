id: adjective-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Words that describe things
  summary: Adjectives are words like tall, wooden or happy that say what something is like, and they don't all behave alike.
  body: |-
    Adjectives are words such as tall, fast, wooden, French, broken, happy, good and same. This dictionary groups what they tell us into five kinds: scale (tall), type (wooden), state (broken), evaluation (good) and reference (same).

    A common central adjective can come before a noun, as in an angry neighbour, and after be, as in the neighbour is angry. Not every adjective does both. The word former can come before a noun (a former president), but it doesn't have the matching use after be. So no single position or meaning picks out every adjective.
  examples:
    - text: an [angry] neighbour
      from: constructed
    - text: The neighbour is [angry].
      from: entry
    - text: a [former] president
      from: constructed
  try: Put a few describing words before a noun and after is. Do they all fit both places?
teacher:
  summary: Gives teachers a working description of adjectives as a cluster of properties, with attention to words that don't pattern alike.
  explain: 'Adjective is a word category. Central members are modifiers of nouns (attributive, an angry neighbour) and predicative complements (the neighbour is angry), and gradable ones accept degree morphology (-er/-est) or degree modifiers like very. This dictionary lists five semantic groupings: scalar (tall, fast), classificatory (wooden, French), state (broken, happy), evaluative (good, correct) and reference (same, other). Classificatory adjectives resist degree modification. Some adjectives are restricted: former in former president lacks the corresponding reading after be. Fast, near and fun are listed as boundary items. This dictionary marks the analysis as provisional.'
  terms: Traditional grammars may call adjectives describing words. In CGEL usage an adjective is a word category, and modifier and predicative complement are functions.
  examples:
    - text: The neighbour is [angry].
      from: entry
    - text: a [wooden] spoon
      from: constructed
    - text: a [former] president
      from: constructed
  contrasts:
    - text: an angry neighbour
      from: constructed
      note: Before the noun.
    - text: The neighbour is angry.
      from: entry
      note: After be, a predicative use.
  watch_for:
    - A learner might assume every adjective can appear both before a noun and after be, when former in former president lacks the corresponding use after be.
    - A learner might sort words by meaning alone, when neither meaning nor a single position picks out every adjective.
  activity: Give students a list of words (tall, wooden, happy, broken, same, former). They test each before a noun and after be, and record which fit where.
child:
  hook: Can you say "an angry neighbour" and also "the neighbour is angry"?
  explain: Adjectives are words that tell us what something is like. Tall, wooden and happy are adjectives. They can go before a noun, and they can go after is.
  examples:
    - text: a [tall] tree
      from: constructed
    - text: The tree is [tall].
      from: constructed
    - text: a [wooden] spoon
      from: constructed
  play: Pick a describing word like tall, happy or wooden. Say it before a noun, then after is. Find three that work both ways.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
