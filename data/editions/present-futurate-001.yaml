id: present-futurate-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: The plain present talking about tomorrow
  summary: A verb in the plain present tense can describe something that hasn't happened yet, when it's scheduled or fixed by an arrangement.
  body: |-
    In <i>The ferry leaves at dawn tomorrow</i>, the verb <i>leaves</i> is in the present tense, yet the event is in the future. The word <i>tomorrow</i> anchors it there, and the sentence presents the departure as scheduled, something arranged in advance.

    The same goes for <i>The Sun sets at five tomorrow</i>, where the event isn't arranged by anyone but can be calculated. Compare <i>The heat will crack the pane tomorrow</i>, where <i>will</i> is used instead. This dictionary treats its account of the present-tense pattern as provisional.
  examples:
    - text: '[The ferry leaves at dawn tomorrow].'
      from: entry
    - text: '[The Sun sets at five tomorrow].'
      from: entry
  try: Think of something coming up this week that's on a schedule, such as a bus or a class. Can you describe it with a plain present-tense verb and a word like <i>tomorrow</i>?
teacher:
  summary: Useful when learners ask why a present-tense verb can refer to a scheduled future event.
  explain: The plain present can locate an event in the future when a future time expression (<i>tomorrow</i>, <i>at dawn tomorrow</i>) anchors it. The reading is of an event scheduled or fixed by an arrangement, and a calculable event such as a sunset fits too. Compare <i>will</i>, as in <i>The heat will crack the pane tomorrow</i>. The dictionary's account is marked provisional, so present it as a description of these examples rather than a complete rule for when learners should choose the present over <i>will</i>.
  terms: Sometimes called the 'present for future' or 'simple present with future time reference'; this dictionary calls it the present futurate.
  examples:
    - text: '[The ferry leaves at dawn tomorrow].'
      from: entry
    - text: '[The Sun sets at five tomorrow].'
      from: entry
  contrasts:
    - text: The heat will crack the pane tomorrow.
      from: constructed
      note: A <i>will</i>-version of a future event, for comparison.
  watch_for:
    - A learner might read <i>leaves</i> as describing the present moment instead of a scheduled future departure.
    - A learner might think the present-tense pattern can replace <i>will</i> in any prediction about the future.
  activity: Students write three sentences about a school timetable or transit schedule using a plain present-tense verb and a future time word, then swap with a partner who says whether each event is scheduled.
