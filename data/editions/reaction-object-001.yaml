id: reaction-object-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Nodding satisfaction
  summary: An action verb can take a noun naming the reaction it expresses.
  body: |-
    In She nodded satisfaction, the nod is how the satisfaction is shown. In He grunted assent, the grunt expresses agreement. The noun can name an attitude, a communicative response or an emotion.

    The verb needn't ordinarily take an object of this kind. In smiled her thanks, the smile is the means of expressing thanks. This dictionary marks the account as provisional.
  examples:
    - text: She [nodded satisfaction].
      from: entry
    - text: He [grunted assent].
      from: entry
  try: Think of a gesture or sound, such as a shrug or a sigh. What reaction could you say it expressed?
teacher:
  summary: For advanced classes, action verbs followed by a noun naming the reaction they express.
  explain: 'The pattern is a VP with an expression or action verb and an NP naming the reaction expressed: She nodded satisfaction. The NP can denote an attitude, communicative response or emotion, and the verb need not ordinarily take an object of this type. In smiled her thanks, the smile is the means of expressing thanks. This dictionary distinguishes this from a cognate object, which names the event itself, and reports restrictions on passive versions. It is marked provisional.'
  terms: A cognate object names the event itself; this dictionary keeps the reaction object separate from it.
  examples:
    - text: She [nodded satisfaction].
      from: entry
    - text: He [grunted assent].
      from: entry
  watch_for:
    - A learner might think the noun names the action itself rather than the reaction expressed.
    - A learner might assume the verb can't take an object because it doesn't ordinarily take one.
  activity: Give students verbs of gesture and sound (nod, grunt, smile, sigh) and nouns of reaction. They combine them and discuss which pairings show a reaction.
