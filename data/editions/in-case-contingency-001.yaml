id: in-case-contingency-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Doing something just in case
  summary: A phrase beginning with <i>in case</i> names a possibility that you're guarding against, so the main action is a precaution.
  body: |-
    In <i>Take a key in case the door locks</i>, the part after <i>in case</i> names a possibility. The taking happens as a precaution against it. You don't need to know yet whether the door will lock.

    That makes it different from a version with <i>if</i>. <i>Take a key if the door locks</i> makes the taking depend on the door locking. With <i>in case</i>, the taking is appropriate before anyone knows how things will turn out.
  examples:
    - text: Take a key [in case the door locks].
      from: entry
    - text: Pack a coat [in case it rains].
      from: constructed
  try: Compare <i>Take a key in case the door locks</i> with <i>Take a key if the door locks</i>. When would you pick up the key in each one?
teacher:
  summary: Useful for learners who treat <i>in case</i> as interchangeable with <i>if</i>.
  explain: The pattern is a prepositional phrase made of <i>in case</i> plus a finite clause. It supplies the possibility against which the main action is a precaution. The main action is appropriate before it is known whether the possibility will come about. An <i>if</i>-adjunct can instead make the main action conditional on that possibility. So the two forms invite different readings of the same main clause, as in <i>Take a key in case the door locks</i> versus <i>Take a key if the door locks</i>. The dictionary marks this dictionary as provisional and relates it to the general prepositional phrase and to <i>if</i>-conditionals.
  terms: Sometimes described as a precautionary or contingency use of <i>in case</i>. The <i>if</i> version is a conditional adjunct.
  examples:
    - text: Take a key [in case the door locks].
      from: entry
    - text: Bring an umbrella [in case it rains].
      from: constructed
  contrasts:
    - text: Take a key in case the door locks.
      from: entry
      note: Precaution; taken before it's known whether the door will lock.
    - text: Take a key if the door locks.
      from: constructed
      note: Taking depends on the door locking.
  watch_for:
    - A learner might treat <i>in case</i> and <i>if</i> as having the same meaning in <i>Take a key in case the door locks</i>.
    - A learner might think the <i>in case</i> clause describes something that has already happened.
  activity: Give pairs of sentences that differ only in <i>in case</i> and <i>if</i>. Students say what you would do, and when, in each version, then write their own pair.
checked:
