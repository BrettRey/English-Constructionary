id: deverbal-er-noun-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Nouns made by adding -er to a verb
  summary: Adding -er to a verb gives a noun for someone or something tied to that action.
  body: |-
    A singer is a person who sings. The central reading names the person who does the activity. Some -er words name a tool instead, as in mixer.

    Agent nouns like these can carry a complement that matches the object of the verb. In the reviewer of the manuscript, the manuscript is what gets reviewed. The same ending also shows up in islander, but that follows a different pattern, because it starts from a noun rather than a verb.
  examples:
    - text: '[the reviewer of the manuscript]'
      from: entry
    - text: '[a mixer]'
      from: entry
  try: Think of a verb for a job. Add -er. Is the new word a person or a tool?
teacher:
  summary: Helps explain agent and instrument nouns in -er and the of-phrase that matches the verb's object.
  explain: A deverbal noun in -er names a participant characteristically associated with the action of the base verb. The central reading identifies the person who does the activity (singer). Instrument readings occur with forms such as mixer. With many agent nouns, the verb's object has a corresponding of-phrase, as in the reviewer of the manuscript. The same ending in islander supports a separate noun-base pattern, so not every -er word comes from a verb.
  terms: Traditional grammars call the person-naming ones (singer) agent nouns; instrument readings such as mixer are a further reading of the same pattern. This dictionary treats the result as an ordinary common noun.
  examples:
    - text: '[the reviewer of the manuscript]'
      from: entry
    - text: '[a mixer]'
      from: entry
  watch_for:
    - A learner might assume every -er noun names a person, when mixer names an instrument.
    - A learner might read islander as built on a verb, when its base is a noun.
  activity: Students match verbs (sing, review, mix) to -er nouns, then say whether each names a person or a tool, and add an of-phrase to the people words where it fits.
child:
  hook: What do you call a person who sings?
  explain: Add -er to a word for an action and you can get a word for who does it, like singer. Sometimes the -er word is a tool instead, like mixer.
  examples:
    - text: A [singer] stood on the stage.
      from: constructed
    - text: Dad used a [mixer] for the cake.
      from: constructed
  play: Take sing, paint and teach. Add -er to each one. Say who does each job. Then find a word ending in -er that is a tool.
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: "Fixed: teacher terms no longer applies 'agent nouns' to the whole class; it now limits it to the person-naming reading and notes that instrument readings such as mixer belong to the same pattern."
