id: such-nominal-result-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Such a cold morning that the locks froze</i>
  summary: <i>Such</i> plus a noun phrase can describe how extreme something was by giving what resulted from it.
  body: |-
    In <i>It was such a cold morning that the locks froze</i>, the second part tells how cold the morning was: cold enough to freeze the locks. The result clause that follows measures the extent or kind of morning it was.

    With a single countable noun, <i>such</i> comes before <i>a</i>. With a plural, as in <i>such cold mornings</i>, there is no <i>a</i>, and the result clause is still possible. The word <i>that</i> can be left out in the pattern.

    This dictionary marks the analysis as provisional.
  examples:
    - text: It was [such a cold morning that the locks froze].
      from: entry
    - text: It was [such a loud noise that the dog jumped].
      from: constructed
  try: Finish this sentence in your own words. <i>It was such a hot day that ...</i>
teacher:
  summary: Useful for explaining <i>such a/an</i> plus a result clause, and the plural version without <i>a</i>.
  explain: The pattern is <i>such</i> followed by a nominal expression and a content clause (<i>that</i> is optional) which gives a result. It characterizes the extent or kind of something through that associated result. In the singular count pattern, <i>such</i> precedes <i>a</i>. A plural nominal such as <i>such cold mornings</i> uses no <i>a</i>, while the result dependency remains available. This dictionary marks the analysis as provisional and has one constructed illustration. A related so-nominal pattern has its own entry.
  terms: Result clause and <i>such ... that</i> are textbook labels for the pattern. The cited grammar treats <i>such</i> as a word in its own right.
  examples:
    - text: It was [such a cold morning that the locks froze].
      from: entry
  contrasts:
    - text: such a cold morning
      from: entry
      note: Singular count noun; <i>such</i> comes before <i>a</i>.
    - text: such cold mornings
      from: constructed
      note: Plural; no <i>a</i>, and the result clause is still possible.
  watch_for:
    - A learner might put <i>a</i> before <i>such</i> in the singular pattern.
    - A learner might add <i>a</i> to a plural nominal after <i>such</i>.
    - A learner might read the <i>that</i>-clause as a relative clause instead of a result.
  activity: Students complete <i>such a ... that</i> and <i>such ... that</i> sentences with their own results, then compare singular and plural versions of the same idea.
child:
  hook: How cold was the morning if the locks froze?
  explain: You can use <i>such</i> to say how big or strong something was. Then you say what happened because of it. The locks froze because the morning was so cold.
  examples:
    - text: It was [such a cold morning that the locks froze].
      from: entry
    - text: It was [such a loud noise that the dog jumped].
      from: constructed
  play: Start with <i>It was such a big ...</i> and finish it with <i>that</i> and something that happened. See whose ending is the funniest.
