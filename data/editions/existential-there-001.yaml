id: existential-there-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Sentences that start with <i>there</i>
  summary: "<i>There</i> plus <i>be</i> can introduce something, or say that it's present, available or going on."
  body: |-
    In <i>There are two spare seats</i>, the word <i>there</i> doesn't point to a place. It opens the sentence so that the thing being introduced, <i>two spare seats</i>, comes after the verb. Sentences like this introduce something new into the conversation, or assert that it's present, available or happening.

    The word <i>there</i> moves around like a subject. It switches places with the verb in a question (<i>Is there a seat?</i>) and can turn up in a tag at the end. The thing introduced favours information that's new to the listener, though some definite things are allowed in the right context.
  examples:
    - text: '[There are two spare seats].'
      from: entry
    - text: '[Is there a seat]?'
      from: entry
    - text: '[There is a cat] on the roof.'
      from: constructed
  try: Say <i>There are two spare seats</i>, then turn it into a question. What happens to the word <i>there</i>?
teacher:
  summary: Helps explain existential <i>there</i>, the <i>there</i> that doesn't mean a place, and what comes after be.
  explain: 'In an existential clause, dummy <i>there</i> is followed by finite <i>be</i> and a pivot NP: <i>There are two spare seats</i>. The clause introduces a candidate referent or asserts its presence, availability or occurrence. <i>There</i> inverts in <i>Is there a seat?</i> and can occur in a tag. In the central presentational use the pivot favours new information, even though some definites are licensed in appropriate contexts. This dictionary marks the analysis as provisional, with medium confidence.'
  terms: Dummy <i>there</i> is also called expletive <i>there</i>. The pivot is the NP after <i>be</i>.
  examples:
    - text: '[There are two spare seats].'
      from: entry
    - text: '[Is there a seat]?'
      from: entry
  contrasts:
    - text: There are two spare seats.
      from: entry
      note: Dummy <i>there</i>, no place meaning.
    - text: There are two spare seats, aren't there?
      from: constructed
      note: <i>There</i> can occur in a tag.
  watch_for:
    - A learner might read <i>there</i> in <i>There are two spare seats</i> as the adverb of place.
    - A learner might expect a definite pivot to be ruled out, though some definites are licensed in appropriate contexts.
  activity: Students write three sentences about their classroom starting with <i>There is</i> or <i>There are</i>. They turn each into a question, then swap with a partner and underline the pivot.
child:
  hook: Does the word <i>there</i> in <i>There are two spare seats</i> point to a place?
  explain: 'Some sentences start with <i>there</i> just to introduce something. <i>There are two spare seats.</i> The seats are the news. You can ask about them too: <i>Is there a seat?</i>'
  examples:
    - text: '[There are two spare seats].'
      from: entry
    - text: '[Is there a seat]?'
      from: entry
    - text: '[There is a cat] on the roof.'
      from: constructed
  play: Look around the room. Say what you can find with <i>There is</i> or <i>There are</i>. Then turn each one into a question starting with <i>Is there</i> or <i>Are there</i>.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
