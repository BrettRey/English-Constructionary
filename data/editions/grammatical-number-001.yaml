id: grammatical-number-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: One or more than one
  summary: Nouns like <i>cat</i> change form to show one thing or more than one, and words nearby change to match.
  body: |-
    <i>Cat</i> and <i>cats</i> show one against more than one, and <i>this</i> and <i>these</i> do the same for the word pointing at it. The verb can follow along too.

    The pattern is about more than counting. <i>Rice</i> and <i>rices</i> show that a word can be treated as something you can count or as an amount you can't, and the choice shows up in the grammar. Some words sit in between: <i>many cattle</i> is fine, while <i>three cattle</i> isn't. In <i>three hours is enough</i>, a plural measure takes a singular verb, so the grammar doesn't just tally the units.
  examples:
    - text: '[cat]/[cats]'
      from: entry
    - text: '[this]/[these]'
      from: entry
    - text: '[rice]/[rices]'
      from: entry
  try: Say <i>There's a cat in the garden</i> and then change <i>cat</i> to <i>cats</i>. What else in the sentence has to change?
teacher:
  summary: Covers singular and plural marking, agreement, and the count/non-count boundary, including odd cases like <i>three hours is enough</i>.
  explain: 'Grammatical number covers singular and plural morphology on nouns and agreement on demonstrative determinatives, verbs and pronouns. It also reflects whether a referent is construed as countable: <i>rice</i> against <i>rices</i> shows non-count against count construal. This dictionary ranks count diagnostics: the tight ones (<i>a</i>/<i>an</i>, low cardinals, distributives) need more individuation precision than the loose ones (<i>many</i>, high round numerals, plural agreement). Quasi-count nouns show the ranking, as in <i>many cattle</i> against <i>three cattle</i>. Amount agreement is a further override: <i>three hours is enough</i> has a plural measure with singular agreement, so agreement doesn''t follow directly from the number of units. This dictionary marks this analysis as provisional.'
  terms: Demonstrative determinatives are <i>this</i>/<i>these</i> and <i>that</i>/<i>those</i>. Non-count is the CGEL term (traditionally mass). <i>Cattle</i>, <i>police</i> and <i>furniture</i> are listed as boundary items.
  examples:
    - text: '[cat]/[cats]'
      from: entry
    - text: '[this]/[these]'
      from: entry
    - text: '[rice]/[rices]'
      from: entry
    - text: '[Three hours] is enough.'
      from: constructed
  contrasts:
    - text: three cattle
      from: entry
      acceptable: false
      note: Quasi-count pattern; compare <i>many cattle</i>.
  watch_for:
    - A learner might take plural form to guarantee plural agreement, as in <i>three hours is enough</i>.
    - A learner might assume a noun that works with the loose diagnostics also works with low cardinals, as with <i>cattle</i>.
  activity: Give students cards with nouns (<i>cat</i>, <i>rice</i>, <i>furniture</i>, <i>hours</i>). They test each with <i>a</i>/<i>an</i>, <i>three</i>, <i>many</i> and a verb, record what works, and sort the nouns into groups.
child:
  hook: How can you tell one cat from more than one cat?
  explain: Nouns like <i>cat</i> change when there's more than one. <i>One cat</i> becomes <i>two cats</i>. Words nearby can change too, like <i>this cat</i> and <i>these cats</i>.
  examples:
    - text: '[cat]/[cats]'
      from: entry
    - text: '[this] cat, [these] cats'
      from: constructed
  play: Pick five things in the room and say each as one and as more than one. Then say <i>this</i> or <i>these</i> in front of each.
