id: emphatic-polarity-response-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Adding force to <i>yes</i> and <i>no</i>
  summary: Informal speakers put an emphatic word in front of <i>yeah</i>, <i>yes</i> or <i>no</i> to give the answer extra feeling.
  body: |-
    You can answer a question with a plain <i>yeah</i> or <i>no</i>. You can also put an emphatic word in front, as in <i>hell yeah</i>, to show you feel strongly about the answer. The word added doesn't change the answer: <i>hell yeah</i> still means <i>yes</i>, and <i>hell fucking no</i> still means <i>no</i>. It adds emotion.

    Some of these combinations use profane words. They're also a small, specific set, not a rule that lets any emphatic word go with any answer. Some are also used to start a longer reply, with the rest of the turn following.
  examples:
    - text: hell yeah.
      from: entry
    - text: Hell yeah, count me in!
      from: constructed
  try: Notice a time someone answered a question with extra force. Was the answer itself different from a plain <i>yes</i> or <i>no</i>, or only the feeling?
teacher:
  summary: Likely relevant only for advanced or register-focused classes; this dictionary covers informal, profane emphatic responses.
  explain: 'This is a family of related local patterns where an emphatic expression precedes a polarity response (<i>yeah</i>, <i>yes</i>, <i>no</i>), adding emotional emphasis while keeping the response''s orientation. It is not a free combination: this dictionary documents particular forms, such as <i>hell yeah</i>, <i>shit no</i>, <i>fuck yes</i> and <i>hell fucking no</i>. Norrick (2009: 880) treats <i>hell</i> in <i>hell yeah</i> and <i>shit</i> in <i>shit no</i> as intensifiers, and the whole expression can work as a pragmatic marker before a longer turn. The reverse order <i>no shit</i> has a different idiomatic meaning and falls outside the family. Emotional emphasis doesn''t necessarily raise certainty or express approval of the event.'
  terms: Intensifier describes the internal contribution of the emphatic word; pragmatic marker describes a use of the whole expression. This dictionary says neither label settles the word's lexical category.
  examples:
    - text: hell yeah.
      from: entry
    - text: '[fuck yeah] it placed third in the derby in his year.'
      from: entry
    - text: '[Fuck no], you don''t care about the money.'
      from: entry
    - text: Hell fucking no.
      from: entry
  contrasts:
    - text: Fuck yes!
      from: entry
      note: One published source gives <i>fuck yes</i> and <i>fuck no</i> but excludes <i>fucking yes</i> and <i>fucking no</i>.
    - text: Fucking yes!
      from: entry
      note: A corpus concordance line supplied for this dictionary attests the bare <i>fucking yes</i>.
  watch_for:
    - A learner might treat an emphatic response as a free pattern in which any emphatic word can precede any answer word.
    - A learner might take emphatic <i>hell yeah</i> to express approval of the event, when this dictionary says emphasis need not mean approval.
    - A learner might read <i>no shit</i> as the same pattern reversed, although it has a different idiomatic meaning.
  activity: Students discuss, in pairs, when a plain <i>yes</i> or <i>no</i> would be heard as flat and when an emphatic response would be out of place in a class, workplace or home setting, then rewrite two emphatic replies into neutral ones.
checked:
