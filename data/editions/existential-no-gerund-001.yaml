id: existential-no-gerund-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>There was no stopping her</i>"
  summary: "<i>There</i> plus <i>be</i> plus <i>no</i> plus an <i>-ing</i> verb presents an action as unavailable in the circumstances."
  body: |-
    <i>There was no stopping her</i> says that stopping her couldn't be done. The pattern is <i>there</i>, a form of <i>be</i>, the word <i>no</i>, and a verb ending in <i>-ing</i>. It presents an action as unavailable in the circumstances.

    <i>There was no moving it</i> normally suggests that moving it was impossible or impracticable. If someone could easily have moved a crate and just chose not to, <i>Nobody moved it</i> fits directly, and <i>There was no moving it</i> would call for more explanation. A rule can be the obstacle too. Where this sense of "can't" comes from is left open in this dictionary.
  examples:
    - text: '[There was no stopping her.]'
      from: entry
    - text: '[There was no telling what he might do next.]'
      from: entry
    - text: '[There''ll be no stopping her.]'
      from: entry
    - text: '[There was no moving it.]'
      from: entry
  try: Picture two crates, one bolted to the floor and one that people simply left where it was. For which does <i>There was no moving it</i> fit better?
teacher:
  summary: Helps explain the idiomatic <i>There was no -ing</i> pattern, which presents an action as unavailable.
  explain: 'The pattern is existential <i>there</i>, BE, <i>no</i>, and a gerund-participial VP. It presents an action as unavailable in the circumstances: <i>There was no moving it</i> normally suggests that moving it was impossible or impracticable, and a rule can also be the obstacle (a prohibitive use). A test: where a crate was easy to move and nobody did, <i>Nobody moved it</i> fits directly and <i>There was no moving it</i> calls for further explanation. CGEL treats <i>no</i> plus a gerund-participial as hybrid and observes a strong restriction to existential <i>there</i>. The source of the modal force is open, and this dictionary’s confidence is low.'
  terms: Gerund-participial is CGEL's name for the <i>-ing</i> form, covering what traditional grammars split into gerund and present participle.
  examples:
    - text: '[There was no stopping her.]'
      from: entry
    - text: '[There was no telling what he might do next.]'
      from: entry
    - text: '[There''ll be no stopping her.]'
      from: entry
  contrasts:
    - text: There was no moving it.
      from: entry
      note: Fits a crate bolted to the floor.
    - text: Nobody moved it.
      from: constructed
      note: Fits a crate that was easy to move and was simply left.
  watch_for:
    - A learner might read <i>There was no moving it</i> as a plain report that nobody moved it.
    - A learner might try the <i>no</i> plus <i>-ing</i> pattern with other kinds of subject, though this dictionary notes a strong restriction to existential <i>there</i>.
  activity: Give students two scenarios for a stuck door, one where it's jammed and one where people just didn't bother. They decide which fits <i>There was no opening it</i> and which fits <i>Nobody opened it</i>, and explain why.
