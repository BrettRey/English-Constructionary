id: coordination-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Joining things with and, or and but
  summary: Words like and, or and but can link two or more equal parts, and none of the parts is in charge.
  body: |-
    In bread and butter, two nouns sit side by side, linked by and. In slowly but surely, two adverbs are linked by but. Neither part is the boss of the other. A group like this is called a coordination, and it adds up the contributions of its parts: joining, choosing, contrasting or adding.

    A coordination can do whatever its parts do together in the sentence. Its parts needn't be exactly the same kind of word, as long as they do a similar job. Two thousand and twenty-seven joins two number expressions of different kinds this way. This dictionary treats the analysis as provisional.
  examples:
    - text: '[bread and butter]'
      from: entry
    - text: '[slowly but surely]'
      from: entry
    - text: '[two thousand and twenty-seven]'
      from: entry
  try: Take a sentence with bread and butter in it. Can you take away and butter and still have a sentence?
teacher:
  summary: Helps explain coordinations as headless groups of equal parts joined by and, or, but or nor.
  explain: 'A coordination is a non-headed constituent made up of two or more coordinates, optionally linked by a coordinator (and, or, but, nor). It isn''t a phrase, because phrases are headed. No coordinate is the head, so the group''s distribution follows from the coordinates jointly. Each coordinate could typically stand alone in the coordination''s position. Coordinates can differ in category where their functions are alike, as in two thousand and twenty-seven. The meaning is the joint contribution of the coordinates: conjunction, disjunction, contrast or addition.'
  terms: Traditional grammars call the linking words coordinating conjunctions. This grammar calls them coordinators and treats the group as a coordination rather than a phrase.
  examples:
    - text: '[bread and butter]'
      from: entry
    - text: '[slowly but surely]'
      from: entry
    - text: '[two thousand and twenty-seven]'
      from: entry
  contrasts:
    - text: bread and butter
      from: entry
      note: Coordination of two nouns; no head.
    - text: fresh bread
      from: constructed
      note: A phrase, with a head noun and a dependent.
  watch_for:
    - A learner might look for a head word in bread and butter, as in a noun phrase, when neither noun is the head.
    - A learner might think the coordinates must be the same category, when a similar function is enough.
  activity: Students write short coordinations with and, or and but (nouns, adjectives, adverbs). For each, they test whether either part could stand alone in the same sentence, and note the meaning the coordinator adds.
child:
  hook: What do the words and, or and but do when they join two things?
  explain: Small words like and, or and but can join two things. In bread and butter, both words matter equally. Neither one is the boss.
  examples:
    - text: We had [bread and butter].
      from: constructed
    - text: The tortoise moved [slowly but surely].
      from: constructed
  play: Pick a food. Join it to another with and, then with or. Say each one in a sentence. How does the meaning change?
