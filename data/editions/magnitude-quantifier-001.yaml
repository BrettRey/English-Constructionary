id: magnitude-quantifier-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>Hundreds of</i>, <i>thousands of</i>, <i>millions of</i>"
  summary: A plural word for a large size, followed by <i>of</i>, gives a rough, large amount without saying exactly how many.
  body: |-
    In <i>hundreds of people</i>, the word <i>hundreds</i> doesn't give an exact count. It gives a rough, large amount, and the speaker is emphasizing scale. The same pattern appears in <i>millions of stars</i>, and it can be stacked, as in <i>tens of thousands of dollars</i>.

    These are plural words followed by <i>of</i> and a noun phrase. <i>Hundreds of people</i> doesn't say how many groups of a hundred there were. That makes it different from an exact phrase such as <i>two of the cats</i>, which picks a smaller group out of a group already known. A related use with <i>dozens</i> is treated separately in this dictionary.
  examples:
    - text: '[hundreds of people]'
      from: entry
    - text: '[tens of thousands of dollars]'
      from: entry
    - text: '[millions of stars]'
      from: entry
  try: Say <i>hundreds of people</i> and then <i>two of the people</i>. Which one tells you how many, and which picks some out of a known group?
teacher:
  summary: Helps explain <i>hundreds of</i>, <i>thousands of</i> and <i>millions of</i> as rough quantifiers, and why they differ from exact numbers.
  explain: A plural magnitude noun (<i>hundreds</i>, <i>thousands</i>, <i>millions</i>) plus <i>of</i> and an NP quantifies an approximate large number. In <i>hundreds of people</i>, <i>hundreds</i> isn't a count of hundreds. It gives a rough scale without fixing how many groups of a hundred there were, and it can be nested (<i>tens of thousands of dollars</i>). The <i>of</i>-complement can be indefinite, unlike a true partitive such as <i>two of the cats</i>, which selects a subset from an established group. A word like <i>dozens</i> has a related quantified use but sits outside the core magnitude class. Mention that exact <i>two of the enquiries</i> is a different pattern.
  terms: Sometimes called an indefinite numeral, or a large-number noun. In this dictionary, a magnitude noun heads a quantifier construction, and a partitive is a separate pattern.
  examples:
    - text: '[hundreds of people]'
      from: entry
    - text: '[tens of thousands of dollars]'
      from: entry
    - text: '[millions of stars]'
      from: entry
  contrasts:
    - text: hundreds of enquiries
      from: constructed
      note: Approximate scale; the complement can be a bare plural.
    - text: two of the enquiries
      from: constructed
      note: Exact, and selects a subset from an established group.
  watch_for:
    - A learner might read <i>hundreds of people</i> as exactly one hundred people, when it gives only an approximate scale.
    - A learner might treat <i>hundreds of</i> as a true partitive like <i>two of the cats</i>, when the <i>of</i>-complement can be indefinite.
  activity: Give students a list of quantity phrases, some with <i>hundreds</i>, <i>thousands</i> or <i>millions of</i> and some with exact numbers. They sort them into rough and exact, then explain what each tells the reader.
child:
  hook: How do you say a really big number when you don't know the exact one?
  explain: Words like <i>hundreds</i>, <i>thousands</i> and <i>millions</i> can tell you roughly how many. We say <i>hundreds of people</i> when we mean a big crowd. It doesn't tell us the exact number.
  examples:
    - text: '[millions of stars]'
      from: entry
    - text: We saw [hundreds of people] at the fair.
      from: constructed
  play: Look at the night sky or a big crowd. Make up sentences that start with <i>hundreds of</i>, <i>thousands of</i> or <i>millions of</i>, and add a noun. Which one would you pick for a huge number?
checked:
