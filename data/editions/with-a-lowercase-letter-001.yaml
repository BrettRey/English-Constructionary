id: with-a-lowercase-letter-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: With a lowercase letter
  summary: Adding <i>with a lowercase r</i> (or another letter) says how a word is written, and can point to an ordinary meaning.
  body: |-
    <i>Republican with a lowercase r</i> points to the ordinary descriptive sense of the word, not an institutional one. <i>Romantic with a lowercase r</i> works the same way.

    The phrase is a spelling instruction. It can say which written form is meant, as <i>small</i> does in <i>with a small r</i>. The letter named generally matches the initial of the label.

    The dictionary marks this account as provisional.
  examples:
    - text: republican [with a lowercase r]
      from: entry
    - text: romantic [with a lowercase r]
      from: entry
  try: Say a word and add <i>with a lowercase</i> and its first letter. What written form are you pointing to?
teacher:
  summary: Helps explain <i>with a lowercase letter</i> as a spelling clarification pointing to an ordinary sense.
  explain: The pattern is a prepositional phrase headed by <i>with</i>, followed by <i>a</i>, <i>lowercase</i> and a letter name. It is postposed after a label or used parenthetically. It specifies lowercase orthography and signals an ordinary or common sense, disambiguating descriptive use from institutional or proper use. <i>With a lowercase r</i> and <i>with a small r</i> can direct a reader to the same written form in a literal clarification. The named letter generally matches the relevant initial or contrasted position in the label. This dictionary marks its analysis provisional. A sibling entry covers <i>with a small letter</i>.
  terms: <i>Lowercase letter</i> is the everyday term. This dictionary lists <i>with a small letter</i> as a variant.
  examples:
    - text: republican [with a lowercase r]
      from: entry
    - text: romantic [with a lowercase r]
      from: entry
  contrasts:
    - text: romantic with a lowercase r
      from: entry
      note: Non-institutional sense.
  watch_for:
    - A learner might name a letter that doesn't match the initial being discussed, though this dictionary says the letter generally matches it.
    - A learner might treat <i>with a lowercase r</i> and <i>with a small r</i> as different instructions, when they can point to the same written form.
  activity: Students pair words such as <i>republican</i> and <i>romantic</i> with the phrase <i>with a lowercase</i> and the initial. They then restate each using <i>with a small</i> and the initial, and confirm the written form is the same.
