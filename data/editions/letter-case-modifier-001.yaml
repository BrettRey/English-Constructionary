id: letter-case-modifier-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Small-c</i> and <i>big-D</i> labels
  summary: A word like <i>small-c</i> or <i>big-D</i> placed before a label tells the reader which kind of meaning the label has.
  body: |-
    Putting <i>small-c</i> before a word tells you to read it in its ordinary, descriptive sense, not as the name of an institution. Putting <i>big-D</i> before a word does the opposite. In <i>She is a big-D Democrat</i>, the label points to the party, while <i>small-c catholic</i> in <i>He's a small-c catholic</i> points to the ordinary sense.

    The little modifier names a letter and whether it's capital or small. It works as a quick instruction about how to read the word that follows. The longer version puts a phrase <i>with a capital D</i> after the label.
  examples:
    - text: He's a [small-c] catholic.
      from: entry
    - text: She is a [Big-D] Democrat.
      from: entry
    - text: That was [little-p] politics.
      from: entry
  try: Pick a word you could write with a capital or a small first letter. How could you tell a reader which meaning you intend?
teacher:
  summary: Explains compact modifiers like <i>small-c</i> and <i>big-D</i> that tell a reader how to interpret a label.
  explain: 'This is the compact form of letter-case specification. A premodifying adjective phrase, often hyphenated, names a letter and its case (<i>small</i>, <i>big</i>, <i>little</i>) and signals how to read the label that follows: ordinary or descriptive, versus institutional or party-affiliated. It sits before the head in the nominal, like other pre-head adjectival modifiers. The same contrast can be expressed with a full PP after the label, such as <i>with a capital D</i>. This dictionary marks the analysis as provisional; it rests on dictionary definitions of <i>capital</i> and <i>small</i>, so treat these as constructed illustrations.'
  terms: 'This dictionary treats it as a metalinguistic modifier: a modifier about how a word is written, used to guide how it is read.'
  examples:
    - text: He's a [small-c] catholic.
      from: entry
    - text: She is a [Big-D] Democrat.
      from: entry
    - text: That was [little-p] politics.
      from: entry
  contrasts:
    - text: She is a Democrat with a capital D.
      from: constructed
      note: The full PP after the label expresses an equivalent contrast.
    - text: She is a [Big-D] Democrat.
      from: entry
      note: The compact modifier before the label.
  watch_for:
    - A learner might read <i>small-c</i> as describing size, when it names the case of the letter.
    - A learner might expect the modifier to come after the label, when the compact form sits before it.
  activity: Write pairs of sentences that need a capital letter to show an institutional meaning and a small letter to show an ordinary one. Partners explain each sentence in their own words and then add the compact modifier before the label.
