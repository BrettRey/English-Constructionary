id: numerative-factor-modifier-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Number words built by multiplying
  summary: In phrases like <i>two hundred and forty-two million</i>, a smaller number multiplies a big round one.
  body: |-
    In <i>two hundred</i>, the word <i>two</i> says how many hundreds there are: two times a hundred. In <i>forty-two million</i>, <i>forty-two</i> says how many millions. The smaller number is called the factor, and the big round word (<i>hundred</i>, <i>thousand</i>, <i>million</i>) is the one it multiplies.

    This dictionary takes the factor to be one of the basic number words, from zero to ninety-nine. It describes the factor as scaling the round word, not as a separate word that introduces the whole phrase, though that analysis is marked provisional.
  examples:
    - text: '[two hundred]'
      from: entry
    - text: '[forty-two million]'
      from: entry
    - text: They sold [three hundred] tickets.
      from: constructed
  try: Pick a number like <i>five hundred</i>. Can you find the smaller number that multiplies the big round one?
teacher:
  summary: Explains why, in <i>two hundred</i>, the first number word is a multiplier of the second rather than a determiner of the noun phrase.
  explain: 'A multiplicative numerative combines a factor with a magnitude head: <i>two hundred</i> is 2 × 100, and <i>forty-two million</i> is 42 × 1,000,000. The factor comes from the basic numeratives (0 to 99) and is a modifier of the magnitude head. It isn''t a determiner of the NP. This dictionary''s reasoning is that a separate determiner can still appear in a count-noun use (it cites <i>two two hundreds</i>), so treating the factor as the determiner would hide why both numerals are there and why each contributes differently. The analysis is provisional.'
  terms: Numeral is the traditional word for number words in general. This dictionary says numerative, and calls the multiplier a factor and the big round word a magnitude head.
  examples:
    - text: '[two hundred]'
      from: entry
    - text: '[forty-two million]'
      from: entry
  watch_for:
    - A learner might take <i>two</i> in <i>two hundred</i> as a determiner of the whole noun phrase, when this dictionary treats it as scaling <i>hundred</i>.
    - A learner might read <i>forty-two million</i> as <i>forty-two plus a million</i>, when it is forty-two times a million.
  activity: Make cards with factors (<i>two</i>, <i>seven</i>, <i>forty-two</i>) and magnitude words (<i>hundred</i>, <i>thousand</i>, <i>million</i>). Pairs draw one of each, say the number aloud, and state the multiplication it stands for.
