id: bare-role-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Jobs and roles without "<i>the</i>" or "<i>a</i>"
  summary: Words like <i>treasurer</i> or <i>captain</i> can describe the role someone holds without a word like <i>the</i> or <i>a</i> in front.
  body: |-
    Normally a word like <i>treasurer</i> needs company: we say <i>the treasurer</i> or <i>a treasurer</i>. But in some sentences it stands alone. <i>They appointed Lee treasurer</i>. <i>Lee served as treasurer</i>. Here the word doesn't point to a particular person. It says what role Lee has.

    Compare <i>They questioned the treasurer</i>. That sentence is about a person, so it normally needs <i>the</i>. The bare version works where a role is being given or described. The role can also have more than one holder, as when two people are named co-captain.
  examples:
    - text: They appointed Lee [treasurer of the club].
      from: entry
    - text: Lee served [as treasurer].
      from: entry
    - text: Faatulu was named [co-captain] along with fellow junior Jamie Peck.
      from: entry
    - text: I've been everything except [president].
      from: entry
  try: Say "<i>They appointed her treasurer</i>" and "<i>They questioned the treasurer</i>." In which sentence does <i>treasurer</i> name a role, and in which does it point at a person?
teacher:
  summary: Explains why role nouns such as <i>secretary</i> can lack a determiner in predicative and some prepositional frames.
  explain: 'A singular count noun that names an office or post can appear with no determiner when the sentence ascribes the role to someone: after <i>be</i>, <i>become</i>, <i>remain</i>, <i>appoint</i> or <i>elect</i>, after <i>as</i>, after <i>role of</i> or <i>position of</i>, in an <i>except</i> phrase licensed by the main clause, or as an ascriptive supplement (<i>Wilson, Secretary to the Cabinet, ...</i>). The bare NP describes the subject or object. It doesn''t normally stand as a referential subject or object for the role-holder, where a determiner is needed (<i>They questioned the treasurer</i>). The noun and context must support a role reading: the article stays in <i>become a teacher</i>. A version with the or a can also ascribe a role (<i>became a co-captain</i>), and with <i>be</i>, <i>the secretary of the club</i> can identify the current holder, answering <i>Who is the secretary?</i>'
  terms: 'Predicative complement: an NP such as <i>treasurer</i> in <i>She stayed treasurer</i> or <i>They appointed her treasurer</i>, which describes the subject or object. This dictionary treats this as a licensed use of a determinerless NP.'
  examples:
    - text: They appointed Lee [treasurer of the club].
      from: entry
    - text: Lee served [as treasurer].
      from: entry
    - text: Lee is [secretary of the club].
      from: entry
    - text: Wilson, [Secretary to the Cabinet], had informed the Prime Minister immediately.
      from: entry
  contrasts:
    - text: Lee is secretary of the club.
      from: entry
      note: Ascribes the role to Lee.
    - text: Lee is the secretary of the club.
      from: entry
      note: Can also answer <i>Who is the secretary?</i>
    - text: I'm told treasurer strongly supports this proposal.
      from: entry
      acceptable: false
      note: A bare role noun doesn't work as a referential subject here.
  watch_for:
    - A learner might assume any job noun can go without an article after <i>become</i>, when the choice depends on the noun and how the job title is used.
    - A learner might use a bare role noun as the subject for a particular person, as in <i>I'm told treasurer strongly supports this proposal</i>.
  activity: Give students two columns of frames (<i>appointed Lee ___</i>, <i>they questioned ___</i>, <i>served as ___</i>, <i>I spoke to ___</i>). Students fill each with <i>secretary</i> or <i>the secretary</i> and explain which frames ascribe a role and which identify a person.
checked:
  date: "2026-11-19"
  model: claude-opus-5-5 (resolving glm-5.3 flags)
  result: fixed
  note: "Fixed: curious.try no longer offers the bare referential object She questioned treasurer (not starred in the entry, which says such objects normally call for a determiner); it now contrasts the entry's own They appointed her treasurer and They questioned the treasurer; curious.body split so multiple holders is no longer read as a licensing condition, and 'only works'/'needs the' softened to the entry's 'normally'; teacher.explain 'in of and except phrases' narrowed to the entry's role of / position of and matrix-licensed except phrases. Also fixed (unflagged): teacher.explain said the treasurer answers Who is the secretary? (now the secretary of the club, as in the entry); teacher.terms called the predicative complement 'the NP after appoint', which is the object (now cites the entry's She stayed treasurer and They appointed her treasurer); watch_for now quotes the starred sentence exactly; contrast Lee is the secretary of the club relabelled from: entry (quoted in the entry's example note); teacher 'The entry' changed to 'This dictionary'. Dismissed: none. Frequency pass: teacher.summary and activity now use secretary (as in the entry's secretary of the club) instead of treasurer (about 22,400th in SUBTLEX-UK); entry examples and the curious edition are unchanged."
