id: for-duration-adjunct-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Saying how long with <i>for</i>
  summary: A <i>for</i> phrase with a length of time says how long something lasted.
  body: |-
    In <i>Jo stayed outside for fifteen minutes</i>, <i>for fifteen minutes</i> measures how long Jo's staying outside lasted. It can measure how long a state or an activity held, or a result was maintained.

    Compare time measured by <i>in</i>. <i>Wrote for an hour</i> measures the time spent writing, while <i>wrote the letter in an hour</i> measures the time it took to finish. With a very quick action, the <i>for</i> phrase can suggest repetition or a result that lasts, where the context supports that.
  examples:
    - text: Jo stayed outside [for fifteen minutes].
      from: entry
    - text: Jo wrote [for an hour].
      from: constructed
    - text: Jo wrote the letter [in an hour].
      from: constructed
  try: Say how long you spent on something today, using <i>for</i>. Then say how long a finished job took, using <i>in</i>.
teacher:
  summary: Helps explain <i>for</i>-phrases that measure how long, and how they differ from in-phrases that measure time to completion.
  explain: 'A <i>for</i>-PP with a measure NP of time is an adjunct that measures how long a state, process or maintained result holds: <i>Jo stayed outside for fifteen minutes</i>. <i>Wrote for an hour</i> measures time spent writing, while <i>wrote the letter in an hour</i> measures elapsed time to completion. With a normally punctual predicate, the adjunct can favour a repeated-event or resulting-state construal where context supports it. This dictionary treats it as a specialization of the PP and marks it provisional, with medium confidence.'
  terms: For-phrases like this are sometimes called duration adverbials.
  examples:
    - text: Jo stayed outside [for fifteen minutes].
      from: entry
  contrasts:
    - text: Jo wrote for an hour.
      from: constructed
      note: Measures time spent writing.
    - text: Jo wrote the letter in an hour.
      from: constructed
      note: Measures time elapsed to completion.
  watch_for:
    - A learner might mix up <i>for an hour</i> (time spent) and <i>in an hour</i> (time to finish).
    - A learner might read <i>for fifteen minutes</i> with a quick action as one long event, when context can favour a repeated-event reading.
  activity: Give students a list of activities, some open-ended (reading, waiting) and some with an endpoint (writing a letter, cleaning a room). They add <i>for</i> or <i>in</i> plus a time and explain what each phrase measures.
child:
  hook: How do you say how long Jo stayed outside?
  explain: <i>For</i> and a length of time tell how long something lasted. <i>Jo stayed outside for fifteen minutes</i>. The time is how long she stayed.
  examples:
    - text: Jo stayed outside [for fifteen minutes].
      from: entry
    - text: Mia waited [for an hour].
      from: constructed
  play: Tell a partner something you did today. Say how long it lasted using <i>for</i>. Your partner guesses what you did.
checked:
