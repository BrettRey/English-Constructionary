id: numerative-teen-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>Thirteen</i> to <i>nineteen</i>"
  summary: The numbers from thirteen to nineteen are built from a single-digit word plus <i>-teen</i>.
  body: |-
    <i>Thirteen</i> through <i>nineteen</i> are formed by adding <i>-teen</i> to a single-digit word. The <i>-teen</i> word has a value ten greater than the base it comes from, so <i>thirteen</i> is ten more than three.

    The ending <i>-ty</i> works differently: the same base gives a different value, as <i>thirteen</i> and <i>thirty</i> show. The two endings also don't have the same distribution as words. Once built, a <i>-teen</i> word acts as one unit and can do the same jobs as a single-digit number.
  examples:
    - text: '[thirteen]'
      from: entry
    - text: '[nineteen]'
      from: entry
    - text: The class has [nineteen] students.
      from: constructed
  try: Say <i>thirteen</i> and <i>thirty</i>. What differs in the sound, and what differs in the amount?
teacher:
  summary: Explains the <i>-teen</i> numbers from thirteen to nineteen and how they differ from the <i>-ty</i> numbers.
  explain: 'The regular teen numeratives are formed from a single-digit base plus <i>-teen</i> and specify cardinalities from thirteen to nineteen. They''re lexically atomic and have the same distribution as single-digit numeratives: determiner, factor and addition. The <i>-teen</i> form is ten greater than its base, while <i>-ty</i> gives a different value from the same base, as <i>thirteen</i> versus <i>thirty</i> shows. CGEL separates the teen and decade formations, and the two endings differ in lexical and prosodic distribution. Eleven and twelve are treated in a separate entry. This dictionary marks the analysis as provisional.'
  terms: Teens is the traditional name for these numbers. This dictionary calls them teen numeratives and treats each as a single word.
  examples:
    - text: '[thirteen]'
      from: entry
    - text: '[nineteen]'
      from: entry
  contrasts:
    - text: '[thirteen] books'
      from: constructed
      note: '<i>-teen</i>, ten greater than the base three.'
    - text: '[thirty] books'
      from: constructed
      note: '<i>-ty</i>, a different value from the same base.'
  watch_for:
    - A learner might confuse <i>thirteen</i> and <i>thirty</i>, which have different values.
    - A learner might treat <i>thirteen</i> as two separate words, when it works as one unit.
  activity: Students pair <i>-teen</i> and <i>-ty</i> words (<i>thirteen</i> and <i>thirty</i>, for example) and say each in a short sentence about a quantity, noting how the endings differ in sound.
child:
  hook: What is the difference between <i>thirteen</i> and <i>thirty</i>?
  explain: <i>Thirteen</i> ends in <i>teen</i> and is ten more than three. <i>Thirty</i> ends in <i>ty</i> and is a different amount. Both start from the same word.
  examples:
    - text: She has [thirteen] marbles.
      from: constructed
    - text: He has [thirty] marbles.
      from: constructed
  play: Say two number words that end in <i>teen</i> and two that end in <i>ty</i>. Can your friend hear the difference? Make a sentence with each.
