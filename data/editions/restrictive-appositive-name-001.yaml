id: restrictive-appositive-name-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: A name added right after a description
  summary: A name can follow a descriptive noun with no pause, so the two together pick out one particular thing.
  body: |-
    In <i>The river Wye flooded</i>, <i>river</i> describes the thing and <i>Wye</i> names it. There's no comma or break between them, so the two sit together as one unit. Both parts are about the same river.

    Swapping the name changes which river you mean. That's what makes this different from an ordinary describing word: <i>river water</i>, for example, doesn't name the particular river in the same way. This dictionary marks the analysis as provisional.
  examples:
    - text: The [river Wye] flooded.
      from: entry
  try: Think of a description plus a name, such as a kind of place followed by its name. Does the name still pick out one particular place?
teacher:
  summary: Helps explain a name attached to a descriptive noun without a supplementary break.
  explain: 'The pattern is a Nom made of a descriptive noun plus a proper-name expression that identifies the referent: <i>the river Wye</i>. Because there''s no supplementary break, the name is integrated into the phrase. Both parts concern the same river, and replacing the name changes the referent identified. An ordinary modifier, such as <i>river</i> in <i>river water</i>, gives no comparable identification. This dictionary treats the pattern as a specialization of the Nom, and marks the analysis as provisional.'
  terms: 'Traditional grammar sometimes calls this restrictive apposition. In this dictionary: integrated appositive name.'
  examples:
    - text: The [river Wye] flooded.
      from: entry
    - text: The river water was cold.
      from: constructed
  contrasts:
    - text: The river Wye flooded.
      from: entry
      note: The name identifies which river.
    - text: The river water was cold.
      from: constructed
      note: <i>River</i> is an ordinary modifier of <i>water</i> and names no particular river.
  watch_for:
    - A learner might treat <i>Wye</i> in <i>the river Wye</i> as an ordinary describing word, like <i>river</i> in <i>river water</i>.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
