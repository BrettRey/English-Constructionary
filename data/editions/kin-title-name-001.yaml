id: kin-title-name-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Family titles before a name
  summary: A family word such as Grandma or Aunt placed before a name works as the name of one relative.
  body: |-
    A relative can be called by a family word plus a name: Grandma Sharon, Aunt Sarah, Grandpa Dale. The two parts do different jobs. The family word says what kind of relative it is, and the name picks out which one.

    There's no the or my in front. You can say we're leaving for Grandma Sharon, or call out Thanks, Aunt Sarah. The same person can be named in other ways too, depending on who is listening: one study found a man calling his father's brother Uncle Bill, Bill or my uncle, depending on whom he was speaking to.
  examples:
    - text: Well, we are actually leaving for [Grandma Sharon] and [Grandpa Dale] in three days.
      from: entry
    - text: How is [Grandma Baum]?
      from: entry
    - text: Thanks, [Aunt Sarah].
      from: entry
    - text: That reminds me of [grampa Charlie]'s story, Julia.
      from: entry
  try: What do you call your relatives when you talk to them, and what do you call them when you talk about them to a friend? Is it always the same?
teacher:
  summary: Explains kin titles used as part of a name (Grandma Sharon) and how they differ from titles like Dr or Sir.
  explain: 'In Grandma Sharon, the head of the NP is the proper noun Sharon, and the kin term is a pre-head modifier with no determiner of its own. The kin term gives a kin class, and the personal name picks out one member of it. The NP can be a referential argument, the subject-determiner in a genitive (grampa Charlie''s story), or a vocative (Thanks, Aunt Sarah). This dictionary treats the kin term as a modifier of the same kind as CGEL''s appellations (Queen, Sister, Captain, Dr), but notes that CGEL''s list doesn''t include kin terms, so this extends CGEL''s analysis. With a genitive determiner the structure differs: in your brother Ben''s birthday, brother is head and Ben an appositive.'
  terms: 'Appellation: CGEL''s term for a pre-head modifier of a personal name that expresses the status of the individual, such as Dr or Queen. Kin title: a family word such as Aunt, Uncle or Grandma used before a name.'
  examples:
    - text: Well, we are actually leaving for [Grandma Sharon] and [Grandpa Dale] in three days.
      from: entry
    - text: I like the ones that [Grandmama Linda] made though.
      from: entry
    - text: That reminds me of [grampa Charlie]'s story, Julia.
      from: entry
    - text: Thanks, [Aunt Sarah].
      from: entry
  contrasts:
    - text: '[Grandpa Dale] called.'
      from: constructed
      note: The kin term modifies the name, and there's no determiner.
    - text: It's your brother Ben's birthday.
      from: constructed
      note: With the determiner your, brother is the head and Ben is an appositive.
  watch_for:
    - A learner might add a determiner and treat Aunt Sarah as if it had the same structure as my aunt Sarah.
    - A learner might take a courtesy aunt or uncle (a kin term used for someone who isn't a relative) to be a blood relation.
  activity: Students list the ways they or their characters name one relative (Uncle plus name, name alone, my uncle) and decide which would suit speaking to the person, speaking about the person to a friend, and writing a card.
child:
  hook: Do you say "Grandma" and then a name for one of your relatives?
  explain: People can call a relative by a family word plus a name, like Aunt Sarah. The family word tells who she is to you. The name tells which aunt you mean.
  examples:
    - text: We're visiting [Aunt Sarah] on Sunday.
      from: constructed
    - text: Thanks, [Aunt Sarah].
      from: entry
    - text: '[Grandpa Dale] made pancakes.'
      from: constructed
  play: List your relatives. For each one, write the family word and the name together. Then try calling the same person by the name alone, or by "my" plus the family word.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
