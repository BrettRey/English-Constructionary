id: plural-s-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Adding <i>-s</i> to make a plural
  summary: Adding <i>-s</i> or <i>-es</i> to a common noun makes it plural, and the same ending can also count types, repeated events or members of a family.
  body: |-
    The ending <i>-s</i> turns <i>cat</i> into <i>cats</i>, marking more than one. The ending is pronounced differently depending on the last sound of the word: an <i>s</i> sound in <i>cats</i>, a <i>z</i> sound in <i>dogs</i>, and an extra syllable, like <i>iz</i>, in <i>horses</i>.

    The same ending does other jobs. <i>Wines</i> counts types of wine. <i>I get headaches</i> describes headaches that come back. And <i>the Kennedys</i> names the members of a family or dynasty, built from a name. Which job the ending does depends on how the noun is being used.
  examples:
    - text: '[cats]'
      from: entry
    - text: '[wines]'
      from: entry
    - text: I get [headaches].
      from: entry
    - text: '[the Kennedys]'
      from: entry
  try: Say <i>cats</i>, <i>dogs</i> and <i>horses</i> aloud. Can you hear the three different endings?
teacher:
  summary: Covers regular plural <i>-s</i>/<i>-es</i>, its pronunciation, and its extensions to types, recurring instances and family names.
  explain: 'Plural <i>-s</i> or <i>-es</i> attaches to a common-noun stem and realizes plural number. In regular formation the final sound of the stem predicts the pronunciation of the suffix: /s/ in <i>cats</i>, /z/ in <i>dogs</i>, /ɪz/ in <i>horses</i>. The same suffix realizes plural number in several uses: non-singular (<i>cats</i>), types or varieties of a substance (<i>wines</i>), recurring instances (<i>I get headaches</i>), and groups formed from proper names (<i>the Kennedys</i>, meaning Kennedy family or dynasty members). A variety reading depends on the noun being used as a count noun. This dictionary marks this as provisional, with medium confidence.'
  terms: The sibilant ending is sometimes called an allomorph of the plural suffix.
  examples:
    - text: '[cats]'
      from: entry
    - text: '[wines]'
      from: entry
    - text: I get [headaches].
      from: entry
    - text: '[the Kennedys]'
      from: entry
  contrasts:
    - text: cats, dogs, horses
      from: constructed
      note: Three pronunciations of one suffix, set by the last sound of the stem.
  watch_for:
    - A learner might pronounce the ending the same way in <i>cats</i>, <i>dogs</i> and <i>horses</i>.
    - A learner might read <i>wines</i> only as more than one bottle, when it can count types of wine.
  activity: Students sort a list of plural nouns by the ending sound (<i>s</i>, <i>z</i>, <i>iz</i>) and say what the last sound of the singular is each time.
child:
  hook: Does the <i>s</i> on <i>cats</i> sound the same as the <i>s</i> on <i>dogs</i>?
  explain: Adding <i>s</i> to a word can mean more than one. <i>Cats</i> ends with an <i>s</i> sound. <i>Dogs</i> ends with a <i>z</i> sound. <i>Horses</i> ends with an extra bit, like <i>iz</i>.
  examples:
    - text: cats
      from: entry
    - text: dogs
      from: constructed
    - text: horses
      from: constructed
  play: 'Say a list of plural words aloud. Sort them by the ending you hear: <i>s</i>, <i>z</i> or <i>iz</i>.'
