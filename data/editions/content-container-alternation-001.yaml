id: content-container-alternation-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Describing the place instead of the crowd
  summary: A busy scene can be described through the things doing the activity or through the place where it happens.
  body: |-
    You can report the same scene in two ways. One starts with what is doing the activity: <i>Bees swarmed in the courtyard</i>. The other starts with the place: <i>The courtyard swarmed with bees</i>. In the second, <i>the courtyard</i> is the subject of the sentence, and the bees come in a phrase beginning <i>with</i>.

    The second way presents the scene as a state of the place, rather than as something the bees are doing. This dictionary treats that analysis as provisional. It also notes that only suitable verbs allow the place-first form, so it can't be assumed to work wherever the other does.
  examples:
    - text: '[The courtyard swarmed with bees].'
      from: entry
    - text: Bees swarmed in the courtyard.
      from: constructed
  try: Take a sentence that says what something is doing in a place. Can you turn it round so the place comes first and the sentence says what the place is full of?
teacher:
  summary: "Low priority for most classes: this dictionary's only example rests on <i>swarm</i>, which is relatively infrequent (about 16,500th among word forms in the SUBTLEX-UK subtitle counts, and <i>swarmed</i> about 47,600th), so treat it if it comes up rather than teaching it. Helps explain why a place can be the subject of a verb of activity, as in <i>The courtyard swarmed with bees</i>."
  explain: 'The pattern pairs two ways of presenting one scene. In one, the content (the things performing the activity) is subject and the place is in a locative PP: <i>Bees swarmed in the courtyard</i>. In the other, the place is subject and the content is in a <i>with</i>-PP: <i>The courtyard swarmed with bees</i>. In the second, <i>the courtyard</i> is the subject and <i>bees</i> is the <i>with</i>-complement, even though the bees perform the activity. The place-subject form is restricted to suitable verbs and does not follow from general PP inversion. This dictionary marks the analysis as provisional.'
  terms: This dictionary's name for the pattern is content and container subject alternation.
  examples:
    - text: '[The courtyard swarmed with bees].'
      from: entry
    - text: Bees swarmed in the courtyard.
      from: constructed
  contrasts:
    - text: The courtyard swarmed with bees.
      from: entry
      note: Place as subject, content in a <i>with</i>-phrase.
    - text: Bees swarmed in the courtyard.
      from: constructed
      note: Content as subject, place in an in-phrase.
  watch_for:
    - A learner might take <i>bees</i> to be the subject of <i>The courtyard swarmed with bees</i> because the bees do the swarming.
    - A learner might assume the place-subject form is available with any verb that allows the content-subject form.
  activity: If the pattern comes up in a reading, write <i>The courtyard swarmed with bees</i> and <i>Bees swarmed in the courtyard</i> on the board. Students underline the subject of each sentence and say which phrase names the place and which names the bees.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
  note: "Frequency pass: teacher.summary now opens by marking the entry low priority (swarm about 16,500th in SUBTLEX-UK); activity no longer has students produce place-subject sentences with verbs like swarm, and is now a recognition task on the two board sentences."
