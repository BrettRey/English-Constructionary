id: abstract-numeral-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Numbers as things we talk about
  summary: A bare number word can be the subject of a sentence about the number itself.
  body: |-
    In <i>Seven is prime</i>, <i>seven</i> isn't counting anything. It names a number, and the sentence says something about that number. The same goes for <i>Twenty is even</i> and <i>Two plus two is four</i>.

    Compare <i>seven pages</i>, where <i>seven</i> tells you how many pages there are. In the mathematical use, the number word stands alone, with no <i>the</i> or other describing word in front. It acts like a name for one particular number.
  examples:
    - text: '[Seven] is prime.'
      from: entry
    - text: '[Twenty] is even.'
      from: entry
    - text: '[Two] plus [two] is [four].'
      from: entry
  try: Compare "<i>Seven is prime</i>" with "<i>I read seven pages</i>." In which sentence is <i>seven</i> counting something, and in which is it the thing being described?
teacher:
  summary: Shows number words used as names of numbers in mathematical statements, in contrast with number words that count.
  explain: In <i>Seven is prime</i>, <i>seven</i> is a cardinal noun heading a bare NP in subject position. It denotes an abstract mathematical object, not a count or quantity, and rigidly designates a particular number. This dictionary notes that it resists determiners and attributive modifiers. Compare <i>seven pages</i>, where <i>seven</i> supplies cardinal determination. The plural <i>sevens</i> can instead count instances of a written symbol or value. This dictionary bases the distinction between abstract-name, token and quantificational uses on their distributions.
  terms: 'Cardinal noun: a number word used as a noun.'
  examples:
    - text: '[Seven] is prime.'
      from: entry
    - text: '[Twenty] is even.'
      from: entry
    - text: '[Two] plus [two] is [four].'
      from: entry
  contrasts:
    - text: Seven is prime.
      from: entry
      note: "<i>Seven</i> names a number."
    - text: seven pages
      from: constructed
      note: "<i>Seven</i> counts pages."
    - text: the seven is prime
      from: entry
      acceptable: false
    - text: prime seven is odd
      from: entry
      acceptable: false
  watch_for:
    - A learner might read <i>Seven is prime</i> as describing seven of something.
    - A learner might add the or an adjective in front of the number word, as in <i>the seven is prime</i>.
  activity: Students sort sentences into two piles, those where a number word names a number (<i>Twenty is even</i>) and those where it counts things (<i>seven pages</i>), then write one new sentence for each pile.
