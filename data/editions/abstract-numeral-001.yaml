id: abstract-numeral-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Numbers as things we talk about
  summary: A bare number word can be the subject of a sentence about the number itself.
  body: |-
    In Seven is prime, seven isn't counting anything. It names a number, and the sentence says something about that number. The same goes for Twenty is even and Two plus two is four.

    Compare seven pages, where seven tells you how many pages there are. In the mathematical use, the number word stands alone, with no the or other describing word in front. It acts like a name for one particular number.
  examples:
    - text: '[Seven] is prime.'
      from: entry
    - text: '[Twenty] is even.'
      from: entry
    - text: '[Two] plus [two] is [four].'
      from: entry
  try: Compare "Seven is prime" with "I read seven pages." In which sentence is seven counting something, and in which is it the thing being described?
teacher:
  summary: Shows number words used as names of numbers in mathematical statements, in contrast with number words that count.
  explain: In Seven is prime, seven is a cardinal noun heading a bare NP in subject position. It denotes an abstract mathematical object, not a count or quantity, and rigidly designates a particular number. This dictionary notes that it resists determiners and attributive modifiers. Compare seven pages, where seven supplies cardinal determination. The plural sevens can instead count instances of a written symbol or value. This dictionary bases the distinction between abstract-name, token and quantificational uses on their distributions.
  terms: 'Cardinal noun: a number word used as a noun.'
  examples:
    - text: '[Seven] is prime.'
      from: entry
    - text: '[Twenty] is even.'
      from: entry
    - text: '[Two] plus [two] is [four].'
      from: entry
  contrasts:
    - text: Seven is prime.
      from: entry
      note: Seven names a number.
    - text: seven pages
      from: constructed
      note: Seven counts pages.
    - text: the seven is prime
      from: entry
      acceptable: false
    - text: prime seven is odd
      from: entry
      acceptable: false
  watch_for:
    - A learner might read Seven is prime as describing seven of something.
    - A learner might add the or an adjective in front of the number word, as in the seven is prime.
  activity: Students sort sentences into two piles, those where a number word names a number (Twenty is even) and those where it counts things (seven pages), then write one new sentence for each pile.
