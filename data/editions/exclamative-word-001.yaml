id: exclamative-word-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>What</i> and <i>how</i> as words of amazement
  summary: Of the question words, only <i>what</i> and <i>how</i> are used in exclamations to present something as remarkable.
  body: |-
    In <i>What a day it's been!</i> and <i>How fast she ran!</i>, the words <i>what</i> and <i>how</i> aren't asking anything. They present the day or the speed as standing out against what we'd expect. Only these two words from the family of question words are used this way.

    <i>How</i> goes with a describing word or an action, as in <i>how fast</i>. <i>What</i> comes before a noun, as in <i>what children</i> or <i>what a day</i>. In a question, the same words do a different job in a different kind of sentence.
  examples:
    - text: '[what] children'
      from: entry
    - text: '[how] fast'
      from: entry
    - text: '[What a] day it''s been!'
      from: entry
    - text: '[What awful weather] we''ve had!'
      from: constructed
  try: Compare <i>How fast she ran!</i> with <i>How fast did she run?</i> <i>What</i> is the speaker doing in each?
teacher:
  summary: 'For advanced classes: exclamative <i>what</i> and <i>how</i>, and how exclamative <i>what</i> differs in word class from question <i>what</i>.'
  explain: 'Exclamative use is the tightest packaging of the indeterminate series: only <i>what</i> and <i>how</i>, and the open variable is evaluated against a contextual norm. Exclamative <i>what</i> is an adjective functioning as an external or internal modifier in NP structure (<i>what children</i>, <i>what a day</i>). Exclamative <i>how</i> is adverbial and modifies an adjective, degree determinative, adverb or verb. Interrogative <i>what</i> is different: a determinative in determiner use and a pronoun when it heads an NP. In a singular count case, an independent <i>What a mess!</i> uses <i>a</i>, while <i>What awful weather!</i> does not. <i>Such (a)</i> and <i>so many/much</i> pattern with exclamative <i>what</i> in exclamatory NPs without belonging to the series.'
  terms: Indeterminate series is this grammar's name for the <i>what</i>/<i>who</i>/<i>how</i> family, sometimes called wh-words.
  examples:
    - text: '[what] children'
      from: entry
    - text: '[how] fast'
      from: entry
    - text: '[What a] day it''s been!'
      from: entry
  contrasts:
    - text: What a lovely day it is!
      from: constructed
      note: Exclamative <i>what</i>, an adjective in modifier function within the noun phrase.
    - text: What do you want?
      from: constructed
      note: Interrogative <i>what</i>, here a pronoun heading an NP.
  watch_for:
    - A learner might give what the same word class in <i>What a day it's been!</i> and <i>What do you want?</i>
    - A learner might treat <i>how</i> in <i>How fast she ran!</i> as a question word asking for a speed.
  activity: Students list five things that surprise them and write each as a <i>what</i> or <i>how</i> exclamation. They then underline <i>what</i> or <i>how</i> and say what it modifies.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: summary now limits the what/how restriction to the question-word (indeterminate) series, as this dictionary does; the what a lovely day contrast note no longer says what modifies day and instead says exclamative what is an adjective in modifier function within the NP. Terms: wh-words now ''sometimes called''. Second round: fixed teacher.explain, which now gives exclamative what as an external or internal modifier in NP structure, as the entry does; teacher.activity no longer limits what is modified to a noun or a describing word (the entry lets how modify a degree determinative or a verb as well). Dismissed the low flag on the contrast note (within the noun phrase covers both external and internal modifiers).'
