id: np-pron-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Words that stand in for a noun phrase
  summary: A pronoun like <i>he</i>, <i>they</i> or <i>it</i> can take the place of a whole noun phrase and still work as the subject or object.
  body: |-
    In <i>John arrived. He looked tired</i>, the word <i>he</i> points back to John. In <i>Before he entered the room, John switched off his phone</i>, <i>he</i> can point forward to John. Said about someone who isn't there, <i>He's late again</i> points to a person the speakers both know about.

    Some uses point to a different person for each case: in <i>Every student thinks they are smart</i>, <i>they</i> follows each student. And in <i>It is raining</i>, the word <i>it</i> doesn't point to anything. It just fills the spot a subject normally fills.
  examples:
    - text: John arrived. [He] looked tired.
      from: entry
    - text: Before [he] entered the room, John switched off his phone.
      from: entry
    - text: '[He]''s late again.'
      from: entry
    - text: '[It] is raining.'
      from: entry
  try: Find a sentence with <i>it</i> and ask whether the word <i>it</i> points to anything. What does <i>it</i> stand for in <i>It is raining</i>?
teacher:
  summary: Covers the different ways a pronoun NP finds its meaning, from earlier and later mentions to the situation and dummy uses.
  explain: 'A pronominal NP consists of a pronoun as head. The dictionary distinguishes anaphoric uses (<i>He looked tired</i>, pointing back to John), cataphoric uses (<i>Before he entered the room, John switched off his phone</i>), exophoric uses (<i>He''s late again</i>, with the referent supplied by the situation), bound variable uses (<i>Every student thinks they are smart</i>) and dummy uses (<i>It is raining</i>; <i>There is a problem</i>), where the pronoun doesn''t identify an entity. Having an antecedent is neither necessary for pronominal NP status nor sufficient to pick its case: <i>they</i> and <i>them</i> can pick up a prior referent but change form with subject versus object function. In this grammar, <i>everybody</i>, <i>something</i> and <i>nobody</i> are compound determinatives, not pronouns. The dictionary marks this account as provisional.'
  terms: Anaphora, cataphora and exophora are the usual names for pointing back, forward and out to the situation. Dummy <i>it</i> is sometimes called expletive <i>it</i>. Indefinite pronouns is the traditional name for <i>everybody</i>, <i>something</i> and <i>nobody</i>, which this grammar treats differently.
  examples:
    - text: John arrived. [He] looked tired.
      from: entry
    - text: Before [he] entered the room, John switched off his phone.
      from: entry
    - text: '[He]''s late again.'
      from: entry
    - text: Every student thinks [they] are smart.
      from: entry
    - text: '[It] is raining.'
      from: entry
    - text: '[There] is a problem.'
      from: entry
  watch_for:
    - A learner might assume every <i>it</i> points to a thing, including the <i>it</i> in <i>It is raining</i>.
    - A learner might think a pronoun has to follow the noun phrase it points to, when it can point forward.
  activity: Give students short texts with highlighted pronouns. They draw an arrow to what each one points to, or write "nothing" for dummy uses.
child:
  hook: In "<i>It is raining</i>", what does "<i>it</i>" stand for?
  explain: Words like <i>he</i> can take the place of a name. In <i>John arrived. He looked tired</i>, <i>he</i> means John. In <i>It is raining</i>, <i>it</i> doesn't mean anything. It just fills the spot.
  examples:
    - text: John arrived. [He] looked tired.
      from: entry
    - text: '[It] is raining.'
      from: entry
    - text: '[She] is my sister.'
      from: constructed
  play: Read a short story aloud. Every time you hear <i>he</i> or <i>she</i>, point to the person it means. Does every <i>it</i> point to something?
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: "Fixed: child explanation no longer defines every pronoun as standing in for a name or noun phrase (dummy it does not); play task limited to he and she, since the entry gives they a bound-variable use. Dismissed: none."
