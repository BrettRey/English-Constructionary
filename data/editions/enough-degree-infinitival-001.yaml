id: enough-degree-infinitival-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Enough to do something
  summary: <i>Enough</i> after a describing word says that a quality reaches the level needed for a stated result.
  body: |-
    In <i>The wall is high enough to hide the bins</i>, <i>high enough</i> says the wall's height meets the threshold, and to hide the bins names the outcome that the height is measured against. The pattern presents a degree as meeting the threshold for the specified outcome.

    <i>Ripe enough to eat</i> works the same way, with ripeness at or above a lower threshold. A neighbouring pattern, <i>too ripe to eat</i>, puts the degree above an upper threshold instead.
  examples:
    - text: The wall is [high enough to hide the bins].
      from: entry
    - text: The fruit is [ripe enough to eat].
      from: constructed
  try: 'Finish this with your own words: <i>The box is big enough to ...</i>'
teacher:
  summary: Helps explain <i>enough</i> plus a <i>to</i>-infinitival as marking a degree sufficient for an outcome, in contrast with <i>too</i>.
  explain: 'The pattern is a gradable adjective or adverb followed by <i>enough</i> and a <i>to</i>-infinitival. It presents a degree as meeting the threshold for the specified outcome: <i>high enough to hide the bins</i>. <i>Ripe enough to eat</i> places the degree at or above a lower threshold, whereas <i>too ripe to eat</i> places it above an upper threshold. This dictionary relates the pattern to gradation and to the too-degree infinitival.'
  terms: Compare the <i>too</i> pattern.
  examples:
    - text: The wall is [high enough to hide the bins].
      from: entry
    - text: The fruit is [ripe enough to eat].
      from: constructed
  contrasts:
    - text: The fruit is [ripe enough to eat].
      from: constructed
      note: The degree meets a lower threshold.
    - text: The fruit is too ripe to eat.
      from: constructed
      note: The degree exceeds an upper threshold.
  watch_for:
    - A learner might think <i>enough</i> and <i>too</i> express the same meaning, when one marks a lower threshold and the other an upper one.
    - A learner might read the <i>to</i>-infinitival as a separate sentence, when it names the outcome the degree allows.
  activity: Students complete sentence frames (<i>The bag is big enough to ...</i>, <i>This soup is hot enough to ...</i>) and then write a matching <i>too</i> sentence for the same adjective.
child:
  hook: How tall must a wall be to hide the bins?
  explain: <i>Enough</i> after a describing word means there is as much of it as you need. Then <i>to</i> and a verb say what it lets you do. <i>The wall is high enough to hide the bins.</i>
  examples:
    - text: The wall is [high enough to hide the bins].
      from: entry
    - text: The box is [big enough to hold the toys].
      from: constructed
  play: Look around the room. Make sentences like <i>The table is big enough to ...</i> Then say what is not big enough.
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: "Fixed: curious body no longer says the height achieves the outcome (the entry says only that the degree meets the threshold, and does not assert the bins are hidden); removed the traditional-term mapping that classed enough as a degree adverb and the infinitival as a result construction, which the entry does not state. Dismissed: none."
