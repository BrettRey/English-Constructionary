id: numerative-complex-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Number words above ninety-nine
  summary: Numbers above ninety-nine are built as phrases, from a multiplied amount like two hundred plus an optional addition.
  body: |-
    Two hundred and five and one thousand twenty-four are made of parts. In each, a multiplied amount (two hundred, one thousand) comes first, and a smaller number (five, twenty-four) is added after it. Two hundred, for instance, can also stand alone as a number.

    That's what separates these from smaller number words. Up to ninety-nine, this dictionary treats each number as a single word. Above that, the number has an inside, and context can sometimes fill in missing pieces. In between two hundred and four and six, the second number can be understood as two hundred and six.
  examples:
    - text: '[one thousand twenty-four]'
      from: entry
    - text: '[two hundred and five]'
      from: entry
  try: Say one thousand twenty-four aloud. Which part could you say on its own as a number?
teacher:
  summary: Explains numbers above 99 as phrases with internal structure, built from a factor, a magnitude and an optional addition.
  explain: 'A complex numerative is a phrase above the lexical range of zero to ninety-nine. It requires a magnitude head with a factor, and additions are coordinated constituents, with or without and: one thousand twenty-four, two hundred and five. Two hundred and four has an internal phrase two hundred which can also stand independently. Where the context supports the intended scale, the second coordinate of between two hundred and four and six can recover material and mean two hundred and six. A shorter coordinate can also get a literal small-number reading in other contexts. The dictionary marks this account as provisional.'
  terms: Numerative is this grammar's term for number words, where a textbook may say numeral.
  examples:
    - text: '[one thousand twenty-four]'
      from: entry
    - text: '[two hundred and five]'
      from: entry
  contrasts:
    - text: '[twenty-four]'
      from: constructed
      note: A single lexical unit.
    - text: '[one thousand twenty-four]'
      from: entry
      note: A phrase, with factor, magnitude and addition.
  watch_for:
    - A learner might take the second coordinate in between two hundred and four and six as the small number six, when context can sometimes supply two hundred and give two hundred and six.
    - A learner might think a large number is one long word rather than a phrase.
  activity: Students break written numbers such as one thousand twenty-four into parts and label the factor, the magnitude and the addition.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: curious body no longer says the addition goes onto ''it'' (two hundred) for both examples; it now says a smaller number is added after the multiplied amount in each; teacher watch_for no longer suggests a reading of the first coordinate as 4 and states the entry''s context-dependent reading of the second coordinate. Second round: fixed curious.body, which now attributes the single-word treatment of numbers up to ninety-nine to this dictionary (its lexical range) and puts the phrasal boundary above ninety-nine, as the entry does.'
