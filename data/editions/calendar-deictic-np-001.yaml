id: calendar-deictic-np-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>Next Tuesday</i>, with no <i>on</i>"
  summary: Words like <i>this</i>, <i>last</i> and <i>next</i> before a day or calendar period say when something happens, measured from now.
  body: |-
    In <i>I'll call next Tuesday</i>, the phrase <i>next Tuesday</i> tells us when, and it needs no <i>on</i> in front. The word <i>next</i> picks out a Tuesday by counting from the present moment. <i>This</i>, <i>last</i> and <i>next</i> work this way.

    Which Tuesday counts as <i>next</i> can vary between speakers, since it depends on how <i>next</i> is resolved. The context of the present is what fixes the period.
  examples:
    - text: I’ll call [next Tuesday].
      from: entry
    - text: We met [last Friday].
      from: constructed
  try: Say <i>I'll call next Tuesday</i>. Which Tuesday do you mean? Ask a friend which one they would pick.
teacher:
  summary: Shows how <i>this</i>, <i>last</i> and <i>next</i> with a weekday or calendar noun give a time adjunct without <i>on</i>.
  explain: The pattern is an NP made of <i>this</i>, <i>last</i> or <i>next</i> and a calendar noun or weekday, used as a temporal adjunct. It uses the contextual present to select an adjacent or current calendar period. The NP can be a time adjunct without <i>on</i>. The relevant Tuesday is selected by the deictic expression, and this dictionary notes some variation in how speakers resolve <i>next</i>. This dictionary relates it to month-and-day dates and to year names, and treats the analysis as provisional.
  terms: "This dictionary calls the pattern a bare deictic calendar NP, where the time is picked out by the context of the present."
  examples:
    - text: I’ll call [next Tuesday].
      from: entry
    - text: We met [last Friday].
      from: constructed
  contrasts:
    - text: I'll call next Tuesday.
      from: entry
      note: A deictic NP used as a time adjunct, without <i>on</i>.
    - text: I'll call on Tuesday.
      from: constructed
      note: A plain weekday with <i>on</i>.
  watch_for:
    - A learner might add <i>on</i> before <i>next Tuesday</i>, when the NP can be a time adjunct without <i>on</i>.
    - A learner might assume <i>next Tuesday</i> picks out the same day for every speaker, when speakers resolve <i>next</i> with some variation.
  activity: Fix a date on the board. Students say which day they take <i>next Friday</i> and <i>last Monday</i> to be from that date, and compare their choices.
child:
  hook: Does "<i>next Tuesday</i>" mean the same day for everyone?
  explain: Words like <i>this</i>, <i>last</i> and <i>next</i> can go right before a day. <i>I'll call next Tuesday</i>. We don't need <i>on</i>. Which Tuesday <i>next</i> means can change from person to person.
  examples:
    - text: I’ll call [next Tuesday].
      from: entry
    - text: We met [last Friday].
      from: constructed
  play: Look at a calendar and find today. Say which day you think <i>next Friday</i> is. Ask a partner if they agree.
