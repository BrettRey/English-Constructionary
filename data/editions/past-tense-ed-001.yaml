id: past-tense-ed-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: The <i>-ed</i> ending on verbs
  summary: Adding <i>-ed</i> to a verb can place something in the past, but it can also mark something imagined or add politeness.
  body: |-
    The <i>-ed</i> ending (or <i>-d</i> or <i>-t</i>, with more than one pronunciation) places something in time, as in <i>She walked home</i> and <i>They finished yesterday</i>. But it does more. In <i>If I owned a car</i>, it marks something that isn't actual. In <i>I wanted to ask you</i>, it adds social distance, which can make a request or offer more polite. This dictionary also gives <i>Did you want coffee?</i> as a polite offer, with the past form <i>did</i>.

    This dictionary lists these as separate meanings and notes that whether one idea, displacement from a reference point, unites them remains debatable. Past time doesn't fit every use: <i>Jones passed to Smith!</i> in a sports commentary describes an immediate past.
  examples:
    - text: She [walked] home.
      from: entry
    - text: If I [owned] a car
      from: entry
    - text: I [wanted] to ask you.
      from: entry
  try: Compare <i>They finished yesterday</i> with <i>Did you want coffee?</i> Is the second one about the past, or about being polite?
teacher:
  summary: Explains the <i>-ed</i> ending as more than past time, covering hypothetical and politeness uses, and how its preterite use differs from its participle use.
  explain: 'Regular <i>-ed</i> (with the allomorphs <i>-d</i>, <i>-t</i>, /d/, /t/ and /ɪd/) marks the preterite. This dictionary lists four meanings: displacement from a reference point (temporal, modal or interpersonal), temporal anteriority (<i>They finished yesterday</i>), non-actual or hypothetical marking (<i>If she studied more</i>; <i>I wish I lived there</i>), and social distancing (<i>Did you want coffee?</i>; <i>I hoped we could talk</i>). The first, unifying meaning remains debatable. Temporal anteriority has exceptions such as sports commentary (<i>Jones passed to Smith!</i>). Remote and backshifted preterites need not locate the event before speech time. Regular <i>-ed</i> also marks the past participle, as in <i>Jo has checked the key</i>. This dictionary marks the analysis as provisional.'
  terms: Past tense is the traditional name; CGEL says preterite. The <i>-ed</i> form after <i>have</i> is the past participle.
  examples:
    - text: She [walked] home.
      from: entry
    - text: They [finished] yesterday.
      from: entry
    - text: If she [studied] more
      from: entry
    - text: I [hoped] we could talk.
      from: entry
  contrasts:
    - text: Jo checked the key.
      from: constructed
      note: Finite preterite.
    - text: Jo has checked the key.
      from: constructed
      note: Participle selected by <i>have</i>.
    - text: I wish I lived there.
      from: entry
      note: Contrary-to-fact desire, not past time.
  watch_for:
    - A learner might assume every <i>-ed</i> form locates the event in the past, when this dictionary lists hypothetical and politeness uses.
    - A learner might read <i>Did you want coffee?</i> only as asking about a past wanting, when it can be a polite offer.
    - A learner might treat the <i>-ed</i> in <i>has checked</i> as a preterite, when it is the participle selected by <i>have</i>.
  activity: Students sort <i>-ed</i> sentences into past time, imagined situations and polite requests or offers, using examples such as <i>They finished yesterday</i>, <i>If she studied more</i> and <i>I wanted to ask you</i>. They then explain what each use has in common with the others, if anything.
child:
  hook: What happens to a verb when you add <i>ed</i>?
  explain: Adding <i>ed</i> can make a verb tell about the past, as in <i>She walked home</i>. It can also talk about something that isn't real, as in <i>If I owned a car</i>. It can also make something sound more polite, as in <i>I wanted to ask you</i>.
  examples:
    - text: She [walked] home.
      from: entry
    - text: They [finished] yesterday.
      from: entry
    - text: If I [owned] a car
      from: entry
    - text: I [wanted] to ask you.
      from: entry
  play: Say three sentences with <i>ed</i> words, one about yesterday, one about something you wish for, and one polite one, like <i>I wanted to ask you</i>. Which job does the <i>ed</i> do in each?
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: child explain and the teacher activity used Did you want coffee? as an -ed example, but it has the irregular preterite did and plain want; they now use I wanted to ask you (this dictionary''s social-distance example with -ed), and the child play matches. The curious body now ties the -ed ending to I wanted to ask you and presents Did you want coffee? as a separate polite offer. Second round: removed the bracketed example Did you want coffee? from the curious and teacher example lists (its did is irregular and want is plain, so neither shows -ed) and gave the teacher list I hoped we could talk instead; teacher.watch_for[1] now says the question can be a polite offer, without ruling out a question about past wanting. Curious.body says the polite offer uses the past form did instead of saying it works ''in the same way''; teacher.summary now contrasts the preterite and participle uses of the ending.'
