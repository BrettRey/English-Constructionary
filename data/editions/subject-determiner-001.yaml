id: subject-determiner-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: A genitive that acts like a subject
  summary: Sometimes the word with <i>'s</i> before a noun tells you who did the action the noun names, not who owns something.
  body: |-
    In <i>the committee's approval of the plan</i>, the committee is the one who approved. The noun <i>approval</i> names an action, and the committee plays the part a subject would play in the matching sentence, <i>the committee approved the plan</i>.

    Compare <i>the committee's photograph</i>. There the link can be ownership or some other relation. So the <i>'s</i> form alone doesn't tell you the committee is the doer; it depends on the noun.

    This dictionary marks the analysis as provisional.
  examples:
    - text: '[Brett''s use] of the microphone'
      from: entry
    - text: '[the committee''s approval] of the plan'
      from: entry
  try: Turn <i>the committee's approval of the plan</i> into a sentence with a verb. Who is the subject? Now do the same with <i>the committee's photograph</i>. What changes?
teacher:
  summary: Explains genitives that match a verb's subject, as in <i>the committee's approval</i>, against ordinary genitives that show ownership.
  explain: The pattern is a genitive NP in determiner function whose relation to the head noun resembles that of a subject. In <i>Brett's use of the microphone</i> and <i>the committee's approval of the plan</i>, the genitive corresponds to the notional subject of the event noun's verb, an agent or experiencer. This is not mere possession. In <i>the committee's photograph</i>, an ownership or other relation remains possible, so genitive position alone does not license an agent interpretation. The distinction is argument-realizing versus the wider range of ordinary genitive relations. This dictionary marks the analysis as provisional.
  terms: 'Sometimes called a subjective genitive. CGEL: genitive NP in determiner function. Avoid possessive as a label, since ownership is only one possible relation.'
  examples:
    - text: '[Brett''s use] of the microphone'
      from: entry
    - text: '[the committee''s approval] of the plan'
      from: entry
  contrasts:
    - text: the committee's approval of the plan
      from: entry
      note: The committee maps to the subject of <i>approved the plan</i>.
    - text: the committee's photograph
      from: constructed
      note: Ownership or another relation remains possible.
  watch_for:
    - A learner might read every genitive as showing ownership.
    - A learner might take the genitive in <i>the committee's approval</i> as the thing approved instead of the one who approved.
  activity: Give students noun phrases with a genitive and a noun such as <i>approval</i>, <i>arrival</i> or <i>photograph</i>. They try to turn each into a sentence with a verb and decide whether the genitive becomes the subject.
