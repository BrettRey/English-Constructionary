id: infinitival-to-stranding-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Ending a sentence with <i>to</i>
  summary: After words like <i>wanted</i>, the word <i>to</i> can stand without a verb after it when the listener can work out what verb is meant.
  body: |-
    In <i>I didn't go, but I wanted to</i>, the sentence stops at <i>to</i>. You know the missing verb is <i>go</i>, because it was just mentioned. The <i>to</i> stays where a full phrase such as <i>to go</i> would have been.

    This lets a speaker avoid repeating a verb. It's a different way of recovering the meaning from using <i>do so</i> in its place.
  examples:
    - text: I didn’t go, but I [wanted to].
      from: entry
    - text: She asked me to help, and I'm happy [to].
      from: constructed
  try: Say <i>I wanted to go</i>, then say it again, dropping <i>go</i>. What does the listener supply?
teacher:
  summary: Explains <i>to</i> with an unexpressed verb phrase, as in <i>I wanted to</i>.
  explain: The pattern is an infinitival complement realized with overt <i>to</i> and a contextually recoverable predicate. In <i>I didn't go, but I wanted to</i>, <i>to</i> stays in the position where the full infinitival would occur, and the listener recovers <i>go</i> from context. The same speaker can recover <i>go</i> without substituting lexical <i>do so</i>. This dictionary relates the pattern to the <i>do so</i> anaphor and marks it provisional.
  terms: Sometimes called VP ellipsis after <i>to</i> or a stranded <i>to</i>. This dictionary describes it as a <i>to</i>-infinitival with an unexpressed verb phrase.
  examples:
    - text: I didn’t go, but I [wanted to].
      from: entry
    - text: She asked me to help, and I'm happy [to].
      from: constructed
  contrasts:
    - text: I didn't go, but I wanted to.
      from: entry
      note: <i>To</i> stranded; <i>go</i> recovered from context.
    - text: I didn't go, but I wanted to go.
      from: constructed
      note: The full infinitival, verb expressed.
  watch_for:
    - A learner might think a sentence ending in <i>to</i> is unfinished.
    - A learner might look for a verb after <i>to</i> in the same clause rather than recovering it from context.
  activity: Students read short exchanges with a stranded <i>to</i> and write what verb the listener recovers. They then repeat the exchange with the full infinitival.
child:
  hook: Can a sentence end with the word "<i>to</i>"?
  explain: Sometimes a sentence ends with <i>to</i>, and you still know the verb. <i>I didn't go, but I wanted to</i>. You know the missing word is <i>go</i>.
  examples:
    - text: I didn’t go, but I [wanted to].
      from: entry
    - text: Mia asked me to play, and I [wanted to].
      from: constructed
  play: Tell a partner something you didn't do but wanted to, like <i>I didn't swim, but I wanted to</i>. Stop after <i>to</i>. Can your partner say the missing verb?
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: child game rewritten as one concrete step (say something you didn''t do but wanted to, stopping at to, with an example that gives the partner the verb). Also fixed (unflagged): ''the entry'' replaced by ''this dictionary'' in teacher text.'
