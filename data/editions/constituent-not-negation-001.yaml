id: constituent-not-negation-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Saying <i>not</i> about one part of a sentence
  summary: <i>Not</i> can deny one part of a sentence, such as a description or a time, instead of the whole action.
  body: |-
    In <i>That is not a solution</i>, <i>not</i> denies what is said about <i>that</i>: <i>it isn't a solution</i>. In <i>She is not in the box</i>, it denies a place. The description or relation is what gets negated.

    <i>Not</i> can also target one part while the rest stays asserted. In <i>Lee came not on Tuesday but on Wednesday</i>, the coming still happened. Only the time is corrected. <i>Jo ordered tea, not coffee</i> targets just the drink, unlike <i>Jo didn't order coffee</i>.
  examples:
    - text: That is [not] a solution.
      from: entry
    - text: She is [not] in the box.
      from: entry
    - text: Lee came [not on Tuesday] but on Wednesday.
      from: constructed
  try: Say <i>Jo ordered tea, not coffee</i>. What does <i>not</i> apply to? Compare <i>Jo didn't order coffee</i>.
teacher:
  summary: Helps students see <i>not</i> as negating a particular part of a clause, and tell it apart from negation attached to the auxiliary.
  explain: 'In constituent negation, <i>not</i> negates a non-verbal predicate or constituent within a clause. This dictionary’s examples have a predicative NP, AdjP or PP in a copular or similar frame (<i>That is not a solution</i>, <i>She is not in the box</i>), where <i>not</i> negates the property or relation the phrase expresses. <i>Not</i> can also have local scope inside coordinates: in <i>Lee came not on Tuesday but on Wednesday</i>, the correction replaces a time expression and the coming remains asserted. This differs from primary finite negation, as in <i>Jo didn''t order coffee</i>, where the negation goes with the finite auxiliary.'
  terms: 'Constituent negation: negation of one part of a clause. Primary (finite) negation: negation attached to the finite auxiliary, as in <i>didn''t</i>.'
  examples:
    - text: That is [not] a solution.
      from: entry
    - text: She is [not] in the box.
      from: entry
  contrasts:
    - text: Jo ordered tea, not coffee.
      from: constructed
      note: <i>Not</i> targets one constituent.
    - text: Jo didn't order coffee.
      from: constructed
      note: Negation goes with the finite auxiliary.
  watch_for:
    - A learner might read <i>Lee came not on Tuesday but on Wednesday</i> as saying <i>Lee didn't come</i>, when the coming remains asserted.
    - A learner might treat <i>not</i> before a predicative phrase and <i>not</i> with the auxiliary as the same thing.
  activity: Give students pairs like <i>Jo ordered tea, not coffee</i> and <i>Jo didn't order coffee</i>. They say what is denied in each and what is still asserted.
checked:
