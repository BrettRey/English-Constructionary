id: quasi-count-noun-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Plural words with no single form
  summary: Some nouns, such as <i>cattle</i>, are plural in form with no singular, and only partly behave like ordinary count nouns.
  body: |-
    <i>Cattle</i> works with <i>many</i> and takes plural verbs: <i>many cattle</i>. But it has no singular, and <i>a cattle</i> isn't something you say. These nouns refer to groups of separate individuals, yet they don't let us pick out one at a time in the usual way.

    To count individuals, English uses a counting expression such as <i>three head of cattle</i>, or a different word altogether, like <i>cow</i>. This dictionary marks the account as provisional, though it treats the pattern as stable.
  examples:
    - text: '[many cattle]'
      from: entry
    - text: '[three head of cattle]'
      from: entry
  try: Try saying <i>a cattle</i> and then <i>a cow</i>. Which one lets you talk about a single animal? What would you say for several?
teacher:
  summary: "Low priority for most classes: <i>cattle</i> is relatively infrequent (about 3,700th among word forms in the SUBTLEX-UK subtitle counts), so treat it if it comes up rather than teaching it. Explains plural-only nouns like <i>cattle</i> that take <i>many</i> but resist <i>a</i>, <i>one</i> and low numbers."
  explain: Quasi-count plural nouns are plural-only, with plural agreement, and resist singular forms and <i>a</i>/<i>an</i>. They allow loose count diagnostics (<i>many</i>, <i>few</i>, high round numerals) but tight ones (<i>a</i>/<i>an</i>, low cardinals, distributives) are degraded. Individuals are counted with specialized frames such as <i>three head of cattle</i>, or by a different word (<i>cow</i>, <i>officer</i>). Tight cardinality uses surface mainly in specialized registers. This dictionary marks the account provisional and says no claim about novel forms follows automatically. <i>Folks</i> is a boundary item showing instability.
  terms: Related to plural-only or collective nouns in traditional grammars; this dictionary calls these quasi-count nouns, with a mixed countability profile.
  examples:
    - text: '[many cattle]'
      from: entry
    - text: '[three head of cattle]'
      from: entry
  contrasts:
    - text: many cattle
      from: entry
      note: Loose count property is fine.
    - text: a cattle
      from: entry
      acceptable: false
      note: Tight count property rejected.
  watch_for:
    - A learner might think <i>three cattle</i> is the standard way to count three animals, when this dictionary gives <i>three head of cattle</i>.
    - A learner might use <i>a</i> with <i>cattle</i> to refer to a single animal.
    - A learner might treat all plural-only nouns as having the same profile.
  activity: If <i>cattle</i> comes up in a reading, students list plural-only nouns they know and test each with <i>many</i>, <i>a</i> and <i>three</i>, recording which tests fit.
