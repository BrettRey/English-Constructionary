id: the-adjective-np-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>The wealthy</i>, <i>the impossible</i>"
  summary: "<i>The</i> plus an adjective can stand for a class of people or an abstract domain, with no noun after it."
  body: |-
    In <i>The very wealthy are exempt</i>, the adjective with <i>the</i> in front refers to a class of people. There's no noun after it, yet the phrase works as the subject, and the verb is plural.

    The same frame can be abstract. In <i>The seemingly impossible is now routine</i>, the phrase means a domain of things, and the verb is singular. In both, the adjective keeps its ability to take adverbs such as <i>very</i> and <i>seemingly</i>.

    This dictionary marks the analysis as provisional, though it's confident in the main pattern.
  examples:
    - text: '[The very wealthy] are exempt.'
      from: entry
    - text: '[The seemingly impossible] is now routine.'
      from: entry
  try: Say <i>The very wealthy are exempt</i> and <i>The seemingly impossible is now routine</i>. How does the verb differ, and what does each phrase refer to?
teacher:
  summary: Explains <i>the</i> plus adjective as a noun phrase for a class of people or an abstract domain, with agreement that follows the reading.
  explain: 'The pattern is an NP with <i>the</i> as determiner and a fused modifier-head adjective phrase, with no overt noun. The default special interpretation is plural and human: <i>the very wealthy</i>. The abstract interpretation takes singular agreement: <i>the utterly impossible</i>. The adjective keeps its ability to take adverbial modifiers. Anaphoric examples such as <i>the long</i> in <i>the short route and the long</i> recover their nominal description from context and have independent agreement. This dictionary marks the analysis as provisional and marks high confidence.'
  terms: 'CGEL: fused head, where the head is fused with its modifier. Traditional grammar sometimes describes the adjective as used as a noun. This dictionary distinguishes the special reading from noun conversion.'
  examples:
    - text: '[The very wealthy] are exempt.'
      from: entry
    - text: '[The seemingly impossible] is now routine.'
      from: entry
  contrasts:
    - text: The very wealthy are exempt.
      from: entry
      note: Human class reading; plural agreement.
    - text: The seemingly impossible is now routine.
      from: entry
      note: Abstract reading; singular agreement.
    - text: the short route and the long
      from: entry
      note: Anaphoric use; the noun <i>route</i> is recovered from context.
  watch_for:
    - A learner might use singular agreement with a human class reading, such as <i>the very wealthy</i>.
    - A learner might think the adjective has become a noun and can no longer take an adverb.
    - A learner might read <i>the long</i> in <i>the short route and the long</i> as a class of people instead of a recovered noun.
  activity: Students list phrases with <i>the</i> and an adjective, such as <i>the rich</i> and <i>the impossible</i>. They mark each as a class of people, an abstract domain or a recovered noun, and choose the matching verb form.
