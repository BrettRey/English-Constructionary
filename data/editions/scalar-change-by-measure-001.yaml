id: scalar-change-by-measure-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: How much something changed
  summary: After a verb of rising or falling, <i>by</i> plus an amount says how big the change was, while <i>to</i> says where it ended up.
  body: |-
    <i>The water level fell by twelve centimetres</i> tells you the size of the drop: the difference between the starting and ending levels. <i>The water level fell to twelve centimetres</i> tells you something else: the level it reached. Same verb, different question answered.

    The word <i>by</i> measures the gap between where something started and where it finished. The word <i>to</i> names the final value. This dictionary marks the analysis as provisional.
  examples:
    - text: The water level fell [by twelve centimetres].
      from: entry
    - text: The water level fell [to twelve centimetres].
      from: entry
  try: Say how much a price, a temperature or a score changed, once with <i>by</i> and once with <i>to</i>. Which tells you the change, and which tells you the new value?
teacher:
  summary: Helps explain <i>by</i> plus a measure phrase for the amount of change, versus <i>to</i> for the endpoint.
  explain: With a verb of scalar change (<i>fall</i>, <i>rise</i> and the like), a PP headed by <i>by</i> plus a measure NP quantifies the amount of change on an ordered scale. <i>By</i> measures the difference between starting and ending values. <i>To</i> with an endpoint instead names the final value, and it can co-occur with a differential. This dictionary treats the <i>by</i>-phrase as a specialization of the PP and relates it to differential measure phrases in comparatives. The analysis is marked provisional.
  terms: The <i>by</i>-phrase here is sometimes called a differential or amount phrase.
  examples:
    - text: The water level fell [by twelve centimetres].
      from: entry
    - text: The water level fell [to twelve centimetres].
      from: entry
  contrasts:
    - text: The water level fell by twelve centimetres.
      from: entry
      note: The size of the drop.
    - text: The water level fell to twelve centimetres.
      from: entry
      note: The value reached.
  watch_for:
    - A learner might read <i>fell to twelve centimetres</i> as a drop of twelve centimetres.
    - A learner might choose <i>by</i> or <i>to</i> without checking whether the number is a difference or an endpoint.
  activity: Show a simple graph with start and end values. Students write one <i>by</i> sentence and one <i>to</i> sentence about it, then swap and check which number each sentence reports.
checked:
