id: instrumental-with-np-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Doing something with a tool
  summary: A phrase with <i>with</i> and a thing can name what was used to do something.
  body: |-
    In <i>Lee opened the case with a small screwdriver</i>, the phrase <i>with a small screwdriver</i> names what Lee used. The screwdriver helped the action happen.

    The same words <i>with</i> can introduce someone who came along, as in <i>with the watchman</i>. That's a different meaning, so the sentence around it matters.
  examples:
    - text: Lee opened the case [with a small screwdriver].
      from: entry
    - text: She stirred the soup [with a wooden spoon].
      from: constructed
  try: Say <i>Lee opened the case with a screwdriver</i>, then <i>Lee opened the case with the watchman</i>. How does the meaning of <i>with</i> change?
teacher:
  summary: Covers <i>with</i> plus a noun phrase naming the instrument used in an action.
  explain: 'The pattern is a prepositional phrase of <i>with</i> plus an instrument noun phrase, used as an adjunct. It identifies an object that mediates or enables an action: in <i>Lee opened the case with a small screwdriver</i>, the screwdriver has a means role. <i>With the watchman</i> can instead identify an accompanying participant, which is a distinct interpretation. This dictionary treats the phrase as a specialization of the prepositional phrase and relates it to <i>by</i> plus gerund means phrases. It is provisional.'
  terms: Traditionally called an adverbial of instrument. This dictionary treats it as an adjunct prepositional phrase.
  examples:
    - text: Lee opened the case [with a small screwdriver].
      from: entry
    - text: She stirred the soup [with a wooden spoon].
      from: constructed
  contrasts:
    - text: Lee opened the case with a small screwdriver.
      from: entry
      note: The <i>with</i>-phrase names the means.
    - text: Lee opened the case with the watchman.
      from: constructed
      note: Can identify an accompanying participant.
  watch_for:
    - A learner might read <i>with the watchman</i> as naming a tool.
    - A learner might think every <i>with</i>-phrase names an accompanying person.
  activity: Students ask <i>How did you do it?</i> about classroom actions and answer with <i>with</i> plus a tool. They then replace the tool with a person and discuss how the meaning shifts.
child:
  hook: What do you use to do things, and how do you say it?
  explain: <i>With</i> can name a tool you used. <i>Lee opened the case with a small screwdriver</i>. The screwdriver is what helped him do it.
  examples:
    - text: Lee opened the case [with a small screwdriver].
      from: entry
    - text: I drew the picture [with a blue pen].
      from: constructed
  play: Act out a job without saying the tool. A partner says what you did, ending with the tool, such as "<i>with a spoon</i>."
checked:
