id: n-sg-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Singular nouns
  summary: Singular is a form of a noun that selects singular agreement, and it's a matter of form, not of counting one.
  body: |-
    <i>Cat</i> and <i>book</i> are singular nouns. They go with <i>a</i>, as in <i>a cat</i>, and with singular verbs, as in <i>The cat sleeps</i>. They typically stand for a single unit.

    Singular is a matter of form, not of meaning. <i>Rice</i>, in its substance sense, can go with a singular verb but doesn't take <i>a</i>. So a singular verb on its own doesn't show that a noun is a singular count noun. This dictionary treats morphological number, countability and verb agreement as separate things.
  examples:
    - text: '[cat]'
      from: entry
    - text: '[book]'
      from: entry
    - text: a [cat]
      from: constructed
    - text: The [cat] sleeps.
      from: constructed
  try: Pick a word for a thing and a word for stuff. Which one goes with <i>a</i>?
teacher:
  summary: Explains singular as a form category, with <i>rice</i> as a case where singular agreement does not mean singular count syntax.
  explain: 'A singular noun has the singular number form: it selects singular agreement and singular-selecting determinatives, and typically construes its referent as a single unit. The category is morphosyntactic, not semantic. <i>Cat</i> combines with <i>a</i> and singular agreement, while <i>rice</i> can take singular agreement without permitting <i>a</i> in its substance use. Singular agreement by itself therefore doesn''t identify singular count syntax. This dictionary separates morphological number, countability and formal agreement, and lists the non-count noun and verb-number agreement as related patterns.'
  terms: Singular is the traditional term. Singular count noun names the pattern with a.
  examples:
    - text: '[cat]'
      from: entry
    - text: '[book]'
      from: entry
  contrasts:
    - text: a cat
      from: constructed
      note: A singular count noun with <i>a</i>.
    - text: The rice is ready.
      from: constructed
      note: Singular agreement, but this is a non-count use that doesn't take <i>a</i>.
  watch_for:
    - A learner might assume that a singular verb shows that a noun is a singular count noun.
    - A learner might assume singular nouns have to name exactly one unit, when the category is a form category.
  activity: Students list singular count nouns (<i>cat</i>, <i>book</i>) and write a sentence with each, using <i>a</i> and a singular verb. They then try <i>rice</i> in its substance use and compare.
