id: only-if-restriction-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Only if as a requirement
  summary: Only if says that something has to be the case for a consequence to hold or a permission to apply.
  body: |-
    In We'll go only if the ferry runs, the ferry running is required for going. Without it, we don't go.

    That doesn't mean the ferry running is enough on its own. Other conditions can remain open, so the ferry might run and we might still stay home. This dictionary describes only if as restricting the circumstances in which a consequence holds or a permission applies, and treats it as a more specific kind of if sentence.
  examples:
    - text: We'll go [only if the ferry runs].
      from: entry
    - text: You can borrow it [only if you ask first].
      from: constructed
  try: Say We'll go only if the ferry runs. If the ferry runs, are we sure to go?
teacher:
  summary: Explains only if as marking a necessary condition, not a guarantee.
  explain: A main clause plus only if plus a finite clause restricts the circumstances in which a consequence holds or a permission applies. In We'll go only if the ferry runs, the ferry's running is required for going. Its running alone need not guarantee going, since further conditions can remain open. This dictionary treats the pattern as a specialization of the if-conditional and relates it to even if. This dictionary marks the analysis as provisional.
  terms: Necessary condition is the logical term for what only if marks. Conditional clause is the traditional name for the if part.
  examples:
    - text: We'll go [only if the ferry runs].
      from: entry
    - text: You can borrow it [only if you ask first].
      from: constructed
  contrasts:
    - text: We'll go only if the ferry runs.
      from: entry
      note: The ferry running is required for going.
    - text: We'll go if the ferry runs.
      from: constructed
      note: Plain if, for comparison. This dictionary treats only if as a specialization of the if-conditional.
  watch_for:
    - A learner might think that if the ferry runs, we're sure to go, when only if doesn't say that.
  activity: Students complete sentence stems that start with a consequence and only if, such as I'll come only if ___, then say what else could still stop the outcome.
child:
  hook: We'll go only if the ferry runs. What if the ferry runs?
  explain: Only if names something that has to be true. If the ferry doesn't run, we don't go. But other things might still matter, so running isn't a promise.
  examples:
    - text: We'll go [only if the ferry runs].
      from: entry
    - text: You can come [only if you ask first].
      from: constructed
  play: Finish the sentence I'll come only if ___. Then think of something else that could still stop you.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: child.explain no longer says the condition has to happen first or that the ferry runs before the trip (the dictionary makes the condition required, with no order of events); curious.summary reworded from ''before a consequence holds'' to ''for a consequence to hold''.'
