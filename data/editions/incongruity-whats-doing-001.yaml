id: incongruity-whats-doing-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>What is that ladder doing in the hall?</i>"
  summary: A question shaped like <i>What is X doing there?</i> can ask for an explanation of something that seems out of place.
  body: |-
    Take <i>What's that ladder doing in the hall?</i> A ladder needn't be performing any action. The question asks why the ladder is there, and it presents its being there as strange.

    The same shape of words can also be an ordinary question. With a person and an activity, such as asking what someone is doing in the hall, it can simply ask what that person is up to. The shape of the words alone doesn't settle which reading is meant.
  examples:
    - text: '[What’s that ladder doing in the hall?]'
      from: entry
    - text: What's that muddy boot doing on the table?
      from: constructed
  try: Think of something you found in an odd spot. How would you ask why it was there, using this pattern?
teacher:
  summary: Covers the idiomatic <i>What is X doing Y?</i> question that asks for an explanation of something presented as odd.
  explain: The pattern is an interrogative built from <i>what</i>, a form of <i>be</i>, a subject, <i>doing</i> and then a location or an <i>-ing</i> expression. Its meaning is to ask for an explanation of a state, presence or action presented as anomalous. A ladder in a hall need not be performing an action, so the <i>doing</i> isn't literal. The same string shape with a human subject and an activity can also support an ordinary literal <i>what</i>-question, so the shape alone doesn't settle which reading is meant. This dictionary treats it as a specialization of the open interrogative clause and marks it provisional. It cites discussion in CGEL, in Kay and Fillmore, and in Goldberg.
  terms: Sometimes called the <i>What's X doing Y?</i> construction.
  examples:
    - text: '[What’s that ladder doing in the hall?]'
      from: entry
    - text: What's your bike doing on the lawn?
      from: constructed
  contrasts:
    - text: What's that ladder doing in the hall?
      from: entry
      note: Asks why it's there, presented as odd.
    - text: What's Dad doing in the hall?
      from: constructed
      note: Can be an ordinary question about an activity.
  watch_for:
    - A learner might answer <i>What's that ladder doing in the hall?</i> by describing an action the ladder performs.
    - A learner might not realize the speaker is presenting the situation as strange.
  activity: Place a few out-of-place objects around the room. Students ask <i>What's the X doing Y?</i> about each, and a partner supplies an explanation.
checked:
  date: '2026-11-19'
