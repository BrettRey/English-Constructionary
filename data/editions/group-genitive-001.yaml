id: group-genitive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: The <i>'s</i> at the end of a longer phrase
  summary: When the owner is described by a long phrase, the <i>'s</i> goes at the very end of that phrase, not on the main word.
  body: |-
    In <i>It was the person next door's ladder</i>, the owner is the person next door. The <i>'s</i> doesn't go on <i>person</i>, the main word, but at the end of the whole phrase, on <i>door</i>.

    So the word right next to the <i>'s</i> isn't the one the ladder belongs to. The ladder belongs to the person, and the reading comes from the whole phrase the <i>'s</i> closes off.
  examples:
    - text: It was [the person next door's ladder].
      from: entry
  try: Describe a friend with a phrase of three or four words, such as <i>the girl at the bus stop</i>. Say whose bag it is, and notice where the <i>'s</i> goes.
teacher:
  summary: For advanced classes, where the genitive <i>'s</i> goes when the possessor is a long phrase.
  explain: 'The genitive marker attaches at the right edge of an extended possessor: <i>the person next door''s ladder</i>. <i>Door</i> is the rightmost host of the <i>''s</i>, though the ladder is associated with the person. The possessor reading is determined by the whole genitive NP, not by the word that hosts the marker. This dictionary treats this as a specialization of the genitive <i>''s</i> pattern, with a genitive NP in determiner function, and marks the analysis as provisional.'
  terms: Phrasal genitive is this dictionary’s name. It is sometimes called a group genitive.
  examples:
    - text: It was [the person next door's ladder].
      from: entry
  watch_for:
    - A learner might put the <i>'s</i> on <i>person</i>, the head noun, instead of at the end of the whole phrase.
    - A learner might take <i>door</i> as the owner because it hosts the <i>'s</i>.
  activity: Give students noun phrases with a modifier after the head (<i>the woman at the desk</i>, <i>the boy next door</i>). They add <i>'s</i> and a noun and then say who owns the object.
