id: for-infinitival-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>For</i>, then who, then <i>to</i>
  summary: A phrase made of <i>for</i>, a person or thing, and <i>to</i> plus a verb can say who would do the action.
  body: |-
    In <i>For them to leave now would be awkward</i>, the words <i>for them to leave now</i> say what would be awkward, and <i>them</i> is the one who would leave. Here <i>for</i> isn't linking <i>them</i> to something as a preposition would. The person doing the leaving is <i>them</i>.

    When the whole phrase is the subject of a sentence, it normally needs <i>for</i> before the person or thing. A pronoun for a person takes its <i>them</i>-type form here.
  examples:
    - text: '[For them to leave now] would be awkward.'
      from: entry
    - text: '[For Ana to win] would be wonderful.'
      from: constructed
  try: In <i>For them to leave now would be awkward</i>, who is leaving?
teacher:
  summary: 'For advanced classes: the <i>for NP to-VP</i> pattern, where the NP is the subject of the infinitive.'
  explain: 'The <i>for</i>-infinitival introduces an infinitival with a syntactically expressed subject: <i>for</i>, Subject NP, then a <i>to</i>-infinitival VP. A personal pronoun takes accusative form (<i>for them to leave</i>). In <i>For them to leave now would be awkward</i>, <i>them</i> is the subject of <i>leave</i>, not the object of a purpose preposition in this use. In subject position this infinitival normally requires <i>for</i> before its overt subject. This dictionary cites CGEL on infinitival clauses and is marked provisional, with medium confidence.'
  terms: Accusative is also called objective case. This pattern is sometimes called a <i>for-to</i> infinitive.
  examples:
    - text: '[For them to leave now] would be awkward.'
      from: entry
    - text: '[For Ana to win] would be wonderful.'
      from: constructed
  watch_for:
    - A learner might analyze <i>for them</i> as a prepositional phrase with <i>them</i> as its object.
    - A learner might expect <i>for</i> to be optional in subject position, where it normally isn't.
  activity: Students write sentences beginning <i>For ___ to ___</i> with different people and verbs. They underline the subject of the infinitive and say who does the action.
