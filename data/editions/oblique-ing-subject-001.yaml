id: oblique-ing-subject-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Them blocking the exit
  summary: An -ing phrase can have its own subject, and a pronoun there can take its object form, as in them blocking the exit.
  body: |-
    In We objected to them blocking the exit, the -ing phrase them blocking the exit has its own subject, them. The pronoun has the form used for objects, not a genitive form such as their.

    The word them is the doer of the blocking, not the thing objected to. And blocking still has its own object, the exit. This dictionary says that where a genitive form is an alternative, the choice varies with the surrounding grammar and with style, and that this pattern is the one with no genitive marking.
  examples:
    - text: We objected to [them blocking the exit].
      from: entry
    - text: She was annoyed at [him leaving early].
      from: constructed
  try: Say We objected to them blocking the exit. Who is doing the blocking?
teacher:
  summary: Explains an -ing clause whose subject is a pronoun in its object form, as in objected to them blocking the exit.
  explain: 'A gerund-participial clause can have a subject NP that, if it''s a personal pronoun, is accusative: them blocking the exit. This dictionary says the prepositional context (objected to) can license them as the embedded subject, while blocking still takes a direct object. The alternative with a genitive subject varies with the syntactic environment and with style. The pattern expresses the subject of an -ing clause without genitive marking where the environment allows it. This dictionary marks the analysis as provisional.'
  terms: This dictionary treats the clause as gerund-participial.
  examples:
    - text: We objected to [them blocking the exit].
      from: entry
    - text: She was annoyed at [him leaving early].
      from: constructed
  watch_for:
    - A learner might take them as the object of the preposition to, when it is the subject of the -ing clause.
    - A learner might read the exit as the object of the preposition to, when it is the direct object of blocking.
  activity: Students underline the subject and the verb of the -ing clause in sentences like We objected to them blocking the exit, then identify which words are the clause's subject and its object.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: replaced the watch_for item that treated omitting the object as a learner error with a confusion the entry supports (blocking still takes the exit as direct object). Dismissed: none. Second round: fixed teacher.terms by cutting the claim about how traditional grammar frames the choice between them blocking and their blocking (this dictionary makes no such claim).'
