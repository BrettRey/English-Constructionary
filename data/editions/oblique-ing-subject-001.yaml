id: oblique-ing-subject-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Them blocking the exit</i>
  summary: An <i>-ing</i> phrase can have its own subject, and a pronoun there can take its object form, as in <i>them blocking the exit</i>.
  body: |-
    In <i>We objected to them blocking the exit</i>, the <i>-ing</i> phrase <i>them blocking the exit</i> has its own subject, <i>them</i>. The pronoun has the form used for objects, not a genitive form such as <i>their</i>.

    The word <i>them</i> is the doer of the blocking, not the thing objected to. And <i>blocking</i> still has its own object, the exit. This dictionary says that where a genitive form is an alternative, the choice varies with the surrounding grammar and with style, and that this pattern is the one with no genitive marking.
  examples:
    - text: We objected to [them blocking the exit].
      from: entry
    - text: She was annoyed at [him leaving early].
      from: constructed
  try: Say <i>We objected to them blocking the exit</i>. Who is doing the blocking?
teacher:
  summary: Explains an <i>-ing</i> clause whose subject is a pronoun in its object form, as in <i>objected to them blocking the exit</i>.
  explain: 'A gerund-participial clause can have a subject NP that, if it''s a personal pronoun, is accusative: <i>them blocking the exit</i>. This dictionary says the prepositional context (<i>objected to</i>) can license <i>them</i> as the embedded subject, while <i>blocking</i> still takes a direct object. The alternative with a genitive subject varies with the syntactic environment and with style. The pattern expresses the subject of an <i>-ing</i> clause without genitive marking where the environment allows it. This dictionary marks the analysis as provisional.'
  terms: This dictionary treats the clause as gerund-participial.
  examples:
    - text: We objected to [them blocking the exit].
      from: entry
    - text: She was annoyed at [him leaving early].
      from: constructed
  watch_for:
    - A learner might take <i>them</i> as the object of the preposition <i>to</i>, when it is the subject of the <i>-ing</i> clause.
    - A learner might read the exit as the object of the preposition to, when it is the direct object of <i>blocking</i>.
  activity: Students underline the subject and the verb of the <i>-ing</i> clause in sentences like <i>We objected to them blocking the exit</i>, then identify which words are the clause's subject and its object.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: replaced the watch_for item that treated omitting the object as a learner error with a confusion the entry supports (blocking still takes the exit as direct object). Dismissed: none. Second round: fixed teacher.terms by cutting the claim about how traditional grammar frames the choice between them blocking and their blocking (this dictionary makes no such claim).'
