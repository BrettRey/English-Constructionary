id: degree-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Comparing things on a scale
  summary: English has a few ways to say where something sits on a scale, such as <i>taller than</i>, <i>the tallest</i> and <i>as tall as</i>.
  body: |-
    Words like <i>tall</i>, <i>expensive</i> or <i>short</i> describe a scale, and English has patterns for placing things on it. <i>Taller than</i> and <i>more expensive than</i> compare two things. <i>The tallest</i> and <i>the most expensive</i> pick out the end of the scale. <i>As tall as</i> says two things are level.

    The patterns can also say how big the difference is: <i>much taller</i>, <i>two feet taller</i>. And they can compare against a group or a standard, as in <i>taller than average</i> or <i>most expensive of all</i>. This dictionary treats the analysis as provisional.
  examples:
    - text: '[as tall as]'
      from: entry
    - text: '[taller than average]'
      from: constructed
    - text: '[most expensive of all]'
      from: entry
    - text: '[two feet taller]'
      from: constructed
  try: Pick two objects in the room and compare them with <i>taller than</i>, then with <i>as tall as</i>. Now try the least expensive thing you can see.
teacher:
  summary: Helps explain comparatives, superlatives and equatives as ways of placing something on a scale.
  explain: 'Degree constructions denote relative scale position. The comparative (<i>-er</i> or <i>more</i>/<i>less</i>: <i>taller</i>, <i>more expensive</i>), the superlative (<i>-est</i> or <i>most</i>/<i>least</i>: <i>tallest</i>, <i>most expensive</i>) and the equative (<i>as tall as</i>) encode scale relations. Measure and differential phrases denote intervals (<i>much taller</i>, <i>two feet taller</i>), and comparison classes supply a reference set or standard (<i>taller than average</i>, <i>most expensive of all</i>). The patterns apply to gradable adjectives and adverbs. This dictionary notes that degree frames are degraded with absolute adjectives and lists <i>unique</i> and <i>dead</i> as boundary items. The analysis is provisional.'
  terms: This dictionary's term for the broader scale meaning is degree.
  examples:
    - text: '[as tall as]'
      from: entry
    - text: '[taller than average]'
      from: constructed
    - text: '[most expensive of all]'
      from: entry
    - text: '[much taller]'
      from: constructed
    - text: '[two feet taller]'
      from: constructed
  contrasts:
    - text: wider
      from: constructed
      note: A simple comparative.
    - text: two centimetres wider
      from: constructed
      note: The same scale with an explicit differential.
    - text: as wide as
      from: constructed
      note: An equality comparison that supplies a standard.
  watch_for:
    - A learner might expect degree frames to work with any adjective, when absolute adjectives such as <i>unique</i> and <i>dead</i> are boundary items.
    - A learner might treat <i>much taller</i> and <i>two feet taller</i> as the same kind of difference, when this dictionary treats <i>much taller</i> as a relative interval and <i>two feet taller</i> as a measured interval.
  activity: Students measure or rank classroom objects, then write sentences with a comparative, a superlative, an equative and a measure phrase. They swap and check that each sentence matches the facts.
child:
  hook: How do you say one thing is more than another?
  explain: We compare things with words like <i>taller</i>, <i>tallest</i> and <i>as tall as</i>. <i>Taller than</i> compares two things. <i>The tallest in the class</i> means no one in the class is taller. <i>As tall as</i> says they match.
  examples:
    - text: Mia is [taller than] Sam.
      from: constructed
    - text: Mia is [as tall as] Sam.
      from: constructed
    - text: Sam is [the tallest] in the class.
      from: constructed
  play: Compare three objects, like pencils or shoes. Make a sentence with <i>taller</i>, one with <i>the tallest</i> and one with <i>as tall as</i>. Can a friend tell which object you mean?
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: teacher.watch_for[1] now states the entry''s distinction (much taller as a relative interval, two feet taller as a measured interval). Also relabelled examples that the entry quotes from constructed to entry. Second round: fixed teacher.terms by cutting the claim about what traditional grammars call these patterns (this dictionary makes no such claim); fixed child.explain, whose ''picks out one at the end'' introduced no scale, by saying what the tallest in the class means.'
