id: degree-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Comparing things on a scale
  summary: English has a few ways to say where something sits on a scale, such as taller than, the tallest and as tall as.
  body: |-
    Words like tall, expensive or short describe a scale, and English has patterns for placing things on it. Taller than and more expensive than compare two things. The tallest and the most expensive pick out the end of the scale. As tall as says two things are level.

    The patterns can also say how big the difference is: much taller, two feet taller. And they can compare against a group or a standard, as in taller than average or most expensive of all. This dictionary treats the analysis as provisional.
  examples:
    - text: '[as tall as]'
      from: entry
    - text: '[taller than average]'
      from: constructed
    - text: '[most expensive of all]'
      from: entry
    - text: '[two feet taller]'
      from: constructed
  try: Pick two objects in the room and compare them with taller than, then with as tall as. Now try the least expensive thing you can see.
teacher:
  summary: Helps explain comparatives, superlatives and equatives as ways of placing something on a scale.
  explain: 'Degree constructions denote relative scale position. The comparative (-er or more/less: taller, more expensive), the superlative (-est or most/least: tallest, most expensive) and the equative (as tall as) encode scale relations. Measure and differential phrases denote intervals (much taller, two feet taller), and comparison classes supply a reference set or standard (taller than average, most expensive of all). The patterns apply to gradable adjectives and adverbs. This dictionary notes that degree frames are degraded with absolute adjectives and lists unique and dead as boundary items. The analysis is provisional.'
  terms: This dictionary's term for the broader scale meaning is degree.
  examples:
    - text: '[as tall as]'
      from: entry
    - text: '[taller than average]'
      from: constructed
    - text: '[most expensive of all]'
      from: entry
    - text: '[much taller]'
      from: constructed
    - text: '[two feet taller]'
      from: constructed
  contrasts:
    - text: wider
      from: constructed
      note: A simple comparative.
    - text: two centimetres wider
      from: constructed
      note: The same scale with an explicit differential.
    - text: as wide as
      from: constructed
      note: An equality comparison that supplies a standard.
  watch_for:
    - A learner might expect degree frames to work with any adjective, when absolute adjectives such as unique and dead are boundary items.
    - A learner might treat much taller and two feet taller as the same kind of difference, when this dictionary treats much taller as a relative interval and two feet taller as a measured interval.
  activity: Students measure or rank classroom objects, then write sentences with a comparative, a superlative, an equative and a measure phrase. They swap and check that each sentence matches the facts.
child:
  hook: How do you say one thing is more than another?
  explain: We compare things with words like taller, tallest and as tall as. Taller than compares two things. The tallest in the class means no one in the class is taller. As tall as says they match.
  examples:
    - text: Mia is [taller than] Sam.
      from: constructed
    - text: Mia is [as tall as] Sam.
      from: constructed
    - text: Sam is [the tallest] in the class.
      from: constructed
  play: Compare three objects, like pencils or shoes. Make a sentence with taller, one with the tallest and one with as tall as. Can a friend tell which object you mean?
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: teacher.watch_for[1] now states the entry''s distinction (much taller as a relative interval, two feet taller as a measured interval). Also relabelled examples that the entry quotes from constructed to entry. Second round: fixed teacher.terms by cutting the claim about what traditional grammars call these patterns (this dictionary makes no such claim); fixed child.explain, whose ''picks out one at the end'' introduced no scale, by saying what the tallest in the class means.'
