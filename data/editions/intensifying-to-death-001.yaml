id: intensifying-to-death-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Scared to death, but fine
  summary: The words <i>to death</i> after a verb can mean extreme feeling, as in <i>scared me to death</i>, or a literal fatal outcome, depending on the verb and the context.
  body: |-
    In <i>The alarm scared me to death, but everyone was fine</i>, <i>to death</i> expresses extreme fright. Nobody died. The continuation about everyone being fine fits that reading.

    With a killing verb, the same words identify a literal result, as in <i>The fox bit the hare to death</i>. The word order is the same in both. A later report of survival fits the extreme-feeling reading and contradicts the literal one.
  examples:
    - text: The alarm [scared me to death], but everyone was fine.
      from: entry
    - text: The fox [bit the hare to death].
      from: entry
  try: Add <i>but I'm fine</i> to the end of <i>The dog scared me to death</i>. Does it still make sense? Now compare <i>The fox bit the hare to death</i>. What does that sentence say happened to the hare?
teacher:
  summary: Distinguishes figurative <i>to death</i> as an intensifier from literal <i>to death</i> as a fatal result.
  explain: The pattern is a verb, optionally an object, and <i>to death</i>. It intensifies an action or the experience it causes. In <i>The dog scared me to death</i>, <i>to death</i> conventionally expresses extreme fright. With a killing verb or an appropriate context, the same phrase identifies a literal result, as in <i>The fox bit the hare to death</i>. The two readings can differ without any change in surface order. A later report of survival is compatible with the emotional intensity reading and contradicts the literal outcome reading, which makes a useful classroom test. This dictionary relates the literal use to object resultatives and the figurative use to degree, and marks itself provisional.
  terms: The figurative use is sometimes described as an intensifier. The literal use is related to the object resultative construction, which presents death as an achieved result.
  examples:
    - text: The alarm [scared me to death], but everyone was fine.
      from: entry
    - text: The fox [bit the hare to death].
      from: entry
  contrasts:
    - text: The alarm scared me to death, but everyone was fine.
      from: entry
      note: Extreme fright; survival is compatible.
    - text: The fox bit the hare to death.
      from: entry
      note: A literal fatal outcome.
  watch_for:
    - A learner might read <i>scared me to death</i> as reporting that someone died.
    - A learner might assume the figurative and literal uses differ in word order.
  activity: Students sort sentences ending in <i>to death</i> into extreme feeling and literal outcome. They test each by adding a later report that the one said to have died was fine, and checking whether it fits.
