id: intensifying-to-death-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Scared to death, but fine
  summary: The words to death after a verb can mean extreme feeling, as in scared me to death, or a literal fatal outcome, depending on the verb and the context.
  body: |-
    In The alarm scared me to death, but everyone was fine, to death expresses extreme fright. Nobody died. The continuation about everyone being fine fits that reading.

    With a killing verb, the same words identify a literal result, as in The fox bit the hare to death. The word order is the same in both. A later report of survival fits the extreme-feeling reading and contradicts the literal one.
  examples:
    - text: The alarm [scared me to death], but everyone was fine.
      from: entry
    - text: The fox [bit the hare to death].
      from: entry
  try: Add but I'm fine to the end of The dog scared me to death. Does it still make sense? Now compare The fox bit the hare to death. What does that sentence say happened to the hare?
teacher:
  summary: Distinguishes figurative to death as an intensifier from literal to death as a fatal result.
  explain: The pattern is a verb, optionally an object, and to death. It intensifies an action or the experience it causes. In The dog scared me to death, to death conventionally expresses extreme fright. With a killing verb or an appropriate context, the same phrase identifies a literal result, as in The fox bit the hare to death. The two readings can differ without any change in surface order. A later report of survival is compatible with the emotional intensity reading and contradicts the literal outcome reading, which makes a useful classroom test. This dictionary relates the literal use to object resultatives and the figurative use to degree, and marks itself provisional.
  terms: The figurative use is sometimes described as an intensifier. The literal use is related to the object resultative construction, which presents death as an achieved result.
  examples:
    - text: The alarm [scared me to death], but everyone was fine.
      from: entry
    - text: The fox [bit the hare to death].
      from: entry
  contrasts:
    - text: The alarm scared me to death, but everyone was fine.
      from: entry
      note: Extreme fright; survival is compatible.
    - text: The fox bit the hare to death.
      from: entry
      note: A literal fatal outcome.
  watch_for:
    - A learner might read scared me to death as reporting that someone died.
    - A learner might assume the figurative and literal uses differ in word order.
  activity: Students sort sentences ending in to death into extreme feeling and literal outcome. They test each by adding a later report that the one said to have died was fine, and checking whether it fits.
