id: nom-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: A noun with its describing words
  summary: The part of a noun phrase made of a noun and its modifiers, not counting the word like <i>the</i> in front.
  body: |-
    In <i>wooden chair</i>, the noun <i>chair</i> is described by <i>wooden</i>. In <i>mother of three</i>, <i>of three</i> adds more about the relation. In <i>knowledge that it is true</i>, the clause after <i>knowledge</i> tells you what the knowledge is about.

    This dictionary calls such a unit a nominal: a head noun with optional modifiers before it and optional modifiers or complements after it. It supplies the core description in a noun phrase. A nominal such as <i>old chair</i> fits in a frame like <i>the ___</i> without adding another determiner.
  examples:
    - text: '[wooden chair]'
      from: entry
    - text: '[helpful neighbors]'
      from: entry
    - text: '[mother of three]'
      from: entry
    - text: '[knowledge that it is true]'
      from: entry
  try: Start with a plain noun, such as <i>chair</i>. How many describing words can you add before and after it?
teacher:
  summary: Explains the nominal as the head noun plus its modifiers and complements, apart from the determiner.
  explain: 'A nominal has a required head noun, optional pre-head modifiers and optional post-head modifiers or complements. Its descriptive content restricts or elaborates the head''s denotation: <i>wooden chair</i> restricts material features and <i>mother of three</i> elaborates a relation. It is immediately dominated by the noun phrase and can be bare in certain contexts. An expansion of <i>chair</i> to <i>old chair</i> can fit inside the frame <i>the ___</i> without adding another determiner, but the resulting <i>old chair</i> normally still requires a determiner as an independent singular count argument.'
  terms: Nom is the CGEL label used here. Some generative textbooks call a comparable unit N-bar.
  examples:
    - text: '[wooden chair]'
      from: entry
    - text: '[mother of three]'
      from: entry
    - text: '[knowledge that it is true]'
      from: entry
  contrasts:
    - text: the old chair
      from: constructed
      note: The determiner <i>the</i> plus the nominal <i>old chair</i>.
    - text: wooden chair
      from: entry
      note: A nominal with a pre-head modifier.
  watch_for:
    - A learner might treat the determiner as part of the nominal.
    - A learner might assume the nominal can stand on its own as a full noun phrase, when <i>old chair</i> normally still needs a determiner as a singular count argument.
  activity: Students take a plain noun, add a modifier before and a complement after (<i>chair</i>, <i>old chair</i>, <i>mother of three</i>), and say where a determiner would go.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
