id: evidential-because-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Giving your reason for saying something
  summary: A because phrase can explain why the speaker says something, not why the thing happened.
  body: |-
    In Jo must be home, because her keys are on the table, the keys are the speaker's reason for concluding that Jo is home. They motivate the conclusion. Their being on the table need not be what caused Jo to be home.

    So the because part is added after the main clause to give grounds for making the claim. It can do the same for a directive, an instruction or request. A because phrase can also give a cause in the world, and this dictionary keeps that use apart from the reason-for-speaking use.
  examples:
    - text: Jo must be home, [because her keys are on the table].
      from: entry
    - text: He must be asleep, [because the lights are off].
      from: constructed
    - text: Take an umbrella, [because the sky looks dark].
      from: constructed
  try: Finish this sentence two ways. She must be tired, because ... (a clue that makes you think so), then because ... (what made her tired).
teacher:
  summary: Helps students tell a because that explains an event from a because that explains why the speaker says something.
  explain: A supplementary because-PP follows a clause and gives grounds for making the preceding claim or directive. In Jo must be home, because her keys are on the table, the keys motivate the speaker's conclusion, and their being on the table need not be what caused Jo to be home. CGEL distinguishes act-related from content-related cause, and this construction is discussed in that connection. This dictionary treats the analysis as provisional (medium confidence) and lists a related construction, epistemic modals with perfect have.
  terms: Evidential or speech-act because are the labels used here. CGEL's contrast is act-related versus content-related cause.
  examples:
    - text: Jo must be home, [because her keys are on the table].
      from: entry
    - text: Close the window, [because it's cold in here].
      from: constructed
  contrasts:
    - text: Jo must be home, because her keys are on the table.
      from: entry
      note: The keys are the speaker's grounds for the conclusion.
    - text: Jo is late because the bus broke down.
      from: constructed
      note: The because phrase gives a cause of the event itself.
  watch_for:
    - A learner might read the because part as the cause of Jo's being home, when it gives the speaker's reason for saying so.
    - A learner might think because can follow only a statement, when this dictionary says it can also give grounds for a directive.
  activity: Give students pairs such as "The grass is wet, because it rained" and "It must have rained, because the grass is wet". They say, for each, whether because explains the event or the speaker's conclusion.
child:
  hook: Why does the speaker think Jo is home?
  explain: Sometimes because tells why something happened. Sometimes it tells why you think something. The keys are a clue that Jo is home. They help the speaker guess it.
  examples:
    - text: Jo must be home, [because her keys are on the table].
      from: entry
    - text: She must be asleep, [because the lights are off].
      from: constructed
  play: Be a detective. Spot a clue, like wet boots by the door. Say what it makes you think, then add because and the clue.
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: "Fixed: teacher explanation now says the keys need not be the cause (as the entry does) instead of ruling the causal link out; the related-construction link is stated as epistemic modals with perfect have rather than epistemic must; child explanation no longer says what did or didn't make Jo go home. Also fixed (unflagged): 'the entry' replaced by 'this dictionary'; the claim that the entry places this use with the act-related kind was cut as unsupported. Second round: fixed the teacher contrast note, because clause changed to because phrase (the entry's pattern is a because-PP)."
