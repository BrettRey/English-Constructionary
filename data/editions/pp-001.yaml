id: pp-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Phrases built around words like in and until
  summary: A preposition phrase is a group of words whose main word is a preposition, such as in, as, until or because.
  body: |-
    In in the garden, the preposition in is the main word, and the garden follows it. The same kind of phrase can be built with other kinds of follower: as a liability, until recently, because it rained, and from under the bed.

    A preposition can also stand alone as a complete phrase. Outside is a whole phrase on its own, as in We waited outside. What makes each of these a preposition phrase is its main word, not the kind of word that comes after it.
  examples:
    - text: '[in the garden]'
      from: entry
    - text: '[as a liability]'
      from: entry
    - text: '[until recently]'
      from: entry
    - text: '[because it rained]'
      from: entry
    - text: '[from under the bed]'
      from: entry
    - text: '[outside]'
      from: entry
  try: Pick a short preposition like in, until or because. What can you put after it to make a phrase?
teacher:
  summary: Defines the PP and the range of complements a preposition can take, including none.
  explain: A PP is a phrase headed by a preposition, with or without a complement. The head may take an NP object (in the garden), a predicative NP or AdjP (as a liability, as reasonable), an AdvP (until recently), a clause (because it rained), a PP (from under the bed), or no complement (outside). A single complementless preposition constitutes a complete PP. PPs are classified by their heads, not by an NP being present. Locative members accept modifiers such as right and straight. A PP can function as a complement, modifier, adjunct or predicative complement in a larger construction.
  terms: Traditional grammars sometimes treat words like outside, until and because as adverbs or conjunctions when no NP follows. Here each is a preposition heading a PP.
  examples:
    - text: '[in the garden]'
      from: entry
    - text: '[as a liability]'
      from: entry
    - text: '[until recently]'
      from: entry
    - text: '[because it rained]'
      from: entry
    - text: '[from under the bed]'
      from: entry
    - text: '[outside]'
      from: entry
  contrasts:
    - text: We waited in the garden.
      from: constructed
      note: Preposition with an NP object.
    - text: We waited outside.
      from: constructed
      note: A complete PP with no complement.
  watch_for:
    - A learner might think a preposition needs an NP after it, when outside can be a complete phrase.
    - A learner might analyze because it rained as a clause only, when this dictionary takes because as the head of a PP with a clause complement.
  activity: Give students a list of PPs (in the garden, until recently, outside). They underline the preposition, then say what, if anything, follows it.
