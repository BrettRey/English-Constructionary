id: np-property-value-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Asking for and giving a size
  summary: A noun phrase like that size can sit before or after another noun to say which value of some property we mean.
  body: |-
    In what size hat, the words what size ask for the size of the hat. In They don't stock shoes that size, the words that size say which size of shoes. Each one names a property (size) and, in the answer, a value for it.

    The phrase can go before the noun, as in that size shoes, or after it, as in shoes that size. The second is the preferred wording for this example. Two values can be given together: a house that size and that price.
  examples:
    - text: '[what size hat]'
      from: entry
    - text: They don't stock [that size shoes].
      from: entry
    - text: They don't stock [shoes that size].
      from: entry
    - text: '[a house that size and that price]'
      from: entry
  try: Ask for something by size, like what size hat. How else could you say it?
teacher:
  summary: Shows a noun phrase supplying or asking for the value of a property of a head noun's referent, before or after the noun.
  explain: A property-value NP supplies both a property and a value, as in shoes that size. In what size hat, the value is the requested information. CGEL analyzes the pre-head NP as determiner and the post-head NP as modifier, and this dictionary records the shared interpretation. Two values can be coordinated, as in a house that size and that price. The lexical range of each position, and the relation to predicative my age, remain open. The dictionary marks this account as provisional.
  terms: Pre-head NP in determiner function is a CGEL analysis; the post-head NP is a modifier.
  examples:
    - text: '[what size hat]'
      from: entry
    - text: They don't stock [that size shoes].
      from: entry
    - text: They don't stock [shoes that size].
      from: entry
    - text: '[a house that size and that price]'
      from: entry
  contrasts:
    - text: They don't stock [that size shoes].
      from: entry
      note: Pre-head variant, with the property NP in determiner function.
    - text: They don't stock [shoes that size].
      from: entry
      note: Post-head variant, CGEL's preferred form for this example, with the property NP as a modifier.
  watch_for:
    - A learner might read that size as an ordinary determiner such as the.
    - A learner might think the pre-head and post-head versions mean different things.
  activity: Give students a clothing-store role-play. They ask and answer using what size hat and shoes that size, and compare where the property phrase goes.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: removed the claim about traditional names for the two positions; retitled so it no longer suggests age and other properties are established applications (the dictionary leaves the lexical range open); removed ''the dictionary prefers'' since the preference for the post-head variant is CGEL''s.'
