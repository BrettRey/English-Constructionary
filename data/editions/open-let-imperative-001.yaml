id: open-let-imperative-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Let everyone draw a ticket
  summary: A sentence starting with let can state a wish or instruction about whoever the noun phrase after let refers to.
  body: |-
    Let everyone draw a ticket tells us what everyone is to do. The action is attributed to everyone, and the sentence doesn't need to be a request for permission from someone in charge.

    It can state a wish, a rule or an instruction involving whoever the noun phrase after let refers to. This dictionary separates it from let's, which has a different person interpretation, and from the let that means giving permission.
  examples:
    - text: '[Let everyone draw a ticket].'
      from: entry
    - text: '[Let the guests choose their seats].'
      from: constructed
  try: Say Let everyone draw a ticket. Who is supposed to draw? Is anyone being asked for permission?
teacher:
  summary: Explains imperatives with let plus a noun phrase and a bare infinitive, such as Let everyone draw a ticket.
  explain: The pattern is imperative let plus a non-inclusive NP plus a bare infinitival. It presents a wish, stipulation or instruction involving the referent of the NP after let. The expected action is attributed to that referent (everyone draws a ticket), and the sentence needn't request permission from a gatekeeper. Inclusive let's has a separate person interpretation. This dictionary relates the pattern to the permissive let and to let's as neighbouring constructions. This dictionary marks the analysis as provisional.
  examples:
    - text: '[Let everyone draw a ticket].'
      from: entry
    - text: '[Let the guests choose their seats].'
      from: constructed
  watch_for:
    - A learner might read the sentence as a request for permission from a gatekeeper, when it needn't be one.
    - A learner might read Let everyone draw a ticket as having the person interpretation of let's, when this dictionary says let's has a separate one.
  activity: Students write three rules for a class game using let plus a group (everyone, each team) and a verb. They then say who is expected to act in each rule.
child:
  hook: Let everyone draw a ticket. Who is going to draw one?
  explain: This sentence tells what everyone should do. It's an instruction or a wish about them. Let's is a different pattern.
  examples:
    - text: '[Let everyone draw a ticket].'
      from: entry
    - text: '[Let each player pick a card].'
      from: constructed
  play: Make up rules for a game that start with Let. Who does each rule say should act?
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: curious.summary now speaks of whoever the noun phrase after let refers to, not someone other than the speaker; teacher.watch_for no longer treats a speaker-inclusive reading as an error and says only that let''s has a separate person interpretation.'
