id: adjectival-passive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Describing a state with a word like <i>locked</i>
  summary: A word that looks like part of a passive verb can instead describe how something is.
  body: |-
    In <i>The door remained locked</i>, the word <i>locked</i> tells us the state of the door. Nobody is said to have done anything. This dictionary tentatively treats <i>locked</i> here as an adjective, because the verb <i>remain</i> can select a description of a state.

    Compare <i>The door was locked by security at noon</i>. There we can picture an event at a particular time, with someone doing the locking, so the verbal passive reading is possible. The two sentences share the same word shape, but the first describes a state and the second can describe an event.
  examples:
    - text: The door [remained locked].
      from: entry
  try: Say <i>The door remained locked</i>, then <i>The door was locked by security at noon</i>. Which one sounds like something happening at a particular time?
teacher:
  summary: Helps students tell a state described by an adjective (<i>remained locked</i>) from a verbal passive event (<i>was locked by security</i>).
  explain: In the adjectival passive, a past-participle form heads an adjective phrase after <i>be</i>, <i>seem</i> or <i>remain</i>, and the clause ascribes a state or property to the subject. <i>Remain</i> supports the adjective analysis because it can select the stative predicate. A verbal passive with an agent and an explicitly dated event, such as <i>The door was locked by security at noon</i>, permits the verbal analysis and gives an event reading instead. This dictionary treats the adjectival passive as a specialization of the subject-ascriptive pattern and marks the analysis as provisional.
  terms: Both patterns use a past-participial form. This dictionary calls the first an adjectival passive (adjective phrase) and the second a verbal <i>be</i>-passive.
  examples:
    - text: The door [remained locked].
      from: entry
  contrasts:
    - text: The door remained locked.
      from: entry
      note: State of the door; adjective analysis supported.
    - text: The door was locked by security at noon.
      from: entry
      note: Agent and dated event; verbal passive analysis permitted.
  watch_for:
    - A learner might read every past participle after <i>be</i>, <i>seem</i> or <i>remain</i> as an event with an agent, when <i>remained locked</i> describes a state.
    - A learner might assume <i>seem</i> or <i>remain</i> can't be followed by <i>locked</i>, when the pattern allows <i>be</i>, <i>seem</i> and <i>remain</i>.
  activity: Students get sentence pairs built on the same participle, one with <i>remain</i> and one with a <i>by</i>-phrase and a time. They label each as state or event and say what clue decided it.
child:
  hook: Is "<i>locked</i>" something a person does, or how the door is?
  explain: In <i>The door remained locked</i>, <i>locked</i> tells us how the door is. It doesn't say who locked it. In <i>The door was locked by security at noon</i>, we hear about something that happened.
  examples:
    - text: The door [remained locked].
      from: entry
    - text: The window [remained closed].
      from: constructed
  play: Think of things that stay in a state, like <i>closed</i> or <i>broken</i>. Say a sentence with <i>remained</i> for each one, and tell a partner how the thing is.
checked:
  date: "2026-11-19"
  model: claude-opus-5-5 (resolving glm-5.3 flags)
  result: fixed
  note: "Fixed: child example The window remained open replaced by The window remained closed (the entry's pattern needs a past-participial base; open is not one); child.play dropped empty for the same reason; curious.body now says this dictionary tentatively treats locked as an adjective (the entry is provisional, confidence medium); teacher.terms 'look like be plus a past participle' changed to 'use a past-participial form' (the entry's example uses remain). Also fixed (unflagged): curious.examples dropped The door [was locked] by security at noon, which bolded a verbal passive as an instance of this pattern (the comparison stays in the body); watch_for item now says after be, seem or remain rather than be plus past participle; teacher 'The entry'/'This entry' changed to 'This dictionary'. Dismissed: none."
