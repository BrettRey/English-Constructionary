id: adjectival-passive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Describing a state with a word like locked
  summary: A word that looks like part of a passive verb can instead describe how something is.
  body: |-
    In The door remained locked, the word locked tells us the state of the door. Nobody is said to have done anything. This dictionary tentatively treats locked here as an adjective, because the verb remain can select a description of a state.

    Compare The door was locked by security at noon. There we can picture an event at a particular time, with someone doing the locking, so the verbal passive reading is possible. The two sentences share the same word shape, but the first describes a state and the second can describe an event.
  examples:
    - text: The door [remained locked].
      from: entry
  try: Say The door remained locked, then The door was locked by security at noon. Which one sounds like something happening at a particular time?
teacher:
  summary: Helps students tell a state described by an adjective (remained locked) from a verbal passive event (was locked by security).
  explain: In the adjectival passive, a past-participle form heads an adjective phrase after be, seem or remain, and the clause ascribes a state or property to the subject. Remain supports the adjective analysis because it can select the stative predicate. A verbal passive with an agent and an explicitly dated event, such as The door was locked by security at noon, permits the verbal analysis and gives an event reading instead. This dictionary treats the adjectival passive as a specialization of the subject-ascriptive pattern and marks the analysis as provisional.
  terms: Both patterns use a past-participial form. This dictionary calls the first an adjectival passive (adjective phrase) and the second a verbal be-passive.
  examples:
    - text: The door [remained locked].
      from: entry
  contrasts:
    - text: The door remained locked.
      from: entry
      note: State of the door; adjective analysis supported.
    - text: The door was locked by security at noon.
      from: entry
      note: Agent and dated event; verbal passive analysis permitted.
  watch_for:
    - A learner might read every past participle after be, seem or remain as an event with an agent, when remained locked describes a state.
    - A learner might assume seem or remain can't be followed by locked, when the pattern allows be, seem and remain.
  activity: Students get sentence pairs built on the same participle, one with remain and one with a by-phrase and a time. They label each as state or event and say what clue decided it.
child:
  hook: Is "locked" something a person does, or how the door is?
  explain: In The door remained locked, locked tells us how the door is. It doesn't say who locked it. In The door was locked by security at noon, we hear about something that happened.
  examples:
    - text: The door [remained locked].
      from: entry
    - text: The window [remained closed].
      from: constructed
  play: Think of things that stay in a state, like closed or broken. Say a sentence with remained for each one, and tell a partner how the thing is.
checked:
  date: "2026-11-19"
  model: claude-opus-5-5 (resolving glm-5.3 flags)
  result: fixed
  note: "Fixed: child example The window remained open replaced by The window remained closed (the entry's pattern needs a past-participial base; open is not one); child.play dropped empty for the same reason; curious.body now says this dictionary tentatively treats locked as an adjective (the entry is provisional, confidence medium); teacher.terms 'look like be plus a past participle' changed to 'use a past-participial form' (the entry's example uses remain). Also fixed (unflagged): curious.examples dropped The door [was locked] by security at noon, which bolded a verbal passive as an instance of this pattern (the comparison stays in the body); watch_for item now says after be, seem or remain rather than be plus past participle; teacher 'The entry'/'This entry' changed to 'This dictionary'. Dismissed: none."
