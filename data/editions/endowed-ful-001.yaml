id: endowed-ful-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Adjectives ending in <i>-ful</i>
  summary: Adding <i>-ful</i> to a noun gives an adjective saying something has or displays what the noun names.
  body: |-
    <i>A thoughtful reply</i> is one that shows thought. The <i>-ful</i> adjective describes something as having or displaying the substance or property associated with the base word.

    The base is typically a noun. <i>Colour</i> gives <i>colourful</i>, a word for something that has colour or displays it. A related ending, <i>-less</i>, works in the opposite direction.
  examples:
    - text: The chair gave a [thoughtful] reply.
      from: entry
    - text: The [colourful] kite flew high.
      from: constructed
  try: Add <i>-ful</i> to a noun such as <i>joy</i> or <i>help</i>. What does the new word say about something?
teacher:
  summary: Helps explain <i>-ful</i> adjectives as formed from a base meaning having or displaying that property.
  explain: An adjective in <i>-ful</i> characterizes something as having or displaying the substance or property associated with the base, typically a noun. In <i>The chair gave a thoughtful reply</i>, <i>thoughtful</i> describes a reply that displays thought. This dictionary treats it as a specialization of the adjective construction and relates it to the privative <i>-less</i> pattern, which marks lack.
  examples:
    - text: The chair gave a [thoughtful] reply.
      from: entry
    - text: She is a [careful] driver.
      from: constructed
  watch_for:
    - A learner might read <i>thoughtful</i> as describing the chair, when it describes the reply.
    - A learner might confuse <i>-ful</i> with its related privative pattern <i>-less</i>, which marks the opposite idea.
  activity: Students list nouns (<i>care</i>, <i>help</i>, <i>use</i>), add <i>-ful</i>, and write a sentence with each new adjective. A partner restates it as <i>has</i> or <i>shows</i> the noun.
child:
  hook: What word describes a reply that shows thought?
  explain: Add <i>-ful</i> to a word like <i>thought</i> and you get a word saying someone has it or shows it. <i>A thoughtful reply</i> shows thought. <i>A colourful kite</i> has colour.
  examples:
    - text: She gave a [thoughtful] answer.
      from: constructed
    - text: The [colourful] kite flew high.
      from: constructed
  play: Try adding <i>-ful</i> to <i>joy</i>, <i>help</i> and <i>care</i>. Use each new word in a short sentence.
