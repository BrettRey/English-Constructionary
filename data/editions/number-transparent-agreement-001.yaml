id: number-transparent-agreement-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: When the verb follows the noun after of
  summary: In <i>a number of applicants</i>, the verb agrees with <i>applicants</i>, not with the singular word <i>number</i>.
  body: |-
    In <i>A number of applicants were waiting</i>, the word <i>number</i> is singular, yet the verb is plural. The verb follows the plural <i>applicants</i> after <i>of</i>.

    Compare <i>The number of applicants</i>. There, <i>number</i> normally names a quantity, and the verb goes with it: singular. <i>Three litres of milk was enough</i> works the same way, with a singular verb for an amount.
  examples:
    - text: A number of applicants [were waiting].
      from: entry
    - text: The number of applicants was small.
      from: constructed
    - text: Three litres of milk was enough.
      from: entry
  try: Say <i>A number of applicants were waiting</i>. Then say <i>The number of applicants was small</i>. Why does the verb change?
teacher:
  summary: Explains why a plural verb can follow a singular noun like <i>number</i> when an <i>of</i>-phrase supplies the plural.
  explain: In a licensed frame, a number-transparent nominal lets the number of the embedded complement determine agreement. In <i>A number of applicants were waiting</i>, the plural is licensed despite the singular <i>number</i>, so the verb follows <i>applicants</i>. With <i>the number of applicants</i>, the nominal normally denotes a numerical quantity and takes singular agreement. Compare an amount reading with singular agreement, as in <i>Three litres of milk was enough</i>. This is a specialization of verb-number agreement. The dictionary marks this account as provisional.
  examples:
    - text: A number of applicants [were waiting].
      from: entry
    - text: Three litres of milk [was] enough.
      from: entry
  contrasts:
    - text: A number of applicants [were waiting].
      from: entry
      note: Plural agreement follows the <i>of</i>-complement.
    - text: The number of applicants [was] small.
      from: constructed
      note: <i>Number</i> names a quantity, so agreement is singular.
  watch_for:
    - A learner might make the verb agree with the singular noun <i>number</i> in <i>A number of applicants</i>.
    - A learner might use a plural verb after <i>the number of applicants</i>.
  activity: Give students sentence frames with <i>a number of</i> and <i>the number of</i>. They choose the verb form, then explain which word the verb agrees with.
