id: neither-nor-coordination-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>Neither this nor that</i>"
  summary: "<i>Neither ... nor</i> links two things and says that neither of them applies."
  body: |-
    In <i>Neither Kim nor Pat replied</i>, the pair <i>neither ... nor</i> joins Kim and Pat, and the sentence denies the reply for both. It also joins actions: <i>He neither knew nor cared where his children were</i> says that he did not know and did not care.

    Both items fall under the negation. The pair can link two phrases, as in <i>neither Jo nor Kai</i>, or two verb phrases, as in <i>neither called nor wrote</i>. It is different from the <i>neither</i> in <i>neither did Jo</i>, which depends on a negative statement that came before it.
  examples:
    - text: He [neither] knew [nor] cared where his children were.
      from: entry
    - text: '[Neither] Kim [nor] Pat replied.'
      from: entry
    - text: '[Neither] Jo [nor] Kai came.'
      from: constructed
  try: Pick two friends. Say a sentence with <i>neither</i> and <i>nor</i> that denies something for both.
teacher:
  summary: Helps teach correlative <i>neither ... nor</i>, which negates both of two coordinated items.
  explain: '<i>Neither ... nor</i> is a correlative coordination: the markers <i>neither</i> and <i>nor</i> introduce paired coordinates, and both coordinated alternatives fall under negation. It can coordinate noun phrases (<i>Neither Kim nor Pat replied</i>) or verb phrases (<i>He neither knew nor cared where his children were</i>). It differs from additive <i>neither</i>, as in <i>neither did Jo</i>, which depends on a preceding negative assertion. This dictionary treats <i>neither ... nor</i> as a specialization of coordination and lists absolute negator determinatives and so-neither inversion as related.'
  terms: Correlative conjunction is a traditional name; this dictionary prefers correlative coordination, with <i>nor</i> as the coordinator.
  examples:
    - text: He [neither] knew [nor] cared where his children were.
      from: entry
    - text: '[Neither] Kim [nor] Pat replied.'
      from: entry
  contrasts:
    - text: Neither Kim nor Pat replied.
      from: entry
      note: "<i>Neither</i> and <i>nor</i> pair two noun phrases."
    - text: Kim didn't call, and neither did Jo.
      from: constructed
      note: Additive <i>neither</i>, which follows a negative statement.
  watch_for:
    - A learner might read <i>Neither Kim nor Pat replied</i> as saying only one of them did not reply.
    - A learner might treat the <i>neither</i> in <i>neither did Jo</i> as the paired <i>neither ... nor</i>.
  activity: Students write pairs of true statements about two classmates (<i>Kim doesn't sing, Pat doesn't sing</i>). They combine each pair into a <i>neither ... nor</i> sentence, once with noun phrases and once with verb phrases.
child:
  hook: How can you say that two people both didn't do something?
  explain: "<i>Neither</i> and <i>nor</i> go together. <i>Neither Kim nor Pat replied</i> means Kim didn't reply and Pat didn't either."
  examples:
    - text: '[Neither] Kim [nor] Pat replied.'
      from: entry
    - text: '[Neither] Jo [nor] Kai came.'
      from: constructed
  play: Say something two friends both didn't do. Then say it again starting with <i>neither</i> and putting <i>nor</i> between their names.
