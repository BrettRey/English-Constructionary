id: subjunctive-mandative-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Clauses that state a requirement
  summary: After words like <i>requested</i>, a <i>that</i>-clause can use the plain form of the verb to say what is required or recommended.
  body: |-
    In <i>They requested that the gate remain closed</i>, the clause after <i>that</i> gives the content of a request. The verb <i>remain</i> is in its plain form: it doesn't take an <i>-s</i> even though the gate is singular.

    The plain form also shows up with <i>not</i>. In <i>that the gate not be opened</i>, <i>not</i> comes before plain <i>be</i>, and no <i>do</i> is needed. The grammar books call this the subjunctive.

    This dictionary marks the analysis as provisional and gives only constructed examples.
  examples:
    - text: They requested [that the gate remain closed].
      from: entry
    - text: They requested [that the gate not be opened].
      from: entry
  try: Say <i>They requested that the gate remain closed</i>. What would the verb be in an ordinary statement, <i>The gate remains closed</i>? How does <i>remain</i> differ?
teacher:
  summary: Explains why a <i>that</i>-clause after request-type words takes the plain verb form and does not mark person or tense.
  explain: The mandative subjunctive is a content clause with (<i>that</i>), a subject and a plain-form verb, presenting the content of a requirement, recommendation or request. <i>Remain</i> does not carry third-person singular marking. With negative <i>not</i>, the plain form can occur without finite <i>do</i>, as in <i>that it not remain closed</i>. In <i>They requested that the gate not be opened</i>, plain <i>be</i> follows <i>not</i> without support from <i>do</i>. This dictionary marks the analysis as provisional and a separate entry covers the related mandative <i>should</i> construction.
  terms: Mandative subjunctive is a textbook name. In CGEL terms the verb is a plain form in a declarative content clause.
  examples:
    - text: They requested [that the gate remain closed].
      from: entry
    - text: They requested [that the gate not be opened].
      from: entry
  contrasts:
    - text: They requested that the gate remain closed.
      from: entry
      note: Plain form; no third-person singular marking.
    - text: They requested that the gate not be opened.
      from: entry
      note: Plain <i>be</i> after <i>not</i>, without support from <i>do</i>.
  watch_for:
    - A learner might expect <i>-s</i> on <i>remain</i> because the gate is third-person singular.
    - A learner might expect <i>do</i> to support <i>not</i> in the clause, when plain <i>be</i> follows <i>not</i> directly.
  activity: Students complete sentences beginning with <i>demand</i>, <i>insist</i>, <i>recommend</i> and <i>request</i> followed by a <i>that</i>-clause. They circle the verb form and say whether it carries person or tense marking.
