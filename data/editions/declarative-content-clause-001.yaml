id: declarative-content-clause-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: When that can be left out
  summary: The part of a sentence that gives what someone believes or says can be introduced by that, which is sometimes optional and sometimes required.
  body: |-
    In I believe they were lying, the part they were lying gives the content of the belief, inside a larger sentence. The word that can introduce it: I believe that they were lying. After a verb like believe, that can be left out.

    It isn't always optional. When that part comes first as the subject of an ordinary, fully expressed sentence, as in That they were lying is now quite obvious, the sentence requires that. Whether the content is reported, taken for granted or questioned depends on the larger sentence around it. This dictionary treats the analysis as provisional.
  examples:
    - text: '[That they were lying] is now quite obvious.'
      from: entry
    - text: I believe [(that) they were lying].
      from: entry
  try: Take a sentence like I believe they were lying. Add that after believe. Does it still work? Now compare That they were lying is now quite obvious, where that is required.
teacher:
  summary: Helps explain when that is optional or required before a declarative content clause.
  explain: 'A declarative content clause is a subordinate clause, optionally introduced by that, that presents propositional content as part of a larger construction. That can be optional after a verb such as say or believe, and in subject extraposition. It is required in ordinary fully expressed initial clausal subjects: That they were lying is now quite obvious. Whether the proposition is reported, presupposed or questioned depends on the matrix construction. The subordinate clause preserves declarative order. Don''t confuse it with a relative clause: in Jo said that Kai read it the content clause has its own object, while in the book that Kai read the relative links an object gap to book.'
  terms: Traditional grammars may call these that-clauses or noun clauses. This dictionary calls them declarative content clauses.
  examples:
    - text: '[That they were lying] is now quite obvious.'
      from: entry
    - text: I believe [(that) they were lying].
      from: entry
  contrasts:
    - text: I believe that they were lying.
      from: constructed
      note: That introduces the content clause after a verb.
    - text: Jo said that Kai read it.
      from: entry
      note: Content clause with its own object.
    - text: the book that Kai read
      from: entry
      note: Relative clause linked to book through an object gap.
  watch_for:
    - A learner might assume that can be dropped in every position, when it is required in an ordinary initial clausal subject.
    - A learner might treat that as the same in Jo said that Kai read it and the book that Kai read, when one introduces a content clause and the other a relative.
  activity: Give students matrix verbs (say, believe, know) and a short statement. They build sentences with and without that, then try the statement as the subject at the start, noting where that must stay.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: curious text no longer calls the embedded part a statement in its own right (in I believe they were lying it supplies the content of the belief; what is done with it depends on the larger construction); the requirement for that is now stated for ordinary, fully expressed initial clausal subjects, as in the entry.'
