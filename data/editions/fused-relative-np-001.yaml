id: fused-relative-np-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: A <i>what</i> phrase that acts as a noun phrase
  summary: A phrase like <i>what she wrote</i> names the thing that was written, much as a noun phrase would.
  body: |-
    In <i>I really liked what she wrote</i>, the phrase <i>what she wrote</i> names the thing that was written. The word <i>what</i> does two jobs: it supplies the thing referred to, and it fills the place after <i>wrote</i> where that thing would go.

    The same words can instead be a question about identity, as after <i>wonder</i>. One clue to the difference is the verb. In <i>What books she has are in the attic</i>, the phrase takes the plural <i>are</i>, where a clause on its own as subject would take a singular verb.
  examples:
    - text: I really liked [what she wrote].
      from: entry
    - text: '[What books she has] are in the attic.'
      from: entry
    - text: I wonder what she wrote.
      from: constructed
  try: Compare <i>I really liked what she wrote</i> with <i>I wonder what she wrote</i>. In which one is <i>what she wrote</i> a thing you could point at?
teacher:
  summary: 'For advanced classes: <i>what she wrote</i> as a noun phrase, and how it differs from an embedded question.'
  explain: 'A fused relative NP identifies a person, thing or quantity through the relation expressed inside the NP. In <i>what she wrote</i>, the initial expression supplies both the nominal reference and a dependent of <i>wrote</i>, so the NP can denote written material. The same string can form an embedded interrogative about the identity of the material. Diagnostics independent of the referential contrast include agreement, extraposition and selection: a plural fused relative as subject licenses plural agreement (<i>What books she has are in the attic</i>), whereas a clausal subject takes default singular agreement. The variable expression of a pseudo-cleft is a fused relative. Confidence in this dictionary is high.'
  terms: Fused relative is CGEL's term. Free relative and nominal relative are sometimes used for the same thing.
  examples:
    - text: I really liked [what she wrote].
      from: entry
    - text: '[What books she has] are in the attic.'
      from: entry
  contrasts:
    - text: I really liked what she wrote.
      from: entry
      note: Fused relative; the NP denotes written material.
    - text: I wonder what she wrote.
      from: constructed
      note: The same words as an embedded question about identity.
  watch_for:
    - A learner might read <i>what she wrote</i> in <i>I really liked what she wrote</i> as a question.
    - A learner might choose a singular verb after <i>What books she has</i>, because the phrase contains a finite clause.
  activity: 'Students get pairs like <i>I liked what she wrote</i> and <i>I wonder what she wrote</i>. They decide which is a noun phrase naming something and which is a question. They can check by the verb: <i>What books she has are in the attic</i>.'
