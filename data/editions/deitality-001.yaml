id: deitality-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Words that behave like <i>this</i> and <i>that</i>
  summary: This dictionary uses deitality for a pattern of grammatical behaviour shared by <i>the</i>, <i>this</i>, <i>that</i> and similar words, separate from what they mean.
  body: |-
    Words like <i>this</i>, <i>that</i>, <i>these</i>, <i>those</i> and <i>the</i> behave alike in ways that have nothing to do with pointing. They resist the neutral <i>there was</i> pattern: <i>There was the dog in the yard</i> doesn't work in the ordinary, neutral way. They can name the group a partitive is drawn from, as in <i>two of the dogs</i>. And they readily host extra identifying material, as in <i>that idiot Larry</i>.

    This dictionary calls that bundle of behaviour deitality. It is related to definiteness, which is about meaning, but the two don't line up perfectly. Membership in the pattern is a matter of degree, and the analysis is provisional.
  examples:
    - text: two of [the] dogs
      from: entry
    - text: '[that] idiot Larry'
      from: entry
  try: Compare <i>two of the dogs</i> with <i>two of some dogs</i>. Which one works? What does that tell you about <i>the</i>?
teacher:
  summary: 'For advanced classes: a grammatical profile (there-resistance, partitive domain, identificational hosting) that goes with, but isn''t the same as, definiteness.'
  explain: 'Deitality is a structural (morphosyntactic) profile of English determination, distinct from semantic definiteness. The prototype is the demonstratives (<i>this</i>, <i>that</i>, <i>these</i>, <i>those</i>). Core members include <i>the</i>, personal genitives and genitive NPs in determiner function. Three diagnostics are ranked: resistance to neutral existential there pivots; domain establishment in true partitives; ready hosting of identificational material. Definiteness and deitality usually coincide, which is why they get run together; weak definites, generic definites, narrative this and proper names each mark a point where they separate. Membership is graded, with status labels deital, non-deital, mixed and provisional. The analysis is provisional.'
  terms: <i>The</i>, <i>this</i>, <i>that</i>, <i>these</i> and <i>those</i> are determinatives; Determiner is their function. The there-resistance is labelled the definiteness effect in this dictionary. Here it counts as one diagnostic of a structural profile, not as definiteness itself.
  examples:
    - text: two of [the] dogs
      from: entry
    - text: '[that] idiot Larry'
      from: entry
  contrasts:
    - text: There was [the] dog in the yard.
      from: entry
      acceptable: false
      note: There-resistance under neutral prosody.
    - text: two of [the] dogs
      from: entry
      note: Domain-establishing complement in a true partitive.
    - text: two of [some] dogs
      from: entry
      acceptable: false
      note: Not acceptable as a true partitive.
  watch_for:
    - A learner might treat deitality and definiteness as the same thing, when weak definites, generic definites, narrative this and proper names show where they separate.
    - A learner might expect a form to be either deital or not, when membership is graded.
  activity: Students test <i>the</i>, <i>this</i>, <i>that</i>, <i>a</i> and <i>some</i> in the frames <i>there was ___ dog in the yard</i>, <i>two of ___ dogs</i> and <i>___ idiot Larry</i>, tallying which words fit each frame and discussing why the results line up with, but don't exactly match, meaning.
