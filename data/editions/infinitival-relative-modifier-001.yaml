id: infinitival-relative-modifier-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: A bench to sit on
  summary: A to plus a verb after a noun can describe the thing by what could be done with it, as in a bench to sit on.
  body: |-
    In We need a bench to sit on, the part to sit on describes the bench. It says what the bench is for or could be used for. The bench is the thing you'd sit on, so it fills the gap after on.

    The to part can have a sense of possibility or fitness. It differs from a purpose phrase, which tells why someone did something. We need a bench to sit on is about the bench, not about the reason for an action.
  examples:
    - text: We need a bench [to sit on].
      from: entry
    - text: She wants a book [to read on the train].
      from: constructed
  try: 'Finish this sentence: I need something to ... What does the thing do for you?'
teacher:
  summary: Covers noun phrases like a bench to sit on, where a to-infinitival modifies the noun.
  explain: The pattern is a nominal followed by a to-infinitival with a gap linked to the antecedent. It characterizes a referent by a possible or appropriate action involving it. In We need a bench to sit on, the bench supplies the complement of on. The relative can have a modal reading, and it can differ from a purpose adjunct describing why a main-clause action occurred. This dictionary relates it to the integrated relative modifier and to the infinitival purpose adjunct, and marks it provisional.
  terms: Sometimes called an infinitival relative clause or a to-infinitive modifying a noun.
  examples:
    - text: We need a bench [to sit on].
      from: entry
    - text: She wants a book [to read on the train].
      from: constructed
  contrasts:
    - text: We need a bench to sit on.
      from: entry
      note: Describes the bench; the bench is what you sit on.
    - text: Jo borrowed the van to move the chairs.
      from: constructed
      note: A purpose phrase telling why the action happened.
  watch_for:
    - A learner might not notice that the bench is what fills the gap after on.
    - A learner might read to sit on as the reason for the needing rather than as a description of the bench.
  activity: Students complete noun phrases such as a pen to ... and a box to ... and mark the gap where the noun would go in the verb phrase. They compare with a purpose sentence.
child:
  hook: What's a bench to sit on?
  explain: To plus a verb can describe a thing by what you could do with it. A bench to sit on is a bench you could sit on. You sit on the bench.
  examples:
    - text: We need a bench [to sit on].
      from: entry
    - text: I found a rope [to climb on].
      from: constructed
  play: Pick something in the room. Describe it with to plus a verb, such as a chair to sit on. Can a partner guess it?
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
