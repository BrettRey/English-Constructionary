id: infinitival-relative-modifier-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>A bench to sit on</i>
  summary: A <i>to</i> plus a verb after a noun can describe the thing by what could be done with it, as in <i>a bench to sit on</i>.
  body: |-
    In <i>We need a bench to sit on</i>, the part <i>to sit on</i> describes the bench. It says what the bench is for or could be used for. The bench is the thing you'd sit on, so it fills the gap after <i>on</i>.

    The <i>to</i> part can have a sense of possibility or fitness. It differs from a purpose phrase, which tells why someone did something. <i>We need a bench to sit on</i> is about the bench, not about the reason for an action.
  examples:
    - text: We need a bench [to sit on].
      from: entry
    - text: She wants a book [to read on the train].
      from: constructed
  try: 'Finish this sentence: <i>I need something to ...</i> What does the thing do for you?'
teacher:
  summary: Covers noun phrases like <i>a bench to sit on</i>, where a <i>to</i>-infinitival modifies the noun.
  explain: The pattern is a nominal followed by a <i>to</i>-infinitival with a gap linked to the antecedent. It characterizes a referent by a possible or appropriate action involving it. In <i>We need a bench to sit on</i>, the bench supplies the complement of <i>on</i>. The relative can have a modal reading, and it can differ from a purpose adjunct describing why a main-clause action occurred. This dictionary relates it to the integrated relative modifier and to the infinitival purpose adjunct, and marks it provisional.
  terms: Sometimes called an infinitival relative clause or a to-infinitive modifying a noun.
  examples:
    - text: We need a bench [to sit on].
      from: entry
    - text: She wants a book [to read on the train].
      from: constructed
  contrasts:
    - text: We need a bench to sit on.
      from: entry
      note: Describes the bench; the bench is what you sit on.
    - text: Jo borrowed the van to move the chairs.
      from: constructed
      note: A purpose phrase telling why the action happened.
  watch_for:
    - A learner might not notice that the bench is what fills the gap after <i>on</i>.
    - A learner might read <i>to sit on</i> as the reason for the needing rather than as a description of the bench.
  activity: Students complete noun phrases such as <i>a pen to ...</i> and <i>a box to ...</i> and mark the gap where the noun would go in the verb phrase. They compare with a purpose sentence.
child:
  hook: What's <i>a bench to sit on</i>?
  explain: <i>To</i> plus a verb can describe a thing by what you could do with it. <i>A bench to sit on</i> is a bench you could sit on. You sit on the bench.
  examples:
    - text: We need a bench [to sit on].
      from: entry
    - text: I found a rope [to climb on].
      from: constructed
  play: Pick something in the room. Describe it with <i>to</i> plus a verb, such as <i>a chair to sit on</i>. Can a partner guess it?
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
