id: proposition-affirmation-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>So I did</i>
  summary: Starting a short reply with <i>so</i>, then the subject and a helping verb, confirms what someone just said.
  body: |-
    If someone says <i>You did promise</i>, a reply of <i>So I did</i> agrees with them: yes, that's true. The reply confirms the point just made.

    Changing the order changes the meaning. <i>So did Jo</i> doesn't confirm that you promised; it adds Jo as another person who promised. The same subject normally resumes the earlier statement when it comes before the helping verb. This dictionary marks the account as provisional.
  examples:
    - text: “You did promise.” “[So I did].”
      from: entry
    - text: “You did promise.” “[So did Jo].”
      from: entry
  try: Say <i>You did promise</i>, then reply <i>So I did</i>. Now reply <i>So did Jo</i>. How do the two replies differ?
teacher:
  summary: Shows how word order after <i>so</i> distinguishes confirming a statement from adding another person.
  explain: 'Fronted <i>so</i> with a subject before the finite auxiliary (<i>So I did</i>) confirms or acknowledges the proposition just put into play. With subject-auxiliary inversion (<i>So did Jo</i>) the meaning changes: Jo is added as another subject who did the same thing. The same subject normally resumes the prior assertion, with subject before auxiliary, and inverted <i>so did I</i> typically adds a parallel case instead. This dictionary marks the analysis provisional. Make the order contrast the focus.'
  terms: The inverted order (<i>so did Jo</i>) is the pattern in '<i>so do I</i>'; this dictionary treats the two orders as distinct constructions.
  examples:
    - text: “You did promise.” “[So I did].”
      from: entry
    - text: “You did promise.” “[So did Jo].”
      from: entry
  contrasts:
    - text: “You did promise.” “[So I did].”
      from: entry
      note: Same subject; confirms the proposition.
    - text: “You did promise.” “[So did Jo].”
      from: entry
      note: Inversion adds Jo as another promiser.
  watch_for:
    - A learner might use <i>So did I</i> to confirm their own earlier action.
    - A learner might read <i>So did Jo</i> as agreeing that you promised.
  activity: Pairs read a statement with <i>did</i>, such as <i>You did promise</i>, and take turns answering with <i>So I did</i> or <i>So did</i> another name. The partner says whether the reply confirms or adds someone.
