id: grammatical-definiteness-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Pointing out which one you mean
  summary: Words like the, this and that, or a name such as John, can show that the listener is able to work out which one is meant, in contrast with a or some.
  body: |-
    Saying the cat signals that the listener can work out which cat. A cat or some person does not. The same pairs show other contrasts: the students against some students is an established group against a subset, and the winner against a winner is unique against arbitrary.

    These contrasts aren't a simple switch tied to one word. Shared knowledge can make the only exit identifiable the first time it's mentioned. And in take the train, the word the can mark the activity itself without pointing to a specific train.
  examples:
    - text: '[the]/[a] cat'
      from: entry
    - text: '[the]/[a] winner'
      from: entry
    - text: '[the] students/[some] students'
      from: entry
  try: Compare the book and a book in your own talk. When do you say each?
teacher:
  summary: Frames definiteness as identifiability, reference scope and discourse status, with known mismatches.
  explain: 'Grammatical definiteness is a semantic feature implemented through nominal determination. This dictionary distinguishes identifiability (the cat against a cat), reference scope (the students against some students; the winner against a winner) and discourse status (given against new). Form is typically realized by the, this, that, dependent genitive pronouns, genitive NPs or bare proper nouns. Familiarity, unique reference and structural diagnostics need separate predictions: shared knowledge can make the only exit identifiable at first mention, and the in take the train can mark a lexicalized activity without distinguishing a specific train. This dictionary marks this analysis as provisional.'
  terms: This dictionary describes the forms as typically deital determiners (a function, filled by the, this, that, dependent genitive pronouns or genitive noun phrases) or bare proper nouns. The and a are determinatives (often called articles), and their function in the NP is determiner.
  examples:
    - text: '[the]/[a] cat'
      from: entry
    - text: '[the] students/[some] students'
      from: entry
    - text: '[the]/[a] winner'
      from: entry
  contrasts:
    - text: the/a book
      from: entry
      note: Given versus new.
    - text: John/some person
      from: entry
      note: A name is inherently identifiable; some person is not.
  watch_for:
    - A learner might think the requires that the listener has seen the thing before, when shared knowledge or a lexicalized activity can also license it.
    - A learner might take the train in take the train as pointing to one specific train.
  activity: Give students short texts with the and a. They underline each, say whether the referent is new, given or identifiable from shared knowledge, and discuss any that don't fit.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: summary no longer says definiteness shows the speaker has a particular thing in mind (this dictionary allows the in take the train without a specific train) and now speaks of identifiability; the train example no longer calls the activity familiar; teacher terms no longer says the forms form a word class called deital determinatives and instead gives this dictionary''s wording (deital determiners, genitive NPs, bare proper nouns). Second round: fixed curious.summary to say these words can show identifiability (this dictionary allows the in take the train without an identifiable train) and curious.body to say the can mark the activity; fixed teacher.terms to list genitive noun phrases among the realizations of deital determiners, as this dictionary does, not as a separate alternative. Dismissed: the flag on ''The and a are determinatives'' (CGEL''s standard classification, presupposed by this dictionary''s account of the determiner function).'
