id: numerative-magnitude-head-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Hundred</i>, <i>thousand</i> and <i>million</i> as base amounts
  summary: <i>Hundred</i>, <i>thousand</i> and <i>million</i> are base amounts that other numbers can scale.
  body: |-
    Words like <i>hundred</i>, <i>thousand</i> and <i>million</i> stand for a base amount. In <i>two hundred</i>, the <i>two</i> scales that base: it says how many hundreds. This dictionary says such a word needs a number in front of it in most contexts.

    The same base can also be a plural noun. <i>Hundred</i> stays singular in <i>two hundred books</i>, but <i>hundreds of books</i> has a plural ending and an <i>of</i> phrase. The dictionary treats these as different uses of the same word. A base can also sit inside a longer number, as in <i>twelve thousand and forty-one</i>.
  examples:
    - text: two [hundred]
      from: entry
    - text: twelve [thousand] and forty-one
      from: entry
    - text: two hundred books and [hundreds] of books
      from: constructed
  try: Compare <i>two hundred books</i> with <i>hundreds of books</i>. Which one has a plural ending, and which one has an <i>of</i>?
teacher:
  summary: Shows how <i>hundred</i>, <i>thousand</i> and <i>million</i> work as the head of a number phrase, and how that differs from their plural noun uses.
  explain: A magnitude head is a determinative such as <i>hundred</i>, <i>thousand</i> or <i>million</i>, denoting a base value that can scale a quantity. It's the head of the magnitude phrase and licenses a factor modifier (<i>two hundred</i>). This dictionary says it requires a factor in most contexts. <i>Hundred</i> stays singular in exact <i>two hundred books</i> and supplies its scale. In <i>hundreds of books</i>, the same base is a plural count noun with an <i>of</i> dependent, which is a separate lexical use. The head can also appear inside an additive coordination (<i>twelve thousand and forty-one</i>). This dictionary marks the analysis as provisional.
  terms: Numeral is the traditional word for number words in general. This dictionary calls <i>hundred</i>, <i>thousand</i> and <i>million</i> magnitude determinatives when they head a number phrase.
  examples:
    - text: two [hundred]
      from: entry
    - text: twelve [thousand] and forty-one
      from: entry
  contrasts:
    - text: two [hundred] books
      from: constructed
      note: Exact quantity, singular magnitude head with a factor.
    - text: '[hundreds] of books'
      from: constructed
      note: Plural count noun with an <i>of</i> dependent.
  watch_for:
    - A learner might add a plural ending to <i>hundred</i> in <i>two hundred books</i>, as in <i>hundreds of books</i>, when the two uses differ.
    - A learner might treat <i>hundreds of books</i> as the same construction as <i>two hundred books</i>.
  activity: Students sort phrases such as <i>two hundred books</i>, <i>hundreds of books</i> and <i>twelve thousand</i> into exact quantities and plural noun uses, then say which has a factor in front.
