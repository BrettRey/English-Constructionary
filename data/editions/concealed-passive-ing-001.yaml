id: concealed-passive-ing-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Active-looking words with a passive meaning
  summary: After verbs like need, an -ing word can have a passive meaning even though it looks active.
  body: |-
    The hinge needs oiling means the hinge should be oiled. The word oiling looks active, but the hinge isn't doing the oiling. The hinge is understood as what someone oils.

    The longer way to say it shows the passive on the surface: The hinge needs to be oiled. In the -ing version, nothing marks the passive. Verbs like need, want and require can take this kind of complement. The meaning of the passive is there, but its usual wording is hidden.
  examples:
    - text: The hinge [needs oiling].
      from: entry
    - text: The hinge [needs to be oiled].
      from: entry
  try: Say The hinge needs oiling and The hinge needs to be oiled. Do they mean the same thing?
teacher:
  summary: Helps explain why needs oiling means needs to be oiled, with no passive marking.
  explain: 'After a licensing verb such as need, want or require, a gerund-participial complement can have a passive interpretation while keeping active form: The hinge needs oiling. The hinge is understood as what someone oils. A to-infinitival with analogous meaning normally requires passive morphology, as in needs to be oiled, which displays the passive overtly. The gerund-participial version shows no passive marking.'
  terms: 'Gerund-participial: the -ing form of a verb. Concealed passive: this dictionary’s name for a passive meaning without passive form.'
  examples:
    - text: The hinge [needs oiling].
      from: entry
    - text: The hinge [needs to be oiled].
      from: entry
  contrasts:
    - text: The hinge needs oiling.
      from: entry
      note: Active form, passive meaning.
    - text: The hinge needs to be oiled.
      from: entry
      note: The infinitival counterpart shows the passive overtly.
  watch_for:
    - A learner might think the hinge does the oiling, when it is understood as what someone oils.
    - A learner might look for be and a past participle in needs oiling and conclude there is no passive meaning.
  activity: Students rewrite sentences like The hinge needs oiling as needs to be oiled, then say who does the action in each and whether the sentence names them.
child:
  hook: Who does the oiling in The hinge needs oiling?
  explain: Sometimes a word ending in -ing has a hidden meaning. The hinge needs oiling means someone should oil the hinge. The hinge doesn't oil itself.
  examples:
    - text: The hinge [needs oiling].
      from: entry
    - text: My bike [needs washing].
      from: constructed
  play: Say each one the longer way. The hinge needs to be oiled. My bike needs to be washed. Make one for something in your room.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
