id: denominator-numeral-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>A ten</i>, <i>three tens</i>"
  summary: A number word can work like an ordinary noun, naming an instance of a number such as a score.
  body: |-
    In <i>I rolled a ten</i>, the word <i>ten</i> isn't counting anything. It names a score of ten. It behaves like an ordinary noun: it has a determiner, <i>a</i>, and it can be plural, as in <i>She drew three tens</i>.

    <i>Three tens</i> means three instances of the value ten, not ten objects. The same works for ratings, as in <i>That's a perfect ten</i>. This dictionary treats the analysis as provisional.
  examples:
    - text: I rolled [a ten].
      from: entry
    - text: She drew [three tens].
      from: entry
    - text: That's [a perfect ten].
      from: entry
  try: Think of a game or contest with scores. How would you name a score of seven as an item, with <i>a</i> before it?
teacher:
  summary: Helps explain number words used as count nouns, such as <i>a ten</i> and <i>three tens</i>.
  explain: 'In this use, a cardinal functions as a noun denoting a token or instance of a numeral (a score, a label, a written symbol), not an abstract number. It behaves as a count noun: it takes determiners and plural morphology. <i>I rolled three tens</i> describes three tokens of the value ten, not a count of ten objects. The noun takes its own plural marking and appears under a separate cardinal determinative, as in <i>three tens</i>. The analysis is provisional.'
  terms: Cardinal here is a noun, not the determinative use of a number as in <i>three dogs</i>.
  examples:
    - text: I rolled [a ten].
      from: entry
    - text: She drew [three tens].
      from: entry
    - text: That's [a perfect ten].
      from: entry
  contrasts:
    - text: I rolled three tens.
      from: entry
      note: Three tokens of the value ten.
    - text: I rolled ten dice.
      from: constructed
      note: "<i>Ten</i> is a determinative counting objects."
  watch_for:
    - A learner might read <i>three tens</i> as ten objects counted three times, when it means three tokens of the value ten.
    - A learner might think a cardinal cannot take a plural ending when it is used as a noun.
  activity: Students play a dice or card game and describe their results with a number noun (<i>I rolled a six</i>, <i>I drew two fives</i>). They then say whether the number counts objects or names a score.
child:
  hook: Can a number word have a plural, like <i>tens</i>?
  explain: A number can name a score or a card. <i>I rolled a ten</i>. You can even add an s, as in <i>three tens</i>. That means three of them, each one a ten.
  examples:
    - text: I rolled [a ten].
      from: entry
    - text: She drew [three tens].
      from: entry
  play: Roll two dice or draw cards a few times. Describe each result with a number word, like <i>a six</i>. If you get the same number twice, give it an s.
