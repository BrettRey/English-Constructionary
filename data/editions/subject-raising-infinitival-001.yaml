id: subject-raising-infinitival-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Sentences where the subject belongs to the next verb
  summary: With verbs like <i>seem</i>, the subject of the sentence really belongs to the <i>to</i>-phrase that follows.
  body: |-
    In <i>There seems to be a leak</i>, the word <i>there</i> can't be doing anything of its own. It is the subject because the <i>to</i>-phrase, <i>to be a leak</i>, selects it. The verb <i>seems</i> gives an assessment of what follows.

    That's why <i>Jo seems to have checked the lock</i> and <i>The lock seems to have been checked by Jo</i> describe the same thing that seems to hold. The subordinate event is what's being assessed.

    This dictionary marks the analysis as provisional and bases it on constructed illustrations.
  examples:
    - text: '[There seems to be a leak].'
      from: entry
    - text: '[Jo seems to have checked the lock].'
      from: entry
    - text: The lock seems to have been checked by Jo.
      from: entry
  try: Say <i>Jo seems to have checked the lock</i>. Then say <i>The lock seems to have been checked by Jo</i>. Does what seems to be the case change?
teacher:
  summary: Useful for contrasting seem-type verbs with promise-type verbs and for showing why dummy there works with them.
  explain: The pattern combines a verbal assessment or aspectual predicate with a subject selected through its complement. Two tests show it. Dummy <i>there</i> is acceptable (<i>There seems to be a leak</i>), and active and passive descriptions of the subordinate event preserve what seems to hold (<i>Jo seems to have checked the lock</i>; <i>The lock seems to have been checked by Jo</i>). Subject control, as in <i>Jo promised to return</i>, differs on both counts. This dictionary treats the analysis as provisional and bases it on constructed illustrations.
  terms: Subject raising is this dictionary's name for it. Sometimes called subject-to-subject raising. The contrast is with subject control.
  examples:
    - text: '[There seems to be a leak].'
      from: entry
    - text: '[Jo seems to have checked the lock].'
      from: entry
  contrasts:
    - text: Jo seems to have checked the lock.
      from: entry
      note: Active; the subordinate event is what seems to hold.
    - text: The lock seems to have been checked by Jo.
      from: entry
      note: The passive preserves what seems to hold.
    - text: Jo promised to return.
      from: constructed
      note: Control; <i>Jo</i> has a role in the promising.
  watch_for:
    - A learner might think the subject of <i>seems</i> is doing the seeming.
    - A learner might treat <i>seems to</i> and <i>promised to</i> as the same pattern, when only one allows dummy <i>there</i>.
  activity: Students try the dummy <i>there</i> and the passive tests on sets of verbs followed by <i>to</i>-phrases. They sort the verbs into those that pass both tests and those that do not.
checked:
  date: '2026-11-19'
