id: collective-numeral-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Counting and arranging in groups
  summary: A plural number word after <i>in</i> or <i>by</i> can tell how people or things are grouped.
  body: |-
    <i>In twos and threes</i> describes people arriving or being arranged in small groups. The number tells the size of each group, not the total. <i>People entered in threes</i> could be an enormous crowd, since <i>three</i> counts the members of each group.

    <i>Count by fives</i> uses a number for grouping too. <i>By the hundreds</i> works a little differently. It suggests large numbers, not batches of exactly one hundred.
  examples:
    - text: '[in twos and threes]'
      from: entry
    - text: '[by the hundreds]'
      from: entry
    - text: '[count by fives]'
      from: entry
  try: Say <i>People entered in threes</i>. Does <i>three</i> tell you how many people there were in all, or how many in each group?
teacher:
  summary: Useful for explaining plural number words that give group sizes after in or by.
  explain: 'In this construction a plural cardinal noun in a PP with <i>in</i> or <i>by</i> gives the size of groups, and the PP is an adverbial modifying the manner of the action (arriving <i>in twos and threes</i>). The cardinal noun is a common noun and takes plural morphology. <i>Three</i> counts the members of each group even though <i>threes</i> is grammatically plural. <i>By the hundreds</i> works differently: it can indicate large numbers without fixed groups, rather than batches of exactly one hundred.'
  terms: 'Cardinal noun: a number word used as a noun. Compare a cardinal determinative, as in <i>three people</i>.'
  examples:
    - text: '[in twos and threes]'
      from: entry
    - text: '[by the hundreds]'
      from: entry
    - text: '[count by fives]'
      from: entry
  contrasts:
    - text: People entered in threes.
      from: constructed
      note: "<i>Three</i> counts the members of each group; the crowd can be of any size."
    - text: Three people entered.
      from: constructed
      note: "<i>Three</i> counts the total."
  watch_for:
    - A learner might read <i>in threes</i> as a total of three people.
    - A learner might read <i>by the hundreds</i> as batches of exactly one hundred.
  activity: Students line up in twos, then in threes, and describe what happened using <i>in twos</i> and <i>in threes</i>. They then count aloud by fives and say what the number tells them.
child:
  hook: Can you count by fives?
  explain: A number can tell how big each group is. <i>In twos</i> means two at a time. <i>Count by fives</i> means you jump five each time.
  examples:
    - text: The children lined up [in twos].
      from: constructed
    - text: We [count by fives].
      from: entry
  play: Line up your friends in twos, then in threes. Say what you did with <i>in twos</i> and <i>in threes</i>.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
