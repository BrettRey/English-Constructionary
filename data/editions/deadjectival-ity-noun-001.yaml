id: deadjectival-ity-noun-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Nouns ending in -ity
  summary: Adding -ity to an adjective can name the quality it describes, sometimes changing how the word sounds.
  body: |-
    Curious is an adjective, and curiosity names the quality of being curious. Eccentric becomes eccentricity in the same way. The ending -ity typically puts the stress on the syllable just before it.

    The base word can change too, as in curious and curiosity, where the end of the word is altered. The -ness ending does something similar, but it typically leaves the base word's shape and stress as they were. Which adjectives take -ity depends on the adjective type.
  examples:
    - text: '[eccentricity]'
      from: entry
    - text: '[curiosity]'
      from: entry
  try: Say eccentric and then eccentricity out loud. Where does the strongest beat fall in each?
teacher:
  summary: Helps explain -ity nouns such as curiosity and eccentricity, including stress shift and changes to the base.
  explain: The pattern forms a common noun from an adjective plus -ity, sometimes with a stem alternation. The noun names a quality or state associated with the adjective. -ity typically stresses the syllable immediately before the ending. It may also alter the end of the base, as in curious and curiosity, and as in eccentric and eccentricity, where the final consonant changes. Formations cluster with particular adjective types. The corresponding -ness formation typically preserves the base's shape and stress, so the two suffixes behave differently. The analysis is provisional.
  terms: Traditional grammars call these abstract nouns formed by suffixation. This dictionary treats the output as a common noun.
  examples:
    - text: '[eccentricity]'
      from: entry
    - text: '[curiosity]'
      from: entry
  contrasts:
    - text: eccentric, eccentricity
      from: entry
      note: Stress shifts and the final consonant changes.
    - text: kind, kindness
      from: constructed
      note: '-ness keeps the base''s shape.'
  watch_for:
    - A learner might expect curiosity to keep the exact shape and stress of curious.
    - A learner might assume -ity and -ness are interchangeable on any adjective.
  activity: Give students adjective and noun pairs (curious, curiosity; kind, kindness). They mark the stressed syllable in each word and compare what -ity and -ness do to the base.
