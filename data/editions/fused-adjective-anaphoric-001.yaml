id: fused-adjective-anaphoric-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Leaving out the noun when it's obvious
  summary: A describing word with the can stand for a noun mentioned earlier, as in <i>the damp</i> for <i>the damp cloth</i>.
  body: |-
    In <i>I took the dry cloth and left the damp</i>, <i>the damp</i> means <i>the damp cloth</i>. The noun isn't repeated because the earlier word <i>cloth</i> makes it clear, and the describing word <i>damp</i> takes over the job of naming.

    The kind of thing comes from <i>cloth</i>, and any agreement follows the recovered noun. This is different from <i>the wealthy</i>, which refers to a group of people without needing an earlier noun to fill in.
  examples:
    - text: I took the dry cloth and left [the damp].
      from: entry
    - text: She chose the red scarf and I chose [the blue].
      from: constructed
  try: Say <i>I took the dry cloth and left the damp</i>. What exactly was left?
teacher:
  summary: Helps explain an adjective standing in for a noun recovered from context, and how it differs from <i>the wealthy</i>.
  explain: 'In an anaphoric fused-head NP, a determiner plus an adjective phrase distinguishes a referent while the descriptive noun is recoverable from context: <i>I took the dry cloth and left the damp</i>. The inferred kind comes from <i>cloth</i>, and agreement follows the recovered nominal. The human-class reading of <i>the wealthy</i> instead needs no such antecedent. This dictionary treats it as a specialization of the fused-head construction, related to the adjective NP and to pro-nominal <i>one</i>, and marks it provisional, with medium confidence.'
  terms: This is sometimes described as an adjective used as a noun. Fused head is this grammar's term for an NP whose head function is carried by another constituent, here the adjective.
  examples:
    - text: I took the dry cloth and left [the damp].
      from: entry
    - text: She chose the red scarf and I chose [the blue].
      from: constructed
  contrasts:
    - text: I took the dry cloth and left the damp.
      from: entry
      note: The noun is recovered from <i>cloth</i>.
    - text: I took the dry cloth and left the damp one.
      from: constructed
      note: Here <i>one</i> overtly stands in for <i>cloth</i>.
  watch_for:
    - A learner might treat <i>the damp</i> as a noun with no link to the earlier <i>cloth</i>.
    - A learner might expect <i>the wealthy</i> to need an earlier noun, when its human-class reading doesn't.
  activity: Students get sentences with two contrasting things (<i>the red car</i> and <i>the blue car</i>). They rewrite them without repeating the noun and underline what supplies the missing noun.
