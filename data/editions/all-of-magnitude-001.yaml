id: all-of-magnitude-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>All of</i> before a number
  summary: Putting <i>all of</i> before a stated amount draws attention to that amount, as if it were noteworthy.
  body: |-
    In <i>They had recruited all of fifty volunteers</i>, the number is the point. The phrase asks us to notice the amount, compared with what we expected. The direction of that comparison is left open in this dictionary.

    A word like <i>about</i> can still make the number inexact, as in <i>all of about five minutes</i>. This isn't the same as <i>all of the fifty volunteers</i>, which talks about a group that has already been identified, and covers all of them.
  examples:
    - text: They had recruited [all of fifty] volunteers.
      from: entry
    - text: '[all of about five minutes]'
      from: entry
    - text: '[all of about ten minutes]'
      from: entry
  try: Compare <i>all of fifty volunteers</i> with <i>all of the fifty volunteers</i>. Which one talks about a group we already know?
teacher:
  summary: For advanced classes, <i>all of</i> before a numeral, which highlights a magnitude, versus <i>all of the</i> plus a known group.
  explain: 'The pattern is <i>all of</i> plus an optional approximator plus a numeral expression, with no definite article after <i>of</i>. The numeral gives the measured or counted magnitude, and a distinct approximator such as <i>about</i> can still make it inexact. The effect is to call attention to the stated magnitude relative to an expectation. This dictionary says the direction of the evaluation remains open and could be tested by varying the expectation while holding the magnitude fixed. <i>All of the fifty volunteers</i> is different: it quantifies over a separately identified group. This dictionary rates its own confidence low.'
  terms: This dictionary treats the numeral as supplying the magnitude independently of the <i>all of</i> expression.
  examples:
    - text: They had recruited [all of fifty] volunteers.
      from: entry
    - text: '[all of about five minutes]'
      from: entry
  contrasts:
    - text: They had recruited all of fifty volunteers.
      from: entry
      note: A magnitude, with no article after <i>of</i>.
    - text: They had recruited all of the fifty volunteers.
      from: constructed
      note: A separately identified group.
  watch_for:
    - A learner might read <i>all of fifty volunteers</i> as <i>all of</i> an already identified group, when the numeral gives the magnitude.
    - A learner might think <i>about</i> is incompatible with <i>all of</i> before a number, when <i>all of about five minutes</i> appears in this dictionary’s examples.
  activity: Students write two sentences, one with <i>all of</i> plus a number and one with <i>all of the</i> plus a number and a group. They then say what each one is about, the amount or the group.
