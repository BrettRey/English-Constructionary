id: come-with-motion-participial-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Came running, came roaring
  summary: <i>Come</i> followed by an <i>-ing</i> word can show how someone approached or what sound came with the movement.
  body: |-
    In <i>Sally came running excitedly into the room</i>, <i>running</i> tells us how she arrived. In <i>came roaring past</i>, from a description of tanks, <i>roaring</i> is a sound heard during the movement, and <i>past</i> shows the path.

    The one who comes takes part in both the motion and the activity or sound. Compare <i>came looking for us</i>. There the <i>-ing</i> word can instead describe a purpose: <i>they came in order to look for us</i>.
  examples:
    - text: Sally [came running excitedly into the room].
      from: entry
    - text: '[came roaring past]'
      from: entry
  try: Say <i>came running</i> and then <i>came looking for us</i>. In which one does the <i>-ing</i> word tell how someone moved, and in which can it tell why they came?
teacher:
  summary: Helps students see <i>come</i> plus an <i>-ing</i> word as manner or sound of movement, and tell it apart from a purpose reading.
  explain: In this pattern the head verb <i>come</i> is followed by a V-ing expression and optionally a path expression. In <i>came running</i>, <i>running</i> supplies the manner. In <i>came roaring past</i>, <i>roaring</i> supplies sound during the movement and <i>past</i> supplies the path; the path describes the movement, not the direction of the sound. The subject participates in the motion and in the activity or sound. A goal expression can also specify the destination. In <i>came looking for us</i> the participial can instead describe a purpose, a reading outside this pattern.
  terms: 'V-ing form: the gerund-participial in CGEL, called the present participle in traditional grammar. Path and goal expressions are related to the goal complement entry.'
  examples:
    - text: Sally [came running excitedly into the room].
      from: entry
    - text: '[came roaring past]'
      from: entry
  contrasts:
    - text: Sally came running into the room.
      from: constructed
      note: <i>Running</i> is the manner of arrival.
    - text: They came looking for us.
      from: constructed
      note: The participial can describe a purpose instead.
  watch_for:
    - A learner might read <i>came running</i> as two separate events, coming and then running, when <i>running</i> describes how the coming happens.
    - A learner might read the <i>-ing</i> word as a purpose, as in <i>came looking for us</i>, when it supplies manner or sound.
    - A learner might take <i>past</i> in <i>came roaring past</i> as the direction of the sound, when it describes the movement.
  activity: Students act out <i>came running</i>, <i>came dancing</i> and <i>came looking for us</i>. The class decides whether the <i>-ing</i> word tells how someone moved or why they came.
child:
  hook: What do you notice about the word after <i>came</i> in <i>Sally came running into the room</i>?
  explain: You can add a word ending in <i>-ing</i> after <i>came</i>. It can tell how someone moved. <i>Sally came running into the room</i>.
  examples:
    - text: Sally [came running excitedly into the room].
      from: entry
    - text: The dog [came running into the kitchen].
      from: constructed
  play: Act out <i>came running</i>, <i>came hopping</i> and <i>came skipping</i>. Which word tells you how the person moved?
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: "Fixed: child.hook no longer asks for 'hurry' with only came (the entry says nothing of hurry) and now asks about the word after came; curious text now says the -ing word can describe a purpose in came looking for us, as the entry puts it; replaced 'this entry' in teacher text. Frequency pass: teacher.activity came skipping (skip about 3,300th in SUBTLEX-UK, counting its other forms) replaced by came dancing; child play unchanged."
