id: irrealis-were-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>I wish I were taller</i>
  summary: In some wishing and imagining sentences, a form of <i>be</i>, <i>were</i>, appears with <i>I</i> or with <i>he</i>, <i>she</i> or <i>it</i>.
  body: |-
    In <i>I wish I were taller</i>, <i>were</i> is the form of <i>be</i> used with <i>I</i>. The sentence is about something that isn't the case. This distinct form is called irrealis, and it shows up in the first and third person singular.

    With remote <i>if</i>, <i>was</i> may also be used by many speakers. But in <i>Were I taller</i>, where <i>were</i> comes before the subject, <i>was</i> fails in standard usage.
  examples:
    - text: I wish [I were taller].
      from: entry
    - text: '[Were I taller], I''d reach the shelf.'
      from: constructed
  try: Say <i>I wish I were taller</i>. Then think of another wish beginning <i>I wish she...</i> Which form of <i>be</i> fits?
teacher:
  summary: Explains the irrealis <i>were</i> that remains in first and third person singular clauses.
  explain: This dictionary treats <i>were</i> as a distinct irrealis form of <i>be</i>, realized in the first or third person singular in selected remote environments, as in <i>I wish I were taller</i>. Remote <i>if</i> may also have <i>was</i>, for many speakers. The matrix-like <i>were</i> in <i>Were I taller</i> is licensed under inversion, where replacing it by <i>was</i> fails in standard usage. It relates this to <i>if</i>-conditionals and to the inverted conditional, and marks the analysis as provisional.
  terms: Sometimes called the subjunctive <i>were</i>. This dictionary calls it a distinct irrealis form of <i>be</i>.
  examples:
    - text: I wish [I were taller].
      from: entry
    - text: '[Were I taller], I''d reach the shelf.'
      from: constructed
  contrasts:
    - text: I wish I were taller.
      from: entry
      note: Irrealis <i>were</i> with <i>I</i>.
    - text: If I were taller, I'd reach the shelf.
      from: constructed
      note: Remote <i>if</i>; <i>was</i> may also occur.
  watch_for:
    - A learner might think <i>were</i> is plural-only and cannot be used with <i>I</i>.
    - A learner might be unsure which of <i>were</i> and <i>was</i> to use after remote <i>if</i>.
  activity: Students complete <i>I wish...</i> and <i>If I...</i> sentences about things that aren't so. They underline the form of <i>be</i> and compare it with the plain past in real past-time sentences.
child:
  hook: How could you finish the wish "<i>I wish I were ...</i>"?
  explain: Sometimes we say <i>were</i> with <i>I</i>. <i>I wish I were taller</i>. It's a wish about something that isn't true right now.
  examples:
    - text: I wish [I were taller].
      from: entry
    - text: I wish [I were a bird].
      from: constructed
  play: Make wishes that start with <i>I wish I were</i>. Then say what you'd do if the wish came true.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
