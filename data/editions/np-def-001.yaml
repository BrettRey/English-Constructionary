id: np-def-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Phrases that point to a particular thing
  summary: Phrases like <i>the dog</i>, <i>she</i> or <i>London</i> can pick out something particular that the listener can work out.
  body: |-
    In <i>The dog barked</i>, the phrase <i>the dog</i> points to one particular dog that the listener can identify from the situation. The same kind of phrase can stand for a whole group the context makes clear, as in <i>The students passed</i>, or for the one person holding a role, as in <i>The CEO resigned</i>.

    It can also talk about a whole kind, as in <i>The dodo is extinct</i>. Not every use points to a single physical thing: in <i>Jo listened to the radio</i>, the phrase can have a conventional activity reading without picking out one particular radio.
  examples:
    - text: '[The dog] barked.'
      from: entry
    - text: '[The students] passed.'
      from: entry
    - text: '[The CEO] resigned.'
      from: entry
    - text: '[The dodo] is extinct.'
      from: entry
  try: Say <i>The dog barked</i> to someone who doesn't know about any dog. What do they ask you?
teacher:
  summary: Lays out the meanings of definite NPs, from an identifiable referent to a role or a kind, and shows where they can be weaker.
  explain: 'A definite NP consists of a definite determiner (<i>the</i>, <i>this</i>, <i>that</i>, a dependent genitive pronoun, or a genitive NP) with a nominal, or a referential personal pronoun, or a bare proper-name NP. The dictionary lists readings: an identifiable instance (<i>The dog barked</i>), a maximal set delimited by context (<i>The students passed</i>), a unique role (<i>The CEO resigned</i>), a kind (<i>The dodo is extinct</i>) and a generally characteristic property (<i>The lion is dangerous</i>). <i>The keys</i> normally identifies an accessible set and can supply a domain in <i>two of the keys</i>, but in <i>Jo listened to the radio</i> a conventional activity reading doesn''t identify one radio. The dictionary marks this account as provisional.'
  terms: "<i>The</i> is a determinative, often called the definite article. Weak definite is a name used for cases like <i>the radio</i> in <i>Jo listened to the radio</i>, which can have a conventional activity reading without identifying one physical radio."
  examples:
    - text: '[The dog] barked.'
      from: entry
    - text: She is [the winner].
      from: entry
    - text: '[The students] passed.'
      from: entry
    - text: '[The CEO] resigned.'
      from: entry
    - text: '[The dodo] is extinct.'
      from: entry
    - text: '[The lion] is dangerous.'
      from: entry
  contrasts:
    - text: '[A dog] barked.'
      from: constructed
      note: The indefinite alternative; the dog's identity is left unstated.
  watch_for:
    - A learner might think <i>the</i> has to point to one specific physical thing.
    - A learner might treat <i>the dodo</i> and <i>the lion</i> as naming one animal when they name a kind.
  activity: Give students short story openings. They underline each definite NP and say what the listener is expected to identify (a thing, a group, a role or a kind).
