id: indefinite-rate-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Fifty miles an hour</i>
  summary: Putting <i>a</i> or <i>an</i> before a unit, as in <i>$20 a yard</i>, turns an amount into a rate.
  body: |-
    In <i>He was going at 50 miles an hour</i>, the words <i>an hour</i> don't mean one particular hour. They say what the <i>50 miles</i> is measured against, so the whole phrase gives a speed. The same pattern gives a price, as in <i>$20 a yard</i>, and a frequency, as in <i>twice a day</i>.

    The speed holds even if the trip lasts only a minute. <i>Fifty miles every hour</i> is different: it can claim fifty miles in each successive hour. A phrase with <i>per</i> can often say the same thing, and it copes better with longer or stacked units.
  examples:
    - text: He was going at [50 miles an hour].
      from: entry
    - text: It costs [$20 a yard].
      from: entry
    - text: The nurse checked it [twice a day].
      from: entry
  try: How would you say what a bicycle costs for each hour you rent it, using <i>a</i> and <i>an hour</i> or <i>a day</i>?
teacher:
  summary: Covers rates like <i>fifty miles an hour</i>, where <i>a</i> or <i>an</i> plus a unit expresses a ratio.
  explain: 'The pattern pairs a quantity or frequency expression with a noun phrase made of <i>a</i> or <i>an</i> and a singular unit noun. It expresses a ratio: a numerator over a unit denominator. <i>Fifty miles an hour</i> gives a speed even if the motion lasts only a minute, whereas <i>fifty miles every hour</i> can assert successive hourly totals. The same form supports price, salary and frequency. The second noun phrase is interpreted as a unit denominator, and the construction describes a rate without asserting one complete occurrence of that unit. A <i>per</i>-phrase can often express the same ratio and is more flexible with stacked or complex denominators.'
  terms: Sometimes called a distributive use of <i>a</i>/<i>an</i>. The <i>a</i>/<i>an</i> here is the indefinite article in traditional terms, a determinative in CGEL terms.
  examples:
    - text: He was going at [50 miles an hour].
      from: entry
    - text: It costs [$20 a yard].
      from: entry
    - text: The nurse checked it [twice a day].
      from: entry
  contrasts:
    - text: He was going at 50 miles an hour.
      from: entry
      note: A rate, whatever the length of the trip.
    - text: He drove 50 miles every hour.
      from: constructed
      note: Can assert successive hourly totals.
  watch_for:
    - A learner might read <i>an hour</i> in <i>fifty miles an hour</i> as one particular hour.
    - A learner might assume the trip must last a whole hour for <i>fifty miles an hour</i> to be true.
  activity: Students collect rates from signs, menus and timetables (<i>price a kilo</i>, <i>trains an hour</i>). They say each aloud with <i>a</i> or <i>an</i>, then restate it with <i>per</i>.
child:
  hook: How fast does a car go in "<i>fifty miles an hour</i>"?
  explain: Sometimes <i>a</i> means "for each." <i>Fifty miles an hour</i> means fifty miles for each hour. A yard of ribbon at <i>$20 a yard</i> costs $20 for each yard.
  examples:
    - text: The car went [50 miles an hour].
      from: constructed
    - text: It costs [$20 a yard].
      from: entry
    - text: The nurse checked it [twice a day].
      from: entry
  play: Find prices and speeds on signs or packages. Say each one with <i>a</i> or <i>an</i>, such as <i>three dollars a bag</i>. Then say what it means with for each.
