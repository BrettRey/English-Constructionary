id: complement-it-extraposition-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Putting <i>it</i> first and the clause last
  summary: A verb can take <i>it</i> right after the verb and put the real content in a clause at the end.
  body: |-
    In <i>We found it surprising that the lights were on</i>, the word <i>it</i> comes right after <i>found</i>, then comes <i>surprising</i>, and the clause <i>that the lights were on</i> comes last. The clause says what was surprising.

    Here <i>it</i> holds the place after the verb and doesn't point back to anything mentioned before. The content comes at the end instead. Putting the clause straight after <i>found</i> and moving the describing word to the end is heavily degraded.
  examples:
    - text: We [found it surprising that the lights were on].
      from: entry
  try: Say <i>We found it surprising that the lights were on</i>. What does <i>it</i> stand for in that sentence?
teacher:
  summary: Useful for explaining object <i>it</i> with an extraposed <i>that</i>-clause after a predicative complement.
  explain: 'In this verb phrase, a verb is followed by <i>it</i> in object position, then a predicative or other complement, and finally a content clause: <i>found it surprising that the lights were on</i>. <i>It</i> fills the object slot and need not refer to a previous noun phrase. The content clause, placed last, gives the propositional content. The corresponding order with the clause directly after the verb (<i>found that the lights were on surprising</i>) is heavily degraded.'
  terms: 'Extraposition: moving a content clause to the end, with <i>it</i> in its place. Content clause: a clause that gives propositional content, such as <i>that the lights were on</i>.'
  examples:
    - text: We [found it surprising that the lights were on].
      from: entry
  contrasts:
    - text: We found it surprising that the lights were on.
      from: entry
      note: <i>It</i> is in object position, the content clause is last.
    - text: We found the news surprising.
      from: constructed
      note: An ordinary noun phrase object with a predicative complement and no content clause.
  watch_for:
    - A learner might look for an earlier noun phrase that <i>it</i> refers to, when <i>it</i> need not refer to one.
    - A learner might put the content clause right after the verb, which is heavily degraded in this pattern.
  activity: Give students sentences like <i>We found it surprising that the lights were on</i>. They underline <i>it</i>, the complement and the content clause, and say what the content clause tells you.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
