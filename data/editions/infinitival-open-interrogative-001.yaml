id: infinitival-open-interrogative-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Which route to take</i>
  summary: A question word followed by <i>to</i> and a verb, as in <i>which route to take</i>, presents an open choice about something that could be done.
  body: |-
    In <i>They discussed which route to take</i>, the part after <i>discussed</i> is a question with <i>to</i> and a verb instead of a full clause. <i>Which route</i> fills in what's missing after <i>take</i>.

    The question is about an action that's being considered, not one that has been carried out. A full finite question can ask instead what was actually done, so the two forms can ask different things.
  examples:
    - text: They discussed [which route to take].
      from: entry
    - text: She asked [where to park].
      from: constructed
  try: Finish the sentence We can't decide... with a question word and <i>to</i> plus a verb.
teacher:
  summary: Covers embedded questions such as <i>which route to take</i>, which have a question phrase and a <i>to</i>-infinitival.
  explain: The pattern is an interrogative phrase followed by a <i>to</i>-infinitival with a linked gap. It presents an unresolved choice about an envisaged action. In <i>They discussed which route to take</i>, <i>which route</i> supplies the missing object of <i>take</i>, and the action is prospective or modal. The corresponding finite question can ask instead what was actually done. This dictionary treats the pattern as a specialization of the open interrogative clause and relates it to <i>for</i>-infinitivals. It is provisional.
  terms: Sometimes called an infinitival wh-question or an embedded infinitival interrogative.
  examples:
    - text: They discussed [which route to take].
      from: entry
    - text: She asked [where to park].
      from: constructed
  contrasts:
    - text: They discussed which route to take.
      from: entry
      note: An envisaged action, still undecided.
    - text: They discussed which route they took.
      from: constructed
      note: A finite question can ask what was actually done.
  watch_for:
    - A learner might read <i>which route to take</i> as asking about a past action.
    - A learner might treat <i>which route</i> as separate from the verb <i>take</i>, when it supplies the missing object of <i>take</i>.
  activity: Students complete sentences that start with <i>I don't know</i>, using a question word plus to and a verb. They then rewrite each with a finite clause and compare the meanings.
