id: immediate-following-no-sooner-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: No sooner ... than
  summary: No sooner ... than presents one event as following almost at once after another.
  body: |-
    In No sooner had we parked than the rain started, the rain starts almost as soon as the parking is done. The sentence starts with no sooner, and the helper word had comes before we.

    The second part begins with than, which brings in the later event. Placing no sooner first is what brings in the changed word order in the first part.
  examples:
    - text: '[No sooner had we parked than the rain started].'
      from: entry
  try: Say something that happened right after something else, beginning with No sooner had ...
teacher:
  summary: For advanced classes, a fronted negative expression with inverted order, and a than-clause for the later event.
  explain: 'The pattern is No sooner plus an inverted primary clause, then than plus a second clause: No sooner had we parked than the rain started. It presents one event as occurring almost immediately after another. The comparative-shaped than-clause supplies the subsequent event. Fronted no sooner licenses inversion in the initial clause. This dictionary relates the pattern to negative-initial inversion and marks it as provisional.'
  terms: Subject-auxiliary inversion is the usual textbook name for the word order in the first part.
  examples:
    - text: '[No sooner had we parked than the rain started].'
      from: entry
  watch_for:
    - A learner might leave the first clause in ordinary order after no sooner, instead of inverting it as had we parked.
    - A learner might replace than with another word in the second part.
  activity: Give students pairs of events in time order. They combine each with No sooner ... than, then say aloud which event came first.
checked:
