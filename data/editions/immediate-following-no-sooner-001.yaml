id: immediate-following-no-sooner-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>No sooner ... than</i>
  summary: <i>No sooner ... than</i> presents one event as following almost at once after another.
  body: |-
    In <i>No sooner had we parked than the rain started</i>, the rain starts almost as soon as the parking is done. The sentence starts with <i>no sooner</i>, and the helper word <i>had</i> comes before <i>we</i>.

    The second part begins with <i>than</i>, which brings in the later event. Placing <i>no sooner</i> first is what brings in the changed word order in the first part.
  examples:
    - text: '[No sooner had we parked than the rain started].'
      from: entry
  try: Say something that happened right after something else, beginning with <i>No sooner had ...</i>
teacher:
  summary: For advanced classes, a fronted negative expression with inverted order, and a <i>than</i>-clause for the later event.
  explain: 'The pattern is <i>No sooner</i> plus an inverted primary clause, then <i>than</i> plus a second clause: <i>No sooner had we parked than the rain started</i>. It presents one event as occurring almost immediately after another. The comparative-shaped <i>than</i>-clause supplies the subsequent event. Fronted <i>no sooner</i> licenses inversion in the initial clause. This dictionary relates the pattern to negative-initial inversion and marks it as provisional.'
  terms: Subject-auxiliary inversion is the usual textbook name for the word order in the first part.
  examples:
    - text: '[No sooner had we parked than the rain started].'
      from: entry
  watch_for:
    - A learner might leave the first clause in ordinary order after <i>no sooner</i>, instead of inverting it as <i>had we parked</i>.
    - A learner might replace <i>than</i> with another word in the second part.
  activity: Give students pairs of events in time order. They combine each with <i>No sooner ... than</i>, then say aloud which event came first.
