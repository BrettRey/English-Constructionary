id: experiential-perfect-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Asking whether something has ever happened
  summary: A <i>have</i> plus past-participle sentence can place earlier happenings within a stretch of time that matters now.
  body: |-
    <i>Have you ever driven a bus?</i> asks whether at least one earlier occasion fits. The speaker isn't asking about a particular day. The word <i>ever</i> can ask about any occurrence before the time of speaking.

    Compare <i>Did you drive the bus yesterday?</i> Once the occasion is finished and has a definite date, the simple past is the natural choice. So <i>have</i> plus a verb like <i>driven</i> fits the experience question, and <i>did drive</i> fits the dated one.
  examples:
    - text: '[Have you ever driven] a bus?'
      from: entry
    - text: '[Did you drive the bus yesterday?]'
      from: entry
  try: Ask a friend <i>Have you ever ...</i> about something they might have done. Then ask about one particular day. Which verb form fits each question?
teacher:
  summary: Helps explain when the present perfect asks about experience and when the simple past is used for a dated occasion.
  explain: The experiential perfect (perfect <i>have</i> plus a past-participial VP) places one or more previous occurrences within a time span understood as relevant now. <i>Ever</i> can ask about any occurrence before the reference time. A finished, explicitly dated occasion normally favours the simple preterite over the present perfect in the standard contrast. This dictionary marks the analysis as provisional, with medium confidence, and cites CGEL on the perfect.
  terms: Present perfect of experience is a common textbook label. The simple preterite is the simple past.
  examples:
    - text: '[Have you ever driven] a bus?'
      from: entry
  contrasts:
    - text: Have you ever driven a bus?
      from: entry
      note: Any earlier occasion counts.
    - text: Did you drive the bus yesterday?
      from: entry
      note: A specific dated occasion; the simple preterite is natural.
  watch_for:
    - A learner might combine the present perfect with an explicit past date like <i>yesterday</i>, when the simple preterite is the natural choice.
    - A learner might read <i>Have you ever driven a bus?</i> as asking about right now rather than any earlier time.
  activity: Students interview each other with <i>Have you ever ...?</i> questions. When a partner says yes, they ask a follow-up about one particular occasion, and note which verb form each question needs.
child:
  hook: How do you ask if someone has done something at least once?
  explain: <i>Have you ever driven a bus?</i> asks if you did it at some time before now. It doesn't ask when. If you ask about yesterday, you say <i>Did you drive the bus yesterday?</i>
  examples:
    - text: '[Have you ever driven] a bus?'
      from: entry
    - text: '[Did you drive the bus yesterday?]'
      from: entry
    - text: '[Have you ever ridden] a horse?'
      from: constructed
  play: Ask three friends <i>Have you ever ...</i> about animals, places or foods. Then ask one of them about a single day with <i>Did you ... yesterday?</i>
checked:
