id: quotative-inversion-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Said the clerk
  summary: After a quotation, the verb of speaking can come before the speaker.
  body: |-
    In “I can explain,” said the clerk, the verb said comes first and the clerk, who is speaking, follows. It reports the words just quoted, and it can come after or within the quotation.

    This dictionary says full noun phrases such as the clerk readily follow the verb. Plain personal pronouns usually come first in neutral modern prose, though literary variants with the verb first occur. This dictionary marks the account as provisional.
  examples:
    - text: “I can explain,” [said the clerk].
      from: entry
  try: Look at some dialogue in a book you're reading. Find a quotation followed by said and a name or a noun. Does the verb come first?
teacher:
  summary: Explains why a reporting verb can come before its subject after direct speech.
  explain: 'In quotative inversion the reporting verb comes before its subject after or within direct speech: “I can explain,” said the clerk. Full NP subjects readily follow the verb. Plain personal pronouns usually precede it in contemporary neutral prose, though literary inverted variants occur. This dictionary marks the analysis provisional and notes the link with the subject-dependent inversion family.'
  terms: Sometimes called 'speech-verb inversion'; this dictionary calls it quotative inversion.
  examples:
    - text: “I can explain,” [said the clerk].
      from: entry
  contrasts:
    - text: “I can explain,” the clerk said.
      from: constructed
      note: The same report with the subject before the verb.
  watch_for:
    - A learner might think said the clerk is a question because the verb comes first.
    - A learner might use the inverted order with a plain pronoun in everyday writing.
  activity: Students take dialogue from a story and rewrite each quotation tag with the verb first and then with the subject first, comparing how each reads.
child:
  hook: Why does the speaker come second in a story?
  explain: In stories, a person's words can be followed by a speaking word and then the speaker. In “I can explain,” said the clerk, the word said comes before the clerk.
  examples:
    - text: “I can explain,” [said the clerk].
      from: entry
    - text: “Come in,” [said the teacher].
      from: constructed
  play: Open a story and find some speech. Does the speaker come before or after the speaking word? Rewrite one to flip the order.
