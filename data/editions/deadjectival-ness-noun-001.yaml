id: deadjectival-ness-noun-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Nouns ending in <i>-ness</i>
  summary: Adding <i>-ness</i> to an adjective makes a noun naming the property or state the adjective describes.
  body: |-
    <i>Clear</i> is an adjective, and <i>clearness</i> names the property of being clear. In <i>the clearness of the recording</i>, the noun phrase talks about how clear the recording is. The same works with <i>awkward</i> and <i>awkwardness</i>.

    A regular <i>-ness</i> noun keeps the stress of the base word. New formations can generally be understood if the adjective is familiar, though some <i>-ness</i> words have specialized meanings of their own. The <i>-ity</i> ending competes with it: both can make property nouns, as in <i>kindness</i> and <i>opacity</i>, and <i>-ity</i> can change the base.
  examples:
    - text: '[the clearness of the recording]'
      from: entry
    - text: '[unexpected awkwardness]'
      from: entry
  try: Choose an adjective for how you feel today and add <i>-ness</i>. Does the new word make sense?
teacher:
  summary: Helps explain <i>-ness</i> nouns such as <i>kindness</i>, and how they differ from <i>-ity</i> nouns.
  explain: 'The pattern forms a common noun from an adjective plus <i>-ness</i>, naming a property or state characterized by the adjective. The regular formation preserves the stress of the base. Novel formations are generally interpretable given a recognizable adjective, although some derivatives lexicalize specialized readings. Competing <i>-ity</i> may shift stress or alter the base: both suffixes can create property nouns, as in <i>kindness</i> and <i>opacity</i>, and the adjective base constrains the choice of suffix.'
  terms: These are sometimes treated under abstract nouns, a broader label. This dictionary treats the output as a common noun.
  examples:
    - text: '[the clearness of the recording]'
      from: entry
    - text: '[unexpected awkwardness]'
      from: entry
  contrasts:
    - text: kindness
      from: constructed
      note: '<i>-ness</i> noun, built on <i>kind</i>.'
    - text: ability
      from: constructed
      note: '<i>-ity</i> forms a property noun and can alter the base.'
  watch_for:
    - A learner might think <i>-ness</i> and <i>-ity</i> can be swapped on any adjective.
    - A learner might assume every <i>-ness</i> noun means only the adjective's quality, when some have specialized readings.
  activity: Students list familiar adjectives and add <i>-ness</i> to each, using the new nouns in sentences such as "<i>The ___ of the ___ surprised us.</i>" They mark which words, if any, also have an <i>-ity</i> partner.
child:
  hook: What do you call being kind? What about being clear?
  explain: You can add <i>-ness</i> to a describing word to name the quality. <i>Kind</i> becomes <i>kindness</i>. <i>Kind</i> is still right there inside <i>kindness</i>.
  examples:
    - text: I liked [the clearness of the recording].
      from: constructed
    - text: Everyone noticed her [kindness].
      from: constructed
  play: Pick five describing words, like soft, bright and sad. Add <i>-ness</i> to each and use it in a sentence. Which new word is your favourite?
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: kindness (-ness) and opacity (-ity) no longer presented as examples of what -ity does; stress preservation stated of regular -ness formations; child line no longer claims the whole pronunciation is kept; child example with added words relabelled constructed; ''abstract nouns'' flagged as a broader label. Dismissed: none. Frequency pass: teacher.summary now names kindness instead of clearness and awkwardness (about 91,500th and 37,200th in SUBTLEX-UK); constructed -ity contrast opacity (about 97,100th) replaced by ability; teacher.explain still quotes the entry''s kindness and opacity; entry examples unchanged.'
