id: god-knows-indeterminate-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>God knows what</i>"
  summary: A phrase like <i>God knows what</i>, placed inside a larger phrase, marks something as unknown or left unspecified, often with feeling.
  body: |-
    In <i>They packed God knows what in these boxes</i>, the speaker doesn't say what the items were. In <i>He filed goodness knows how many pages</i>, the number of pages is the unknown value. Both put the phrase right inside the object and mark an open value with emphasis.

    This dictionary lists variants with <i>Heaven</i>, <i>the Lord</i> and <i>goodness</i> in place of <i>God</i>. A separate sentence such as <i>God knows how many pages he filed</i> can also make a literal claim about who knows, so what the phrase does depends on where it sits.
  examples:
    - text: They packed [God knows what] in these boxes.
      from: entry
    - text: He filed [goodness knows how many pages].
      from: entry
    - text: She put [God knows what] in the soup.
      from: entry
  try: 'Finish this sentence with your own version: <i>She bought heaven knows ...</i> Does the phrase stand in for a missing item or amount?'
teacher:
  summary: Mostly for advanced classes, an idiomatic stance formula that fills a slot for an unknown item or amount.
  explain: 'The pattern is a fixed authority expression plus <i>knows</i> plus an indeterminate expression such as <i>what</i> or <i>how many</i>, placed inside an argument or modifier: <i>God knows what</i> in <i>They packed God knows what in these boxes</i>. It marks a value as unknown or left unspecified, often with an emphatic stance. Variants use <i>Heaven</i>, <i>the Lord</i> and <i>goodness</i>. In an independent sentence such as <i>God knows how many pages he filed</i>, it can also be a literal claim about knowledge. This dictionary says that a literal knowledge clause does not generally have the embedded distribution, and that the internal constituency of the formula is open.'
  terms: Indeterminate is this dictionary’s term for words like <i>what</i> and <i>how many</i> that identify an open value.
  examples:
    - text: They packed [God knows what] in these boxes.
      from: entry
    - text: He filed [goodness knows how many pages].
      from: entry
    - text: She put [God knows what] in the soup.
      from: entry
  contrasts:
    - text: God knows how many pages he filed.
      from: entry
      note: As an independent sentence, can make a literal claim about knowledge.
  watch_for:
    - A learner might read <i>God knows what</i> in an object slot as a literal claim about divine knowledge.
    - A learner might expect the variant with <i>goodness</i> or <i>Heaven</i> to work only as an independent sentence.
  activity: Give students three sentences with a blank in the object slot (<i>He filed ...</i>, <i>She cooked ...</i>, <i>They bought ...</i>). Students fill them with an authority word plus <i>knows</i> and an indeterminate, then say what is left unspecified.
