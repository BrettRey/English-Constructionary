id: year-name-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Years as names
  summary: A number like <i>1994</i> can name a particular year, working like a name rather than a count.
  body: |-
    In <i>born in 1994</i>, the number doesn't count anything. It names one particular year. We can also say <i>the year 1066 saw the Norman Conquest</i>, or <i>2025 will be different</i>, with the number standing on its own as the subject.

    Compare <i>They met in 2002</i> with <i>They waited two years</i>. The first uses a number to identify a year, with no length of time. The second counts a stretch of time. Writing with digits can hide the difference.

    A year name resists words like <i>the</i> or an adjective in front of it. The dictionary marks this account as provisional.
  examples:
    - text: born in [1994]
      from: entry
    - text: The year [1066] saw the Norman Conquest.
      from: entry
    - text: '[2025] will be different.'
      from: entry
  try: Say <i>They met in 2002</i> and <i>They waited two years</i>. Which one tells you how long, and which one tells you when?
teacher:
  summary: Helps explain years as name-like numbers, and how they differ from counting.
  explain: A year name is a cardinal noun that names a specific year through direct reference. It heads a bare noun phrase and resists determiners and attributive modifiers. It occurs as the complement of a preposition (<i>in 1994</i>), as an appositive (<i>the year 1066</i>) and as a subject (<i>2025 will be different</i>). This dictionary describes the spoken form as typically using the basic numeratives (and <i>oh</i>), as in <i>ten sixty-six</i> rather than <i>one thousand sixty-six</i>. In <i>They met in 2002</i> the number identifies a calendar year without specifying elapsed time. In <i>They waited two years</i> the cardinal quantifies a duration. This dictionary marks its analysis provisional.
  terms: Calendrical label is the term in the source cited by this dictionary. This dictionary treats the year name as a proper-name-like use of a cardinal noun.
  examples:
    - text: born in [1994]
      from: entry
    - text: The year [1066] saw the Norman Conquest.
      from: entry
    - text: '[2025] will be different.'
      from: entry
  contrasts:
    - text: They met in 2002.
      from: entry
      note: Names a year, with no amount of time.
    - text: They waited two years.
      from: entry
      note: Counts a duration.
  watch_for:
    - A learner might read <i>in 2002</i> as a length of time, when it names a calendar year.
    - A learner might read the digits of a year as a quantity, since digits can obscure the distinction.
  activity: Students sort sentences with numbers into year names and durations. They then read the year names aloud in the form this dictionary describes, such as <i>ten sixty-six</i>.
child:
  hook: Does the number in "<i>born in 1994</i>" count something?
  explain: A year's number is its name. <i>Born in 1994</i> tells us which year. <i>Two years</i> is different. It counts how long.
  examples:
    - text: born in [1994]
      from: entry
    - text: They waited [two years].
      from: entry
  play: Say a year, like the year you were born. Then say how many years something took. Which one is a name and which one counts?
