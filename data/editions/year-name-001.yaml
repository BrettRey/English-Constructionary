id: year-name-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Years as names
  summary: A number like 1994 can name a particular year, working like a name rather than a count.
  body: |-
    In born in 1994, the number doesn't count anything. It names one particular year. We can also say the year 1066 saw the Norman Conquest, or 2025 will be different, with the number standing on its own as the subject.

    Compare They met in 2002 with They waited two years. The first uses a number to identify a year, with no length of time. The second counts a stretch of time. Writing with digits can hide the difference.

    A year name resists words like the or an adjective in front of it. The dictionary marks this account as provisional.
  examples:
    - text: born in [1994]
      from: entry
    - text: The year [1066] saw the Norman Conquest.
      from: entry
    - text: '[2025] will be different.'
      from: entry
  try: Say They met in 2002 and They waited two years. Which one tells you how long, and which one tells you when?
teacher:
  summary: Helps explain years as name-like numbers, and how they differ from counting.
  explain: A year name is a cardinal noun that names a specific year through direct reference. It heads a bare noun phrase and resists determiners and attributive modifiers. It occurs as the complement of a preposition (in 1994), as an appositive (the year 1066) and as a subject (2025 will be different). This dictionary describes the spoken form as typically using the basic numeratives (and oh), as in ten sixty-six rather than one thousand sixty-six. In They met in 2002 the number identifies a calendar year without specifying elapsed time. In They waited two years the cardinal quantifies a duration. This dictionary marks its analysis provisional.
  terms: Calendrical label is the term in the source cited by this dictionary. This dictionary treats the year name as a proper-name-like use of a cardinal noun.
  examples:
    - text: born in [1994]
      from: entry
    - text: The year [1066] saw the Norman Conquest.
      from: entry
    - text: '[2025] will be different.'
      from: entry
  contrasts:
    - text: They met in 2002.
      from: entry
      note: Names a year, with no amount of time.
    - text: They waited two years.
      from: entry
      note: Counts a duration.
  watch_for:
    - A learner might read in 2002 as a length of time, when it names a calendar year.
    - A learner might read the digits of a year as a quantity, since digits can obscure the distinction.
  activity: Students sort sentences with numbers into year names and durations. They then read the year names aloud in the form this dictionary describes, such as ten sixty-six.
child:
  hook: Does the number in "born in 1994" count something?
  explain: A year's number is its name. Born in 1994 tells us which year. Two years is different. It counts how long.
  examples:
    - text: born in [1994]
      from: entry
    - text: They waited [two years].
      from: entry
  play: Say a year, like the year you were born. Then say how many years something took. Which one is a name and which one counts?
