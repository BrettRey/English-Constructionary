id: with-a-capital-letter-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>With a capital letter</i>
  summary: Adding <i>with a capital D</i> (or another letter) to a word says how it is written, and can point to an official or named meaning.
  body: |-
    <i>Democrat with a capital D</i> tells us how the word is written, and it can point to the party-affiliated sense. <i>Church with a capital C</i> does the same for the institutional sense.

    So the phrase is a spelling instruction that can also point to the meaning. This dictionary notes that in <i>chaos with a capital C</i>, there need be neither an organization nor a name. The capital instruction can support an emphatic reading.

    This dictionary marks this account as provisional.
  examples:
    - text: democrat [with a capital D]
      from: entry
    - text: church [with a capital C]
      from: entry
  try: Say one word and add <i>with a capital</i> and its first letter. Does the word's meaning change?
teacher:
  summary: Helps explain <i>with a capital letter</i> as a way to specify spelling and signal a proper or institutional sense.
  explain: The pattern is a prepositional phrase headed by <i>with</i>, followed by <i>a</i>, <i>capital</i> and a letter name. It is a postposed adjunct or parenthetical after a label. It specifies uppercase orthography for the label, favouring an institutional or proper sense. It disambiguates official or proper-name use from ordinary descriptive use. In <i>democrat with a capital D</i>, the sense can be party-affiliated. In <i>chaos with a capital C</i>, there need be neither an organization nor a name, and the capital instruction can support an emphatic reading. This dictionary marks its analysis provisional. A sibling entry covers <i>with an uppercase letter</i>.
  terms: This dictionary treats this as a spelling specification, with an uppercase variant.
  examples:
    - text: democrat [with a capital D]
      from: entry
    - text: church [with a capital C]
      from: entry
  contrasts:
    - text: democrat with a capital D
      from: entry
      note: Party-affiliated sense.
    - text: church with a capital C
      from: entry
      note: Institutional sense.
  watch_for:
    - A learner might think the phrase must name an organization, when this dictionary says <i>chaos with a capital C</i> needs neither an organization nor a name.
    - A learner might take it as only a spelling instruction, when it can also point to a proper sense.
  activity: Write pairs of words on the board, such as <i>democrat</i> and <i>church</i>. Students say them with <i>with a capital</i> and a letter, then discuss what meaning each choice points to.
checked:
  date: "2026-11-19"
