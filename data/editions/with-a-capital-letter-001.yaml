id: with-a-capital-letter-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: With a capital letter
  summary: Adding with a capital D (or another letter) to a word says how it is written, and can point to an official or named meaning.
  body: |-
    Democrat with a capital D tells us how the word is written, and it can point to the party-affiliated sense. Church with a capital C does the same for the institutional sense.

    So the phrase is a spelling instruction that can also point to the meaning. This dictionary notes that in chaos with a capital C, there need be neither an organization nor a name. The capital instruction can support an emphatic reading.

    This dictionary marks this account as provisional.
  examples:
    - text: democrat [with a capital D]
      from: entry
    - text: church [with a capital C]
      from: entry
  try: Say one word and add with a capital and its first letter. Does the word's meaning change?
teacher:
  summary: Helps explain with a capital letter as a way to specify spelling and signal a proper or institutional sense.
  explain: The pattern is a prepositional phrase headed by with, followed by a, capital and a letter name. It is a postposed adjunct or parenthetical after a label. It specifies uppercase orthography for the label, favouring an institutional or proper sense. It disambiguates official or proper-name use from ordinary descriptive use. In democrat with a capital D, the sense can be party-affiliated. In chaos with a capital C, there need be neither an organization nor a name, and the capital instruction can support an emphatic reading. This dictionary marks its analysis provisional. A sibling entry covers with an uppercase letter.
  terms: This dictionary treats this as a spelling specification, with an uppercase variant.
  examples:
    - text: democrat [with a capital D]
      from: entry
    - text: church [with a capital C]
      from: entry
  contrasts:
    - text: democrat with a capital D
      from: entry
      note: Party-affiliated sense.
    - text: church with a capital C
      from: entry
      note: Institutional sense.
  watch_for:
    - A learner might think the phrase must name an organization, when this dictionary says chaos with a capital C needs neither an organization nor a name.
    - A learner might take it as only a spelling instruction, when it can also point to a proper sense.
  activity: Write pairs of words on the board, such as democrat and church. Students say them with with a capital and a letter, then discuss what meaning each choice points to.
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: "Fixed: child explanation now matches the entry (capital C marks the institutional sense of church, not a particular church); teacher explain describes the phrase itself as the postposed adjunct or parenthetical; emphatic reading hedged as the entry has it. Dismissed: none. Second round: removed the child edition, whose institutional and party-affiliated senses need adult background to follow (an adult-register pattern); teacher.explain now says democrat with a capital D can imply party affiliation, as this dictionary has it; cut the claim that capital letter is the everyday term."
