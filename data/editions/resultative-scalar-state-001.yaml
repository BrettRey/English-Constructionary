id: resultative-scalar-state-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Doing something until it reaches a state
  summary: A describing word after the object can show the point on a scale that the action brought something to.
  body: |-
    In <i>They polished the railing smooth</i>, the word <i>smooth</i> tells you where the polishing ended up. The railing ended up smooth, and the sentence reports that it got there.

    The describing word works like a point on a scale, such as how smooth something is. According to this dictionary, swapping <i>smooth</i> for a quality that doesn't readily supply an endpoint can make the sentence less acceptable, even when the verb and object stay the same. The analysis is marked provisional.
  examples:
    - text: They [polished the railing smooth].
      from: entry
    - text: She [wiped the table clean].
      from: constructed
  try: Think of something you can do to an object until it's clean, flat, dry or smooth. Say it as one sentence with the describing word last.
teacher:
  summary: Helps explain resultatives whose adjective names an attainable endpoint on a scale.
  explain: In a resultative VP like <i>polished the railing smooth</i>, the adjective gives the result as an attained point or region on a scale. On the completed-event reading, the rail reaches contextual smoothness. This dictionary treats the pattern as a specialization of the object resultative, and notes that replacing <i>smooth</i> with a property that doesn't readily supply an attainable endpoint can lower acceptability, even with the same verb and object. Present the adjective as the state the action brings about.
  terms: 'Traditional grammar sometimes speaks of a resultative predicate or result phrase. In this dictionary: scalar endpoint adjective in a resultative.'
  examples:
    - text: They [polished the railing smooth].
      from: entry
    - text: She [wiped the table clean].
      from: constructed
  contrasts:
    - text: They polished the railing.
      from: constructed
      note: No result is stated; compare with <i>polished the railing smooth</i>.
  watch_for:
    - A learner might read <i>smooth</i> in <i>polished the railing smooth</i> as describing how the polishing was done, when it names the state reached.
  activity: Give students verb and object pairs (<i>wipe the table</i>, <i>paint the fence</i>, <i>press the shirt</i>). They add an adjective that names the state reached, then compare which adjectives name a clear endpoint.
child:
  hook: What do you call a table after you wipe it until it's clean?
  explain: Some sentences end with a word that tells how things turned out. <i>They polished the railing smooth</i>. After the polishing, the railing was smooth.
  examples:
    - text: They [polished the railing smooth].
      from: entry
    - text: She [wiped the table clean].
      from: constructed
  play: Pick something to do, like <i>wipe</i>, <i>wash</i> or <i>paint</i>. Say what you did and add a word for how it ended up.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: curious body no longer says the railing started out rough or dull (the entry does not specify an initial state).'
