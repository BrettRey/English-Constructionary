id: evaluative-binominal-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: A noun of a noun, used to judge
  summary: In a phrase like a nitwit of a husband, the first noun is a judgment about the person or thing named by the second.
  body: |-
    In her stupid nitwit of a husband, the husband is the target of the evaluation. The first noun, nitwit, is said of the husband. This is different from a statue of bronze or a cup of water, where of expresses a material or a measure.

    The first part can be bigger than one word. In that destroyer of education of a minister, the education is what the minister destroys, and destroyer of education is the judgment passed on the minister.
  examples:
    - text: '[her stupid nitwit of a husband]'
      from: entry
    - text: '[wobbly jellies of men]'
      from: entry
    - text: '[that destroyer of education of a minister]'
      from: entry
  try: Think of a judgment you could pass on a person with a noun, then fit it into a phrase of that shape.
teacher:
  summary: Helps explain evaluative noun of noun phrases, and how they differ from material and measure of-phrases.
  explain: 'In an evaluative binominal, the first nominal is predicated of the referent of the second: a nitwit of a husband evaluates the husband as a nitwit. Material and measure expressions such as a statue of bronze and a cup of water supply different relations. This dictionary notes that the usual singular oblique takes a(n) and that Kim and Sells document bare plural obliques (wobbly jellies of men). The evaluation can apply to a complex first nominal, as in destroyer of education of a minister, where education is what the minister destroys; that grouping leaves the attachment of the outer PP open.'
  terms: This dictionary calls the judging use an evaluative binominal.
  examples:
    - text: '[her stupid nitwit of a husband]'
      from: entry
    - text: '[wobbly jellies of men]'
      from: entry
    - text: '[that destroyer of education of a minister]'
      from: entry
  contrasts:
    - text: a nitwit of a husband
      from: constructed
      note: The first noun evaluates the husband.
    - text: a statue of bronze
      from: constructed
      note: Of expresses the material.
    - text: a cup of water
      from: constructed
      note: Of expresses a measure.
  watch_for:
    - A learner might read a nitwit of a husband as two people, a nitwit and a husband.
    - A learner might read of in a statue of bronze as evaluating, when it gives a material.
  activity: Students sort phrases with of (a nitwit of a husband, a cup of water, a statue of bronze) by whether of expresses a judgment, a material or a measure.
