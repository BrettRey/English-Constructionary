id: progressive-futurate-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Being</i> plus <i>-ing</i> for plans
  summary: A <i>be</i> plus <i>-ing</i> verb with a future time can describe something already planned.
  body: |-
    In <i>We're meeting Jo on Tuesday</i>, the verb form is the same one used for things happening right now, but the words <i>on Tuesday</i> point to the future. The sentence presents the meeting as already arranged, planned or settled.

    An explicit future time selects that reading. For an ordinary natural event like sunset, this dictionary says the plain present is often preferred. This dictionary marks the account as provisional.
  examples:
    - text: '[We’re meeting Jo on Tuesday].'
      from: entry
  try: Think of something you've already planned for next week. Can you say it with <i>am</i>, <i>is</i> or <i>are</i> plus an <i>-ing</i> verb and a day?
teacher:
  summary: Explains the <i>be</i> plus <i>-ing</i> form with a future time word for arranged events.
  explain: 'A progressive clause with an explicit future anchor can present a future event as already arranged, planned or settled in the relevant circumstances: <i>We''re meeting Jo on Tuesday</i>. The future anchor selects the arrangement interpretation. With an ordinary predicted natural event, such as the time of sunset, this dictionary says the plain present is often preferred. The analysis is provisional, with one constructed example.'
  terms: Sometimes called 'present progressive for future'; this dictionary calls it the progressive futurate.
  examples:
    - text: '[We’re meeting Jo on Tuesday].'
      from: entry
  contrasts:
    - text: The Sun sets at five tomorrow.
      from: constructed
      note: A natural event, where this dictionary says the plain present is often preferred.
  watch_for:
    - A learner might read <i>We're meeting Jo</i> as describing a meeting in progress.
    - A learner might use the progressive for a future event that has no arrangement behind it.
  activity: Students write a plan for the week in <i>be</i> plus <i>-ing</i> sentences with a day each, then trade with a partner who says what has already been arranged.
