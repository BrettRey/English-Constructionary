id: until-time-boundary-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Until, the endpoint
  summary: Until names the point up to which something goes on, or before which something doesn't happen.
  body: |-
    In We waited until the shutters opened, the opening of the shutters ordinarily ends the wait. Until supplies the boundary: the waiting held up to that point.

    Until can also work with a negative. In She didn't leave until noon, the time before noon is the period when leaving didn't happen. Until can be followed by a date, a noun phrase, or a whole clause.

    This dictionary marks this account as provisional.
  examples:
    - text: We waited [until the shutters opened].
      from: entry
    - text: She didn't leave [until noon].
      from: constructed
  try: Say what you did until a certain time today. Then say something you didn't do until that time.
teacher:
  summary: Helps explain until as marking the endpoint of a situation or the delay of an event.
  explain: The pattern is a prepositional phrase headed by until, followed by a date, a noun phrase or a finite clause. It supplies the boundary up to which a situation holds, or up to which an occurrence is delayed. In We waited until the shutters opened, the opening ends the wait on the ordinary reading. Under negation, as in didn't leave until noon, the earlier interval is associated with absence of the event. This dictionary treats until phrases as prepositional phrases and relates the pattern to since. The analysis is marked provisional.
  terms: Until is a preposition here.
  examples:
    - text: We waited [until the shutters opened].
      from: entry
    - text: She didn't leave [until noon].
      from: constructed
  contrasts:
    - text: We waited until the shutters opened.
      from: entry
      note: The wait holds up to the boundary.
    - text: She didn't leave until noon.
      from: constructed
      note: Under negation, the earlier interval is a time without leaving.
  watch_for:
    - A learner might read didn't leave until noon as saying she left before noon, when the time before noon is the period without leaving.
    - A learner might read until as marking the start of something, when it supplies the boundary up to which a situation holds or an occurrence is delayed.
  activity: Students make a timeline of a school day. They write sentences with until for what holds up to each time, and sentences with didn't ... until for delayed events.
child:
  hook: What do you do until the bell rings?
  explain: The word until tells us up to when something goes on. We waited until the shutters opened. Then the waiting was over.
  examples:
    - text: We waited [until the shutters opened].
      from: entry
    - text: I read [until bedtime].
      from: constructed
  play: Say what you do until a time or event, like "I play until dinner." Then let a friend say what happens next.
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: "Fixed: curious body now says the opening ordinarily ends the wait, as this dictionary qualifies it; teacher watch_for items restated in terms of this dictionary's boundary and absence-of-event wording; child explain no longer says until only tells where something stops. Also fixed (unflagged): cut the claim that until is sometimes grouped with conjunctions and the description of the phrases as adjuncts, neither of which this dictionary states; 'the entry' wording."
