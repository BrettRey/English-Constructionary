id: until-time-boundary-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Until</i>, the endpoint
  summary: <i>Until</i> names the point up to which something goes on, or before which something doesn't happen.
  body: |-
    In <i>We waited until the shutters opened</i>, the opening of the shutters ordinarily ends the wait. <i>Until</i> supplies the boundary: the waiting held up to that point.

    <i>Until</i> can also work with a negative. In <i>She didn't leave until noon</i>, the time before noon is the period when leaving didn't happen. <i>Until</i> can be followed by a date, a noun phrase, or a whole clause.

    This dictionary marks this account as provisional.
  examples:
    - text: We waited [until the shutters opened].
      from: entry
    - text: She didn't leave [until noon].
      from: constructed
  try: Say what you did until a certain time today. Then say something you didn't do until that time.
teacher:
  summary: Helps explain <i>until</i> as marking the endpoint of a situation or the delay of an event.
  explain: The pattern is a prepositional phrase headed by <i>until</i>, followed by a date, a noun phrase or a finite clause. It supplies the boundary up to which a situation holds, or up to which an occurrence is delayed. In <i>We waited until the shutters opened</i>, the opening ends the wait on the ordinary reading. Under negation, as in <i>didn't leave until noon</i>, the earlier interval is associated with absence of the event. This dictionary treats <i>until</i> phrases as prepositional phrases and relates the pattern to <i>since</i>. The analysis is marked provisional.
  terms: <i>Until</i> is a preposition here.
  examples:
    - text: We waited [until the shutters opened].
      from: entry
    - text: She didn't leave [until noon].
      from: constructed
  contrasts:
    - text: We waited until the shutters opened.
      from: entry
      note: The wait holds up to the boundary.
    - text: She didn't leave until noon.
      from: constructed
      note: Under negation, the earlier interval is a time without leaving.
  watch_for:
    - A learner might read <i>didn't leave until noon</i> as saying she left before noon, when the time before noon is the period without leaving.
    - A learner might read <i>until</i> as marking the start of something, when it supplies the boundary up to which a situation holds or an occurrence is delayed.
  activity: Students make a timeline of a school day. They write sentences with <i>until</i> for what holds up to each time, and sentences with <i>didn't ... until</i> for delayed events.
child:
  hook: What do you do until the bell rings?
  explain: The word <i>until</i> tells us up to when something goes on. <i>We waited until the shutters opened</i>. Then the waiting was over.
  examples:
    - text: We waited [until the shutters opened].
      from: entry
    - text: I read [until bedtime].
      from: constructed
  play: Say what you do until a time or event, like "<i>I play until dinner</i>." Then let a friend say what happens next.
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags)
