id: modal-plain-complement-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Little helper verbs and the plain verb after them
  summary: Words like <i>might</i> come before a verb in its basic form, and they have no <i>-s</i> ending of their own.
  body: |-
    In <i>Jo might have missed the train</i>, the word <i>might</i> comes first and the plain form <i>have</i> follows it. <i>Might</i> doesn't change for different subjects: there's no third-person <i>-s</i> on the modal itself. The verb after it stays in its basic form.

    This dictionary calls words like <i>might</i> central modals. This dictionary also notes that an ordinary central modal can't fill the slot after perfect <i>have</i>. The modal comes first and <i>have</i> comes after it.
  examples:
    - text: Jo [might have missed] the train.
      from: entry
    - text: Kim [must have left] early.
      from: constructed
    - text: They [will call] tomorrow.
      from: constructed
  try: Put <i>might</i>, <i>must</i> or <i>will</i> in front of a verb, then change the subject from <i>I</i> to <i>she</i>. Does the modal change at all?
teacher:
  summary: Helps explain why verbs after modals stay in the plain form and why modals have no <i>-s</i> form.
  explain: 'A central modal combines with a plain-form verb phrase. <i>Might</i> selects plain <i>have</i> in <i>Jo might have missed the train</i>, and the modal has no third-person singular suffix. This dictionary adds that ordinary central modals cannot occupy the complement slot of perfect <i>have</i>: the modal comes first, and <i>have</i> follows it. The pattern is a specialization of the general verb phrase. Teachers may want to pair it with the perfect, which this dictionary lists as related.'
  terms: Plain form is sometimes called the base form or bare infinitive. Central modal is the CGEL name; modal auxiliary is sometimes used in textbooks.
  examples:
    - text: Jo [might have missed] the train.
      from: entry
    - text: Kim [must have left] early.
      from: constructed
    - text: They [will call] tomorrow.
      from: constructed
  contrasts:
    - text: Jo might have missed the train.
      from: entry
      note: Modal first, then plain <i>have</i>.
    - text: Jo has missed the train.
      from: constructed
      note: Perfect <i>have</i> with a third-person singular form, and no modal.
  watch_for:
    - A learner might add <i>-s</i> to a modal after <i>he</i> or <i>she</i>, since other verbs take it.
    - A learner might use <i>have</i> or <i>has</i> before the modal rather than after it.
    - A learner might use a verb form with <i>-ing</i> or <i>-ed</i> after <i>might</i> instead of the plain form.
  activity: Give students subjects (<i>I</i>, <i>she</i>, <i>they</i>) and modals (<i>might</i>, <i>must</i>, <i>will</i>). They build sentences with a plain verb, then with <i>have</i> and a past participle, and compare the endings on each verb.
