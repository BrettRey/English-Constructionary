id: present-backshift-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Why a report uses the past form
  summary: When you report what someone said earlier, the verb in the report can take a past form even if the original speaker used the present.
  body: |-
    In <i>Yesterday Jo said she was hungry</i>, the report uses <i>was</i>, though Jo's own words could have been present tense, as in <i>I'm hungry</i>. The past form matches the past setting of the reporting.

    The hunger can still coincide with the speaking, so <i>was</i> doesn't have to mean Jo was hungry before she spoke. A present-tense form is also possible in suitable contexts, especially where the reporter treats the content as still current.
  examples:
    - text: Yesterday Jo said [she was hungry].
      from: entry
  try: Report something a friend said earlier today, once with a past verb and once with a present verb. When does each feel right?
teacher:
  summary: Explains how a past-tense form in a report can correspond to a present-tense original or overlap the reporting time.
  explain: In a past reporting setting, a subordinate preterite can correspond to a present-tense original or overlap the reporting reference time. In <i>Yesterday Jo said she was hungry</i>, the hunger can coincide with the speaking. A present-tense form is also possible in appropriate contexts, especially where the reporter treats the content as still current. This dictionary relates the pattern to declarative content clauses and marks it provisional, with medium confidence.
  terms: Textbooks sometimes call this backshift or the sequence of tenses.
  examples:
    - text: Yesterday Jo said [she was hungry].
      from: entry
  watch_for:
    - A learner might read <i>was</i> in <i>she was hungry</i> as meaning the hunger came before Jo spoke, when it can coincide with the speaking.
    - A learner might think the report must use a past form, when a present form is possible where the reporter treats the content as still current.
  activity: Give students direct statements (<i>I'm hungry</i>, <i>I like it</i>). They report each as said yesterday, then discuss whether a present form could also work.
child:
  hook: If Jo says <i>I'm hungry</i>, how do you tell it tomorrow?
  explain: When you tell what someone said before, the verb can take a past form. <i>Yesterday Jo said she was hungry</i>. She could have been hungry right when she said it.
  examples:
    - text: Yesterday Jo said she was hungry.
      from: entry
    - text: Yesterday Sam said he was tired.
      from: constructed
  play: One person says a sentence with <i>I am</i>. Another tells it later starting with <i>said</i>, using a past form.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
