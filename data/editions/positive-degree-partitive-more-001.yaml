id: positive-degree-partitive-more-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>More of</i> a particular set
  summary: <i>More of</i> followed by a group or a substance compares amounts taken from that group or substance.
  body: |-
    In <i>We should keep more of these samples</i>, the phrase after <i>of</i> says which set we're drawing from: <i>these samples</i>. Keeping more of them means a bigger share of that set.

    The word <i>more</i> can count things in a plural group, as in <i>more of these samples</i>, or measure an amount of a substance, as in <i>more of this soup</i>. Which one it is depends on what follows <i>of</i>.
  examples:
    - text: We should keep [more of these samples].
      from: entry
    - text: Could I have [more of this soup]?
      from: constructed
  try: Say <i>more of these cookies</i> and <i>more of this milk</i>. Which one counts items, and which one measures an amount?
teacher:
  summary: Covers <i>more of</i> plus a domain expression, which compares amounts drawn from a specified set or whole.
  explain: In NP[<i>more</i> + PP[<i>of</i> + domain expression]], the <i>of</i>-phrase fixes the group counted over. <i>More</i> can quantify a plural count domain (<i>more of these samples</i>) or an amount of a non-count substance, depending on the complement. This dictionary describes the pattern as comparing amounts drawn from a specified set or whole, and relates it to the true partitive. It is marked provisional, with medium confidence.
  terms: This dictionary treats this as a specialization of the true partitive.
  examples:
    - text: We should keep [more of these samples].
      from: entry
    - text: Could I have [more of this soup]?
      from: constructed
  watch_for:
    - A learner might treat <i>more of these samples</i> and <i>more samples</i> as the same, though the <i>of</i>-phrase fixes a specified set to draw from.
  activity: Show a bowl of items and a jug of juice. Students write one sentence with <i>more of</i> plus a plural count noun phrase and one with <i>more of</i> plus a non-count substance.
child:
  hook: What is the difference between <i>more cookies</i> and <i>more of these cookies</i>?
  explain: <i>More of these cookies</i> means more from a set you can point to. The words after <i>of</i> tell which set you mean.
  examples:
    - text: We should keep more of these samples.
      from: entry
    - text: Could I have more of this soup?
      from: constructed
  play: Point at a pile of things and say what you want more of, starting with <i>more of these</i> or <i>more of this</i>.
