id: response-obligation-ditransitive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Owing someone something
  summary: With <i>owe</i>, the person you owe comes first and the thing owed comes second, and the thing may not yet have been given.
  body: |-
    In <i>I owe Lee an apology</i>, Lee is the person who is entitled to the apology, and the apology is still outstanding. The verb <i>owe</i> is followed by two noun phrases in a row: first the person, then the thing.

    This is a version of the two-object pattern found with verbs like <i>send</i> and <i>give</i>. But owing isn't giving. The sentence can be true even if the apology hasn't been offered, because it describes an obligation, not a gift on its way. This dictionary marks the analysis as provisional.
  examples:
    - text: I [owe Lee an apology].
      from: entry
    - text: We [owe the neighbours a favour].
      from: constructed
  try: Think of something you owe a friend. Say it with the friend's name first, then the thing owed.
teacher:
  summary: Helps explain <i>owe</i> with two objects and how an obligation differs from a transfer.
  explain: '<i>Owe</i> takes an indirect object (the creditor, or entitled participant) followed by a direct object (the outstanding thing): <i>I owe Lee an apology</i>. This dictionary treats it as a specialization of the ditransitive VP. The meaning is an obligation, not an intended gift: Lee is the person to whom the apology is owed, and the sentence can be true when the apology has not been offered. Contrast this with verbs of giving, where the pattern suggests a transfer.'
  terms: Indirect object and direct object are the usual terms. In this dictionary, the pattern is a double-object construction.
  examples:
    - text: I [owe Lee an apology].
      from: entry
    - text: We [owe the neighbours a favour].
      from: constructed
  contrasts:
    - text: I owe Lee an apology.
      from: entry
      note: Obligation; the apology is outstanding.
    - text: I gave Lee an apology.
      from: constructed
      note: A transfer, which the sentence presents as completed.
  watch_for:
    - A learner might read <i>owe Lee an apology</i> as saying the apology has already been delivered.
  activity: Students write three things they owe someone (a call, a thank-you, a book) using the double-object pattern. Partners say whether each thing has been handed over yet and how they can tell.
child:
  hook: If you owe a friend a game, has the friend got it yet?
  explain: <i>Owe</i> is followed by the person and then the thing. <i>I owe Lee an apology</i> means Lee should get an apology. It doesn't mean Lee has it yet.
  examples:
    - text: I [owe Lee an apology].
      from: entry
    - text: We [owe Grandma a phone call].
      from: constructed
  play: Say what you owe someone, with the name first. Then ask a friend, "Has it happened yet?"
checked:
