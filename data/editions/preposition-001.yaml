id: preposition-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Words like <i>in</i>, <i>outside</i> and <i>because</i>
  summary: In this dictionary, a preposition is a word that heads a preposition phrase, and the group is wider than you may expect.
  body: |-
    Words like <i>in</i>, <i>on</i> and <i>of</i> are prepositions. So are some words that traditional grammar puts elsewhere: <i>outside</i>, <i>home</i> and <i>ago</i>, which need no noun after them, and <i>because</i>, which takes a whole clause.

    Prepositions relate one thing or event to another in space, time or other ways. They don't change form. <i>In the garden</i>, <i>she waited outside</i> and <i>ten years ago</i> all contain a preposition, and so does <i>because it rained</i>. In place uses, you can add <i>right</i> or <i>straight</i>: <i>right outside</i>, <i>straight home</i>.
  examples:
    - text: '[in] the garden'
      from: entry
    - text: She waited [outside].
      from: entry
    - text: ten years [ago]
      from: entry
    - text: '[because] it rained'
      from: entry
  try: Find a sign or a book page and look for small words like <i>in</i>, <i>on</i> or <i>because</i>. Which ones are followed by a noun, and which by a clause or nothing?
teacher:
  summary: Defines the wider category of preposition, including words that traditional grammar calls adverbs or subordinating conjunctions.
  explain: A preposition is a lexical category heading PPs, with optional complements for much of the class. The CGEL category is much larger than the traditional one. It includes traditional prepositions (<i>in</i>, <i>on</i>, <i>of</i>), objectless members traditionally called adverbs (<i>home</i>, <i>abroad</i>, <i>ashore</i>, <i>upstairs</i>; <i>ago</i>, with an obligatory pre-head measure modifier), the rare complement-head member <i>notwithstanding</i>, and clause-taking members traditionally called subordinating conjunctions (<i>because</i>, <i>although</i>, <i>while</i>). Prepositions are closed-class and don't inflect. In locative uses they accept <i>right</i> and <i>straight</i>. The Constructionary departs from CGEL on the analysis of <i>ago</i>.
  terms: Traditional grammar calls <i>home</i>, <i>outside</i> and <i>upstairs</i> adverbs, and <i>because</i>, <i>although</i> and <i>while</i> subordinating conjunctions. This grammar calls them prepositions.
  examples:
    - text: '[in] the garden'
      from: entry
    - text: She waited [outside].
      from: entry
    - text: ten years [ago]
      from: entry
    - text: '[because] it rained'
      from: entry
  watch_for:
    - A learner might think a preposition must be followed by a noun phrase, when this dictionary gives intransitive members such as <i>outside</i>.
    - A learner might treat <i>because</i> as a different kind of word from <i>in</i>, when this dictionary places both in one category.
  activity: Give students a list (<i>in</i>, <i>outside</i>, <i>home</i>, <i>ago</i>, <i>because</i>, <i>although</i>). They try each in a sentence, then say whether anything follows it, and what.
