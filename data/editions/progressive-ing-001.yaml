id: progressive-ing-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Being plus <i>-ing</i> for things in progress
  summary: A form of be plus a verb ending in <i>-ing</i> presents something as ongoing or unfolding at a particular time.
  body: |-
    In <i>She is reading</i>, the action is in progress. In <i>They were walking home</i>, it was going on at some time in the past. In <i>She was building a house</i>, the house building is ongoing, and the sentence doesn't say it was ever finished. Compare <i>She built a house</i>, which does tell us it was completed.

    The same form can also frame something as current or temporary, as in <i>He is living in Chicago</i> or <i>The server is running slow today</i>. This dictionary marks the account as provisional.
  examples:
    - text: She [is reading].
      from: entry
    - text: They [were walking] home.
      from: entry
    - text: She [was building] a house.
      from: entry
    - text: He [is living] in Chicago.
      from: entry
    - text: The server [is running] slow today.
      from: entry
  try: Say <i>She was building a house</i>, then <i>She built a house</i>. In which one do you know the house got finished?
teacher:
  summary: Core explanation of the be plus <i>-ing</i> progressive, with its two readings and a contrast with the simple past.
  explain: 'The progressive is be plus a gerund-participle. Its first reading marks an ongoing or unfolding situation at a reference time (imperfective viewpoint), where endpoints aren''t asserted: <i>She was building a house</i> doesn''t entail completion, while <i>She built a house</i> does. Its second reading marks a current-phase or contingent construal, often contrasted with a default habitual or simple-present reading (<i>He is living in Chicago</i>). The progressive auxiliary and its gerund-participial complement form a VP headed by be. This dictionary marks the account provisional. A future adjunct can give the progressive an arrangement reading.'
  terms: Often called the continuous or progressive aspect; the <i>-ing</i> form is a gerund-participle.
  examples:
    - text: She [is reading].
      from: entry
    - text: They [were walking] home.
      from: entry
    - text: She [was building] a house.
      from: entry
    - text: I'm [living] in Mississauga.
      from: entry
  contrasts:
    - text: She was building a house.
      from: entry
      note: Ongoing process; does not entail completion.
    - text: She built a house.
      from: entry
      note: Perfective contrast with completion entailment.
  watch_for:
    - A learner might think any <i>-ing</i> form after a verb is a progressive, such as the <i>-ing</i> form in <i>Jo avoided staying</i>, which isn't progressive.
    - A learner might think <i>She was building a house</i> means the house was finished.
  activity: Students match sentence pairs, such as <i>She was building a house</i> and <i>She built a house</i>, to the question "Is the house finished?" and explain their answer.
child:
  hook: Is the house finished if she was building it?
  explain: Words like <i>is</i>, <i>was</i> and <i>were</i> plus an <i>-ing</i> word can show something going on. <i>She was building a house</i> means she was in the middle of it. <i>She built a house</i> means it got done.
  examples:
    - text: She [is reading].
      from: entry
    - text: They [were walking] home.
      from: entry
    - text: She [was building] a house.
      from: entry
  play: Say what you are doing right now with <i>is</i> or <i>am</i> and an <i>-ing</i> word. Then say what you did yesterday without <i>-ing</i>. Does it sound finished or still going?
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
