id: imperative-or-warning-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: A command followed by a warning
  summary: A command joined by <i>or</i> to a result tells you what may happen if you ignore it.
  body: |-
    In <i>Hold still or you'll fall</i>, the second part says what may happen if the command is ignored. The fall goes with failing to hold still.

    The sentence doesn't offer two equal choices, to hold still or to fall. The fall is a warning, and the speaker doesn't intend it as something the listener might do instead.
  examples:
    - text: '[Hold still or you''ll fall].'
      from: entry
  try: Say a warning that starts with a command and has <i>or</i> after it, such as <i>Wait here or ...</i>
teacher:
  summary: Helps learners read a command plus <i>or</i> plus a result as a warning, not a choice.
  explain: 'An imperative is followed by <i>or</i> and a declarative consequence: <i>Hold still or you''ll fall</i>. The second state of affairs is presented as what may happen if the directive is ignored. The fall is associated with failure to hold still, rather than offered as an equally intended alternative action. This dictionary relates the pattern to imperative-plus-and and to either-or coordination, and marks the analysis as provisional.'
  examples:
    - text: '[Hold still or you''ll fall].'
      from: entry
  watch_for:
    - A learner might read the two parts as equal options, to hold still or to fall.
    - A learner might treat the second part as an instruction to follow.
  activity: Give students warning signs with <i>or</i>. They paraphrase each as <i>If you don't ...</i> and say what the writer wants the reader to do.
child:
  hook: Does <i>Hold still or you'll fall</i> give you two choices?
  explain: No. The first part tells you what to do. The second part tells you what may happen if you don't.
  examples:
    - text: '[Hold still or you''ll fall].'
      from: entry
  play: Take turns giving a command and then a warning with <i>or</i>. Say what the speaker really wants.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
