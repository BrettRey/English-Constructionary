id: continuative-perfect-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Having done something up to now
  summary: Some <i>have</i>-sentences say that a situation has been going on through a stretch of time that ends at the moment being talked about.
  body: |-
    In <i>Jo has lived here since April</i>, Jo still lives here: the living-here stretches from April up to now. The sentence presents a situation as holding through an interval that ends at the relevant time.

    That time needn't be now. In <i>Jo had lived there since April when we met</i>, the stretch ends at the meeting. This reading goes with a suitable state, like living somewhere, and a phrase giving the starting point. A sentence like <i>I've visited three times since 2019</i> is different: it counts separate occasions rather than describing something ongoing.
  examples:
    - text: Jo [has lived here since April].
      from: entry
    - text: Jo [had lived there since April] when we met.
      from: entry
  try: Say <i>I've lived here since 2019</i>, then <i>I've visited three times since 2019</i>. Which one describes something still going on?
teacher:
  summary: Helps explain the ongoing-state reading of the perfect, as in <i>has lived here since April</i>.
  explain: 'The continuative perfect combines perfect have, a past-participial VP and a duration reaching the reference time. With a suitable stative predicate and a since-anchor, the ordinary reading extends the situation to the present, or to another reference time supplied by context (<i>when we met</i>). Contrast the experiential perfect, which only locates an occurrence before the reference time: <i>I''ve visited three times since 2019</i> counts completed episodes within the same interval. <i>Since</i> does not force continuity, because it also combines with experiential uses. The analysis is provisional.'
  terms: Perfect have appears in what textbooks call the present perfect (<i>has lived</i>) and past perfect (<i>had lived</i>). Continuative and experiential name two readings of it.
  examples:
    - text: Jo [has lived here since April].
      from: entry
    - text: Jo [had lived there since April] when we met.
      from: entry
  contrasts:
    - text: I've lived here since 2019.
      from: entry
      note: Ongoing-state reading is available.
    - text: I've visited three times since 2019.
      from: entry
      note: Counts completed episodes in the interval.
  watch_for:
    - A learner might read <i>has lived here since April</i> as a completed past event.
    - A learner might assume that <i>since</i> signals an ongoing state.
  activity: Give students pairs of since-sentences, some with states (<i>live</i>, <i>know</i>, <i>work at</i>) and some with countable events (<i>visit</i>, <i>call</i>). They sort them into "still going on" and "counted occasions" and discuss the cues.
