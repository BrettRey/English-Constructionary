id: demonstrative-determinative-fused-head-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>This</i> and <i>that</i> standing on their own
  summary: Words like <i>this</i> and <i>that</i> can stand alone as a whole phrase, pointing to something in the situation.
  body: |-
    In <i>That is incredible!</i>, <i>that</i> isn't attached to a noun. It stands on its own and points to something in the situation, such as what has just happened or been said. A prior statement can supply the target even when no physical object is pointed at.

    This dictionary counts <i>this</i>, <i>that</i>, <i>these</i> and <i>those</i> as a kind of word called determinatives, and it keeps them in that category even when they stand on their own. In <i>That plan is strange</i>, by contrast, <i>that</i> goes with a noun. This dictionary treats the analysis as provisional.
  examples:
    - text: '[That] is incredible!'
      from: entry
    - text: '[That] plan is strange.'
      from: constructed
  try: Hear someone say <i>That is incredible!</i> What could that be pointing to? Now say <i>That plan is incredible.</i> What changes?
teacher:
  summary: Helps explain <i>this</i>, <i>that</i>, <i>these</i> and <i>those</i> used alone, and why this grammar keeps them as determinatives.
  explain: 'The pattern is an NP where a demonstrative determinative realizes fused determiner-head function: one word does the jobs of determiner and head. In <i>That is incredible!</i>, <i>that</i> is an entire NP referring to the current situation. In <i>That plan is strange</i>, it instead determines a nominal. The fused head must be <i>this</i>, <i>that</i>, <i>these</i> or <i>those</i>. A prior proposition can supply the deictic target even with no physical object indicated. This grammar treats these words as determinatives, and independent NP use doesn''t reclassify them as pronouns. The analysis is provisional.'
  terms: Traditional grammars call this use a demonstrative pronoun. This grammar keeps <i>this</i>, <i>that</i>, <i>these</i> and <i>those</i> as determinatives (a word category) in fused determiner-head function.
  examples:
    - text: '[That] is incredible!'
      from: entry
    - text: That is strange.
      from: constructed
  contrasts:
    - text: That is incredible!
      from: entry
      note: <i>That</i> alone is the whole NP, referring to the situation.
    - text: That plan is strange.
      from: entry
      note: <i>That</i> determines a nominal, <i>plan</i>.
  watch_for:
    - A learner might reclassify <i>that</i> as a pronoun when it stands alone, when this grammar keeps it a determinative.
    - A learner might look for a physical object that <i>that</i> points to, when a prior proposition can supply the target.
  activity: Students collect sentences with <i>this</i>, <i>that</i>, <i>these</i> and <i>those</i>, sort them into stand-alone and followed-by-a-noun, and say what each one points to in the situation or in the previous sentence.
