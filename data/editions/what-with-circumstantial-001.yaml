id: what-with-circumstantial-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>What with</i>, giving reasons
  summary: <i>What with</i> and one or more circumstances offers them as the reason for what happened.
  body: |-
    <i>What with the trains being late and the roads blocked, we stayed put</i>. The part before the comma lists the circumstances, and they explain why we stayed.

    A simple noun phrase can fill the same slot: <i>What with the weather, we never left the house</i>. A plain <i>with</i> phrase can show an accompanying circumstance with no explanation, as in <i>She waited with her arms folded</i>. Adding <i>what</i> invites a reason reading.

    The dictionary marks this account as provisional.
  examples:
    - text: '[What with the trains being late and the roads blocked], we stayed put.'
      from: entry
    - text: '[What with the weather], we never left the house.'
      from: entry
    - text: She waited with her arms folded.
      from: entry
  try: Explain why you were late using <i>What with</i> and two reasons. Does it sound like an excuse?
teacher:
  summary: For advanced classes, <i>what with</i> as a way to present circumstances as the reason for a situation.
  explain: The pattern is an adjunct beginning with <i>what with</i>, followed by a noun phrase, a non-finite or verbless predication, or a coordination. It presents one or more circumstances as explaining the main situation. A plain <i>with</i> phrase can depict an accompanying circumstance with no explanatory force, as in <i>She waited with her arms folded</i>. Adding <i>what</i> invites a reason reading. A simple noun phrase such as <i>the weather</i> can fill the same slot. This dictionary marks its analysis provisional.
  terms: This dictionary treats <i>what with</i> as an idiom introducing a reason adjunct, and relates it to absolute supplements, which can also express circumstances with their own predication.
  examples:
    - text: '[What with the trains being late and the roads blocked], we stayed put.'
      from: entry
    - text: '[What with the weather], we never left the house.'
      from: entry
  contrasts:
    - text: What with the weather, we never left the house.
      from: entry
      note: Reason reading.
    - text: She waited with her arms folded.
      from: entry
      note: Accompanying circumstance, no explanation.
  watch_for:
    - A learner might read <i>what with</i> as a question about <i>what</i>, when it introduces a reason.
    - A learner might take a plain <i>with</i> phrase to explain the main situation, when it can depict an accompanying circumstance.
  activity: Students write sentences with <i>with</i> in two uses, one a depiction and one with <i>what</i> added as a reason, and say which is which.
