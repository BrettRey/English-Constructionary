id: locative-location-variant-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Putting the surface right after the verb
  summary: With some verbs, the place that gets treated comes right after the verb and the material comes after with.
  body: |-
    They sprayed the panel with paint puts the panel, the place that gets sprayed, straight after the verb. The paint, the material, follows with. The sentence presents the panel as the main thing affected.

    This way of saying it favours reading the panel as the affected area, though not every part needs to be covered. In a with-phrase like this, with gives the material. In painted the panel with a brush, it gives the tool instead.
  examples:
    - text: They [sprayed the panel with paint].
      from: entry
    - text: They [painted the panel with a brush].
      from: constructed
  try: Say They sprayed the panel with paint and then They painted the panel with a brush. What does with give in each one?
teacher:
  summary: Helps explain the frame in which the location is the direct object and the material comes in a with-phrase, as in sprayed the panel with paint.
  explain: 'In this frame the location is the direct object and the material is a with-dependent: sprayed the panel with paint. The location can also be the passive subject (The panel was sprayed with paint). The frame favours an affected-region reading, which need not literally cover every part of the site. Don''t confuse the material with-phrase with the instrument with-phrase in painted the panel with a brush.'
  terms: This dictionary calls this the location-object frame.
  examples:
    - text: They [sprayed the panel with paint].
      from: entry
    - text: The panel was [sprayed with paint].
      from: constructed
  contrasts:
    - text: They sprayed the panel with paint.
      from: entry
      note: The location is the object; with gives the material.
    - text: They painted the panel with a brush.
      from: constructed
      note: The with-phrase gives the instrument, not the material.
  watch_for:
    - A learner might think the panel must be covered completely, when the frame favours an affected-region reading that need not cover every part.
    - A learner might read the with-phrase in painted the panel with a brush as a material, when it is an instrument.
  activity: Give students verb cards such as spray and paint. They build sentences with the place right after the verb, swap them with a partner, and mark whether the with-phrase names a material or an instrument.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: removed every claim about an alternate frame in which the material is the object (onto-phrases, ''theme-object frame'', the locative alternation, which verbs take both), since this dictionary does not describe it; the second curious example is now painted the panel with a brush, which this dictionary contrasts with the material with-phrase; try and activity reworded to match. Second round: fixed curious.body, affected as a whole changed to the affected area (the entry says an affected-region reading that need not cover every part).'
