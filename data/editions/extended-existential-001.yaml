id: extended-existential-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: There were two alarms ringing
  summary: A there sentence can introduce something and then say where it is or what it's doing.
  body: |-
    In There were two alarms ringing, the sentence introduces two alarms and then says what they were doing: ringing. The word ringing tells us about the alarms themselves.

    A different kind of added phrase works another way. It can comment on the whole situation without describing the thing introduced. So the same sentence shape can hold either a description of the alarms or a comment on the whole event, and this dictionary keeps the two apart.
  examples:
    - text: '[There were two alarms ringing].'
      from: entry
    - text: '[There was a light shining] in the window.'
      from: constructed
  try: In There were two alarms ringing, who or what is doing the ringing?
teacher:
  summary: 'For advanced classes: there sentences that add a location or a predicate about the introduced NP.'
  explain: 'An extended existential has dummy there, be, a pivot NP, and an integrated location or secondary predication: There were two alarms ringing. It introduces a referent and characterizes its position or current situation. Ringing predicates an activity of the alarms. A free event adjunct can instead modify the whole existential assertion without predicating a property of the pivot. This dictionary is a specialization of existential there, marked provisional, with medium confidence.'
  terms: Pivot NP is the NP after be. Secondary predication is a predicate that describes the pivot.
  examples:
    - text: '[There were two alarms ringing].'
      from: entry
    - text: '[There was a light shining] in the window.'
      from: constructed
  watch_for:
    - A learner might treat every phrase after the pivot as describing the pivot, when a free event adjunct can modify the whole assertion.
    - A learner might take ringing as a separate clause, when it predicates an activity of the alarms.
  activity: Students write There was/were sentences about a picture, adding what each thing is doing. Pairs then check that each added phrase describes the thing just introduced.
checked:
