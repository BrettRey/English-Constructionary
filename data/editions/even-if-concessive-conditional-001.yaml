id: even-if-concessive-conditional-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Plans that survive bad news
  summary: Even if names a condition that might seem to threaten a plan and says the plan holds anyway.
  body: |-
    In Even if it rains, we'll go, the speaker says the plan stays fixed under a condition that looks unfavourable. Rain is the awkward case, and the plan is presented as holding even then.

    The speaker can say this while not knowing whether it will rain. The sentence doesn't settle the weather. It settles what happens either way. This differs from the ordinary expectation a plain if sentence suggests, and the even is what changes it.
  examples:
    - text: '[Even if it rains], we''ll go.'
      from: entry
    - text: '[Even if you''re late], we''ll wait for you.'
      from: constructed
    - text: '[Even if the road is closed], they''ll find a way.'
      from: constructed
  try: Say Even if it rains, we'll go. Does the speaker need to know whether it will rain?
teacher:
  summary: Helps explain how even if differs from a plain if in conditional sentences.
  explain: 'An even-if adjunct (even if plus a finite clause) holds the main clause''s consequence fixed under a condition presented as unfavourable or extreme. It is a specialization of the if-conditional. The sentence can be used while the condition is still uncertain: Even if it rains, we''ll go doesn''t need the rain to be settled. The plan is presented as holding in that case, unlike the ordinary expectation a bare conditional suggests. This dictionary marks the analysis as provisional, with medium confidence, and rests on CGEL''s discussion of concessive conditionals.'
  terms: Concessive conditional is the name used here for even if clauses.
  examples:
    - text: '[Even if it rains], we''ll go.'
      from: entry
    - text: '[Even if you''re late], we''ll wait for you.'
      from: constructed
  contrasts:
    - text: Even if it rains, we'll go.
      from: entry
      note: The plan holds even in the unfavourable case.
    - text: If it rains, we'll go.
      from: constructed
      note: A bare conditional, with the ordinary expectation this dictionary mentions.
  watch_for:
    - A learner might read even if as a plain if with extra emphasis, and miss that the consequence is presented as holding regardless.
    - A learner might think the speaker of Even if it rains, we'll go knows that it will rain.
  activity: Give pairs a plan ("We'll start at noon") and a possible obstacle (heavy traffic, a late guest). Each pair writes one sentence with even if and one with a plain if, then explains aloud what changes.
child:
  hook: What does the speaker mean by Even if it rains, we'll go?
  explain: Even if tells you the plan won't change. Rain might come, and that's the bad news. The people will go anyway.
  examples:
    - text: '[Even if it rains], we''ll go.'
      from: entry
    - text: '[Even if you''re late], we''ll wait for you.'
      from: constructed
  play: Make a plan, like going to the park. Then think of something that could get in the way. Say your plan with Even if at the start.
