id: reflexive-benefactive-ditransitive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Finding yourself a room
  summary: A sentence can show someone securing something for themselves by using a reflexive word, like herself, right after the verb.
  body: |-
    In Jo found herself a quieter room, Jo is both the finder and the person who benefits. The word herself comes right after found, and the room follows. The sentence presents Jo's action as securing a resource for Jo.

    Compare Jo found herself in a quieter room, where herself is the direct object and the phrase in a quieter room says where Jo was. This dictionary marks the account as provisional.
  examples:
    - text: Jo [found herself a quieter room].
      from: entry
  try: Take a sentence such as Jo found a quieter room. Can you add herself to show that the room was for Jo?
teacher:
  summary: Explains a reflexive indirect object that shows the subject benefiting from the action.
  explain: 'In this frame a reflexive indirect object follows the verb, with a direct object after it: Jo found herself a quieter room. Jo is understood as the intended beneficiary and room is the acquired resource. The two postverbal NPs are the indirect and the direct object. In Jo found herself in a quieter room, by contrast, herself is the direct object and the PP locates Jo. This dictionary marks the analysis provisional.'
  terms: The Birmingham English Constructicon, which this dictionary cites, has a related record titled Getting V oneself N. This dictionary describes the pattern as a reflexive beneficiary in a double-object VP.
  examples:
    - text: Jo [found herself a quieter room].
      from: entry
  contrasts:
    - text: Jo found herself in a quieter room.
      from: constructed
      note: Here herself is the direct object and the PP says where Jo is.
  watch_for:
    - A learner might treat herself as the direct object in both sentences.
    - A learner might read a quieter room as describing Jo.
  activity: Students compare Jo found herself a quieter room and Jo found herself in a quieter room, and mark the role of herself in each (indirect object or direct object).
checked:
