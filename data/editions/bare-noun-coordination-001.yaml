id: bare-noun-coordination-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Two bare nouns joined by <i>and</i>
  summary: Two singular nouns with no article can be joined by <i>and</i> to name a pair, as in <i>husband and wife</i>.
  body: |-
    In <i>between husband and wife</i>, neither noun has a <i>the</i> or <i>a</i> before it, yet together they name a pair. The same happens in <i>He had pad and pencil</i>, where the two items are introduced as new.

    Context can make the pair work as the subject or object of a sentence. In <i>Bride and dog can be customized!</i>, the bride and the dog were already described earlier, so the pair is easy to identify. The pair can be a familiar one or a new one, as long as the link between the two is recoverable.
  examples:
    - text: '[between husband and wife]'
      from: entry
    - text: '[Bride and dog] can be customized!'
      from: entry
    - text: He had [pad and pencil].
      from: entry
  try: Think of a pair like <i>pen and paper</i>. Where can you use it with no article?
teacher:
  summary: For advanced classes, bare singular count nouns coordinated into a pair that can serve as an argument.
  explain: The pattern coordinates two bare singular count forms with <i>and</i>, presenting two linked individuals or roles through one phrase. Context may make the pair identifiable or introduce its members as new. In the invitation example, the preceding text introduces the bride and her dog, so the coordination can refer to their depictions. The pairing can support an argument use whose individual bare nouns would require separate licensing. This dictionary treats the pattern as a coordinate structure and marks it provisional. It relates it to a separate construction that licenses bare referential names.
  terms: Bare here means without an article or other determiner. This dictionary calls the pattern bare singular noun coordination.
  examples:
    - text: '[between husband and wife]'
      from: entry
    - text: '[Bride and dog] can be customized!'
      from: entry
    - text: He had [pad and pencil].
      from: entry
  contrasts:
    - text: He had pad and pencil.
      from: entry
      note: Attested object introducing the two items.
    - text: Bride and dog can be customized!
      from: entry
      note: Attested subject; the items are already salient.
  watch_for:
    - A learner might assume each noun in <i>pad and pencil</i> needs its own article, when the pair as a whole can work as an argument in context.
    - A learner might think the pair has to be already familiar, when this dictionary notes it can also introduce its members as new.
  activity: Students collect attested pairs of bare nouns from texts. For each, they say whether the context made the pair familiar or introduced it as new.
