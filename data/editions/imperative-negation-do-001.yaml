id: imperative-negation-do-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Telling someone not to
  summary: To tell someone not to do something, English uses <i>don't</i> or <i>do not</i>, even with <i>be</i>.
  body: |-
    <i>Don't look at me</i> and <i>Don't be afraid</i> are negative commands. <i>Don't</i> comes first, and the rest follows.

    The pattern uses <i>don't</i> even where a plain statement wouldn't. A statement uses <i>She isn't late</i>, but a negative command uses <i>Don't be late</i>. A speaker can add <i>you</i> for emphasis, as in <i>Don't you look at me!</i>, or use a word like <i>everyone</i>, as in <i>Don't everyone shout it out</i>.
  examples:
    - text: '[Don''t] look at me.'
      from: entry
    - text: '[Don''t] be afraid.'
      from: entry
    - text: '[Don''t] you look at me!'
      from: entry
    - text: '[Don''t] everyone shout it out.'
      from: entry
    - text: She isn't late.
      from: constructed
  try: Tell a friend not to be late, then not to be noisy. Do you say <i>don't</i> each time?
teacher:
  summary: Teaches negative commands with <i>don't</i>, including the contrast with <i>be</i> in declaratives.
  explain: 'A prohibitive imperative uses <i>do</i>-support for negation: <i>Don''t look at me</i>. This dictionary notes this holds even with <i>be</i>, where an auxiliary could negate in a declarative: <i>Don''t be afraid</i>, against <i>She isn''t late</i>. An overt subject can follow <i>don''t</i>, as in the emphatic <i>Don''t you look at me!</i> and in a quantified subject such as <i>Don''t everyone shout it out</i>. The negative inclusive <i>Let''s not leave</i> is a different imperative subtype. This dictionary marks its analysis as provisional.'
  terms: <i>Do</i>-support is the usual name. Prohibitive imperative is this dictionary’s term for a negative command.
  examples:
    - text: '[Don''t] look at me.'
      from: entry
    - text: '[Don''t] be afraid.'
      from: entry
    - text: '[Don''t] you look at me!'
      from: entry
    - text: '[Don''t] everyone shout it out.'
      from: entry
  contrasts:
    - text: Don't be late.
      from: constructed
      note: Imperative with <i>do</i>-support despite <i>be</i>.
    - text: She isn't late.
      from: constructed
      note: Declarative negation without <i>do</i>.
  watch_for:
    - A learner might negate <i>be</i> in an imperative as in a declarative, when this dictionary requires <i>do</i>-support.
    - A learner might treat <i>Let's not leave</i> as the same subtype as <i>Don't be late</i>.
    - A learner might place an overt subject before <i>don't</i> instead of after it.
  activity: Give students positive commands including some with <i>be</i>. They turn each into a negative command, then contrast with a statement such as <i>She isn't late</i>.
child:
  hook: How do you tell someone not to do something?
  explain: You can start with <i>Don't</i>. <i>Don't look at me</i> is a negative command. <i>Don't be afraid</i> uses <i>Don't</i> too, even with <i>be</i>.
  examples:
    - text: '[Don''t] look at me.'
      from: entry
    - text: '[Don''t] be afraid.'
      from: entry
  play: Tell your partner five things not to do, starting with <i>Don't</i>. Include one with <i>be</i>, like <i>Don't be late</i>.
