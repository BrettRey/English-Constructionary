id: imperative-negation-do-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Telling someone not to
  summary: To tell someone not to do something, English uses don't or do not, even with be.
  body: |-
    Don't look at me and Don't be afraid are negative commands. Don't comes first, and the rest follows.

    The pattern uses don't even where a plain statement wouldn't. A statement uses She isn't late, but a negative command uses Don't be late. A speaker can add you for emphasis, as in Don't you look at me!, or use a word like everyone, as in Don't everyone shout it out.
  examples:
    - text: '[Don''t] look at me.'
      from: entry
    - text: '[Don''t] be afraid.'
      from: entry
    - text: '[Don''t] you look at me!'
      from: entry
    - text: '[Don''t] everyone shout it out.'
      from: entry
    - text: She isn't late.
      from: constructed
  try: Tell a friend not to be late, then not to be noisy. Do you say don't each time?
teacher:
  summary: Teaches negative commands with don't, including the contrast with be in declaratives.
  explain: 'A prohibitive imperative uses do-support for negation: Don''t look at me. This dictionary notes this holds even with be, where an auxiliary could negate in a declarative: Don''t be afraid, against She isn''t late. An overt subject can follow don''t, as in the emphatic Don''t you look at me! and in a quantified subject such as Don''t everyone shout it out. The negative inclusive Let''s not leave is a different imperative subtype. This dictionary marks its analysis as provisional.'
  terms: Do-support is the usual name. Prohibitive imperative is this dictionary’s term for a negative command.
  examples:
    - text: '[Don''t] look at me.'
      from: entry
    - text: '[Don''t] be afraid.'
      from: entry
    - text: '[Don''t] you look at me!'
      from: entry
    - text: '[Don''t] everyone shout it out.'
      from: entry
  contrasts:
    - text: Don't be late.
      from: constructed
      note: Imperative with do-support despite be.
    - text: She isn't late.
      from: constructed
      note: Declarative negation without do.
  watch_for:
    - A learner might negate be in an imperative as in a declarative, when this dictionary requires do-support.
    - A learner might treat Let's not leave as the same subtype as Don't be late.
    - A learner might place an overt subject before don't instead of after it.
  activity: Give students positive commands including some with be. They turn each into a negative command, then contrast with a statement such as She isn't late.
child:
  hook: How do you tell someone not to do something?
  explain: You can start with Don't. Don't look at me is a negative command. Don't be afraid uses Don't too, even with be.
  examples:
    - text: '[Don''t] look at me.'
      from: entry
    - text: '[Don''t] be afraid.'
      from: entry
  play: Tell your partner five things not to do, starting with Don't. Include one with be, like Don't be late.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
