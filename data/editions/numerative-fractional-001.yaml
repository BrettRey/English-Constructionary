id: numerative-fractional-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Fraction words as nouns
  summary: In a fraction like <i>one fifth</i>, the word <i>fifth</i> names the size of the pieces and behaves like a noun.
  body: |-
    In <i>one fifth</i>, the word <i>fifth</i> names the size of the pieces, and the number in front counts them. Because it's a noun, it takes a plural ending when there's more than one: <i>one third</i>, but <i>two thirds</i>.

    Some fraction words are made by adding <i>-th</i> to a number word, as in <i>fifth</i>. Others, such as <i>half</i> and <i>quarter</i>, are separate words that aren't built that way. This dictionary treats <i>fifth</i> in a fraction as different from <i>fifth</i> in <i>fifth place</i>, where it describes a position and takes no plural, even though the two look the same.
  examples:
    - text: '[fifth]'
      from: entry
    - text: '[quarter]'
      from: entry
    - text: '[one third] and [two thirds]'
      from: constructed
  try: Say <i>one fifth</i>, then <i>two fifths</i>. What happens to the end of the word? Does <i>fifth place</i> change the same way?
teacher:
  summary: Separates fraction nouns (<i>three fifths</i>) from ordinal adjectives (<i>fifth place</i>), which share morphological material.
  explain: 'A fractional noun denotes a denominator and heads the nominal in a fraction NP, with the numerator in determiner function (<i>one fifth</i>). It''s a count noun and inflects for number: <i>one third</i>, <i>two thirds</i>. <i>Half</i> and <i>quarter</i> are suppletive, not formed with <i>-th</i>. The same form can be an ordinal adjective in another use: <i>fifth</i> in <i>fifth place</i> is adjectival and takes no plural, while <i>fifths</i> in <i>three fifths</i> takes plural marking and a cardinal determiner. This dictionary, which is provisional, treats these as separate categories despite the shared form.'
  terms: Fraction word, with numerator and denominator, are the traditional terms. Ordinal number is the traditional name for what this dictionary calls an ordinal adjective.
  examples:
    - text: '[fifth]'
      from: entry
    - text: '[quarter]'
      from: entry
  contrasts:
    - text: three [fifths]
      from: constructed
      note: Fractional noun, plural, with a cardinal determiner.
    - text: '[fifth] place'
      from: constructed
      note: Ordinal adjective, no plural marking.
  watch_for:
    - A learner might add plural marking to <i>fifth</i> in <i>fifth place</i>, as if it were the fraction noun.
    - A learner might expect <i>half</i> and <i>quarter</i> to be formed with <i>-th</i> like <i>fifth</i>.
  activity: Give students a pie drawn in fifths. They shade one, two and three pieces and write the fraction in words each time, then write a sentence using <i>fifth</i> to give a position in a race and compare the two uses.
child:
  hook: What happens to the word <i>third</i> when you have two pieces?
  explain: A fraction word names the size of the pieces. <i>One third</i> has one piece. With two pieces you say <i>two thirds</i>, adding an <i>s</i>. <i>Half</i> and <i>quarter</i> are special words.
  examples:
    - text: I coloured [two thirds] of the picture.
      from: constructed
    - text: She ate [one quarter] of the pizza.
      from: constructed
  play: Say <i>one third</i>, then <i>two thirds</i>. Now try <i>one fifth</i> and <i>two fifths</i>. Which part of the word changes when there's more than one piece?
