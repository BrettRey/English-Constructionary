id: exclamative-clause-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: What and how sentences of surprise
  summary: Some sentences start with what or how to present something as remarkable.
  body: |-
    What a fine player she is! and How generous you are! both present something as remarkable, as measured against what we'd expect. Each starts with a what or how phrase, then normally the person or thing, then the verb.

    These are clauses, meaning groups of words built around a verb. They can stand alone, as above, or sit inside a bigger sentence: I realised what a bargain it was. The usual order can change, as in How happy would he be if he could see her once more!, which is a marked but allowed pattern. A phrase with no verb, such as What a disaster!, isn't counted here.
  examples:
    - text: '[What a fine player she is!]'
      from: entry
    - text: '[How generous you are!]'
      from: entry
    - text: I realised [what a bargain it was].
      from: entry
    - text: '[How happy would he be if he could see her once more!]'
      from: entry
  try: Make your own sentence that starts with What a or How. Where does the verb come, before or after the person or thing?
teacher:
  summary: Helps students recognize what and how exclamatives as verb-headed clauses, and tell them from questions and from phrase-only exclamations.
  explain: 'An exclamative clause is a clause headed by a VP (normally tensed) and marked by an exclamative phrase based on what or how. It presents a proposition as holding to a remarkable degree or in a remarkable way, and characteristically makes an exclamatory statement. The exclamative phrase is normally initial and the Subject precedes the Predicator, though subject postposing and subject-auxiliary inversion are possible. It occurs in main clauses and as a subordinate content clause. Clause type isn''t the same as force: exclamation is a wider pattern of use. Phrase-only What a disaster! isn''t a headed clause in this dictionary; see the clause-analogue entry. What and how can also mark open interrogatives, and role, order, meaning and context separate the two.'
  terms: Exclamative clause is CGEL's term. Sentences like these are sometimes called exclamatory sentences.
  examples:
    - text: '[What a fine player she is!]'
      from: entry
    - text: '[How generous you are!]'
      from: entry
    - text: I realised [what a bargain it was].
      from: entry
    - text: '[How happy would he be if he could see her once more!]'
      from: entry
  watch_for:
    - A learner might treat any sentence beginning with what or how as an exclamative, when the same words can start an open interrogative.
    - A learner might take Subject-Predicator order as required, though the how-happy example shows a licensed inversion.
    - A learner might count What a disaster! as a verb-headed clause, when this dictionary treats it as phrase-only.
  activity: Students get strips with what/how sentences, some exclamatives and some questions (What did she play? alongside What a fine player she is!). They sort them and mark where the verb and subject fall.
child:
  hook: Which sentence shows surprise, What a fine player she is or What did she play?
  explain: Some sentences start with What a or How to show something is remarkable. What a fine player she is!
  examples:
    - text: '[What a fine player she is!]'
      from: entry
    - text: '[How generous you are!]'
      from: entry
    - text: '[What a big dog he is!]'
      from: constructed
  play: Look at a picture. Say something amazing about it that starts with What a or How.
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: "Fixed: curious.body and teacher.explain no longer make tense part of what a clause is or require it (the entry says headed exclamatives are normally tensed); child.explain no longer states subject-before-verb order as a rule (the entry allows subject postposing and inversion); curious.body says normally for the order."
