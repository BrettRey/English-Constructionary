id: means-by-gerund-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Saying how with <i>by</i> and an action word
  summary: <i>By</i> followed by an action that ends in <i>ing</i> says how something was done.
  body: |-
    In <i>Jo reopened the file by restoring a backup</i>, the restoring is the method. It's how Jo got the file back. The sentence presents the activity as the means by which the outcome was reached.

    Compare <i>Jo reopened the file after restoring a backup</i>. <i>After</i> gives the order of events but leaves the connection to context. <i>By</i> says more: the restoring is part of the method, not merely something that happened around the same time.
  examples:
    - text: Jo reopened the file [by restoring a backup].
      from: entry
    - text: Jo reopened the file after restoring a backup.
      from: entry
  try: Say how you got to school today, starting with <i>by</i> and an <i>ing</i> word. What would change if you used <i>after</i> instead?
teacher:
  summary: Helps explain <i>by</i> plus an <i>ing</i> phrase as the means by which something was done, and how it differs from <i>after</i>.
  explain: 'A PP with <i>by</i> and a gerund-participial clause presents an activity as the means of obtaining another outcome: <i>Jo reopened the file by restoring a backup</i>. The restoring is interpreted as part of the method, not merely a coincidental event in the same time period. Compare <i>after restoring a backup</i>, which supplies temporal order and leaves the means relation to context. This dictionary treats the <i>by</i>-phrase as a specialization of the prepositional phrase and relates it to infinitival purpose adjuncts.'
  terms: The <i>ing</i> form after a preposition is traditionally called a gerund. In this dictionary it is a gerund-participial clause inside a PP.
  examples:
    - text: Jo reopened the file [by restoring a backup].
      from: entry
  contrasts:
    - text: Jo reopened the file by restoring a backup.
      from: entry
      note: The restoring is the means.
    - text: Jo reopened the file after restoring a backup.
      from: entry
      note: <i>After</i> gives temporal order; the means relation is left to context.
  watch_for:
    - A learner might read <i>by restoring a backup</i> as showing only when something happened, when it gives the method.
    - A learner might treat <i>after restoring a backup</i> as saying the restoring was the method, when it supplies temporal order and leaves the means to context.
  activity: Students write what they did and how, using <i>by</i> and an <i>ing</i> phrase, then change <i>by</i> to <i>after</i>. Partners say whether the meaning changed and how.
child:
  hook: How did you get your shoes on this morning?
  explain: You can say how you did something with <i>by</i> and an <i>ing</i> word. <i>I opened the box by cutting the tape</i>. The cutting is how the box got opened.
  examples:
    - text: I opened the box [by cutting the tape].
      from: constructed
    - text: Jo reopened the file [by restoring a backup].
      from: entry
  play: Say how you do something with <i>by</i>. <i>I got warm by ...</i> <i>I made a friend by ...</i> Finish each one with an <i>ing</i> word, then try <i>after</i> instead of <i>by</i> with a partner.
