id: no-determiner-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>No</i> before a noun
  summary: Put before a noun, <i>no</i> says that there were zero instances of whatever the noun names.
  body: |-
    In <i>no books</i> and <i>no evidence</i>, the word <i>no</i> tells you that there were zero instances. <i>No books</i> means no books at all, and <i>no evidence</i> means an absence of evidence.

    <i>No</i> can go before a singular count noun, a plural count noun or a non-count noun. A clause with <i>We saw no damage</i> also normally takes a positive confirmation tag, such as <i>did we?</i> That ties the word before the noun to the sentence as a whole: it makes the whole sentence negative.
  examples:
    - text: '[no books]'
      from: entry
    - text: '[no evidence]'
      from: entry
    - text: We saw [no damage].
      from: constructed
  try: Say <i>We saw no damage</i>, then add <i>did we?</i> Does the sentence still feel negative?
teacher:
  summary: Teaches <i>no</i> as a determinative that quantifies a noun phrase down to zero, with clause polarity as a test.
  explain: '<i>No</i> is a determinative in determiner function: a determinative phrase headed by <i>no</i> is the determiner in the noun phrase. It construes the noun phrase as having zero members or instances. It can determine a singular count, plural count or non-count nominal. <i>We saw no damage</i> normally licenses a positive confirmation tag, which links the local determiner to wider clausal polarity. This dictionary separates those polarity diagnostics from the claim that the relevant quantity is zero. This dictionary treats <i>no</i> as interfacing with primary-auxiliary negation.'
  terms: This dictionary calls <i>no</i> a determinative (the word category) and uses determiner for the function it has in the noun phrase.
  examples:
    - text: '[no books]'
      from: entry
    - text: '[no evidence]'
      from: entry
  contrasts:
    - text: We saw no damage, did we?
      from: constructed
      note: The positive tag shows the clause is negative.
    - text: No dog barked.
      from: constructed
      note: <i>No</i> before a singular count noun.
  watch_for:
    - A learner might think <i>no</i> needs a plural noun after it.
    - A learner might expect <i>no</i> to need a negative verb as well, when <i>We saw no damage</i> already makes the clause negative.
  activity: Students write sentences with <i>no</i> before a plural noun, a singular noun and a non-count noun. They add a confirmation tag to one and compare it with the plain clause.
child:
  hook: What does <i>no</i> mean in <i>no books</i>?
  explain: When <i>no</i> comes before a word for a thing, it means zero, none at all. <i>No books</i> means there are no books. <i>No evidence</i> means there isn't any evidence.
  examples:
    - text: '[no books]'
      from: entry
    - text: '[no evidence]'
      from: entry
    - text: We saw [no damage].
      from: constructed
  play: Look around your room. Make a sentence that starts with <i>There is no</i> or <i>There are no</i>, naming something that is missing.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: child.explain no longer says no means zero before any word; it now ties the zero meaning to no before a noun, as in no books (the dictionary assigns it to no as a determiner in a noun phrase).'
