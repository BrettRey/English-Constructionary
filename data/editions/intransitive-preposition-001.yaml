id: intransitive-preposition-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Prepositions with no object
  summary: Some prepositions can do their job without a noun phrase after them, as outside does in She waited outside.
  body: |-
    Take in the garden: the preposition in has an object, the garden. But in She waited outside, outside stands alone. It has no object, yet it's still the same kind of word, a preposition.

    No object doesn't mean nothing follows. A preposition can take a phrase, as in owing to the rain, a description, as in as satisfactory, or a whole clause, as in because it rained. What it lacks is a noun phrase object.
  examples:
    - text: She waited [outside].
      from: entry
    - text: This happened [owing [to the rain]].
      from: entry
    - text: We left [because it rained].
      from: entry
    - text: That counts [as satisfactory].
      from: entry
  try: Say We waited outside and We waited outside the gate. What does the gate add?
teacher:
  summary: Explains that prepositions can be intransitive, lacking an object, without lacking a complement.
  explain: 'Intransitive here means no object, not no complement. A preposition without an NP object can be complementless, as in outside, or can take a PP complement (owing to the rain), a predicative complement (as satisfactory), or a clause complement (because it rained). The category remains preposition throughout. The PP can function as complement, modifier, adjunct or predicative. For complementless locative members such as outside, right or straight modification and from-embedding help distinguish PPs from adverb phrases: right outside, straight home, from abroad. This dictionary gives ago as intransitive-only, with an obligatory pre-head measure modifier, as in ten years ago. This dictionary marks the analysis as provisional.'
  terms: A word like outside in this use is sometimes called an adverb. CGEL, and this dictionary, treat them as prepositions heading PPs without an object.
  examples:
    - text: She waited [outside].
      from: entry
    - text: This happened [owing [to the rain]].
      from: entry
    - text: That counts [as satisfactory].
      from: entry
    - text: We left [because it rained].
      from: entry
    - text: ten years [ago]
      from: entry
    - text: Bill slept the afternoon [away].
      from: entry
  contrasts:
    - text: We waited outside.
      from: constructed
      note: No object.
    - text: We waited outside the gate.
      from: constructed
      note: The same word with a noun phrase object.
  watch_for:
    - A learner might think a preposition must be followed by a noun phrase.
    - A learner might read no object as meaning no complement, when to the rain (after owing) and it rained (after because) are complements.
  activity: Students list prepositions from a text and sort each use by whether a noun phrase object follows. They then find uses with a PP, predicative or clause complement.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
