id: corrective-but-coordination-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>Not this but that</i>"
  summary: The <i>not-but</i> pattern turns down one description and puts another in its place.
  body: |-
    In <i>I ordered not tea but coffee</i>, <i>not</i> marks tea as the wrong candidate, and <i>but</i> brings in the correction. The speaker is saying what was ordered by ruling out one choice and naming the right one.

    This differs from the <i>but</i> in a sentence like <i>It was cheap but good</i>. There, both parts can be asserted. In the <i>not-but</i> pattern the first part is rejected and the second is offered in its place. This dictionary treats the analysis as provisional.
  examples:
    - text: I ordered [not tea but coffee].
      from: entry
    - text: She wanted [not a quick answer but a good one].
      from: constructed
  try: Think of a time you corrected someone's guess. How would you say it with <i>not</i> and <i>but</i>?
teacher:
  summary: Helps explain <i>not X but Y</i> as a correction that rejects one description and substitutes another.
  explain: 'The pattern is a coordination of the form <i>not XP + but XP</i>. <i>Not</i> applies to the rejected candidate, and <i>but</i> introduces the correction: <i>I ordered not tea but coffee</i>. This differs from concessive <i>but</i>, where both coordinated propositions can be asserted (<i>It was cheap but good</i>). This dictionary treats the pattern as a specialization of coordination and marks the analysis as provisional.'
  terms: This dictionary calls the pattern corrective <i>not X but Y</i> and sets it apart from concessive <i>but</i>.
  examples:
    - text: I ordered [not tea but coffee].
      from: entry
    - text: She wanted [not a quick answer but a good one].
      from: constructed
  contrasts:
    - text: I ordered not tea but coffee.
      from: entry
      note: Corrective; tea is rejected, coffee substituted.
    - text: It was cheap but good.
      from: constructed
      note: Concessive but; both parts are asserted.
  watch_for:
    - A learner might read <i>not tea but coffee</i> as concessive <i>but</i>, as if both were ordered.
    - A learner might attach <i>not</i> only to the verb rather than to the rejected candidate.
  activity: Give students mistaken statements ("<i>You ordered tea.</i>"). They correct each one aloud with a <i>not X but Y</i> sentence, then rewrite one as a concessive <i>but</i> sentence and compare the meanings.
child:
  hook: How do you tell someone they guessed wrong and give the right answer?
  explain: You can say what something isn't and then what it is. <i>I ordered not tea but coffee</i>. The first thing is turned down. The second is the right one.
  examples:
    - text: I ordered [not tea but coffee].
      from: entry
    - text: We went to [not the park but the beach].
      from: constructed
  play: Make up two guesses about what's in a box. Correct each with not and but. Who can come up with the silliest right answer?
