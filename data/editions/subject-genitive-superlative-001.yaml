id: subject-genitive-superlative-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Worked our hardest
  summary: A verb followed by a genitive and a superlative, as in worked our hardest, says the effort reached its highest point.
  body: |-
    In worked our hardest, the word our points back to the people doing the work, and hardest describes their effort. There's no noun after hardest. The phrase supplies a degree, a standard of how hard.

    A version with at is also possible with some verbs: They worked at their hardest. The two don't have exactly the same range. Be at one's best is another at-pattern.

    This dictionary marks the analysis as provisional and leaves open what grammatical role the bare phrase has.
  examples:
    - text: Kate and I have [worked our hardest] to raise them that way.
      from: entry
    - text: They [worked at their hardest].
      from: entry
    - text: They [worked their hardest].
      from: entry
  try: Say They worked their hardest and They worked at their hardest. Do they feel the same to you?
teacher:
  summary: Optional enrichment on worked their hardest and the related at-pattern.
  explain: 'The pattern is a clause with a subject and a verb followed by a phrase whose genitive is linked to the subject and whose superlative sets a high degree: our refers to those doing the work, and hardest characterizes their effort. The postverbal expression has no overt noun. A linked at-pattern is available with some verbs, with a different range (be at one''s best). The cited work uses the label objoid for the position and unusual object profile. This dictionary leaves the grammatical function of the bare phrase open, and the head analysis is open, so avoid presenting one analysis as settled.'
  terms: Objoid is the label in the cited work. This dictionary leaves the function of the bare phrase open.
  examples:
    - text: Kate and I have [worked our hardest] to raise them that way.
      from: entry
    - text: They [worked their hardest].
      from: entry
  contrasts:
    - text: They worked at their hardest.
      from: entry
      note: The at-pattern, with the same verb.
    - text: They worked their hardest.
      from: entry
      note: The bare variant.
  watch_for:
    - A learner might look for a noun after hardest, when the phrase has no overt noun.
    - A learner might read our or their as owning something, when it tracks the subject.
  activity: Students complete They worked ___ hardest and We tried ___ hardest with the matching genitive for each subject. They check that the genitive refers to the people doing the work.
checked:
