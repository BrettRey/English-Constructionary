id: subject-genitive-superlative-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Worked our hardest</i>
  summary: A verb followed by a genitive and a superlative, as in <i>worked our hardest</i>, says the effort reached its highest point.
  body: |-
    In <i>worked our hardest</i>, the word <i>our</i> points back to the people doing the work, and <i>hardest</i> describes their effort. There's no noun after <i>hardest</i>. The phrase supplies a degree, a standard of how hard.

    A version with <i>at</i> is also possible with some verbs: <i>They worked at their hardest</i>. The two don't have exactly the same range. <i>Be at one's best</i> is another at-pattern.

    This dictionary marks the analysis as provisional and leaves open what grammatical role the bare phrase has.
  examples:
    - text: Kate and I have [worked our hardest] to raise them that way.
      from: entry
    - text: They [worked at their hardest].
      from: entry
    - text: They [worked their hardest].
      from: entry
  try: Say <i>They worked their hardest</i> and <i>They worked at their hardest</i>. Do they feel the same to you?
teacher:
  summary: Optional enrichment on <i>worked their hardest</i> and the related at-pattern.
  explain: 'The pattern is a clause with a subject and a verb followed by a phrase whose genitive is linked to the subject and whose superlative sets a high degree: <i>our</i> refers to those doing the work, and <i>hardest</i> characterizes their effort. The postverbal expression has no overt noun. A linked at-pattern is available with some verbs, with a different range (<i>be at one''s best</i>). The cited work uses the label objoid for the position and unusual object profile. This dictionary leaves the grammatical function of the bare phrase open, and the head analysis is open, so avoid presenting one analysis as settled.'
  terms: Objoid is the label in the cited work. This dictionary leaves the function of the bare phrase open.
  examples:
    - text: Kate and I have [worked our hardest] to raise them that way.
      from: entry
    - text: They [worked their hardest].
      from: entry
  contrasts:
    - text: They worked at their hardest.
      from: entry
      note: The at-pattern, with the same verb.
    - text: They worked their hardest.
      from: entry
      note: The bare variant.
  watch_for:
    - A learner might look for a noun after <i>hardest</i>, when the phrase has no overt noun.
    - A learner might read <i>our</i> or <i>their</i> as owning something, when it tracks the subject.
  activity: Students complete <i>They worked ___ hardest</i> and <i>We tried ___ hardest</i> with the matching genitive for each subject. They check that the genitive refers to the people doing the work.
