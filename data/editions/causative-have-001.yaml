id: causative-have-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Having someone do something
  summary: In a sentence like I'll have Jo check the figures, the speaker arranges for someone else to do the checking.
  body: |-
    In I'll have Jo check the figures, the subject arranges, instructs or brings about an event. Jo is the one who does the checking, and the verb after Jo is in its plain form, check, with no to.

    In Had Kai replace the roof, Kai is likewise the understood replacer. A nearby pattern looks similar but works differently. In Had the roof replaced, the roof is what is affected, and the sentence can describe an arrangement. Had his phone stolen can describe an unwanted experience instead.
  examples:
    - text: I'll [have Jo check the figures].
      from: entry
  try: Say I'll have Jo check the figures. Who does the checking, you or Jo?
teacher:
  summary: Helps separate causative have from perfect have and from the affected-object pattern (had the roof replaced).
  explain: 'In causative have, the subject presents an event as arranged, instructed or brought about, and the noun phrase after have (Jo) is the one who carries it out, followed by a bare infinitival (the infinitive without to). I''ll have Jo check the figures: Jo undertakes the checking. Compare perfect have (Jo has checked the figures), where have is an auxiliary, and affected have (have the figures checked), where the object is what is affected and no one is named as the doer.'
  terms: 'Bare infinitival: an infinitival with no to; in this pattern it is check the figures. Perfect have is the auxiliary in has checked. Affected have is the pattern in had the roof replaced.'
  examples:
    - text: I'll [have Jo check the figures].
      from: entry
  contrasts:
    - text: I'll have Jo check the figures.
      from: entry
      note: Causative have. Jo is the one who checks.
    - text: Jo has checked the figures.
      from: constructed
      note: Perfect have. Has is an auxiliary.
    - text: I'll have the figures checked.
      from: constructed
      note: Affected have. The figures are what is affected.
  watch_for:
    - A learner might read have in have Jo check as perfect have.
    - A learner might take Jo to be the thing affected, when Jo is the understood checker.
    - A learner might expect to before check, though the pattern has a bare infinitival.
  activity: Write sentences on strips using have Jo check, have the figures checked and has checked. Students sort them by whether someone is arranged to act, something is affected, or it is the perfect have in has checked.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: teacher.terms now gives the bare infinitival as check the figures, not the plain verb form alone; teacher.activity no longer defines perfect have as completion. Also fixed: teacher.explain tied to Jo as in the entry''s example. Second round: fixed the perfect-have contrast note by cutting ''nothing is arranged'' (this dictionary doesn''t rule out an arrangement behind Jo has checked the figures); also fixed (unflagged) curious.body, which presented Had Kai replace the roof as a different pattern though this dictionary''s note gives it as causative have with Kai as the understood replacer. Dismissed: the two flags on calling perfect have an auxiliary (CGEL''s standard classification, which this dictionary presupposes in contrasting perfect have with causative have).'
