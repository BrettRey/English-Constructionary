id: causative-have-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Having someone do something
  summary: In a sentence like <i>I'll have Jo check the figures</i>, the speaker arranges for someone else to do the checking.
  body: |-
    In <i>I'll have Jo check the figures</i>, the subject arranges, instructs or brings about an event. Jo is the one who does the checking, and the verb after Jo is in its plain form, <i>check</i>, with no <i>to</i>.

    In <i>Had Kai replace the roof</i>, Kai is likewise the understood replacer. A nearby pattern looks similar but works differently. In <i>Had the roof replaced</i>, the roof is what is affected, and the sentence can describe an arrangement. <i>Had his phone stolen</i> can describe an unwanted experience instead.
  examples:
    - text: I'll [have Jo check the figures].
      from: entry
  try: Say <i>I'll have Jo check the figures</i>. Who does the checking, you or Jo?
teacher:
  summary: Helps separate causative <i>have</i> from perfect <i>have</i> and from the affected-object pattern (<i>had the roof replaced</i>).
  explain: 'In causative <i>have</i>, the subject presents an event as arranged, instructed or brought about, and the noun phrase after <i>have</i> (<i>Jo</i>) is the one who carries it out, followed by a bare infinitival (the infinitive without <i>to</i>). <i>I''ll have Jo check the figures</i>: Jo undertakes the checking. Compare perfect <i>have</i> (<i>Jo has checked the figures</i>), where <i>have</i> is an auxiliary, and affected <i>have</i> (<i>have the figures checked</i>), where the object is what is affected and no one is named as the doer.'
  terms: 'Bare infinitival: an infinitival with no <i>to</i>; in this pattern it is <i>check the figures</i>. Perfect <i>have</i> is the auxiliary in <i>has checked</i>. Affected <i>have</i> is the pattern in <i>had the roof replaced</i>.'
  examples:
    - text: I'll [have Jo check the figures].
      from: entry
  contrasts:
    - text: I'll have Jo check the figures.
      from: entry
      note: Causative <i>have</i>. Jo is the one who checks.
    - text: Jo has checked the figures.
      from: constructed
      note: Perfect <i>have</i>. <i>Has</i> is an auxiliary.
    - text: I'll have the figures checked.
      from: constructed
      note: Affected <i>have</i>. The figures are what is affected.
  watch_for:
    - A learner might read <i>have</i> in <i>have Jo check</i> as perfect <i>have</i>.
    - A learner might take Jo to be the thing affected, when Jo is the understood checker.
    - A learner might expect <i>to</i> before <i>check</i>, though the pattern has a bare infinitival.
  activity: Write sentences on strips using <i>have Jo check</i>, <i>have the figures checked</i> and <i>has checked</i>. Students sort them by whether someone is arranged to act, something is affected, or it is the perfect <i>have</i> in <i>has checked</i>.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: teacher.terms now gives the bare infinitival as check the figures, not the plain verb form alone; teacher.activity no longer defines perfect have as completion. Also fixed: teacher.explain tied to Jo as in the entry''s example. Second round: fixed the perfect-have contrast note by cutting ''nothing is arranged'' (this dictionary doesn''t rule out an arrangement behind Jo has checked the figures); also fixed (unflagged) curious.body, which presented Had Kai replace the roof as a different pattern though this dictionary''s note gives it as causative have with Kai as the understood replacer. Dismissed: the two flags on calling perfect have an auxiliary (CGEL''s standard classification, which this dictionary presupposes in contrasting perfect have with causative have).'
