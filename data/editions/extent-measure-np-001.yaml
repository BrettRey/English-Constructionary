id: extent-measure-np-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Saying how far
  summary: After a verb of movement, a measured distance can answer the question "<i>how far</i>".
  body: |-
    In <i>We walked three kilometres before lunch</i>, the phrase <i>three kilometres</i> says how far the walking went. It measures the distance covered, or the spatial extent of something.

    That differs from a measure of time. <i>Walked three kilometres</i> measures distance, while <i>walked for an hour</i> measures how long the walking lasted and uses a <i>for</i> phrase. A separate phrase can also say where the walking led.
  examples:
    - text: We walked [three kilometres] before lunch.
      from: entry
    - text: They ran [two kilometres] along the river.
      from: constructed
  try: Say how far you walk to school, or to a shop. Which words in your sentence give the distance?
teacher:
  summary: Helps explain measure phrases like <i>three kilometres</i> after a motion verb, and how they differ from objects and duration phrases.
  explain: 'A measure NP after a motion or spatial verb measures traversed distance or the spatial extent of a configuration: <i>We walked three kilometres before lunch</i>. The NP answers <i>how far</i> and usually lacks an ordinary active-object/passive-subject alternation, so it doesn''t behave like a typical object. A goal phrase can independently say where the walking led. Distance (<i>three kilometres</i>) is kept apart from duration (<i>for an hour</i>, a <i>for</i>-PP). This dictionary marks the analysis as provisional, with medium confidence.'
  terms: Measure phrase is the usual name. Traditional grammar sometimes treats such phrases as adverbials of distance.
  examples:
    - text: We walked [three kilometres] before lunch.
      from: entry
  contrasts:
    - text: We walked three kilometres.
      from: constructed
      note: Measures distance, answering <i>how far</i>.
    - text: We walked for an hour.
      from: constructed
      note: Measures duration with a <i>for</i> phrase.
  watch_for:
    - A learner might treat <i>three kilometres</i> as an ordinary object that could become the subject of a passive.
    - A learner might mix up a distance phrase (<i>three kilometres</i>) with a duration phrase (<i>for an hour</i>).
  activity: Students write how far they went on a recent trip, then rewrite it to say how long it took. They label each phrase as distance or duration.
child:
  hook: How could you answer <i>How far did we walk?</i>
  explain: You can say a distance right after the verb. <i>We walked three kilometres</i>. The words <i>three kilometres</i> tell <i>how far</i>.
  examples:
    - text: We walked [three kilometres] before lunch.
      from: entry
    - text: They ran [two kilometres] along the river.
      from: constructed
  play: Pick a way to move, like walking, running or swimming. Say a sentence that tells how far you went. Then say how long it took, using <i>for</i>.
