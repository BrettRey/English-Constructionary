id: absolute-negator-determinative-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Negative words that stand in for a noun phrase
  summary: Words like <i>nobody</i>, <i>nothing</i> and <i>none</i> can make a whole sentence negative without a separate <i>not</i>.
  body: |-
    In <i>Nobody knew where Kim was</i>, the word <i>nobody</i> does two jobs. It fills the place of the person who knew, and it makes the whole sentence negative. The same goes for <i>nothing</i> in <i>Kim had done nothing about it</i>, and for <i>none</i> in <i>We liked none of them</i>.

    This dictionary treats <i>nobody</i>, <i>nothing</i>, <i>nowhere</i>, <i>no one</i> and <i>no place</i> as compounds of the word <i>no</i>, and <i>none</i> as another form of <i>no</i>. They aren't pronouns here. A sentence with one of them can be rephrased with a verb negated and a word like any, as in <i>Kim didn't do anything about it</i>.
  examples:
    - text: '[Nobody] knew where Kim was.'
      from: entry
    - text: Kim had done [nothing] about it.
      from: entry
    - text: We liked [none] of them.
      from: entry
  try: Take a sentence with <i>nothing</i> in it and say it again with <i>didn't</i> and <i>anything</i>. Do the two versions give the same message?
teacher:
  summary: Useful for showing that <i>nobody</i>, <i>nothing</i> and <i>none</i> carry the negation of the clause themselves.
  explain: '<i>No</i> and <i>none</i> are the dependent and independent forms of the determinative <i>no</i>. <i>Nobody</i>, <i>no one</i>, <i>nothing</i>, <i>nowhere</i> and <i>no place</i> are single-word compounds of <i>no</i>. All of these are determinatives. Standing alone as noun phrases, they are in fused determiner-head function: one word is both determiner and head. Their negative meaning is carried up to the whole clause, so the clause counts as negative without a separate not. The same message can be expressed with verbal negation plus <i>any</i>, <i>either</i> or <i>ever</i>, as in <i>didn''t do anything</i>.'
  terms: Traditional grammars may call <i>nobody</i> and <i>nothing</i> negative pronouns. This grammar treats them as determinatives, with <i>none</i> as a form of the determinative <i>no</i> and the others as compounds of <i>no</i>.
  examples:
    - text: '[Nobody] knew where Kim was.'
      from: entry
    - text: Kim had done [nothing] about it.
      from: entry
    - text: We liked [none] of them.
      from: entry
  contrasts:
    - text: Kim had done nothing about it.
      from: entry
      note: The negative word is the object.
    - text: Kim hadn't done anything about it.
      from: constructed
      note: Verbal negation plus <i>any</i> gives a parallel way to be negative.
  watch_for:
    - A learner might look for a separate <i>not</i> in <i>Nobody knew where Kim was</i>, when <i>nobody</i> itself makes the clause negative.
    - A learner might treat <i>none</i> as unrelated to <i>no</i>, when it is the independent form of the same determinative.
  activity: Give pairs a set of sentences with <i>nobody</i>, <i>nothing</i> and <i>none</i>. Each pair rewrites each one with a negated verb and <i>any</i>, then says whether the message stays the same.
child:
  hook: How can a sentence say no without the word <i>not</i>?
  explain: Words like <i>nobody</i>, <i>nothing</i> and <i>none</i> make a sentence mean no all by themselves. You don't need <i>not</i>. You can also say the idea another way, with <i>didn't</i> and <i>anything</i>.
  examples:
    - text: '[Nobody] ate the last cookie.'
      from: constructed
    - text: I found [nothing] under the bed.
      from: constructed
    - text: I didn't find anything under the bed.
      from: constructed
  play: Say a sentence with <i>nobody</i> or <i>nothing</i>. Then say it again with <i>didn't</i> and <i>anybody</i> or <i>anything</i>. Take turns.
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: "Fixed: teacher explanation and terms now say that no and none are the dependent and independent forms of the determinative no, while nobody, no one, nothing, nowhere and no place are single-word compounds of no (as the entry has it); terms no longer gives a rationale the entry lacks; curious 'try' question reworded to ask whether the two versions give the same message."
