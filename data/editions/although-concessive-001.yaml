id: although-concessive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Admitting a drawback with <i>although</i>
  summary: An <i>although</i> phrase acknowledges something that might have counted against the main claim.
  body: |-
    In <i>Although the steps were icy, we reached the door</i>, both things are presented as true. The steps were icy, and we reached the door. The contrast comes from an expectation about what the ice might have stopped.

    <i>Even if</i> works differently. In <i>Even if the steps are icy, we'll reach the door</i>, the ice is uncertain, so the sentence concedes a possibility rather than a fact.
  examples:
    - text: '[Although the steps were icy], we reached the door.'
      from: entry
    - text: '[Even if the steps are icy], we’ll reach the door.'
      from: entry
  try: 'Finish this sentence: <i>Although it was late, ...</i> Does your ending go against what <i>late</i> might lead us to expect?'
teacher:
  summary: Shows <i>although</i> as a way to concede a circumstance that might have counted against the main claim.
  explain: An <i>although</i> phrase is a PP with a finite clause or a licensed reduced predication. It acknowledges a circumstance that might have counted against the main claim. Both the ice and the arrival are presented as actual, and the contrast comes from an expectation about what the ice might impede. Compare <i>even if</i>, which gives a conditional concession and leaves the ice uncertain. This dictionary treats the <i>although</i> phrase as a specialization of PP and marks the analysis provisional.
  terms: Textbooks may call <i>although</i> a subordinating conjunction. This dictionary treats <i>although</i> as the head of a PP.
  examples:
    - text: '[Although the steps were icy], we reached the door.'
      from: entry
    - text: '[Even if the steps are icy], we’ll reach the door.'
      from: entry
  contrasts:
    - text: Although the steps were icy, we reached the door.
      from: entry
      note: The ice is presented as actual.
    - text: Even if the steps are icy, we'll reach the door.
      from: entry
      note: The ice is left uncertain.
  watch_for:
    - A learner might treat the <i>although</i> clause as uncertain, when both the ice and the arrival are presented as actual.
    - A learner might read the contrast as being between the two clauses alone, when it comes from an expectation about what the ice might impede.
  activity: Students complete <i>although</i> sentences, then say what expectation each one goes against. They compare with the same ideas expressed with <i>even if</i>.
child:
  hook: What does "<i>although</i>" tell us might have stopped us?
  explain: <i>Although</i> shows something that might have stopped us, but didn't. <i>Although the steps were icy, we reached the door.</i> The steps really were icy.
  examples:
    - text: '[Although the steps were icy], we reached the door.'
      from: entry
    - text: '[Although it was raining], we played outside.'
      from: constructed
  play: Start with <i>although</i> and a problem, like being tired or cold. Then say what happened anyway. Take turns with a partner.
