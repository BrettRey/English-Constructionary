id: adjectival-raising-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>Likely to</i>, said of a whole situation"
  summary: With a word like <i>likely</i>, the sentence judges a whole situation rather than describing the person it starts with.
  body: |-
    In <i>Liz was likely to convince them</i>, the word <i>likely</i> doesn't describe Liz. It assesses a situation: Liz convincing them. That's why <i>They were likely to be convinced by Liz</i> describes the same situation.

    It also explains <i>There is likely to be enough food left</i>, where the opening <i>there</i> isn't a person or thing that could be likely. Compare <i>determined to leave</i>, where the adjective says something about its subject: someone is determined. There the opening word can't be an empty <i>there</i>.
  examples:
    - text: '[There is likely to be enough food left.]'
      from: entry
    - text: '[Liz was likely to convince them.]'
      from: entry
  try: Say <i>Liz was likely to convince them</i>, and then <i>They were likely to be convinced by Liz</i>. Does the situation stay the same?
teacher:
  summary: For advanced classes, shows how <i>likely</i> assesses a situation expressed by the infinitival, unlike <i>determined</i>.
  explain: 'In the raising pattern, the subject belongs to the infinitival predication, and the adjective assesses the whole situation. Evidence in this dictionary: <i>likely</i> permits dummy <i>there</i> as subject (<i>There is likely to be enough food left</i>), and an active and a passive version describe the same situation (<i>Liz was likely to convince them</i>; <i>They were likely to be convinced by Liz</i>). In <i>determined to leave</i>, the adjective ascribes determination to its subject and does not permit dummy <i>there</i>. This dictionary sets raising apart from the tough construction, in which the matrix subject is linked to a non-subject gap.'
  terms: Raising adjective is the label used for <i>likely</i> in this pattern. Dummy <i>there</i> is the empty subject <i>there</i>.
  examples:
    - text: '[There is likely to be enough food left.]'
      from: entry
    - text: '[Liz was likely to convince them.]'
      from: entry
  contrasts:
    - text: Liz was likely to convince them.
      from: entry
      note: "<i>Likely</i> assesses the situation of Liz convincing them."
    - text: Kim was determined to leave.
      from: constructed
      note: "<i>Determined</i> ascribes determination to Kim, so dummy <i>there</i> doesn't fit here."
  watch_for:
    - A learner might read <i>Liz was likely to convince them</i> as saying something about Liz herself, when <i>likely</i> assesses the situation.
    - A learner might treat <i>likely</i> and <i>determined</i> as the same pattern because both are followed by <i>to</i>, when this dictionary shows they differ.
  activity: Give students pairs of adjectives followed by <i>to</i>-infinitivals (<i>likely</i> and <i>determined</i>). They test each with an active and passive version of the same situation and decide which adjective stays about the same situation.
