id: deverbal-able-adjective-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Adjectives ending in <i>-able</i>
  summary: In its central pattern, adding <i>-able</i> to a verb gives an adjective that says something can have that action done to it.
  body: |-
    <i>Searchable</i> describes a document that someone can search. <i>Readable</i> normally describes what people can read. So a new <i>-able</i> adjective built on a verb that takes an object normally describes the thing the action would be done to, not the person doing it. There are related forms in <i>-ible</i>.

    Some verbs bring a small word along. <i>Dependable</i> is built on <i>depend on</i>, and it describes what you can depend on.

    Not every case fits. <i>Perishable</i> doesn't simply mean that something <i>can be perished</i>, so some <i>-able</i> words go beyond this central meaning.
  examples:
    - text: The document is [searchable].
      from: entry
    - text: A [dependable] source is hard to find.
      from: entry
  try: Take a verb you use and add <i>-able</i>. Does the new word describe the thing the action would happen to?
teacher:
  summary: Helps explain that an <i>-able</i> adjective built on a transitive verb is oriented to the verb's object, and that its central reading can be paraphrased as <i>can be Xed</i>.
  explain: 'A deverbal adjective in <i>-able</i> (or <i>-ible</i>) characterizes a potential participant of an action by the possibility or suitability of that action. With a transitive base the adjective is oriented to the base verb''s object: <i>readable</i> describes what people can read. The central reading can typically be paraphrased with a modal passive (<i>can be searched</i>). A prepositional verb can supply an oblique participant, as in <i>dependable</i> (<i>depend on</i>). Intransitive-base and lexicalized readings, such as <i>perishable</i>, extend beyond this central pattern.'
  terms: The paraphrase can be called a modal passive.
  examples:
    - text: The document is [searchable].
      from: entry
    - text: A [dependable] source is hard to find.
      from: entry
  contrasts:
    - text: This fabric washes well.
      from: entry
      note: A related idea in a clause with an active verb; <i>washable</i> is the adjective counterpart.
  watch_for:
    - A learner might read <i>dependable</i> as describing the person who depends, when it describes what can be depended on.
    - A learner might assume every <i>-able</i> word means <i>can be Xed</i>, though <i>perishable</i> and other lexicalized forms extend beyond that pattern.
  activity: Students list verbs from a class text, add <i>-able</i> where it makes a word they know, and paraphrase each as <i>can be Xed</i>. They flag any word that doesn't paraphrase that way.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: curious summary and body and teacher summary now confine object orientation to the central (transitive-base) pattern, as the entry does, and mention readings that go beyond it; dropped the claim that some -able words ''drifted'' from the central meaning; dropped the unsupported ''verbal adjectives'' traditional-term mapping.'
