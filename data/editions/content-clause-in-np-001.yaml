id: content-clause-in-np-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Nouns that come with a that-clause
  summary: A noun such as claim or fact can be followed by a clause that spells out its content.
  body: |-
    In The claim that Jo knew the code surprised us, the that-clause says what the claim was: Jo knew the code. Nothing in that clause is missing or points back to claim.

    Compare The claim that Jo rejected surprised us. Here Jo rejected the claim, so the clause is missing something, the thing rejected, and that something is the claim. The rumour that Jo had left gives the content of the rumour. The rumour that Jo spread works like the second claim sentence: it has a missing object that is the rumour.
  examples:
    - text: The [claim that Jo knew the code] surprised us.
      from: entry
    - text: The claim [that Jo rejected] surprised us.
      from: entry
  try: Compare the rumour that Jo had left and the rumour that Jo spread. In which one is something missing from the clause?
teacher:
  summary: Helps students separate a noun's content clause from a relative clause that looks the same.
  explain: 'A noun such as claim or fact can take a finite content clause that supplies the propositional content associated with it: the claim that Jo knew the code. The embedded clause (Jo knew the code) is complete and has no gap linked to claim. In the claim that Jo rejected, the string that Jo rejected, which opens like the content clause above, is an integrated relative clause with an object gap corresponding to claim. So a clause after a noun can be a content clause or a relative clause, and the difference is whether the clause has a gap linked to the noun.'
  terms: 'Content clause: a clause giving propositional content. Integrated relative: a relative clause closely tied to its noun.'
  examples:
    - text: The [claim that Jo knew the code] surprised us.
      from: entry
    - text: The claim [that Jo rejected] surprised us.
      from: entry
  contrasts:
    - text: The rumour that Jo had left surprised us.
      from: constructed
      note: Content clause. It gives the content of the rumour; nothing is missing.
    - text: The rumour that Jo spread surprised us.
      from: constructed
      note: Integrated relative. The clause has an object gap linked to rumour.
  watch_for:
    - A learner might treat the claim that Jo rejected as a content clause, when Jo rejected the claim and the clause has a gap.
    - A learner might assume that-clauses after a noun all work alike, when the gap test separates two types.
  activity: Give students noun phrases like the rumour that Jo had left and the rumour that Jo spread. They test each by asking whether the clause has a gap linked to the noun (what was spread?), then label content clause or relative clause.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: teacher.explain no longer calls the two clauses the same string (that Jo knew the code vs that Jo rejected); teacher.activity uses the gap-linked-to-the-noun test the entry gives, not completeness on its own.'
