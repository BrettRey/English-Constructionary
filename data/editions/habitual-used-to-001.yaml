id: habitual-used-to-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>Used to</i>"
  summary: "<i>Used to</i> followed by a plain verb describes a habit or a state that belonged to a past period."
  body: |-
    <i>The shop used to close at noon</i> tells us that closing at noon was the regular pattern at some earlier time. <i>Used to</i> can also describe a past state, as in <i>Jo used to own it</i>.

    The present-tense counterpart, <i>use to</i>, doesn't parallel this by describing a current habit in an ordinary affirmative sentence.
  examples:
    - text: The shop [used to close] at noon.
      from: entry
    - text: Jo [used to own] it.
      from: entry
  try: Say something about a place near you that has changed, starting with <i>It used to ...</i>
teacher:
  summary: Helps students use <i>used to</i> for past habits and states and see how it differs from the present.
  explain: 'The pattern is <i>used to</i> plus a plain-form verb: <i>The shop used to close at noon</i>. It presents a habitual situation or state as characteristic of a past period, so it covers habits and states: <i>Jo used to own it</i>. This dictionary says the present counterpart <i>use to</i> does not express a parallel current habit in ordinary affirmative clauses. It treats it as a specialization of VP structure, related to the past tense, and marks the analysis as provisional.'
  terms: Often taught as the past habitual or <i>used to</i> + infinitive.
  examples:
    - text: The shop [used to close] at noon.
      from: entry
    - text: Jo [used to own] it.
      from: entry
  watch_for:
    - A learner might use <i>use to</i> for a present habit in an affirmative sentence, when it doesn't parallel <i>used to</i>.
    - A learner might think <i>used to</i> covers only repeated actions, when it also covers states like owning.
  activity: Students write two sentences with <i>used to</i> about how their town has changed, one a habit and one a state, then swap and decide which is which.
child:
  hook: How do you talk about how things were?
  explain: "<i>Used to</i> talks about how things were in the past. <i>The shop used to close at noon</i>."
  examples:
    - text: The shop [used to close] at noon.
      from: entry
    - text: Jo [used to own] it.
      from: entry
  play: Tell a partner two things that <i>used to</i> be true for you. Start each with <i>I used to</i>.
