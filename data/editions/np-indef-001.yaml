id: np-indef-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Phrases that bring in something new
  summary: Phrases like <i>a dog</i> or <i>some students</i> bring something into the conversation without assuming the listener already knows which one.
  body: |-
    In <i>A dog barked</i>, the phrase <i>a dog</i> brings in a dog without saying which one. The speaker may know exactly which dog it was, but the sentence leaves it unstated. <i>Some students passed</i> works the same way for a part of a group.

    The same small word can also sort things into a type instead of pointing to something. In <i>She is a teacher</i>, <i>a teacher</i> tells us what she is. And <i>There was a spare key in the box</i> introduces a key that nobody has mentioned yet.
  examples:
    - text: '[A dog] barked.'
      from: entry
    - text: '[Some students] passed.'
      from: entry
    - text: She is [a teacher].
      from: entry
    - text: There's [a dog] in the yard.
      from: entry
  try: Say <i>A dog barked</i> and then <i>The dog barked</i>. When would you pick each one?
teacher:
  summary: Shows indefinite NPs introducing new referents, classifying, or describing a role, and how they contrast with definite NPs.
  explain: 'An indefinite NP consists of an indefinite determiner (<i>a</i>, <i>an</i>, <i>some</i>) with a nominal, or an existential quantifier with a nominal, or a bare plural or non-count nominal. The dictionary lists readings: a non-identifiable instance (<i>A dog barked</i>), a partial set (<i>Some students passed</i>), a role instance or classification (<i>She became a manager</i>), a subkind (<i>That is a type of fish</i>), a characteristic property, existence (<i>There''s a dog in the yard</i>) and a taxonomic type. Even in <i>A dog barked</i> the speaker can have a specific dog in mind. In <i>She is a teacher</i>, the same article heads a classification with no separate referent. Definiteness effects in existentials depend on information status as well as nominal marking. The dictionary marks this account as provisional.'
  terms: "<i>A</i> and <i>an</i> are determinatives, often called the indefinite article. Existential <i>there</i> is the <i>there</i> in <i>There's a dog in the yard</i>."
  examples:
    - text: '[A dog] barked.'
      from: entry
    - text: '[Some students] passed.'
      from: entry
    - text: She became [a manager].
      from: entry
    - text: There's [a dog] in the yard.
      from: entry
    - text: That counts as [a sport].
      from: entry
  contrasts:
    - text: '[A dog] barked.'
      from: entry
      note: Non-identifiable; introduces a dog.
    - text: '[The dog] barked.'
      from: constructed
      note: Definite; the dog is identifiable.
  watch_for:
    - A learner might think <i>a</i> means the speaker has no particular dog in mind.
    - A learner might read <i>a teacher</i> in <i>She is a teacher</i> as naming a separate person.
  activity: Give students a short story opening. They underline each indefinite NP and mark whether it introduces something new or classifies someone.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
