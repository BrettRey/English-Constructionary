id: modified-personal-pronoun-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Adjectives in front of <i>me</i>, <i>you</i> and <i>us</i>
  summary: A pronoun such as <i>you</i> or <i>me</i> can take an adjective in front of it to pick out a stage of a person's life or the state they were in.
  body: |-
    In <i>The five-year-old you was so cute!</i>, the word <i>you</i> still means the person being addressed. The adjective adds an age, so the phrase picks out one stage of that person. In <i>An exhausted me has felt</i>, the word <i>me</i> still means the speaker, and <i>exhausted</i> adds the state the speaker was in.

    These phrases show a split. The verb in the first example is <i>was</i>, not the <i>were</i> that ordinary <i>you</i> goes with, yet a phrase containing <i>me</i> can still go with <i>myself</i>, as in <i>Questions A Younger Me Would Ask Myself</i>. This dictionary says that what kind of word the head is, and why the split happens, remain open.
  examples:
    - text: '[The five-year-old you] was so cute!'
      from: entry
    - text: Questions [A Younger Me] Would Ask Myself
      from: entry
    - text: '[An exhausted me] has felt …'
      from: entry
teacher:
  summary: For advanced classes, personal pronouns modified by an adjective, as in <i>the five-year-old you</i> or <i>an exhausted me</i>.
  explain: 'An attributive adjective can combine with a form otherwise used as a personal pronoun. The pronoun anchors the reference (the addressee, the speaker); the adjective picks out a stage or aspect of that person (<i>the five-year-old you</i>), or characterizes the person''s state (<i>an exhausted me</i>). In subject position the whole phrase can take third-person verb agreement, as in <i>the five-year-old you was</i>. A coreferential reflexive can keep the pronoun''s person (<i>A Younger Me ... Myself</i>). This dictionary marks the analysis as provisional: the category of the head and the explanation for the split agreement remain open.'
  examples:
    - text: '[The five-year-old you] was so cute!'
      from: entry
    - text: Questions [A Younger Me] Would Ask Myself
      from: entry
    - text: '[An exhausted me] has felt …'
      from: entry
  contrasts:
    - text: The five-year-old you was so cute!
      from: entry
      note: The verb is <i>was</i>, which contrasts with ordinary second-person <i>you were</i>.
    - text: Questions A Younger Me Would Ask Myself
      from: entry
      note: The reflexive keeps first person.
  watch_for:
    - A learner might assume the verb must agree with you as an ordinary second-person pronoun, as in <i>you were</i>.
    - A learner might take <i>Poor old me</i>, which this dictionary lists as a separate bare evaluative pattern, to be the same construction as <i>the younger me</i>.
    - A learner might read <i>an exhausted me</i> as picking out a different person, when <i>me</i> still identifies the speaker.
  activity: Students write a sentence about themselves at an earlier age, starting with <i>The ... me</i> or <i>The ... you</i>, and one about a state (tired, nervous). Compare how the verb and any reflexive look in each, without deciding which analysis is right.
