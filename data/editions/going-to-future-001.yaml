id: going-to-future-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Going to</i> as a way of looking ahead
  summary: <i>Be going to</i> followed by a verb can present something as coming up, because of a plan or because of what is happening now.
  body: |-
    In <i>It's going to freeze tonight</i>, nothing is travelling anywhere. The words <i>going to</i> simply look ahead, presenting the freeze as coming because of present signs. In <i>I'm going to leave</i>, the same words present an event as coming in light of an intention.

    Compare <i>I'm going to the station</i>, where <i>going</i> is a real journey and <i>to the station</i> is the place. In <i>I'm going to leave</i>, a verb follows <i>to</i>.
  examples:
    - text: '[It''s going to freeze tonight].'
      from: entry
    - text: I'm [going to leave].
      from: entry
    - text: I'm going to the station.
      from: entry
  try: Say <i>It's going to rain</i>, then think of a sentence where <i>going</i> is a real journey. How do you tell the two apart?
teacher:
  summary: Helps separate prospective <i>be going to</i> from the motion verb <i>go</i> in sentences like <i>I'm going to the station</i>.
  explain: 'Prospective <i>be going to</i> presents an event as upcoming in light of an intention or present indications: <i>It''s going to freeze tonight</i>. The form is <i>be</i>, <i>going</i> and a <i>to</i>-infinitival. It takes an infinitival, and it allows subjects with no motion interpretation, such as the weather subject in the example, which has no mover and no physical destination. In <i>I''m going to the station</i>, by contrast, <i>going</i> is a motion verb and <i>to</i> is a preposition. This dictionary marks this analysis as provisional.'
  terms: Sometimes called the going-to future. This dictionary calls it the prospective construction.
  examples:
    - text: '[It''s going to freeze tonight].'
      from: entry
    - text: I'm [going to leave].
      from: entry
  contrasts:
    - text: I'm going to leave.
      from: entry
      note: Prospective, takes an infinitival.
    - text: I'm going to the station.
      from: entry
      note: Motion verb with a destination.
  watch_for:
    - A learner might read <i>going to</i> in <i>It's going to freeze</i> as movement toward a place.
    - A learner might treat <i>going to leave</i> and <i>going to the station</i> as the same structure.
  activity: Give students pairs of sentences with <i>going to</i>. They sort each one as a journey or a look ahead and discuss what in the sentence helped them decide.
child:
  hook: Is <i>It's going to rain</i> about a trip?
  explain: <i>Going to</i> can talk about what is coming next. <i>It's going to freeze tonight</i> tells us what to expect. Nobody is travelling. <i>I'm going to the station</i> is different, because there you go to a place.
  examples:
    - text: '[It''s going to freeze tonight].'
      from: entry
    - text: I'm going to the station.
      from: entry
  play: Sort sentences with <i>going to</i> into two piles, trips and what's coming next. Talk about how you decided.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: 'Fixed: teacher.activity and child.play no longer give ''a place or a verb after to'' as a sorting test (a journey can also take a purpose infinitive); removed the teacher.explain sentence turning the weather example into a general no-destination test; curious.body no longer says nobody has to be moving. Also fixed (unflagged): ''the entry'' replaced by ''this dictionary''; ''Often taught'' changed to ''Sometimes called''. Second round: dismissed teacher.explain to as a preposition in going to the station (CGEL''s standard classification of to before a noun phrase, consistent with the entry''s contrast with motion to a destination).'
