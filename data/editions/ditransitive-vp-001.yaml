id: ditransitive-vp-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Verbs that take two objects
  summary: Some verbs can be followed by two noun phrases in a row, such as someone who receives and the thing received.
  body: |-
    In I sent Sue a copy, the verb sent is followed by two things: Sue, who gets the copy, and a copy, what is sent. The first is called the indirect object and the second the direct object. Each is a full noun phrase, and the verb allows both.

    The pattern isn't only about handing things over. It also fits She baked Kim a cake, where the cake is meant for Kim, and It cost Mel his job, where Mel loses something. Which verbs allow it depends on the verb: some also allow a version with to or for, as in I sent a copy to Sue, and some don't.
  examples:
    - text: I [sent Sue a copy].
      from: entry
    - text: She [told him the truth].
      from: entry
    - text: She [baked Kim a cake].
      from: entry
    - text: They [charged Ed ten dollars].
      from: entry
    - text: It [cost Mel his job].
      from: entry
  try: Say I sent Sue a copy, then say I sent a copy to Sue. Does the meaning change? Now try the same with other verbs, such as baked or told.
teacher:
  summary: Helps explain double-object verbs, what counts as an indirect object, and how they differ from verbs with a to- or for-phrase.
  explain: 'A ditransitive VP has a verb followed by two internal objects, the indirect object (Oi) and then the direct object (Od), as in sent Sue a copy. This dictionary treats this as a syntactic pattern, not a meaning class: the Oi tends to be a recipient or beneficiary of goods, but can also be a prevented recipient, a source or a loser (refused Kim permission, charged Ed ten dollars, cost Mel his job). Which verb senses allow it is lexically specific: give allows Oi or a to-phrase, explain takes only to, buy allows Oi or for, and borrow takes only for. A to- or for-phrase is not an indirect object: in sent a copy to Sue, a copy is the direct object and the verb is monotransitive.'
  terms: Indirect object and direct object are the usual terms. Double-object construction is another name for the same pattern.
  examples:
    - text: I [sent Sue a copy].
      from: entry
    - text: She [baked Kim a cake].
      from: entry
    - text: They [refused Kim permission].
      from: entry
    - text: They [charged Ed ten dollars].
      from: entry
  contrasts:
    - text: I sent Sue a copy.
      from: entry
      note: Two objects, indirect then direct.
    - text: I sent a copy to Sue.
      from: constructed
      note: One object plus a to-phrase; monotransitive.
    - text: We considered Ed a fool.
      from: constructed
      note: One object plus a predicative NP, not two objects.
  watch_for:
    - A learner might treat the to-phrase in sent a copy to Sue as an indirect object.
    - A learner might assume any verb that can take a to-phrase can also take two objects, though licensing depends on the verb sense.
    - A learner might read the two NPs in considered Ed a fool as two objects, when a fool describes Ed.
  activity: Give students verb cards (give, send, bake, explain, buy). They try each in a double-object sentence and in a to- or for-phrase sentence, sort the results, and compare with a dictionary or the teacher.
child:
  hook: Can you give a friend a pencil without saying "to"?
  explain: Some verbs can be followed by who something is for and then the thing itself. Dad baked Kim a cake. The cake is meant for Kim. The words come in that order.
  examples:
    - text: Dad [baked Kim a cake].
      from: constructed
    - text: I [sent Sue a copy].
      from: entry
    - text: She [told him the truth].
      from: entry
  play: Make up sentences with who gets something, then what they get. Try sent, told and baked. Then say each one again with to or for and a name at the end.
