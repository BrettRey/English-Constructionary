id: into-causative-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Talking someone into going
  summary: A verb, a person and <i>into</i> plus an <i>-ing</i> verb can say how someone was brought to do something.
  body: |-
    In <i>talked him into going to London</i>, <i>talking</i> is the means, and <i>him</i> is the person who ends up going. He's both the one affected and the one doing the going.

    The same pattern works with other verbs. In <i>They laughed him into joining in</i>, the laughter is understood as the means by which he was induced to join. The result is claimed only for an actual completed case. A conditional, an attempt or a negation can suspend it. <i>Into</i> followed by a place, by contrast, describes movement.
  examples:
    - text: '[talked him into going to London]'
      from: entry
    - text: They [laughed him into joining in].
      from: entry
  try: Say <i>She talked him into going</i>. Who goes? Now say <i>She tried to talk him into going</i>. Did he go?
teacher:
  summary: Covers verb plus object plus into plus a gerund-participial clause, as in talked him into going.
  explain: The pattern is a verb, an object, and a prepositional phrase with <i>into</i> plus a gerund-participial clause whose understood subject is the object. It presents the object's action or change of mental state as a result of what the matrix verb describes. In <i>talked him into going to London</i>, <i>talk</i> supplies a means and <i>him</i> supplies the understood subject of <i>going</i>. The pattern can give an otherwise intransitive use of a verb an object. The result inference concerns an affirmative, completed instance; a conditional, an attempt or negation can suspend it. <i>Into</i> followed by a locative noun phrase can have the distinct caused-motion interpretation. This dictionary marks the analysis as provisional.
  terms: No widely used traditional name is given in this dictionary. It is related to caused-motion and object resultative constructions.
  examples:
    - text: '[talked him into going to London]'
      from: entry
    - text: They [laughed him into joining in].
      from: entry
  contrasts:
    - text: talked him into going to London
      from: entry
      note: "<i>Into</i> plus a gerund-participial clause; <i>him</i> is the understood subject of <i>going</i>."
    - text: They pushed the cart into the barn.
      from: constructed
      note: "<i>Into</i> plus a place; caused motion."
  watch_for:
    - A learner might read <i>talked him into going</i> as saying that he talked.
    - A learner might take <i>She tried to talk him into going</i> to mean that he went.
  activity: Students write sentences with a verb, a person and <i>into</i> plus <i>-ing</i>. They then add a conditional, an attempt or a negative and discuss whether the result still follows.
