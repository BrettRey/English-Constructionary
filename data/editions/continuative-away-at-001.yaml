id: continuative-away-at-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Keeping at something with away
  summary: Adding away and at to a verb presents an activity as sustained or repeated, aimed at a target.
  body: |-
    In They worked away at the problem all afternoon, away doesn't mean that anyone went anywhere. It adds the idea that the work went on, without saying the problem was solved. The target of the effort comes after at.

    The same idea fits Simmy was carving away at the roast: the carving is presented as sustained, with no finished result announced. This dictionary also says that away can help a verb fit the at frame when it would be judged worse with at alone. A different pattern, with away from, is about direction and is a separate matter.
  examples:
    - text: Simmy was [carving away at the roast].
      from: entry
    - text: They [worked away at the problem] all afternoon.
      from: entry
  try: Compare They worked at the problem with They worked away at the problem. Which one sounds more like long, patient effort?
teacher:
  summary: Helps explain how away plus an at-phrase marks ongoing or repeated effort aimed at a target.
  explain: 'The pattern is a verb followed by away and an at-phrase: V away at NP. Away contributes aspect, not direction. It presents the activity as sustained or repeated, possibly made of many small effects on the target, without a finished result. A published comparison (carve with and without away) suggests that away can also license a verb that is judged markedly less acceptable with at alone. The analysis is provisional. Don''t confuse it with directional away from, which has a separate interpretation, or with the conative at pattern, which shares the target at-phrase but differs in aspect and available verbs.'
  terms: This dictionary describes away here as making an aspectual contribution, not a directional one.
  examples:
    - text: Simmy was [carving away at the roast].
      from: entry
    - text: They [worked away at the problem] all afternoon.
      from: entry
  contrasts:
    - text: They worked away at the problem all afternoon.
      from: entry
      note: Away marks sustained effort; the problem needn't be solved.
    - text: They walked away from the problem.
      from: constructed
      note: Away from is directional, a separate interpretation.
  watch_for:
    - A learner might read away in worked away at as movement away from something.
    - A learner might take worked away at the problem to mean the problem was solved.
  activity: Students act out or describe tasks that take many small efforts (chipping, scrubbing, sanding). They complete "She was ___ away at the ___" and say what the sentence leaves open about whether the job finished.
child:
  hook: What does away mean in "She worked away at her homework"?
  explain: Sometimes away doesn't mean going anywhere. It means you keep doing something for a while. Working away at homework means working on it for a good while.
  examples:
    - text: They [worked away at the problem] all afternoon.
      from: entry
    - text: Dad was [chipping away at the ice].
      from: constructed
  play: Pick a job, like scrubbing or colouring. Say it with away at, then act it out for ten seconds. Does it feel like one quick action or like something that keeps going?
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: removed the claim that the work in the problem example consisted of many small efforts (the entry says only that it conveys duration and leaves the result open) and the matching many-small-cuts reading of the carving example; child explain and play now speak of keeping going rather than bit by bit.'
