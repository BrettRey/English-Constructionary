id: preposition-pied-piping-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Carrying a preposition to the front
  summary: In a describing clause, the preposition can move to the front together with the word <i>which</i> or <i>whom</i>.
  body: |-
    In <i>The terminal from which they departed is closed</i>, the little word <i>from</i> travels to the front of the clause together with <i>which</i>. The two stay together as a unit.

    The word <i>that</i> after <i>from</i> can't be used this way: with <i>that</i>, the preposition has to stay behind, as in <i>The terminal that they departed from is closed</i>. A fronted preposition can take <i>which</i> or <i>whom</i>.
  examples:
    - text: The terminal [from which they departed] is closed.
      from: entry
    - text: The terminal that they departed from is closed.
      from: constructed
  try: Turn <i>I spoke to the woman</i> into a clause that begins with <i>to whom</i>.
teacher:
  summary: Explains relative clauses where a fronted preposition travels with <i>which</i> or <i>whom</i>.
  explain: In a relative clause with a fronted preposition, the preposition and the relative expression form a PP at the front of the clause, and the rest of the clause contains a linked gap. A fronted P can take <i>which</i> or <i>whom</i>. The comparable relative with <i>that</i> requires stranding rather than forming an initial PP from <i>that</i>. Compare <i>To whom Jo spoke</i>, which fronts the preposition with its complement, with <i>Jo was spoken to</i>, which leaves it behind. This dictionary relates the pattern to integrated relative modifiers, selected prepositional complements and the prepositional passive, and marks it provisional, with medium confidence.
  terms: Textbooks sometimes call this preposition fronting or pied-piping. Stranding is the term for leaving the preposition behind.
  examples:
    - text: The terminal [from which they departed] is closed.
      from: entry
  contrasts:
    - text: The terminal from which they departed is closed.
      from: entry
      note: Preposition fronted with <i>which</i>.
    - text: The terminal that they departed from is closed.
      from: constructed
      note: With <i>that</i>, the preposition is stranded at the end.
  watch_for:
    - A learner might split the preposition from <i>which</i>, when the fronted PP stays together.
    - A learner might expect to front the preposition in a relative with <i>that</i>, when <i>that</i> requires stranding.
  activity: Give students pairs of sentences (<i>I spoke to the woman. She called</i>) and ask them to join them two ways, with a fronted preposition and with a stranded one, and say which relative word each needs.
