id: genitive-s-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: The <i>'s</i> ending
  summary: Adding <i>'s</i> to a noun phrase marks it as a genitive, and the relation it expresses can be of several different kinds.
  body: |-
    The <i>'s</i> ending marks a word or phrase as a genitive. In <i>Mary's book</i>, it means the book is Mary's. In <i>the tree's branches</i>, the branches are part of the tree. In <i>Shakespeare's plays</i>, Shakespeare wrote them. And in <i>tomorrow's meeting</i>, it ties the meeting to a time. The <i>'s</i> form can also stand alone, as in <i>That car is John's</i>.

    The ending doesn't have to sit right next to the person it describes. In <i>the person next door's bicycle</i>, the <i>'s</i> is attached to <i>door</i>, but the owner is the whole phrase, <i>the person next door</i>.
  examples:
    - text: '[Mary''s] book'
      from: entry
    - text: '[the tree''s] branches'
      from: entry
    - text: '[Shakespeare''s] plays'
      from: entry
    - text: '[tomorrow''s] meeting'
      from: entry
    - text: '[the person next door''s] bicycle'
      from: entry
    - text: That car is [John's].
      from: entry
  try: Pick a noun phrase of several words, such as <i>the person next door</i>, and add <i>'s</i>. Where does your <i>'s</i> land, and who does the phrase point to?
teacher:
  summary: Covers the <i>'s</i> genitive, its range of meanings, and where the marker goes on a longer phrase.
  explain: 'The genitive <i>''s</i> attaches to a noun phrase and marks it as a genitive. This dictionary lists a range of relations: ownership (<i>Mary''s book</i>), part-whole (<i>the tree''s branches</i>), creation or authorship (<i>Shakespeare''s plays</i>), time (<i>a day''s work</i>, <i>tomorrow''s meeting</i>), property (<i>the metal''s strength</i>), a doer (<i>the sun''s rise</i>) and social or institutional role (<i>Mary''s brother</i>). The relation varies across these uses. Position matters: in <i>the person next door''s bicycle</i>, <i>''s</i> is adjacent to <i>door</i> but the possessor is the whole <i>person next door</i>. The <i>''s</i> form can also stand alone, as in <i>That car is John''s</i> (an independent genitive). This dictionary treats the analysis as provisional.'
  terms: Traditional grammars sometimes call this the possessive, but the relation can be something other than ownership. Independent genitive is the name this dictionary uses for <i>That car is John's</i>.
  examples:
    - text: '[Mary''s] book'
      from: entry
    - text: '[the tree''s] branches'
      from: entry
    - text: '[a day''s] work'
      from: entry
    - text: '[the university''s] president'
      from: entry
    - text: That car is [John's].
      from: entry
  contrasts:
    - text: the person next door's bicycle
      from: entry
      note: The <i>'s</i> is attached to <i>door</i>, but the possessor is the whole phrase.
  watch_for:
    - A learner might read every <i>'s</i> phrase as ownership, when this dictionary lists part-whole, authorship, time and role uses as well.
    - A learner might expect <i>'s</i> on the head noun of a longer phrase, though in <i>the person next door's bicycle</i> it is attached to <i>door</i>.
  activity: Give students a set of <i>'s</i> phrases from this dictionary on slips. They sort them by relation (owner, part, author, time, role) and then compose one of each type with their own nouns.
child:
  hook: What does the little <i>'s</i> tell you in <i>Mary's book</i>?
  explain: The <i>'s</i> ending can show who something belongs to. It can also show where something comes from or what it is part of. <i>Mary's book</i> is the book that is Mary's. <i>The tree's branches</i> are the branches on the tree.
  examples:
    - text: '[Mary''s] book'
      from: entry
    - text: '[the tree''s] branches'
      from: entry
    - text: '[Shakespeare''s] plays'
      from: entry
  play: Look around the room and name five things with <i>'s</i>, like <i>Mia's pencil</i> or <i>the door's handle</i>. Then find one that is about a time, like <i>tomorrow's lesson</i>.
