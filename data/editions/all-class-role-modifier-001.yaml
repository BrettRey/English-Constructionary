id: all-class-role-modifier-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: All as a restriction, as in an all girls' school
  summary: Putting all before a class word can say that only members of that class fill a role connected to the noun.
  body: |-
    In an all girls' school, the role at issue is who can attend. The school educates only girls, but it can serve only some of the town's girls and it can have men on staff. In an all-women team, the role is team membership, and the team supplies the members.

    The pattern works with several forms. There's a plural noun with an apostrophe (all girls'), a plain plural (all-women), and an adjective (all-female). The head noun helps decide which role all restricts.
  examples:
    - text: an [all girls’ school]
      from: entry
    - text: '[all-female police unit]'
      from: entry
    - text: '[all-women team]'
      from: entry
  try: Think of a team, club or school described with all. Who does all say may be in it?
teacher:
  summary: Explains how all with a class word restricts a role, such as who attends or who belongs.
  explain: The pattern is a nominal consisting of all plus a class-denoting nominal or adjective plus a noun. It restricts the occupants of a salient role associated with the head noun to one class. With an all girls' school the role is eligibility to attend, so the school can educate only some of the town's girls and have men on staff. With an all-women team, the team supplies the members. Genitive and plain-case nominal forms and adjectives all support the interpretation. CGEL treats all girls' as a genitive NP with peripheral all, while the internal bracketing of the other forms is left open. This dictionary marks the analysis as provisional.
  terms: CGEL analyzes the apostrophe form girls' in its example as genitive.
  examples:
    - text: an [all girls’ school]
      from: entry
    - text: '[all-female police unit]'
      from: entry
    - text: '[all-women team]'
      from: entry
  contrasts:
    - text: all-female police unit
      from: entry
      note: Adjectival class specification.
    - text: all-women team
      from: entry
      note: Plain plural form.
  watch_for:
    - A learner might read all girls' school as saying every girl in the town attends, when the restriction concerns who can attend.
    - A learner might assume all must restrict the same role in every phrase, when the head noun helps select the set.
  activity: Students collect phrases with all and a class word (all-girls, all-female). For each, they say which role is restricted (attending, belonging) and who may fill it.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
