id: equative-as-as-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Comparing with <i>as ... as</i>
  summary: "<i>As ... as</i> sets one thing's degree against another's without saying the first has more."
  body: |-
    In <i>The new shelf is as wide as the old one</i>, the pattern compares the new shelf's width with the old one's. The positive form doesn't say that the new shelf is wider.

    The first <i>as</i> comes before the describing word, and the second <i>as</i> introduces what you're measuring against, here <i>the old one</i>.
  examples:
    - text: The new shelf is [as wide as the old one].
      from: entry
    - text: Max is [as tall as his sister].
      from: constructed
  try: Compare two things in the room with <i>as ... as</i>, such as two bags or two books.
teacher:
  summary: Helps explain the <i>as ... as</i> equative that compares a degree with a standard without asserting a greater one.
  explain: The scalar equative has the form <i>as</i> + gradable expression + <i>as</i>-phrase or clause. In its positive form it compares a degree with a standard without asserting a greater degree. In <i>The new shelf is as wide as the old one</i>, the old shelf supplies the standard. This dictionary relates the pattern to gradation and to than-reduced clauses.
  terms: Traditionally called a comparison of equality; compare the comparative with <i>than</i>.
  examples:
    - text: The new shelf is [as wide as the old one].
      from: entry
    - text: Max is [as tall as his sister].
      from: constructed
  watch_for:
    - A learner might think <i>as wide as</i> asserts that the new shelf is wider.
    - A learner might leave out the first <i>as</i>, though the pattern has two.
  activity: Students pick pairs of objects and write sentences with <i>as ... as</i>, naming the standard each time.
child:
  hook: How do you say two things match in size?
  explain: Put <i>as</i> before a describing word and <i>as</i> before the thing you're comparing with. <i>The new shelf is as wide as the old one</i>. It doesn't say the new shelf is wider.
  examples:
    - text: The new shelf is [as wide as the old one].
      from: entry
    - text: Max is [as tall as his sister].
      from: constructed
  play: Pick two things you can see. Say how they compare using <i>as ... as</i>, such as <i>as long as</i> or <i>as tall as</i>.
checked:
