id: equative-as-as-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Comparing with as ... as
  summary: As ... as sets one thing's degree against another's without saying the first has more.
  body: |-
    In The new shelf is as wide as the old one, the pattern compares the new shelf's width with the old one's. The positive form doesn't say that the new shelf is wider.

    The first as comes before the describing word, and the second as introduces what you're measuring against, here the old one.
  examples:
    - text: The new shelf is [as wide as the old one].
      from: entry
    - text: Max is [as tall as his sister].
      from: constructed
  try: Compare two things in the room with as ... as, such as two bags or two books.
teacher:
  summary: Helps explain the as ... as equative that compares a degree with a standard without asserting a greater one.
  explain: The scalar equative has the form as + gradable expression + as-phrase or clause. In its positive form it compares a degree with a standard without asserting a greater degree. In The new shelf is as wide as the old one, the old shelf supplies the standard. This dictionary relates the pattern to gradation and to than-reduced clauses.
  terms: Traditionally called a comparison of equality; compare the comparative with than.
  examples:
    - text: The new shelf is [as wide as the old one].
      from: entry
    - text: Max is [as tall as his sister].
      from: constructed
  watch_for:
    - A learner might think as wide as asserts that the new shelf is wider.
    - A learner might leave out the first as, though the pattern has two.
  activity: Students pick pairs of objects and write sentences with as ... as, naming the standard each time.
child:
  hook: How do you say two things match in size?
  explain: Put as before a describing word and as before the thing you're comparing with. The new shelf is as wide as the old one. It doesn't say the new shelf is wider.
  examples:
    - text: The new shelf is [as wide as the old one].
      from: entry
    - text: Max is [as tall as his sister].
      from: constructed
  play: Pick two things you can see. Say how they compare using as ... as, such as as long as or as tall as.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
