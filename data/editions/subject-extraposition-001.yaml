id: subject-extraposition-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Saving the clause for the end
  summary: A sentence can start with it and put a clause after the verb to say what the situation is.
  body: |-
    Instead of saying That he hasn't phoned worries me, we can say It worries me that he hasn't phoned. The clause that tells what the worry is about moves to the end, and the small word it fills the subject spot as a stand-in with nothing of its own to refer to.

    The later part can be a that-clause, a question clause or a to-phrase. This dictionary points out that the version with the clause up front is often less natural when the information is new.

    This dictionary marks the analysis as provisional.
  examples:
    - text: '[It worries me that he hasn''t phoned.]'
      from: entry
    - text: '[It is unclear why she told him.]'
      from: entry
    - text: '[It would be pointless to resist.]'
      from: entry
  try: Take It would be pointless to resist and try putting the to-phrase at the start. Which version fits better when you tell someone a piece of news?
teacher:
  summary: Teaches the it ... that/to pattern and how to tell dummy it from a pronoun that refers.
  explain: The matrix subject is dummy it, and the situation under discussion comes after the predicate as an extraposed content clause or infinitival. A that-clause, an interrogative clause or a to-infinitival may occur in the later position. The basic initial-clause version is often less natural when the information is presented as new. A referential NP doesn't ordinarily alternate in this way. Dummy it has no referent. This differs from right dislocation, where the pronoun does refer to the dislocated noun phrase. This dictionary marks the analysis as provisional, with high confidence.
  terms: 'CGEL: extraposition with dummy it. Textbooks sometimes call this anticipatory or expletive it.'
  examples:
    - text: '[It worries me that he hasn''t phoned.]'
      from: entry
    - text: '[It is unclear why she told him.]'
      from: entry
    - text: '[It would be pointless to resist.]'
      from: entry
  contrasts:
    - text: That he hasn't phoned worries me.
      from: entry
      note: The basic version, with the clause in subject position.
    - text: It surprised me that Jo left.
      from: entry
      note: Dummy it is the subject of the matrix clause.
    - text: I find it surprising that Jo left.
      from: entry
      note: Here it is an object and the clause follows the predicative; a separate pattern.
  watch_for:
    - A learner might look for a noun that it stands for, when dummy it refers to nothing.
    - A learner might mix up It surprised me that Jo left with I find it surprising that Jo left, where it is an object.
  activity: Students are given sentences with a clause at the start and rewrite them with it and the clause at the end. They then decide which version sounds better when the news is new.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
