id: subject-extraposition-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Saving the clause for the end
  summary: A sentence can start with <i>it</i> and put a clause after the verb to say what the situation is.
  body: |-
    Instead of saying <i>That he hasn't phoned worries me</i>, we can say <i>It worries me that he hasn't phoned</i>. The clause that tells what the worry is about moves to the end, and the small word <i>it</i> fills the subject spot as a stand-in with nothing of its own to refer to.

    The later part can be a <i>that</i>-clause, a question clause or a <i>to</i>-phrase. This dictionary points out that the version with the clause up front is often less natural when the information is new.

    This dictionary marks the analysis as provisional.
  examples:
    - text: '[It worries me that he hasn''t phoned.]'
      from: entry
    - text: '[It is unclear why she told him.]'
      from: entry
    - text: '[It would be pointless to resist.]'
      from: entry
  try: Take <i>It would be pointless to resist</i> and try putting the <i>to</i>-phrase at the start. Which version fits better when you tell someone a piece of news?
teacher:
  summary: Teaches the <i>it</i> ... <i>that</i>/<i>to</i> pattern and how to tell dummy <i>it</i> from a pronoun that refers.
  explain: The matrix subject is dummy <i>it</i>, and the situation under discussion comes after the predicate as an extraposed content clause or infinitival. A <i>that</i>-clause, an interrogative clause or a <i>to</i>-infinitival may occur in the later position. The basic initial-clause version is often less natural when the information is presented as new. A referential NP doesn't ordinarily alternate in this way. Dummy <i>it</i> has no referent. This differs from right dislocation, where the pronoun does refer to the dislocated noun phrase. This dictionary marks the analysis as provisional, with high confidence.
  terms: 'CGEL: extraposition with dummy <i>it</i>. Textbooks sometimes call this anticipatory or expletive <i>it</i>.'
  examples:
    - text: '[It worries me that he hasn''t phoned.]'
      from: entry
    - text: '[It is unclear why she told him.]'
      from: entry
    - text: '[It would be pointless to resist.]'
      from: entry
  contrasts:
    - text: That he hasn't phoned worries me.
      from: entry
      note: The basic version, with the clause in subject position.
    - text: It surprised me that Jo left.
      from: entry
      note: Dummy <i>it</i> is the subject of the matrix clause.
    - text: I find it surprising that Jo left.
      from: entry
      note: Here <i>it</i> is an object and the clause follows the predicative; a separate pattern.
  watch_for:
    - A learner might look for a noun that <i>it</i> stands for, when dummy <i>it</i> refers to nothing.
    - A learner might mix up <i>It surprised me that Jo left</i> with <i>I find it surprising that Jo left</i>, where <i>it</i> is an object.
  activity: Students are given sentences with a clause at the start and rewrite them with <i>it</i> and the clause at the end. They then decide which version sounds better when the news is new.
