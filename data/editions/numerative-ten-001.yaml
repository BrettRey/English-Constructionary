id: numerative-ten-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: The word <i>ten</i>
  summary: <i>Ten</i> is a single word that other number words, such as <i>-teen</i> and <i>-ty</i> ones, are built from.
  body: |-
    <i>Ten</i> is a single word that specifies the amount ten. It can stand in front of a plural noun, as in <i>ten chapters</i>, and it's the base that the <i>-teen</i> and <i>-ty</i> numbers are formed from.

    <i>Ten</i> can also be counted. In <i>two tens</i>, the number two counts two portions of the value ten, and <i>tens</i> takes a plural ending. This dictionary says that <i>ten</i> used on its own doesn't force either analysis in every context.
  examples:
    - text: '[ten]'
      from: entry
    - text: '[ten] chapters'
      from: constructed
    - text: '[two tens]'
      from: constructed
  try: Compare <i>ten chapters</i> with <i>two tens</i>. Which one has an <i>s</i> on <i>ten</i>, and what is <i>two</i> doing in it?
teacher:
  summary: Explains <i>ten</i> as a basic numerative and how it differs from the noun use in <i>two tens</i>.
  explain: <i>Ten</i> is a monomorphemic lexeme specifying a cardinality of ten. It occurs in all basic numerative positions, including determiner and factor, and is the morphological base for <i>-teen</i> and <i>-ty</i>. <i>Ten chapters</i> uses <i>ten</i> directly with a plural nominal. In <i>two tens</i>, the separate cardinal <i>two</i> quantifies two realizations of the value and <i>tens</i> inflects, as a noun would. This dictionary doesn't force either analysis for an independent use of <i>ten</i> across contexts. It is provisional.
  terms: Cardinal number is the traditional name. This dictionary also uses cardinal noun for the countable use in <i>two tens</i>.
  examples:
    - text: '[ten]'
      from: entry
  contrasts:
    - text: '[ten] chapters'
      from: constructed
      note: <i>Ten</i> used directly with a plural noun.
    - text: '[two tens]'
      from: constructed
      note: <i>Tens</i> inflects for number and is counted by <i>two</i>.
  watch_for:
    - A learner might read <i>tens</i> in <i>two tens</i> as a plural of the determiner in <i>ten chapters</i>, when it takes plural marking as a noun.
    - A learner might assume a bare <i>ten</i> has one fixed analysis, when this dictionary leaves that open across contexts.
  activity: Students write one phrase with <i>ten</i> before a noun and one with <i>two tens</i>, and explain in their own words what <i>two</i> counts in the second.
