id: secondary-verbal-negation-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Negating a verb without <i>do</i>
  summary: In certain verb forms, <i>not</i> negates the verb without the helper <i>do</i>.
  body: |-
    Plain sentences like <i>Lee did not leave</i> need the helper <i>do</i>. But some verb forms get their negation another way. In <i>It is vital that he not be told</i>, <i>not</i> stands directly in front of <i>be</i>. In <i>Not locking the doors is unwise</i>, it stands before <i>locking</i>. In <i>a plan not to leave</i>, it comes before <i>to</i>.

    This works with forms that aren't tensed sentences: a plain-form verb after <i>that</i>, an <i>-ing</i> form, a form like <i>approved</i> in <i>a plan not approved by the board</i>, and a <i>to</i> form. In each, no <i>do</i> is used. With <i>to</i>, <i>not</i> can come before or after it, as in <i>for them not to smile</i> and <i>for them to not smile</i>. This dictionary marks the analysis as provisional.
  examples:
    - text: It is vital that he [not] be told.
      from: entry
    - text: '[Not] locking the doors is unwise.'
      from: entry
    - text: a plan [not] approved by the board
      from: entry
    - text: It looks bad for them [not] to smile.
      from: entry
  try: Compare <i>Lee did not leave</i> with <i>a plan not to leave</i>. What helper verb appears in the first and not in the second?
teacher:
  summary: Helps explain <i>not</i> before non-finite and subjunctive verb phrases, where <i>do</i>-support is unavailable.
  explain: In secondary verbal negation, <i>not</i> premodifies a VP in a non-finite or subjunctive clause, and <i>do</i>-support is unavailable. The four cases are the subjunctive (<i>that he not be told</i>), the gerund-participial (<i>not locking the doors</i>), the past-participial (<i>a plan not approved by the board</i>) and the infinitival (<i>for them not to smile</i>). In <i>to</i>-infinitivals, <i>not</i> may appear before or after <i>to</i> (<i>for them to not smile</i>). The negative <i>to</i>-infinitival in <i>a plan not to leave</i> and the mandative <i>that Lee not leave</i> both keep the following verb in the plain form without <i>do</i>. By contrast, the finite declarative <i>Lee did not leave</i> uses <i>do</i>. CGEL treats these as secondary verbal negation, distinguished by form from primary negation.
  terms: Subjunctive, gerund-participial, past-participial and infinitival are the clause types named in this dictionary. CGEL distinguishes secondary verbal negation by form from primary negation; the finite declarative <i>Lee did not leave</i>, which uses <i>do</i>, is the comparison case.
  examples:
    - text: It is vital that he [not] be told.
      from: entry
    - text: '[Not] locking the doors is unwise.'
      from: entry
    - text: a plan [not] approved by the board
      from: entry
    - text: It looks bad for them [not] to smile.
      from: entry
  contrasts:
    - text: Lee did not leave.
      from: constructed
      note: Finite declarative; negation uses <i>do</i>.
    - text: a plan not to leave
      from: constructed
      note: Negative <i>to</i>-infinitival; no <i>do</i>.
    - text: for them to not smile
      from: entry
      note: <i>Not</i> may also follow <i>to</i>.
  watch_for:
    - A learner might add <i>do</i> to the verb after <i>not</i> in a <i>to</i>-infinitive or subjunctive clause.
    - A learner might look for <i>not</i> only after <i>to</i>, when it may come before or after.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
