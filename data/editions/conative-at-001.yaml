id: conative-at-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Aiming an action at something
  summary: An at-phrase can show that an action was aimed at something, without saying it connected.
  body: |-
    The horse kicked at me and The horse kicked me differ in a useful way. The second says the kick landed. The first says the kick was aimed at me, and it may have connected or missed.

    The at-phrase names the target. It doesn't rule out success: The striker kicked at the ball and caught it with the outside of her foot. With a verb like kick, a direct object normally means contact happened, and at removes that commitment. Related uses with eat or nibble can involve small amounts or repetition.
  examples:
    - text: The horse [kicked at me].
      from: entry
    - text: The horse [kicked me].
      from: entry
    - text: The striker [kicked at the ball] and caught it with the outside of her foot.
      from: constructed
  try: Compare The horse kicked at me with The horse kicked me. In which one do you know for sure that the kick connected?
teacher:
  summary: Useful for explaining at-phrases that present an action as directed at a target without the usual result of the transitive use.
  explain: In the conative, a verb of action is followed by a PP headed by at, whose complement is the target. Kicked at me presents the action as directed towards the speaker without committing to the usual result. With kick, the direct object in The horse kicked me normally entails contact, while the at-phrase permits either contact or a miss. The target supplies a direction for the action, with no entailment of arrival or contact. Ordinary uses such as look at are left to their own accounts.
  terms: 'Conative: the traditional name for this pattern. Comp is a complement; the target is the object of at.'
  examples:
    - text: The horse [kicked at me].
      from: entry
    - text: The striker [kicked at the ball] and caught it with the outside of her foot.
      from: constructed
  contrasts:
    - text: The horse kicked at me.
      from: entry
      note: Directed at the speaker. Contact or a miss.
    - text: The horse kicked me.
      from: entry
      note: Transitive control. Contact occurred.
  watch_for:
    - A learner might read kicked at as meaning the kick missed, when it permits either contact or a miss.
    - A learner might treat the at-phrase as a place adjunct, when it names what the action was directed towards.
  activity: Students act out two versions of kicking a ball, once with contact and once with a miss. They describe each with kicked the ball and kicked at the ball, then discuss which description fits.
child:
  hook: Is kicking at a ball the same as kicking a ball?
  explain: Kicked the ball means your foot hit it. Kicked at the ball means you aimed a kick at it. You might have missed.
  examples:
    - text: The horse [kicked at me].
      from: entry
    - text: Mia [kicked at the ball] and missed.
      from: constructed
    - text: Mia [kicked the ball] to Sam.
      from: constructed
  play: Kick a soft ball or pretend to. Say what happened with kicked the ball or kicked at the ball.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
