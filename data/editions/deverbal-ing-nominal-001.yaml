id: deverbal-ing-nominal-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Activity nouns ending in -ing
  summary: Some words in -ing name an activity or its result and behave like nouns, taking words like careful and of.
  body: |-
    In The careful sorting of the files took hours, sorting names an activity, but it acts like a noun. It takes the adjective careful in front of it, and the files comes after of.

    The same idea can be said another way. Carefully sorting the files uses the adverb carefully, and the files follows the verb directly. Here the -ing word acts like a verb. This dictionary treats the two patterns as different, and the first as a noun pattern.
  examples:
    - text: '[The careful sorting of the files] took hours.'
      from: entry
  try: Compare careful sorting of the files with carefully sorting the files. Which one has of? Which one has an adverb?
teacher:
  summary: Helps contrast an -ing noun with its nominal dependents against the verb-like -ing form.
  explain: A deverbal noun in -ing names an activity, result or product using nominal syntax. In The careful sorting of the files took hours, careful modifies the noun and of introduces what was formerly the object. A gerund-participial can say the same thing with carefully and take the files as a direct object. This dictionary’s confidence in this analysis is marked medium.
  terms: Traditional grammars may call the noun a verbal noun and the verb-like form a gerund.
  examples:
    - text: '[The careful sorting of the files] took hours.'
      from: entry
  contrasts:
    - text: Carefully sorting the files took hours.
      from: constructed
      note: The verb-like version, with an adverb and a direct object.
  watch_for:
    - A learner might use careful with the verb-like form, or carefully with the noun-like form, when each pattern takes its own kind of modifier.
  activity: Students rewrite each noun-pattern sentence in the verb-like pattern and back, marking where of appears and where the adverb appears.
