id: in-duration-completion-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Finishing in a stretch of time
  summary: A phrase like in fifteen minutes can say how long something took, but the same words can also say when something will start.
  body: |-
    In Jo sealed the cartons in fifteen minutes, the phrase in fifteen minutes measures the time up to the point where the job was done. It tells you how long the sealing took.

    The same words can do something different. In Lee will start in fifteen minutes, they say when the starting will happen, fifteen minutes from now. So one form carries two readings, and the rest of the sentence helps you tell which one you've got.
  examples:
    - text: Jo sealed the cartons [in fifteen minutes].
      from: entry
    - text: Lee will start [in fifteen minutes].
      from: entry
  try: Say Jo sealed the cartons in fifteen minutes, then Lee will start in fifteen minutes. Which one tells you how long the job took, and which tells you when something begins?
teacher:
  summary: Helps with in plus a time measure, which can mean time taken or time until a future event.
  explain: The pattern is a clause with an adjunct of the form in plus a noun phrase measuring time. With a completed event in the preterite, the interval normally measures the time to completion, as in Jo sealed the cartons in fifteen minutes. With a prospective reading, the same form can instead locate an event fifteen minutes from now, as in Lee will start in fifteen minutes. The first measures the time to a bounded occurrence or endpoint. The second gives a temporal location. This dictionary marks the analysis as provisional.
  terms: Sometimes called a duration adjunct or a time-frame adverbial. This dictionary treats it as a prepositional phrase adjunct.
  examples:
    - text: Jo sealed the cartons [in fifteen minutes].
      from: entry
    - text: Lee will start [in fifteen minutes].
      from: entry
  contrasts:
    - text: Jo sealed the cartons in fifteen minutes.
      from: entry
      note: Time taken to reach completion.
    - text: Lee will start in fifteen minutes.
      from: entry
      note: Locates the start fifteen minutes from now.
  watch_for:
    - A learner might read Lee will start in fifteen minutes as saying that the starting takes fifteen minutes.
    - A learner might think in fifteen minutes has one fixed meaning whatever the verb and tense are.
  activity: Write sentences with in and a time measure on strips, some past and some future. Students sort them into "how long it took" and "how long until it happens", then explain which clue in the sentence decided it.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: the curious try question used an invented sentence pair that presupposed the future sentence locates the start; it now uses this dictionary''s two examples, which are the readings the dictionary assigns. Also fixed (unflagged): ''the entry'' wording in teacher explain.'
