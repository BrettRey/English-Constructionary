id: what-about-topic-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: What about this idea?
  summary: What about, followed by a thing or an action, puts something forward for the other person to think about.
  body: |-
    What about asking Lee first? isn't really a request for information. It proposes an action, asking Lee, for the listener to consider.

    The words after what about can name an action, as here, or a thing. With something like the spare key, the conversation supplies what the issue is. The speaker doesn't need to ask what the object is.

    The dictionary marks this account as provisional.
  examples:
    - text: '[What about asking Lee first?]'
      from: entry
    - text: What about the spare key?
      from: constructed
  try: Suggest something to a friend using What about. Does the friend answer with information or with a decision?
teacher:
  summary: Helps explain what about as a way to propose an activity or raise a related topic.
  explain: The pattern is what about followed by a noun phrase or a gerund-participial expression. It introduces something for consideration, often as a related topic or proposed activity. An activity can be proposed without asking for the identity of an object. With a referent such as the spare key, the intended issue is supplied by the conversation. This dictionary classes it as pragmatic and relates it to questions. It marks its analysis provisional, so present a proposed activity and a related topic as two uses, and note that context supplies what is at issue.
  terms: Gerund-participial is this dictionary's term for an -ing expression such as asking Lee first. Textbooks may call the -ing form a gerund.
  examples:
    - text: '[What about asking Lee first?]'
      from: entry
    - text: What about the spare key?
      from: constructed
  contrasts:
    - text: What about asking Lee first?
      from: entry
      note: Proposes an action; no object is asked for.
    - text: What about the spare key?
      from: constructed
      note: The conversation supplies the issue.
  watch_for:
    - A learner might answer What about asking Lee first? by naming an object, when it proposes an action.
    - A learner might look for a missing noun phrase after about, when the proposal is complete.
  activity: Pairs plan a weekend. One suggests with What about and an -ing phrase, the other accepts, rejects or changes the plan.
child:
  hook: How do you suggest a game to a friend?
  explain: Sometimes What about is a way to suggest an idea. What about asking Lee first? It isn't a question about a thing.
  examples:
    - text: '[What about asking Lee first?]'
      from: entry
    - text: What about playing outside?
      from: constructed
  play: Take turns suggesting an activity with What about. The next player says yes or suggests another.
