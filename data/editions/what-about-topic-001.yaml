id: what-about-topic-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>What about</i> this idea?"
  summary: "<i>What about</i>, followed by a thing or an action, puts something forward for the other person to think about."
  body: |-
    <i>What about asking Lee first?</i> isn't really a request for information. It proposes an action, <i>asking Lee</i>, for the listener to consider.

    The words after <i>what about</i> can name an action, as here, or a thing. With something like <i>the spare key</i>, the conversation supplies what the issue is. The speaker doesn't need to ask what the object is.

    The dictionary marks this account as provisional.
  examples:
    - text: '[What about asking Lee first?]'
      from: entry
    - text: What about the spare key?
      from: constructed
  try: Suggest something to a friend using <i>What about</i>. Does the friend answer with information or with a decision?
teacher:
  summary: Helps explain <i>what about</i> as a way to propose an activity or raise a related topic.
  explain: The pattern is <i>what about</i> followed by a noun phrase or a gerund-participial expression. It introduces something for consideration, often as a related topic or proposed activity. An activity can be proposed without asking for the identity of an object. With a referent such as <i>the spare key</i>, the intended issue is supplied by the conversation. This dictionary classes it as pragmatic and relates it to questions. It marks its analysis provisional, so present a proposed activity and a related topic as two uses, and note that context supplies what is at issue.
  terms: Gerund-participial is this dictionary's term for an <i>-ing</i> expression such as <i>asking Lee first</i>. Textbooks may call the <i>-ing</i> form a gerund.
  examples:
    - text: '[What about asking Lee first?]'
      from: entry
    - text: What about the spare key?
      from: constructed
  contrasts:
    - text: What about asking Lee first?
      from: entry
      note: Proposes an action; no object is asked for.
    - text: What about the spare key?
      from: constructed
      note: The conversation supplies the issue.
  watch_for:
    - A learner might answer <i>What about asking Lee first?</i> by naming an object, when it proposes an action.
    - A learner might look for a missing noun phrase after <i>about</i>, when the proposal is complete.
  activity: Pairs plan a weekend. One suggests with <i>What about</i> and an <i>-ing</i> phrase, the other accepts, rejects or changes the plan.
child:
  hook: How do you suggest a game to a friend?
  explain: Sometimes <i>What about</i> is a way to suggest an idea. <i>What about asking Lee first?</i> It isn't a question about a thing.
  examples:
    - text: '[What about asking Lee first?]'
      from: entry
    - text: What about playing outside?
      from: constructed
  play: Take turns suggesting an activity with <i>What about</i>. The next player says yes or suggests another.
