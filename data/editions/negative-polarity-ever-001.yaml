id: negative-polarity-ever-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: The word <i>ever</i> in questions and negatives
  summary: <i>Ever</i> meaning at any time fits in questions, negatives and some other settings, but is marked in a plain positive statement.
  body: |-
    In <i>Has Lee ever sailed solo?</i>, the word <i>ever</i> asks about any occasion at all. It fits in questions and under negation. It also fits in other suitable settings, such as superlatives.

    A plain positive statement is different: the affirmative counterpart of the question is marked, because it has no special licensor. This dictionary links the use to the setting it appears in, not to the word on its own. <i>Have you ever seen it?</i> asks a question and doesn't state anything negative.
  examples:
    - text: Has Lee [ever sailed] solo?
      from: entry
    - text: '[Have you ever seen] it?'
      from: constructed
  try: Ask a question with <i>ever</i>, then change the question into a plain statement. What changes?
teacher:
  summary: Explains temporal <i>ever</i> as a polarity-sensitive adverb that needs a licensing context.
  explain: Temporal <i>ever</i> ranges over occasions or times, especially under negation or questioning. The affirmative counterpart, <i>Lee has ever sailed solo</i>, is marked without a special licensor, while superlatives and other suitable environments also permit <i>ever</i>. <i>Have you ever seen it?</i> licenses <i>ever</i> in a question and supplies no negative assertion, whereas <i>Jo never saw it</i> has negation within the temporal adverb. This dictionary links the pattern to the experiential perfect and notes the analysis is provisional.
  terms: Negative polarity item is the textbook name for an expression like <i>ever</i> that needs a licensing context.
  examples:
    - text: Has Lee [ever sailed] solo?
      from: entry
    - text: '[Have you ever seen] it?'
      from: constructed
  contrasts:
    - text: Have you ever seen it?
      from: constructed
      note: <i>Ever</i> in a question; no negative assertion.
    - text: Jo never saw it.
      from: constructed
      note: Negation is inside <i>never</i>.
  watch_for:
    - A learner might think <i>ever</i> is negative itself, when a question can license it without any negative assertion.
    - A learner might use <i>ever</i> in a plain positive statement without a licensing context.
  activity: Students write three questions with <i>ever</i> and three statements with <i>never</i>, then say which setting each one uses. Discuss that a question with <i>ever</i> makes no negative assertion.
checked:
