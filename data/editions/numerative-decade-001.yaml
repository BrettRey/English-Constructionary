id: numerative-decade-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Number words for whole tens
  summary: The words <i>twenty</i> to <i>ninety</i> each name a number of tens.
  body: |-
    <i>Twenty</i> means 20, and <i>seventy</i> means 70. These words name whole tens, from twenty up to ninety, and each is built from a single-digit base with the ending <i>-ty</i>.

    <i>Sixty</i> stands by itself as a word, and it also supplies the first part of <i>sixty-four</i>. Its link to <i>six</i> is easy to see. But you can't make a new tens word by adding <i>-ty</i> to just any number expression.
  examples:
    - text: '[twenty]'
      from: entry
    - text: '[seventy]'
      from: entry
    - text: '[sixty]-four'
      from: constructed
  try: Say all the tens words from <i>twenty</i> to <i>ninety</i>. Which one reminds you of its single-digit number?
teacher:
  summary: Covers the tens words <i>twenty</i> to <i>ninety</i>, built with <i>-ty</i>, as the base for numbers like <i>sixty-four</i>.
  explain: A decade numerative specifies a cardinality in tens (20, 30, ..., 90), formed from a single-digit base and the suffix <i>-ty</i>. It's a basic numerative, so it can serve as determiner or factor, and it combines with single digits to form compounds such as <i>twenty-one</i>. <i>Sixty</i> can stand alone and can supply the first component of <i>sixty-four</i>. The relation to <i>six</i> is transparent, but a new decade form can't automatically be generated from any numerical expression by adding <i>-ty</i>. The dictionary treats the decade endings as lexical word formation, and marks this account as provisional.
  terms: Numerative is this grammar's term for number words, where a textbook may say numeral. Decade numerals or tens words are common informal names.
  examples:
    - text: '[twenty]'
      from: entry
    - text: '[seventy]'
      from: entry
    - text: '[sixty]-four'
      from: constructed
  watch_for:
    - A learner might think any number word can take <i>-ty</i> to make a tens word.
    - A learner might miss that <i>sixty</i> relates to <i>six</i>, though the link is transparent.
  activity: Students write the tens words from <i>twenty</i> to <i>ninety</i>, circle each ending, and match each with its single-digit base. Then they build three compound numbers from them.
child:
  hook: What do <i>twenty</i>, <i>thirty</i> and <i>forty</i> all end with?
  explain: Words like <i>twenty</i>, <i>seventy</i> and <i>ninety</i> name whole tens. They end in <i>-ty</i>. <i>Seventy</i> means 70. You can count by tens with them.
  examples:
    - text: I counted [twenty] stones.
      from: constructed
    - text: He is [seventy] years old.
      from: constructed
  play: Count by tens out loud, from <i>twenty</i> up to <i>ninety</i>. Stop at each <i>-ty</i> word, and clap on each one.
