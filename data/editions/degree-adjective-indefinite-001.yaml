id: degree-adjective-indefinite-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>How big a mess</i>, <i>too big a problem</i>"
  summary: With words like <i>how</i>, <i>too</i>, <i>so</i>, <i>that</i> and <i>as</i>, the adjective can move in front of <i>a</i> or <i>an</i>.
  body: |-
    In <i>a big mess</i>, the adjective sits between <i>a</i> and the noun. But after words such as <i>how</i>, <i>so</i>, <i>too</i>, <i>that</i> and <i>as</i>, the adjective moves forward and <i>a</i> follows it. So we say <i>how big a mess</i>, <i>too big a problem</i>, <i>so good a student</i>, not <i>that good a teacher</i>.

    The word <i>a</i> or <i>an</i> has to stay: this pattern doesn't work with <i>the</i>. In some varieties you can also add <i>of</i>, as in <i>that big of a deal</i>, though whether <i>of</i> is acceptable depends on the degree word and the variety. The ordinary word <i>very</i> doesn't do this, and takes the usual order: <i>a very serious problem</i>.
  examples:
    - text: '[How big a mess] was it?'
      from: entry
    - text: It was [too big a problem] to ignore.
      from: entry
    - text: She's [so good a student] that she skipped a year.
      from: entry
    - text: It's not [as big a deal] as you think.
      from: entry
  try: Start from <i>a big mess</i> and ask <i>how big a mess</i>. Then try the same with <i>the</i>, and see whether it still works.
teacher:
  summary: Explains inverted order after degree words (<i>how big a mess</i>) and the <i>a(n)</i>-only restriction.
  explain: 'A degree word plus an adjective can precede the indefinite article, reversing the usual order: <i>a big mess</i> becomes <i>how big a mess</i>. Eligible phrases include those with <i>how</i>, <i>so</i>, <i>too</i>, <i>that</i> and <i>as</i>, and certain comparatives (<i>more interesting a job</i>). The article must be indefinite <i>a(n)</i>; <i>the</i> doesn''t fit, as in <i>how big the mess</i>. The <i>how</i> version can be an interrogative phrase, fronted to the start of the clause. Ordinary <i>very</i> uses a different word order (<i>a very serious problem</i>). An intervening <i>of</i> (<i>that big of a deal</i>) is especially familiar in North American varieties and is more available with some degree words than others. Register differs among the variants.'
  terms: 'Degree word: a word such as <i>how</i>, <i>so</i>, <i>too</i> or <i>as</i> that modifies the adjective. Indefinite article: <i>a</i> or <i>an</i>, the words CGEL classes as determinatives.'
  examples:
    - text: '[How big a mess] was it?'
      from: entry
    - text: He's not [that good a teacher].
      from: entry
    - text: It was [too big a problem] to ignore.
      from: entry
    - text: It's not [that big of a deal].
      from: entry
    - text: '[more interesting a job] than I thought'
      from: entry
  contrasts:
    - text: a big mess
      from: constructed
      note: Ordinary order, with the adjective after <i>a</i>.
    - text: how big the mess
      from: entry
      acceptable: false
      note: This dictionary stars this version with <i>the</i>.
    - text: a very serious problem
      from: constructed
      note: "<i>Very</i> keeps the usual order."
  watch_for:
    - A learner might put the definite article into the pattern, as in <i>how big the mess</i>.
    - A learner might expect <i>very</i> to behave like <i>how</i> and <i>so</i>, and move the adjective in front of <i>a</i>.
    - A learner might assume that <i>of</i> is available with every degree word, though this dictionary notes this varies with the degree word and variety.
  activity: Give students <i>a big mess</i>, <i>a good teacher</i> and <i>a serious problem</i>. They build <i>how</i>, <i>too</i>, <i>so</i> and <i>as</i> versions, then check each with a different noun and say which degree words they can use.
checked:
  date: "2026-11-19"
  model: claude-sonnet-5-5 (resolving checker flags); claude-opus-5-5 (second round)
  result: fixed
  note: "Dismissed: teacher.terms a/an as determinatives (GLM: unsupported) is CGEL's standard classification and consistent with the entry; reworded to say CGEL classes them so rather than that this grammar does. Also fixed (unflagged): removed 'Usually' (a frequency word) from curious.body; 'the entry' replaced by 'this dictionary'. Second round: dismissed teacher.terms a/an as determinatives, flagged again (CGEL's standard classification, consistent with the entry's indefinite article)."
