id: subject-resultative-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Saying how the subject ends up
  summary: A word after the verb can tell you what state the subject reaches, as in froze solid.
  body: |-
    In The basin froze solid, the word solid says what state the basin ended up in. It describes the outcome of the freezing, and no other object is needed to make it work.

    That makes it different from a word that describes how someone was while an action happened. This dictionary notes that this second kind ordinarily holds during the event, while the result word marks where the event ends up.

    This dictionary marks the analysis as provisional and rests on one illustration.
  examples:
    - text: The basin [froze solid].
      from: entry
    - text: The pond [froze solid].
      from: constructed
  try: Take the basin froze and add a word that says what it became. What happens to the meaning?
teacher:
  summary: Helps students distinguish a result state that the subject reaches from a description that holds during the action.
  explain: The pattern is a verb followed by a predicative complement that specifies the state the subject reaches. In The basin froze solid, solid describes the outcome of freezing. A depictive predicate, by contrast, ordinarily holds during the event, as in Jo arrived hungry. No separate object licenses solid here. This dictionary marks the analysis provisional, rests on one constructed example, and names a related object-oriented resultative as a separate entry.
  terms: Resultative is the usual textbook term. Depictive is the usual term for the description that holds during the event.
  examples:
    - text: The basin [froze solid].
      from: entry
  contrasts:
    - text: The basin froze solid.
      from: entry
      note: Solid is the outcome of the freezing; resultative.
    - text: Jo arrived hungry.
      from: constructed
      note: Hungry describes Jo during the arriving; depictive.
  watch_for:
    - A learner might read solid as a description that holds during the freezing, when it names the outcome.
    - A learner might look for an object after froze, when the complement is predicated of the subject.
  activity: Give students verbs such as freeze, melt and dry. They add a word that says the end state, then check that it describes the subject at the end of the event, not during it.
child:
  hook: What word tells you how the water ended up after it froze?
  explain: Some words after a verb tell how something ended up. The pond froze solid. Solid is how the pond ended up after it froze.
  examples:
    - text: The basin [froze solid].
      from: entry
    - text: The pond [froze solid].
      from: constructed
  play: Pick a verb such as froze or melted. Add a word that says how the thing ended up. Read your sentence to a friend and see if they can say how it ended.
checked:
  date: '2026-11-19'
