id: month-day-date-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Dates written month first
  summary: A month name followed by a number picks out a day, as in <i>June 14</i> or <i>November 18</i>.
  body: |-
    In <i>June 14th</i>, the number after the month tells you which day of that month is meant. It can be written as a digit, <i>June 14</i>, or as an ordinal, <i>June fourteenth</i>. The date needs no <i>the</i> or <i>of</i> inside it.

    The same date can also be said in another order, with extra words: <i>the fourteenth of June</i>. That pattern uses different order and marking. This dictionary describes only the month-first pattern here and leaves other date formats to separate accounts.
  examples:
    - text: '[June 14th]'
      from: entry
    - text: They set the deadline for [November 18].
      from: entry
    - text: the fourteenth of June
      from: constructed
  try: Write today's date in the month-first way. Then say it again the other way, starting with the number.
teacher:
  summary: Helps with month-first dates and how the day number relates to the month name.
  explain: A month name followed by a day number identifies a day by its ordinal position within that month. The number can be written as a digit or an ordinal (<i>June 14</i>, <i>June 14th</i>, <i>June fourteenth</i>). No article or preposition appears inside the date. <i>The fourteenth of June</i> identifies the same date with a different order and marking, so teach it as a separate pattern. This dictionary's high-confidence account covers the month-first pattern only. The number works as an index in a conventional system, like the numeral in a numerical label.
  terms: Ordinal number is the traditional term for <i>fourteenth</i>. Month-first is this dictionary's label for the order.
  examples:
    - text: '[June 14th]'
      from: entry
    - text: They set the deadline for [November 18].
      from: entry
  contrasts:
    - text: June 14th
      from: entry
      note: Month first, with no article or preposition.
    - text: the fourteenth of June
      from: constructed
      note: The same date with a different order and marking.
  watch_for:
    - A learner might read the <i>14</i> in <i>June 14</i> as counting something rather than naming a day.
    - A learner might add <i>the</i> or <i>of</i> inside a month-first date.
    - A learner might think <i>June 14</i> and <i>the fourteenth of June</i> name different days.
  activity: Students write their birthdays in the month-first way, then say them aloud with ordinal numbers. Next they say each birthday in the other order and compare what words changed.
child:
  hook: Can you say your birthday starting with the month?
  explain: A month name followed by a number can name a day. <i>June 14th</i> is the fourteenth day of June. You can also say <i>the fourteenth of June</i>.
  examples:
    - text: My birthday is [March 3].
      from: constructed
    - text: '[June 14th]'
      from: entry
  play: Write your birthday starting with the month. Then say it out loud using the number word, like <i>fourteenth</i>. Try a friend's birthday too.
checked:
