id: scalar-challenge-call-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Doubting that something deserves its name
  summary: You call that a sandwich? can say the thing doesn't deserve the label, rather than ask what to call it.
  body: |-
    When someone says You call that a sandwich? with a dismissive tone, they're saying the thing doesn't deserve the name. It's just bread with lettuce.

    The same words can also be a plain question, if someone really wants to know what label you use. A dismissive tone and a visibly poor example point to the challenge. This dictionary marks the analysis as provisional and treats the challenge reading as a proposal whose status as a settled convention remains open.
  examples:
    - text: '[You call that a sandwich]? It''s just bread with lettuce.'
      from: entry
    - text: '[You call that clean]? There''s dust everywhere.'
      from: entry
    - text: '[You call that music]?'
      from: entry
    - text: '[You call that an apology]? You didn''t even say sorry.'
      from: entry
  try: Think of something that barely deserves its name. Challenge it with You call that ...? and say what's missing.
teacher:
  summary: Helps explain a dismissive question that challenges whether a label fits.
  explain: 'The frame You call that (a) N/PRED? has a declarative clause with a second person subject and call as the main verb, and its complement is a category label (a noun or a predicative expression). It challenges whether the label is appropriate: that doesn''t deserve the label X. It challenges category membership, not scalar degree, though the two are related. The speaker can reject the label without offering a replacement. A literal inquiry about what to call an object is also possible, so tone and context decide. Question prosody is typically layered onto the declarative frame. This dictionary marks the analysis as provisional.'
  terms: In this dictionary it overlaps in function with declarative scalar recalibration, which targets degree rather than category membership.
  examples:
    - text: '[You call that a sandwich]? It''s just bread with lettuce.'
      from: entry
    - text: '[You call that clean]? There''s dust everywhere.'
      from: entry
    - text: '[You call that an apology]? You didn''t even say sorry.'
      from: entry
  watch_for:
    - A learner might answer You call that a sandwich? as a vocabulary question, when it can be a challenge.
    - A learner might miss the dismissive tone that signals a challenge rather than a cooperative question about words.
  activity: Show pictures of poor examples (a plain piece of bread as a sandwich). Students say You call that a ...? in a dismissive voice, then in a curious voice, and the class says which reading each one gave.
child:
  hook: What do you say when someone calls something by a grand name it doesn't deserve?
  explain: You call that a sandwich? can say the thing is not good enough to have that name, instead of asking about the word. The tone of voice helps.
  examples:
    - text: '[You call that a sandwich]? It''s just bread with lettuce.'
      from: entry
    - text: '[You call that music]?'
      from: entry
  play: Pick something that's not a good example of its name. Say You call that ...? in a surprised voice and add one reason.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: curious.summary and child.explain now say the sentence can be a challenge rather than that it always is (the entry also allows a literal question about what label to use); curious.body no longer rules out the question reading; teacher.explain says question prosody is typically layered, as in the entry; removed a scalar-recalibration example not given in this entry; reworded one watch_for.'
