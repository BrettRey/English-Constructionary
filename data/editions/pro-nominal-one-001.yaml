id: pro-nominal-one-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: "<i>One</i> and <i>ones</i> standing in for a noun"
  summary: The words <i>one</i> and <i>ones</i> can stand in for a noun that was already mentioned, so we don't repeat it.
  body: |-
    In <i>I preferred the larger ones</i>, the word <i>ones</i> picks up a description from earlier, such as <i>shoes</i> or <i>cups</i>. It carries that description, and it can still take its own <i>the</i>, an adjective like <i>larger</i>, and a plural ending.

    This dictionary says it normally stands in for something countable. The number word <i>one</i> is a separate thing: it can answer a question about how many. This dictionary marks the account as provisional.
  examples:
    - text: I preferred [the larger ones].
      from: entry
  try: Say a sentence about some things, then refer back to them with <i>ones</i> and an adjective, as in <i>the larger ones</i>.
teacher:
  summary: Explains <i>one</i> and <i>ones</i> as substitute words that recover a noun and can take their own determiner, adjective and plural.
  explain: Pro-nominal <i>one(s)</i> is an anaphoric head that recovers a nominal description while allowing independent determination and number. In <i>I preferred the larger ones</i>, <i>ones</i> can take plural morphology, a determiner (<i>the</i>) and an adjective (<i>larger</i>). It normally recovers count nominal content. The numeral <i>one</i> is separate and can answer a question about cardinality. This dictionary marks the analysis as provisional and gives one constructed example, so check further cases before generalizing.
  terms: Sometimes called the 'prop-word <i>one</i>' or 'substitute <i>one</i>' in traditional grammars; this dictionary calls it pro-nominal <i>one</i>.
  examples:
    - text: I preferred [the larger ones].
      from: entry
  watch_for:
    - A learner might read <i>ones</i> as the numeral <i>one</i> with a plural ending.
    - A learner might think <i>ones</i> can recover any kind of noun, when this dictionary says it normally recovers count nominal content.
  activity: Students get a sentence with a repeated noun, such as one about two kinds of cups, and replace the second noun with <i>one</i> or <i>ones</i> and an adjective. They compare their versions.
child:
  hook: How can you talk about some things again without saying the same word twice?
  explain: The word <i>ones</i> can stand in for a word we've already used. If we're talking about <i>shoes</i>, we can say <i>the larger ones</i>. It means <i>the larger shoes</i>.
  examples:
    - text: I preferred [the larger ones].
      from: entry
    - text: We kept the red ones.
      from: constructed
  play: Name a group of things, like <i>pencils</i>. Then say which ones you like using <i>ones</i>, such as <i>the sharp ones</i>.
