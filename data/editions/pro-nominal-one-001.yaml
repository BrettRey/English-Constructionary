id: pro-nominal-one-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: One and ones standing in for a noun
  summary: The words one and ones can stand in for a noun that was already mentioned, so we don't repeat it.
  body: |-
    In I preferred the larger ones, the word ones picks up a description from earlier, such as shoes or cups. It carries that description, and it can still take its own the, an adjective like larger, and a plural ending.

    This dictionary says it normally stands in for something countable. The number word one is a separate thing: it can answer a question about how many. This dictionary marks the account as provisional.
  examples:
    - text: I preferred [the larger ones].
      from: entry
  try: Say a sentence about some things, then refer back to them with ones and an adjective, as in the larger ones.
teacher:
  summary: Explains one and ones as substitute words that recover a noun and can take their own determiner, adjective and plural.
  explain: Pro-nominal one(s) is an anaphoric head that recovers a nominal description while allowing independent determination and number. In I preferred the larger ones, ones can take plural morphology, a determiner (the) and an adjective (larger). It normally recovers count nominal content. The numeral one is separate and can answer a question about cardinality. This dictionary marks the analysis as provisional and gives one constructed example, so check further cases before generalizing.
  terms: Sometimes called the 'prop-word one' or 'substitute one' in traditional grammars; this dictionary calls it pro-nominal one.
  examples:
    - text: I preferred [the larger ones].
      from: entry
  watch_for:
    - A learner might read ones as the numeral one with a plural ending.
    - A learner might think ones can recover any kind of noun, when this dictionary says it normally recovers count nominal content.
  activity: Students get a sentence with a repeated noun, such as one about two kinds of cups, and replace the second noun with one or ones and an adjective. They compare their versions.
child:
  hook: How can you talk about some things again without saying the same word twice?
  explain: The word ones can stand in for a word we've already used. If we're talking about shoes, we can say the larger ones. It means the larger shoes.
  examples:
    - text: I preferred [the larger ones].
      from: entry
    - text: We kept the red ones.
      from: constructed
  play: Name a group of things, like pencils. Then say which ones you like using ones, such as the sharp ones.
checked:
  date: '2026-11-19'
