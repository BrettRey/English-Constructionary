id: either-or-coordination-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Offering two choices with either and or
  summary: Either at the start and or between marks a pair of alternatives.
  body: |-
    In Pick either the blue folder or the red one, the word either warns at the left edge that two alternatives are coming, and or introduces the second. The two options are the blue folder and the red one.

    The pattern puts the overt marker at the left edge. This dictionary relates it to a neighbouring pattern with neither and nor.
  examples:
    - text: Pick [either the blue folder or the red one].
      from: entry
    - text: You can have [either tea or juice].
      from: constructed
  try: Offer a friend two choices for lunch, using either and or.
teacher:
  summary: Helps explain correlative coordination with either and or, where either marks the alternatives at the left edge.
  explain: 'Either ... or is a correlative coordination: either, an overt marker at the left edge, introduces the alternatives, and or links them. The pattern is either + XP + or + XP, so the choices are two phrases, here two NPs. This dictionary treats it as a specialization of coordination and relates it to neither ... nor.'
  terms: Traditionally, either and or are correlative conjunctions.
  examples:
    - text: Pick [either the blue folder or the red one].
      from: entry
    - text: You can have [either tea or juice].
      from: constructed
  watch_for:
    - A learner might place either before the second option instead of at the left edge.
    - A learner might confuse either ... or with neither ... nor, which is a related but separate pattern.
  activity: Students write choices for a menu using either ... or, then swap papers and mark the two alternatives in each.
child:
  hook: How do you offer someone two choices at once?
  explain: Either goes before the first choice. Or goes before the second. You can say Pick either the blue folder or the red one.
  examples:
    - text: Pick [either the blue folder or the red one].
      from: entry
    - text: You can have [either tea or juice].
      from: constructed
  play: Offer a friend two snacks using either and or. They pick one and say which they chose.
