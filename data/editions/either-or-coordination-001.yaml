id: either-or-coordination-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Offering two choices with <i>either</i> and <i>or</i>
  summary: "<i>Either</i> at the start and <i>or</i> between marks a pair of alternatives."
  body: |-
    In <i>Pick either the blue folder or the red one</i>, the word <i>either</i> warns at the left edge that two alternatives are coming, and <i>or</i> introduces the second. The two options are the blue folder and the red one.

    The pattern puts the overt marker at the left edge. This dictionary relates it to a neighbouring pattern with <i>neither</i> and <i>nor</i>.
  examples:
    - text: Pick [either the blue folder or the red one].
      from: entry
    - text: You can have [either tea or juice].
      from: constructed
  try: Offer a friend two choices for lunch, using <i>either</i> and <i>or</i>.
teacher:
  summary: Helps explain correlative coordination with <i>either</i> and <i>or</i>, where <i>either</i> marks the alternatives at the left edge.
  explain: '<i>Either ... or</i> is a correlative coordination: <i>either</i>, an overt marker at the left edge, introduces the alternatives, and <i>or</i> links them. The pattern is <i>either</i> + XP + <i>or</i> + XP, so the choices are two phrases, here two NPs. This dictionary treats it as a specialization of coordination and relates it to <i>neither ... nor</i>.'
  terms: Traditionally, <i>either</i> and <i>or</i> are correlative conjunctions.
  examples:
    - text: Pick [either the blue folder or the red one].
      from: entry
    - text: You can have [either tea or juice].
      from: constructed
  watch_for:
    - A learner might place <i>either</i> before the second option instead of at the left edge.
    - A learner might confuse <i>either ... or</i> with <i>neither ... nor</i>, which is a related but separate pattern.
  activity: Students write choices for a menu using <i>either ... or</i>, then swap papers and mark the two alternatives in each.
child:
  hook: How do you offer someone two choices at once?
  explain: "<i>Either</i> goes before the first choice. <i>Or</i> goes before the second. You can say <i>Pick either the blue folder or the red one</i>."
  examples:
    - text: Pick [either the blue folder or the red one].
      from: entry
    - text: You can have [either tea or juice].
      from: constructed
  play: Offer a friend two snacks using <i>either</i> and <i>or</i>. They pick one and say which they chose.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
