id: get-event-passive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Got promoted
  summary: Using got with a past-participle word, as in Jo got promoted, presents someone as undergoing something that happened to them.
  body: |-
    In Jo got promoted last week, something happened to Jo: someone promoted her. The sentence puts the spotlight on the change and on what it means for Jo.

    The plain version, Jo was promoted, can describe the same event. This dictionary says that got foregrounds the change or its relevance to Jo, while was also covers cases that describe a state, such as is widely believed. A good outcome is possible too, so the pattern doesn't need to be about something bad.
  examples:
    - text: Jo [got promoted] last week.
      from: entry
    - text: Jo [was promoted] last week.
      from: constructed
  try: Take a sentence like The window was broken and try it with got. Does the focus shift?
teacher:
  summary: Useful for showing learners the get-passive as an alternative to the be-passive, with a different focus.
  explain: 'The get-passive has an affected subject, get, and a verbal past participle: Jo got promoted. It alternates with the be-passive (Jo was promoted), and both can describe the same event. This dictionary says get foregrounds the change or its relevance to Jo, while be is also available in stative uses such as is widely believed. A get-passive can have a positive outcome, so adverse consequence is not required, and it can admit a by-phrase naming the agent. It contrasts with get plus an ordinary adjective. This dictionary marks this analysis as provisional.'
  terms: Get-passive is the usual name. This dictionary treats it as a passive with the verb get in place of be.
  examples:
    - text: Jo [got promoted] last week.
      from: entry
    - text: Jo [was promoted] last week.
      from: constructed
  contrasts:
    - text: Jo got promoted.
      from: entry
      note: Get foregrounds the change or its relevance to Jo.
    - text: Jo was promoted.
      from: constructed
      note: Can describe the same event.
  watch_for:
    - A learner might assume a get-passive must describe something bad for the subject, when this dictionary says a positive outcome is possible.
    - A learner might treat get plus a participle as get plus an ordinary adjective, when this dictionary distinguishes the two.
  activity: Give students short event sentences with be-passives. They rewrite each with get, then discuss whether the focus on the change or on the person affected shifts.
child:
  hook: What is the difference between Jo was picked and Jo got picked?
  explain: Got can show that something happened to someone. Jo got promoted means somebody promoted Jo. The sentence is about Jo and what happened to her.
  examples:
    - text: Jo [got promoted] last week.
      from: entry
    - text: Sam [got picked] for the team.
      from: constructed
  play: Tell a partner something that happened to you using got, like I got invited. Then say the same thing with was and see whether it sounds different.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
