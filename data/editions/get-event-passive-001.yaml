id: get-event-passive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Got promoted</i>
  summary: Using <i>got</i> with a past-participle word, as in <i>Jo got promoted</i>, presents someone as undergoing something that happened to them.
  body: |-
    In <i>Jo got promoted last week</i>, something happened to Jo: someone promoted her. The sentence puts the spotlight on the change and on what it means for Jo.

    The plain version, <i>Jo was promoted</i>, can describe the same event. This dictionary says that <i>got</i> foregrounds the change or its relevance to Jo, while <i>was</i> also covers cases that describe a state, such as <i>is widely believed</i>. A good outcome is possible too, so the pattern doesn't need to be about something bad.
  examples:
    - text: Jo [got promoted] last week.
      from: entry
    - text: Jo [was promoted] last week.
      from: constructed
  try: Take a sentence like <i>The window was broken</i> and try it with <i>got</i>. Does the focus shift?
teacher:
  summary: Useful for showing learners the <i>get</i>-passive as an alternative to the <i>be</i>-passive, with a different focus.
  explain: 'The <i>get</i>-passive has an affected subject, <i>get</i>, and a verbal past participle: <i>Jo got promoted</i>. It alternates with the <i>be</i>-passive (<i>Jo was promoted</i>), and both can describe the same event. This dictionary says <i>get</i> foregrounds the change or its relevance to Jo, while <i>be</i> is also available in stative uses such as <i>is widely believed</i>. A <i>get</i>-passive can have a positive outcome, so adverse consequence is not required, and it can admit a <i>by</i>-phrase naming the agent. It contrasts with <i>get</i> plus an ordinary adjective. This dictionary marks this analysis as provisional.'
  terms: Get-passive is the usual name. This dictionary treats it as a passive with the verb <i>get</i> in place of <i>be</i>.
  examples:
    - text: Jo [got promoted] last week.
      from: entry
    - text: Jo [was promoted] last week.
      from: constructed
  contrasts:
    - text: Jo got promoted.
      from: entry
      note: <i>Get</i> foregrounds the change or its relevance to Jo.
    - text: Jo was promoted.
      from: constructed
      note: Can describe the same event.
  watch_for:
    - A learner might assume a <i>get</i>-passive must describe something bad for the subject, when this dictionary says a positive outcome is possible.
    - A learner might treat <i>get</i> plus a participle as <i>get</i> plus an ordinary adjective, when this dictionary distinguishes the two.
  activity: Give students short event sentences with <i>be</i>-passives. They rewrite each with <i>get</i>, then discuss whether the focus on the change or on the person affected shifts.
child:
  hook: What is the difference between <i>Jo was picked</i> and <i>Jo got picked</i>?
  explain: <i>Got</i> can show that something happened to someone. <i>Jo got promoted</i> means somebody promoted Jo. The sentence is about Jo and what happened to her.
  examples:
    - text: Jo [got promoted] last week.
      from: entry
    - text: Sam [got picked] for the team.
      from: constructed
  play: Tell a partner something that happened to you using <i>got</i>, like <i>I got invited</i>. Then say the same thing with <i>was</i> and see whether it sounds different.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
