id: true-partitive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Picking some out of a group
  summary: A phrase like <i>three of the boxes</i> picks out a smaller number from a group we already have in mind.
  body: |-
    In <i>They opened three of the boxes</i>, the words after <i>of</i> name a group already established: the boxes. The words before <i>of</i> say the number chosen from it. The boxes can be more numerous than three.

    Compare <i>three boxes of apples</i>. There, <i>of apples</i> says what is inside the boxes, not which boxes were chosen. A longer sentence can show both: <i>They bought three of the cartons of milk</i>. <i>Of the cartons</i> names the set that <i>three</i> comes from, and <i>of milk</i> says what each carton holds.

    The dictionary marks this account as provisional.
  examples:
    - text: They opened [three of the boxes].
      from: entry
    - text: They bought [three of the cartons of milk].
      from: entry
  try: Say <i>three of the apples</i> and <i>three boxes of apples</i>. In which one are you choosing from a set already in view?
teacher:
  summary: Helps explain how <i>of</i>-phrases pick a subset from an established group, as opposed to naming contents or a measure.
  explain: 'In a true partitive, a quantificational head or fused head combines with an <i>of</i>-phrase whose noun phrase is definite or otherwise establishes a domain. The <i>of</i>-phrase supplies the domain counted over, so the boxes can be more numerous than three. In <i>three boxes of apples</i>, <i>of apples</i> instead identifies the content or measure domain. In <i>three of the cartons of milk</i>, <i>of the cartons</i> gives the domain and <i>of milk</i> identifies the contents of each. This dictionary notes that a definite noun phrase after <i>of</i> is compatible with either analysis: <i>three of the cartons</i> selects members of a set, while <i>three litres of the milk</i> specifies quantity. The analysis is marked provisional.'
  terms: Partitive is the traditional name. The contrast case is the measure pseudopartitive, covered in a related entry.
  examples:
    - text: They opened [three of the boxes].
      from: entry
    - text: They bought [three of the cartons of milk].
      from: entry
  contrasts:
    - text: Three of the cartons selects members of a set.
      from: entry
      note: Partitive reading.
    - text: Three litres of the milk specifies quantity.
      from: entry
      note: Measure reading, though the definite noun phrase after <i>of</i> looks the same.
  watch_for:
    - A learner might read the <i>of</i>-phrase in <i>three boxes of apples</i> as the group chosen from, when it names the contents.
    - A learner might assume a definite noun phrase after <i>of</i> must signal a partitive, though this dictionary says it is compatible with either analysis.
  activity: Lay out ten counters. Students say "<i>I took three of the counters</i>" and compare it with "<i>three counters of plastic</i>", then discuss which phrase names the group chosen from.
child:
  hook: If you take three cookies from a plate, what is left behind?
  explain: We say <i>three of the cookies</i> when we pick some from a group we can already see. The group comes after <i>of</i>.
  examples:
    - text: They opened [three of the boxes].
      from: entry
    - text: I ate [two of the cookies].
      from: constructed
  play: Put toys on a table. Take some and say "<i>I took two of the toys.</i>" Then swap and let a friend say what you left.
checked:
