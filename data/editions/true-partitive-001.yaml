id: true-partitive-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Picking some out of a group
  summary: A phrase like three of the boxes picks out a smaller number from a group we already have in mind.
  body: |-
    In They opened three of the boxes, the words after of name a group already established: the boxes. The words before of say the number chosen from it. The boxes can be more numerous than three.

    Compare three boxes of apples. There, of apples says what is inside the boxes, not which boxes were chosen. A longer sentence can show both: They bought three of the cartons of milk. Of the cartons names the set that three comes from, and of milk says what each carton holds.

    The dictionary marks this account as provisional.
  examples:
    - text: They opened [three of the boxes].
      from: entry
    - text: They bought [three of the cartons of milk].
      from: entry
  try: Say three of the apples and three boxes of apples. In which one are you choosing from a set already in view?
teacher:
  summary: Helps explain how of-phrases pick a subset from an established group, as opposed to naming contents or a measure.
  explain: 'In a true partitive, a quantificational head or fused head combines with an of-phrase whose noun phrase is definite or otherwise establishes a domain. The of-phrase supplies the domain counted over, so the boxes can be more numerous than three. In three boxes of apples, of apples instead identifies the content or measure domain. In three of the cartons of milk, of the cartons gives the domain and of milk identifies the contents of each. This dictionary notes that a definite noun phrase after of is compatible with either analysis: three of the cartons selects members of a set, while three litres of the milk specifies quantity. The analysis is marked provisional.'
  terms: Partitive is the traditional name. The contrast case is the measure pseudopartitive, covered in a related entry.
  examples:
    - text: They opened [three of the boxes].
      from: entry
    - text: They bought [three of the cartons of milk].
      from: entry
  contrasts:
    - text: Three of the cartons selects members of a set.
      from: entry
      note: Partitive reading.
    - text: Three litres of the milk specifies quantity.
      from: entry
      note: Measure reading, though the definite noun phrase after of looks the same.
  watch_for:
    - A learner might read the of-phrase in three boxes of apples as the group chosen from, when it names the contents.
    - A learner might assume a definite noun phrase after of must signal a partitive, though this dictionary says it is compatible with either analysis.
  activity: Lay out ten counters. Students say "I took three of the counters" and compare it with "three counters of plastic", then discuss which phrase names the group chosen from.
child:
  hook: If you take three cookies from a plate, what is left behind?
  explain: We say three of the cookies when we pick some from a group we can already see. The group comes after of.
  examples:
    - text: They opened [three of the boxes].
      from: entry
    - text: I ate [two of the cookies].
      from: constructed
  play: Put toys on a table. Take some and say "I took two of the toys." Then swap and let a friend say what you left.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
