id: singular-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: What singular means
  summary: Singular is a form that nouns, pronouns and similar words can have, and it makes other words in the sentence agree with it.
  body: |-
    Singular is a form that nouns, pronouns and similar words can have. With a count noun like <i>cat</i> it points to one thing, and so do <i>it</i> and <i>this</i>. The singular form is often just the plain word with nothing added, as in <i>cat</i>.

    The pattern also reaches words for substances, like <i>rice</i>. There it signals wholeness, not a count of one: the rice is treated as one undivided mass. <i>The water is cold</i> has a singular verb, even though no distinct unit of water has to be picked out. This dictionary marks the analysis as provisional.
  examples:
    - text: '[it]'
      from: entry
    - text: '[this]'
      from: entry
    - text: '[rice]'
      from: entry
    - text: The [water is] cold.
      from: constructed
  try: Compare <i>The cats are asleep</i> with <i>The rice is ready</i>. Which verb form goes with the plural, and which goes with the singular?
teacher:
  summary: Helps explain singular form and agreement across count and non-count nouns, pronouns and determinatives.
  explain: 'The singular construction applies to common and proper nouns, pronouns and determinatives. Its form is singular morphology (often zero) plus singular agreement marking, and it signals singular construal. For count uses it specifies exactly one countable entity; this dictionary''s examples are the noun <i>cat</i>, the pronoun <i>it</i> and the determinative <i>this</i>. For non-count nouns it marks unity or wholeness, as with <i>rice</i>, an undivided substance. The pattern travels across count and non-count uses: <i>The water is cold</i> has singular agreement although no distinct unit of water need have been selected. CGEL separates number agreement from countability. This dictionary marks the analysis as provisional.'
  terms: Non-count nouns are traditionally called mass or uncountable nouns. This dictionary follows CGEL in saying non-count.
  examples:
    - text: '[it]'
      from: entry
    - text: '[this]'
      from: entry
    - text: '[rice]'
      from: entry
    - text: The [water is] cold.
      from: constructed
  contrasts:
    - text: The cat is asleep.
      from: constructed
      note: A count noun, one entity, singular agreement.
    - text: The rice is ready.
      from: constructed
      note: A non-count noun, singular agreement, no count of one.
  watch_for:
    - A learner might think singular agreement with a non-count noun like <i>rice</i> means a single item.
    - A learner might match the verb to the meaning of a word (<i>a lot of water</i>) instead of its form.
  activity: Give students a list of nouns (<i>cat</i>, <i>rice</i>, <i>water</i>, <i>idea</i>). They write a sentence with each and mark the verb. Then discuss which nouns count a single item and which mark wholeness.
child:
  hook: What word do we use for just one thing, like <i>it</i> or <i>this</i>?
  explain: A singular word can stand for one thing, like <i>it</i> or <i>this</i>. Words like <i>rice</i> and <i>water</i> are singular too, even though you don't count them one by one.
  examples:
    - text: The [rice is] ready.
      from: constructed
    - text: The [water is] cold.
      from: constructed
  play: Look at things around you. Say <i>the cat is</i> or <i>the rice is</i>, and see which words go with <i>is</i>.
checked:
  date: '2026-11-19'
  model: claude-sonnet-5-5 (resolving checker flags)
  result: fixed
  note: 'Fixed: title, summary and curious.body no longer define singular as single-thing reference (non-count singulars are a separate use); teacher.explain no longer groups it and this under count nouns; child.explain no longer says ''Singular means one''; child.hook reworded to match.'
