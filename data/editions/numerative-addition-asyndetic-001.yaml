id: numerative-addition-asyndetic-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Big numbers said without <i>and</i>
  summary: Some numbers are built by putting a small number straight after a large one, with no <i>and</i> between them.
  body: |-
    In <i>two hundred five</i>, the <i>five</i> is added to <i>two hundred</i>, even though nothing joins them. It means the same as <i>two hundred and five</i>. <i>Two thousand seven</i> works the same way.

    This dictionary says the version without <i>and</i> is strongly preferred in American English and in faster or less formal speech. The <i>five</i> here is an addition to a complete amount. That differs from <i>five hundred</i>, where <i>five</i> says how many hundreds.
  examples:
    - text: '[two hundred five]'
      from: entry
    - text: '[two thousand seven]'
      from: entry
  try: Say <i>two hundred five</i> and <i>two hundred and five</i>. Do they mean the same number?
teacher:
  summary: Shows that <i>two hundred five</i> is addition with no spoken <i>and</i>, parallel to the version with <i>and</i>.
  explain: 'This construction adds a smaller number to a complete magnitude phrase by juxtaposition, with the coordinator <i>and</i> omitted: <i>two hundred five</i> means 200 + 5. The dictionary analyzes it as coordination without a spoken coordinator. The addition coordinate can itself be a basic numerative or a magnitude phrase, so the pattern is recursive. In <i>two hundred five</i>, <i>five</i> contributes the same remainder as in <i>two hundred and five</i>. This differs from <i>five hundred</i>, where a factor selects a magnitude. The dictionary notes that this form is strongly preferred in American English and in faster or less formal registers. It marks this account as provisional.'
  terms: Numerative is this grammar's term for number words, where a textbook may say numeral. Asyndetic means joined without a coordinator.
  examples:
    - text: '[two hundred five]'
      from: entry
    - text: '[two thousand seven]'
      from: entry
  contrasts:
    - text: '[two hundred five]'
      from: entry
      note: Addition with no <i>and</i> (200 + 5).
    - text: '[two hundred and five]'
      from: entry
      note: Addition with <i>and</i> (200 + 5).
    - text: '[five hundred]'
      from: constructed
      note: Multiplication, not addition (a factor selects a magnitude).
  watch_for:
    - A learner might think a number without <i>and</i> is missing something.
    - A learner might read <i>two hundred five</i> as two hundred multiplied by five.
  activity: Dictate numbers such as 205, 2007 and 3006. Students write them in digits, then say each aloud in both styles, with <i>and</i> and without it.
