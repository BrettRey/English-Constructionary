id: durational-long-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Asking or denying "<i>long</i>" after a verb
  summary: Plain <i>long</i> after a verb works in a question, a negative or an <i>if</i>-clause to describe a potentially long time.
  body: |-
    <i>They didn't stay long</i> and <i>Did you wait long?</i> both use <i>long</i> to talk about how much time passed. The word fits in a question such as <i>Will they stay long?</i>, and in a negative. This dictionary says a conditional can license it too.

    This dictionary says the plain affirmative <i>They stayed long</i> is markedly less natural for many speakers. Adding a modifier changes things, as in <i>They stayed too long</i>. Linguists analyse the word differently, so this dictionary leaves its category open.
  examples:
    - text: Did you [wait long]?
      from: entry
    - text: They didn't [stay long].
      from: entry
    - text: Will they [stay long]?
      from: constructed
    - text: They stayed [too long].
      from: constructed
  try: Say a sentence with <i>long</i> after a verb in a question and one in a negative. Then try an <i>if</i>-clause.
teacher:
  summary: Helps explain how postverbal durational <i>long</i> fits question, negative and conditional frames.
  explain: 'Postverbal <i>long</i> describes a potentially long duration, typically in a non-affirmative frame: a negative (<i>They didn''t stay long</i>), a polar question (<i>Did you wait long?</i>) or a conditional antecedent. This dictionary says the ordinary affirmative <i>They stayed long</i> is markedly less natural for many speakers. Modified forms can behave differently, as in <i>They stayed too long</i>. A separate use before the main verb is possible in affirmative <i>They have long known</i>. The category analysis varies across sources: CGEL gives reasons for an adverb, and the Constructicon draft proposes an NP analysis for the postverbal use.'
  terms: Duration adverbial; non-affirmative (or polarity-sensitive) contexts.
  examples:
    - text: Did you [wait long]?
      from: entry
    - text: They didn't [stay long].
      from: entry
    - text: Will they [stay long]?
      from: constructed
  contrasts:
    - text: They stayed [too long].
      from: constructed
      note: A modified form, which can behave differently from plain <i>long</i>.
    - text: They have long known.
      from: constructed
      note: A separate use before the main verb.
  watch_for:
    - A learner might assume that the question and negative frames carry over to every affirmative sentence with <i>long</i>, though this dictionary describes the plain affirmative as markedly less natural.
  activity: Students sort sentences with <i>long</i> into question, negative, conditional and affirmative frames, and discuss which affirmative versions are natural.
