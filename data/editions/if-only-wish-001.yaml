id: if-only-wish-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>If only</i>
  summary: <i>If only</i>, standing alone, expresses a wish about something that isn't the case or might not be.
  body: |-
    <i>If only we had brought a torch!</i> is a wish. A result can be left unsaid, and the sentence still conveys the wish.

    <i>If only</i> is different from <i>only if</i>. <i>We can enter only if we bring a torch</i> sets a necessary condition. <i>If only</i> expresses a wish, and the clause that follows is often remote in its wording.
  examples:
    - text: '[If only we had brought a torch!]'
      from: entry
    - text: We can enter only if we bring a torch.
      from: entry
  try: Think of something you wish had gone differently. Start the sentence with <i>If only</i>.
teacher:
  summary: Teaches learners to express a wish with <i>if only</i>, and to tell it from <i>only if</i>.
  explain: 'Optative <i>if only</i> stands alone with a finite clause, often modally remote: <i>If only we had brought a torch!</i> It expresses a wish concerning a possibility or unrealized state. A consequence can remain unexpressed, and the utterance conveys a wish. <i>Only if</i> instead sets a necessary condition, as in <i>We can enter only if we bring a torch</i>. This dictionary relates the pattern to ordinary <i>if</i>-conditionals and marks the analysis as provisional.'
  terms: Optative is this dictionary’s term for the wish use.
  examples:
    - text: '[If only we had brought a torch!]'
      from: entry
    - text: We can enter only if we bring a torch.
      from: entry
  contrasts:
    - text: If only we had brought a torch!
      from: entry
      note: A wish.
    - text: We can enter only if we bring a torch.
      from: entry
      note: A necessary condition.
  watch_for:
    - A learner might treat <i>if only</i> as the same as <i>only if</i>, when <i>if only</i> expresses a wish and <i>only if</i> imposes a condition.
    - A learner might look for a main clause after <i>if only</i>, when the consequence can remain unexpressed.
  activity: Give students situations where something went wrong. They write a wish with <i>If only</i> and a related condition with <i>only if</i>, and say how the two differ.
child:
  hook: How do you say what you wish had happened?
  explain: <i>If only</i> can show a wish. <i>If only we had brought a torch!</i> means we wish we had one. It's a wish, so no other part is needed.
  examples:
    - text: '[If only we had brought a torch!]'
      from: entry
  play: Think of a wish about something that didn't happen. Begin with <i>If only</i> and say it with feeling.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
