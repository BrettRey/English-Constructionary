id: if-only-wish-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: If only
  summary: If only, standing alone, expresses a wish about something that isn't the case or might not be.
  body: |-
    If only we had brought a torch! is a wish. A result can be left unsaid, and the sentence still conveys the wish.

    If only is different from only if. We can enter only if we bring a torch sets a necessary condition. If only expresses a wish, and the clause that follows is often remote in its wording.
  examples:
    - text: '[If only we had brought a torch!]'
      from: entry
    - text: We can enter only if we bring a torch.
      from: entry
  try: Think of something you wish had gone differently. Start the sentence with If only.
teacher:
  summary: Teaches learners to express a wish with if only, and to tell it from only if.
  explain: 'Optative if only stands alone with a finite clause, often modally remote: If only we had brought a torch! It expresses a wish concerning a possibility or unrealized state. A consequence can remain unexpressed, and the utterance conveys a wish. Only if instead sets a necessary condition, as in We can enter only if we bring a torch. This dictionary relates the pattern to ordinary if-conditionals and marks the analysis as provisional.'
  terms: Optative is this dictionary’s term for the wish use.
  examples:
    - text: '[If only we had brought a torch!]'
      from: entry
    - text: We can enter only if we bring a torch.
      from: entry
  contrasts:
    - text: If only we had brought a torch!
      from: entry
      note: A wish.
    - text: We can enter only if we bring a torch.
      from: entry
      note: A necessary condition.
  watch_for:
    - A learner might treat if only as the same as only if, when if only expresses a wish and only if imposes a condition.
    - A learner might look for a main clause after if only, when the consequence can remain unexpressed.
  activity: Give students situations where something went wrong. They write a wish with If only and a related condition with only if, and say how the two differ.
child:
  hook: How do you say what you wish had happened?
  explain: If only can show a wish. If only we had brought a torch! means we wish we had one. It's a wish, so no other part is needed.
  examples:
    - text: '[If only we had brought a torch!]'
      from: entry
  play: Think of a wish about something that didn't happen. Begin with If only and say it with feeling.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol)
  result: pass
