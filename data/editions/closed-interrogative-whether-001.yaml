id: closed-interrogative-whether-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: Questions inside sentences with <i>whether</i>
  summary: "<i>Whether</i> can introduce a question or a choice between alternatives inside a larger sentence."
  body: |-
    In <i>Whether to reschedule still needs discussion</i>, <i>whether</i> introduces a choice between alternatives, and the whole phrase acts as the subject of the sentence. <i>Whether</i> can be followed by a full clause or by <i>to</i> and a verb.

    It also works in places where the question word <i>if</i> isn't available, such as before <i>to</i> and a verb. Some other positions, including some where the phrase is the subject, favour <i>whether</i> or require it.
  examples:
    - text: '[Whether to reschedule] still needs discussion.'
      from: entry
    - text: I wonder [whether Kim finished the report].
      from: constructed
  try: Compare <i>I wonder whether to go</i> and <i>I wonder whether we should go</i>. Is the choice between alternatives the same in both?
teacher:
  summary: Useful for explaining when <i>whether</i>, and not <i>if</i>, introduces an embedded closed question.
  explain: "<i>Whether</i> introduces an embedded closed question or choice between alternatives, followed either by a clause in declarative order or by a <i>to</i>-infinitival. It can introduce an infinitival where interrogative <i>if</i> is unavailable. Certain finite prepositional and subject environments likewise favour or require <i>whether</i>. When teaching embedded questions, show <i>whether</i> alongside <i>if</i>, so students see where <i>whether</i> is the form to use."
  terms: 'Subordinate closed interrogative: an embedded closed question or choice between alternatives. Compare <i>if</i>, whose use is more restricted here; see the separate entry for <i>if</i>.'
  examples:
    - text: '[Whether to reschedule] still needs discussion.'
      from: entry
    - text: I wonder [whether Kim finished the report].
      from: constructed
  watch_for:
    - A learner might choose <i>if</i> where <i>whether</i> is favoured or required, as with <i>whether to reschedule</i>.
    - A learner might miss that a <i>whether</i>-phrase can itself be the subject of a sentence.
  activity: Give students sentences with a gap where <i>whether</i> or <i>if</i> could go. They decide where <i>whether</i> is needed or preferred, then say what each embedded clause asks.
checked:
  date: '2026-11-19'
  model: codex (gpt-6.2-sol); claude-opus-5-5 (audit edits)
  result: pass
  note: 'Audit: fixed teacher.terms, which glossed the pattern as an embedded yes/no question only (the entry also covers a choice between alternatives).'
