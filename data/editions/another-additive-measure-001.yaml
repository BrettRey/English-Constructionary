id: another-additive-measure-001
status: draft
drafted:
  date: '2026-11-19'
  model: claude-sonnet-5-5
curious:
  title: <i>Another three days</i>
  summary: <i>Another</i> before a number or measure adds an amount of that size to what has gone before.
  body: |-
    In <i>We stayed another three days</i>, <i>another</i> adds three days to the stay. It doesn't replace the first period. It continues it.

    Ordinary <i>another</i> goes with a singular count noun, as in <i>another day</i>. Here, though, <i>another</i> comes before a plural, <i>three days</i>.
  examples:
  - text: We stayed [another three days].
    from: entry
  - text: We stayed [another day].
    from: constructed
  try: Say <i>We stayed another day</i>, then <i>We stayed another three days</i>. What does <i>another</i> add each time?
teacher:
  summary: Shows how <i>another</i> before a cardinal or measure adds an amount of the stated size, even before a plural.
  explain: In the pattern <i>another</i> plus a cardinal or measure expression plus a nominal, <i>another</i> adds another amount of the stated size to the relevant course or quantity. In <i>We stayed another three days</i>, the added quantity is plural, even though ordinary <i>another</i> with no intervening quantifier selects a singular count nominal. The example adds days to the earlier period and doesn't replace it. This dictionary treats the pattern as a specialization of the indefinite NP and relates it to the measure pseudopartitive. It is marked provisional.
  examples:
  - text: We stayed [another three days].
    from: entry
  contrasts:
  - text: We stayed another three days.
    from: entry
    note: <i>Another</i> plus a cardinal and a plural noun, adding to the earlier period.
  - text: We stayed another day.
    from: constructed
    note: Ordinary <i>another</i> with a singular count noun.
  watch_for:
  - A learner might think <i>another</i> must be followed by a singular noun, when the cardinal allows a plural.
  - A learner might read <i>another three days</i> as a replacement for the earlier period, when the example adds days.
  activity: Students complete sentences such as <i>We waited another ...</i> with a number and a unit of time. They say what <i>another</i> added.
child:
  hook: We say "<i>another day</i>". Can we also say "<i>another three days</i>"?
  explain: <i>Another</i> means one more. With a number it means that much more. <i>We stayed another three days</i> means three more days on top of the ones before.
  examples:
  - text: We stayed [another three days].
    from: entry
  - text: We stayed [another day].
    from: constructed
  play: Pick a number and a time, like two hours or five minutes. Say a sentence with <i>another</i>, like <i>We waited another two hours</i>. Then tell a partner how much more time <i>another</i> added.
