id: cardinal-noun-001
name: Cardinal Noun
pattern: "N[cardinal]"
type: syntactic
dimensions:
  form: "Cardinal numerative in noun category; may be proper or common"
  meaning: "Denotes number entities, quantities, labels, or numerical tokens"
  function: "Heads NPs in various uses (naming, quantifying, labelling)"
  distribution: "Subject, object, complement; proper uses are bare, common uses take determiners"
meanings:
  '1':
    definition: Cardinal numerative used as a noun to denote a number entity or quantity concept
    examples:
      - form: "[Ten] is even."
        note: Proper-noun use (abstract numeral)
      - form: "a ten"
        note: Common-noun use (denominator/token)
      - form: "Room 101"
        note: Proper-noun use (numerical label)
      - form: "hundreds of people"
        note: Common-noun use (magnitude quantifier)
constraints:
  - type: semantic
    description: Denotes a number entity or quantity concept, not a determiner function.
  - type: syntactic
    description: Proper-noun uses head bare NPs; common-noun uses take determiners and plural.
semanticRefs:
  - cardinality
relatedConstructions:
  - id: cardinal-determinative-001
    relationship: related-to
    notes: Cardinal determinatives vs cardinal nouns
  - id: denominator-numeral-001
    relationship: related-to
grounds:
  - source: reynolds-2026-numerals
    relation: cites
    bears-on: category-assignment
  - source: reynolds-2026-numerals
    locator: "§5, Tables 1–2"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "A quantifying or token use can take number inflection and another determiner, as in two tens. The naming use ten in Ten is even and the determinative use in ten cards lack that count-noun environment."
    evidence: "Reynolds separates cardinal nouns used to name, count, or label from syntactic determiner function."
    confidence: medium
