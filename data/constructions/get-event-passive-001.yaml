id: get-event-passive-001
name: "<i>get</i> Passive"
pattern: Clause[affected Subject + get + verbal past participle]
type: mixed
meanings:
  '1':
    definition: Presents the subject as undergoing a passive event, often with subject relevance or affectedness.
    examples:
      - form: Jo [got promoted] last week.
        note: Constructed illustration.
relatedConstructions:
  - id: subject-resultative-001
    relationship: related-to
  - id: be-passive-001
    relationship: alternates-with
    notes: <i>Jo got promoted</i> and <i>Jo was promoted</i> can describe the same event. <i>Get</i> foregrounds the change or its relevance to Jo. <i>Be</i> is also available in stative uses such as <i>is widely believed</i>.
grounds:
  - source: cgel-2002
    locator: Ch. 16 §10.1.3, verbal get-passive versus adjectival get
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: An apparent positive outcome can occur, so adverse consequence is unnecessary. The construction can admit an agent <i>by</i>-phrase and contrasts with <i>get</i> plus an ordinary adjective.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
