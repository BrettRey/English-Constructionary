id: genitive-ing-subject-001
name: Genitive Subject in a Gerund-Participial
pattern: gerund-participial[Subject:genitive NP + V-ing VP]
type: syntactic
meanings:
  '1':
    definition: Expresses an overt subject in the genitive inside a gerund-participial.
    examples:
      - form: I disliked [their arriving so late].
        note: Constructed illustration.
relatedConstructions:
  - id: deverbal-noun-of-argument-001
    relationship: related-to
  - id: np-gen-indep-001
    relationship: related-to
  - id: oblique-ing-subject-001
    relationship: alternates-with
    notes: Compare We objected to their blocking the exit and We objected to them blocking the exit. The case varies in this frame. Availability depends on the higher construction and variety.
  - id: deverbal-ing-nominal-001
    relationship: related-to
    notes: Their carefully sorting the files has a verbal predicate with an adverb and direct object. Their careful sorting of the files has adjective and of-complement in a nominal.
grounds:
  - source: cgel-2002
    locator: Ch. 14 §§1.5–1.6
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The verb can retain adverbial modification and take a direct object. The genitive marks its subject rather than turning the following verb into a noun.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
