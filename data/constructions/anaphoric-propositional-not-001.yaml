id: anaphoric-propositional-not-001
name: "Anaphoric <i>not</i> with an Attitude Predicate"
pattern: licensed predicate + not
type: mixed
meanings:
  '1':
    definition: Picks up the negative counterpart of a prior proposition.
    examples:
      - form: “Is the screen broken?” “I [hope not].”
        note: Constructed illustration.
relatedConstructions:
  - id: negative-raising-001
    relationship: related-to
grounds:
  - source: cgel-2002
    locator: Ch. 9 §7.2; Ch. 17 §7.7.2
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "<i>Not</i> supplies the content that <i>the screen is not broken</i>. <i>I don’t hope so</i> can instead negate the hoping, and compatibility of the standalone <i>not</i> varies by predicate."
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
