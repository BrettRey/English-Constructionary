id: simple-intransitive-vp-001
name: Simple Intransitive VP
pattern: VP[Head:V, without a core complement slot in the use at issue]
type: syntactic
meanings:
  '1':
    definition: Presents a one-place predication without a core object or predicative complement.
    examples:
      - form: The guests [laughed].
        note: Constructed illustration.
