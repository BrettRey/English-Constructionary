id: neither-nor-coordination-001
name: "Correlative Coordination with <i>neither … nor</i>"
pattern: "neither X nor Y"
type: syntactic
meanings:
  '1':
    definition: Negates both conjuncts in a coordination
    examples:
      - form: "He [neither] knew [nor] cared where his children were."
        note: VP coordination
      - form: "[Neither] Kim [nor] Pat replied."
        note: NP coordination
constraints:
  - type: syntactic
    description: Correlative markers <i>neither</i> and <i>nor</i> introduce paired coordinates.
  - type: semantic
    description: Both coordinated alternatives fall under negation.
formRefs:
  - neither-nor-correlative
relatedConstructions:
  - id: coordination-001
    relationship: specialization-of
    parthood: formal
  - id: absolute-negator-determinative-001
    relationship: related-to
  - id: so-neither-inversion-001
    relationship: related-to
lexiconRefs:
  - gold/conjunctions
grounds:
  - source: cgel-2002
    locator: "Ch. 15 §2.4; Ch. 9 §3.2"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "The coordinator can link two phrases as in <i>neither Jo nor Kai</i> or two verb phrases as in <i>neither called nor wrote</i>. The construction differs from additive <i>neither did Jo</i>, which depends on a preceding negative assertion."
    evidence: "CGEL describes the correlative frame and the wider use of nor and neither following negative clauses."
    confidence: medium
