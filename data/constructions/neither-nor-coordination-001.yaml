id: neither-nor-coordination-001
name: Correlative Coordination with neither...nor
pattern: "neither X nor Y"
type: syntactic
meanings:
  '1':
    definition: Negates both conjuncts in a coordination
    examples:
      - form: "He [neither] knew [nor] cared where his children were."
        note: VP coordination
      - form: "[Neither] Kim [nor] Pat replied."
        note: NP coordination
constraints:
  - type: syntactic
    description: Correlative markers neither and nor introduce paired coordinates.
  - type: semantic
    description: Both coordinated alternatives fall under negation.
formRefs:
  - neither-nor-correlative
relatedConstructions:
  - id: coordination-001
    relationship: specialization-of
    parthood: formal
  - id: absolute-negator-determinative-001
    relationship: related-to
  - id: so-neither-inversion-001
    relationship: related-to
lexiconRefs:
  - gold/conjunctions
grounds:
  - source: cgel-2002
    locator: "Ch. 15 §2.4; Ch. 9 §3.2"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "The coordinator can link two phrases as in neither Jo nor Kai or two verb phrases as in neither called nor wrote. The construction differs from additive neither did Jo, which depends on a preceding negative assertion."
    evidence: "CGEL describes the correlative frame and the wider use of nor and neither following negative clauses."
    confidence: medium
