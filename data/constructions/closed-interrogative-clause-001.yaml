    relationship: specialization-of
    parthood: formal
  - id: open-interrogative-clause-001
    relationship: see-also
    notes: Closed and open interrogatives are distinct primary clause types with different syntactic marking
  - id: declarative-question-001
    relationship: see-also
    notes: A declarative question asks without subject–auxiliary inversion and carries a stronger same-polarity bias
