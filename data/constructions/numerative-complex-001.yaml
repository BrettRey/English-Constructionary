id: numerative-complex-001
name: Complex Numerative (Phrasal >99)
pattern: "[factor + magnitude] (+ addition)"
type: syntactic
dimensions:
  form: "Syntactic phrase or coordination; magnitude head with factor modifier"
  meaning: "Multiplicative and additive composition for values above 99"
  function: "Same functions as basic numeratives but with internal syntactic structure"
  distribution: "Prosodic breaks at magnitude boundaries; allows internal modification"
meanings:
  '1':
    definition: Phrasal numeratives above the lexical 0–99 range, built from magnitude phrases with optional additions
    examples:
      - form: one thousand twenty-four
        note: factor + magnitude + asyndetic addition
      - form: two hundred and five
        note: factor + magnitude + <i>and</i>-addition
constraints:
  - type: structural
    description: Requires a magnitude head with a factor; additions are coordinated constituents.
  - type: structural
    description: Applies above the basic numerative lexicon (0–99).
semanticRefs:
  - cardinality
  - additive-composition
syntacticRefs:
  - prosodic-breaks-magnitude
  - coordination-ellipsis-numerative
relatedConstructions:
  - id: cardinal-determinative-001
    relationship: related-to
    notes: Phrasal construction headed by cardinal determinatives; not a specialization of the lexical category (lexeme/phrase boundary at 99, Reynolds 2026 EL&L)
  - id: numerative-factor-modifier-001
    relationship: contains
  - id: numerative-addition-coordination-001
    relationship: contains
  - id: numerative-addition-asyndetic-001
    relationship: contains
grounds:
