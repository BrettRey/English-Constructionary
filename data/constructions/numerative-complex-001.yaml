kind:
  provisional: true
  projection:
    target: "<i>Two hundred and four</i> has an internal phrase <i>two hundred</i> which can also stand independently. Where the context supports the intended scale, the second coordinate of <i>between two hundred and four and six</i> can recover material and mean <i>two hundred and six</i>."
    evidence: "Reynolds uses reduction and coordination to diagnose structure above the basic lexical inventory. A shorter coordinate can also get a literal small-number reading in other contexts."
    confidence: medium
