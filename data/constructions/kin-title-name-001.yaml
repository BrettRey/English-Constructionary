id: kin-title-name-001
name: Kin Title with a Personal Name
pattern: "NP[Nom[pre-head kin term + personal name]], with no determiner"
type: mixed
dimensions:
  form: "A kin term such as aunt, uncle, grandma, grandpa or nana before a given name or surname, with no determiner. The NP's head is the proper noun, and the kin term is a pre-head modifier."
  meaning: "Designates one relative: the kin term gives a kin class and the personal name picks out a member of it."
  function: "Referential argument, subject-determiner in a genitive, or vocative."
  distribution: "In the caregiver lines cited, grandparental titles occur with given names (<i>Grandma Sharon</i>) and with a surname (<i>Grandma Baum</i>). Schneider and Homans's American informants most often designated aunts and uncles this way."
meanings:
  '1':
    definition: Designates a relative by combining a kin title with that person's name.
    details: "Schneider and Homans report that an uncle may be addressed or referred to by <i>uncle</i> plus first name, by first name alone or by <i>uncle</i> alone, and similarly an aunt (1955: 1195). Among their informants the combination was the most frequently employed term for aunts and uncles (p. 1199), and they write that the American system “classes all uncles together and then subdivides members of the class” (p. 1201). CGEL calls pre-head modifiers of personal names such as <i>Queen</i>, <i>Sister</i>, <i>Captain</i> and <i>Dr</i> appellations, expressing the status of the individual, and notes that it is arguable whether they form part of the name (pp. 518–519). Its list of appellations doesn't include kin terms. Treating the kin term here as a modifier of the same kind extends that analysis and isn't itself grounded in CGEL."
    examples:
      - form: "Well, we are actually leaving for [Grandma Sharon] and [Grandpa Dale] in three days."
        note: "Attested, mother to child. Coordinated NPs as object in a PP; the transcript's pause mark is omitted."
        grounds:
          - source: childes
            locator: "Weist, Matt/040610.cha, line 899"
            relation: attests
            bears-on: attestation
      - form: "I like the ones that [Grandmama Linda] made though."
        note: "Attested, mother. Subject of a relative clause."
        grounds:
          - source: childes
            locator: "Brent, j1/010001.cha, line 392"
            relation: attests
            bears-on: attestation
      - form: "How is [Grandma Baum]?"
        note: "Attested. The speaker is herself a grandmother (participant Kate); a surname follows the kin title."
        grounds:
          - source: childes
            locator: "Snow, 030019b.cha, line 3596"
            relation: attests
            bears-on: attestation
      - form: "That reminds me of [grampa Charlie]'s story, Julia."
        note: "Attested, mother to child. The NP is subject-determiner in a genitive."
        grounds:
          - source: childes
            locator: "Hall, WhitePro/jub.cha, line 15237"
            relation: attests
            bears-on: attestation
      - form: "Thanks, [Aunt Sarah]."
        note: "Constructed vocative."
constraints:
  - type: syntactic
    description: "The kin term takes no determiner of its own. With a genitive determiner the structure differs: in <i>it's your brother Ben's birthday</i> (CHILDES Peters, 010621a.cha, line 20), <i>brother</i> is head, <i>your</i> is its determiner and <i>Ben</i> is an integrated appositive. CGEL draws the same contrast between <i>architect Norman Foster</i>, where <i>architect</i> is an omissible embellishment, and <i>the architect Norman Foster</i>, where <i>architect</i> is head and the name an appositive dependent (p. 520)."
  - type: semantic
    description: "The kin term assigns the bearer to a kin class, and the personal name selects one member of it (Schneider and Homans 1955: 1201)."
  - type: pragmatic
    description: "The same relative can be designated in other ways. Schneider and Homans's informants used first name alone as the principal term for an uncle or aunt where there was strong positive or negative affect (1955: 1200). One informant called his father's brother <i>Uncle Bill</i> when speaking with his father, <i>Bill</i> when speaking with the uncle directly and <i>my uncle</i> when telling a friend about him (p. 1196)."
relatedConstructions:
  - id: strong-proper-name-001
    relationship: overlaps-with
    overlap-dimension: functional
    notes: "In referential argument use the NP is a strong proper name (<i>leaving for Grandma Sharon</i>); in address it isn't (<i>Thanks, Aunt Sarah</i>). Test: hold the referent fixed and drop the personal name. Bare <i>Grandpa</i> has a simple head and is itself the name, while in <i>Grandpa Dale</i> the kin term modifies a proper noun."
  - id: title-personal-name-001
    relationship: overlaps-with
    overlap-dimension: formal
    notes: "Both place a title before a personal name with no determiner, the pattern CGEL calls appellation plus name (pp. 518–519). That entry's titles identify an office, qualification or style (<i>Sir James</i>, <i>Dr Patel</i>); a kin title identifies a kin class. Test: drop the personal name. A kin title can remain as a name for the same person: Schneider and Homans's informants addressed or referred to an uncle by <i>uncle</i> plus first name or by <i>uncle</i> alone (1955: 1195), and bare <i>Aunty</i> occurs as an argument (<i>Do the duck for Aunty?</i>, CHILDES Peters, 010410c.cha, line 605). <i>Sir</i> can't: dropping the name from <i>Sir James opened the ceremony</i> leaves ∗<i>Sir opened the ceremony</i> (constructed). Some occupational appellations pass the test, as in CGEL's <i>Have you seen Nurse?</i> (p. 518), so it separates kin titles from <i>Sir</i>, not from every office title."
  - id: proper-name-001
    relationship: implements
    notes: "The NP is used as a relative's name; proper name stays the semantic classification."
  - id: restrictive-appositive-name-001
    relationship: related-to
    notes: "Compare <i>it's your brother Ben's birthday</i>, where <i>brother</i> is head and <i>Ben</i> an integrated appositive, with <i>grampa Charlie's story</i>, where the kin term modifies the name and no determiner occurs."
  - id: vocative-001
    relationship: interfaces-with
    notes: "The same NP serves in address (<i>Thanks, Aunt Sarah</i>, constructed)."
  - id: genitive-s-001
    relationship: interfaces-with
    notes: "The NP can be subject-determiner in a genitive (<i>grampa Charlie's story</i>)."
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §20.2.2, [4ii] and Appellations, pp. 518–519; nominal modifiers and appositives, p. 520"
    relation: discusses
    bears-on: projection
    note: "Appellations as pre-head modifiers of personal names, with royal, clerical, military, political, judicial and academic kinds; kin terms aren't among them. Contrasts <i>architect Norman Foster</i> with <i>the architect Norman Foster</i>."
  - source: schneider-homans-1955
    locator: "pp. 1195, 1196, 1199–1201"
    relation: discusses
    bears-on: projection
    note: "<i>Aunt</i>- or <i>uncle</i>-plus-first-name as the most frequent designation among the informants, its alternation with first name alone, <i>uncle</i> alone and <i>my uncle</i>, and the classing and subdividing of uncles."
  - source: childes
    locator: "Weist, Matt/040610.cha line 899; Brent, j1/010001.cha line 392; Snow, 030019b.cha line 3596; Hall, WhitePro/jub.cha line 15237; Peters, 010621a.cha line 20 and 010410c.cha line 605; Brown, Sarah/040118.cha line 296"
    relation: attests
    bears-on: attestation
    note: "Title-plus-name arguments and genitives in caregiver speech, a determined kin noun with an appositive name, a bare kin title used alone, and a clerical appellation."
kind:
  provisional: true
  projection:
    target: "Knowing that a kin title plus a personal name is a family's designation for a relative predicts that it occurs with no determiner in argument functions, as a genitive subject-determiner and in address, and that the same person can also be designated by the first name alone, the kin term alone or a relational NP such as <i>my uncle</i>, depending on audience and relationship."
    evidence: "Schneider and Homans (1955: 1195–1201) document the combination and its alternatives for aunts and uncles among their American informants. The CHILDES lines attest argument and genitive uses in caregiver speech. The analysis of the kin term as a pre-head modifier extends CGEL's account of appellations, which doesn't list kin terms."
    confidence: medium
  boundaries:
    overlaps_with: ["title-personal-name-001", "strong-proper-name-001"]
    known_boundary_items:
      - "<i>Sister Margareta</i>, said of a school principal (CHILDES Brown, Sarah/040118.cha, line 296). <i>Sister</i> here is a clerical appellation in CGEL's list (p. 519), not a kin title."
      - "<i>my Aunt Sarah</i> or <i>my aunt Sarah</i> (constructed). With a genitive determiner the kin noun can be head and the name an appositive, as in <i>the architect Norman Foster</i>; the spelling varies."
      - "Courtesy aunts and uncles (Schneider and Homans 1955: 1203). The kin term is applied to someone who isn't a relative, though there is “never any doubt about their status as courtesy kin”."
  grain:
    level: micro
    parent_families: ["personal-naming"]
semanticRefs:
  - reference
