id: bare-role-001
name: Bare Role Construction
pattern: "NP[Det:absent + Nom[Head:singular count role noun]], in a licensed role slot"
type: mixed
dimensions:
  form: "A singular count nominal, optionally modified, with no determiner"
  meaning: "Presents an office, assignment, or role that can be held or taken on"
  function: "Subject- or object-oriented predicative, complement of role-marking as or selected of, or ascriptive supplement"
  distribution: "Available in particular role-denoting senses and constructions. Ordinary referential subject and object positions generally require a determiner with the same singular count noun."
meanings:
  '1':
    definition: Ascribes an office or institutional role, or gives the content of an office expression.
    details: "The same nominal can follow be, become, remain, appoint, or elect when the verb licenses a predicative complement. It can also occur with as and in role of or position of. In an appointment construction the direct object names the appointee and the bare NP gives the office."
    examples:
      - form: "They appointed Lee [treasurer of the club]."
        note: "Constructed object-oriented predicative. In They questioned the treasurer of the club, the article-marked NP instead identifies the person questioned."
      - form: "Lee served [as treasurer]."
        note: "Constructed prepositional frame. Compare Lee applied for the position [of treasurer]. Both retain a bare role nominal."
      - form: "Faatulu was named [co-captain] along with fellow junior Jamie Peck."
        note: "The sports report explicitly names two holders of the role."
        grounds:
          - source: asu-faatulu-co-captain
            locator: "Paragraph beginning As one of the few upperclassmen"
            relation: attests
            bears-on: attestation
      - form: "Lee is [secretary of the club]."
        note: "Constructed after CGEL’s comparison. Lee is the secretary of the club can also specify the incumbent in answer to Who is the secretary?"
  '2':
    definition: Ascribes a professional assignment construed as a post.
    details: "A workplace can make a particular assignment available for the construction. The availability of a bare form is sensitive to lexical choice and how a job title is used in the institution."
    examples:
      - form: "They appointed Lee [lead counsel] for the appeal."
        note: "Constructed. Lead counsel specifies the assignment."
      - form: "Lee became [a lawyer]."
        note: "Constructed comparison. In ordinary standard usage, became lawyer is degraded on the professional-class reading."
  '3':
    definition: Ascribes a relational or ceremonial role in a licensed frame.
    details: "A following relational dependent can specify whom the role is held in relation to. This use is limited to independently available role expressions. It is distinct from using a kin term as a form of address or as a standing name."
    examples:
      - form: "They asked Lee to be [godfather to their son]."
        note: "Constructed relational example. The to-phrase supplies the other participant."
      - form: "[Dad] called, but Sam answered."
        note: "Constructed boundary case. Dad identifies a person as subject when the family uses it as a name."
constraints:
  - type: syntactic
    description: "A bare role NP can describe the subject or object. It does not ordinarily occupy the subject or object position as a referential expression for the roleholder."
  - type: semantic
    description: "The choice of noun and context must support a role reading. Predicative function alone does not license removal of the article from become a miser or become a teacher."
  - type: semantic
    description: "The role can have multiple holders. An article-marked alternative can also ascribe a role, and with specifying be it can identify the contextually relevant incumbent."
relatedConstructions:
  - id: np-bare-001
    relationship: specialization-of
    parthood: formal
    notes: "This is one use of a determinerless NP headed by a nominal."
  - id: subject-ascriptive-001
    relationship: interfaces-with
    notes: "A bare role NP can ascribe a post to the subject."
  - id: object-ascriptive-001
    relationship: interfaces-with
    notes: "In the appointment frame the predicand is realized as object."
  - id: specificational-copular-001
    relationship: related-to
    notes: "The definite counterpart can identify who fills the role."
  - id: strong-proper-name-001
    relationship: related-to
    notes: "A role form used as a standing name independently licenses referential argument uses."
  - id: weak-proper-name-article-001
    relationship: related-to
    notes: "The article pattern of a conventional name is independent of the article alternation in role predication."
grounds:
  - source: cgel-2002
    locator: "Ch. 4 §5.1 [5]; Ch. 5 §8.5 [19], p. 409; Ch. 7, pp. 637–638, predicative complements of as; Ch. 15 §5, [22ii]"
    relation: discusses
    bears-on: projection
    note: "Documents verbal, prepositional, and ascriptive supplementary uses and contrasts referential object uses."
  - source: cgel-2002
    locator: "Ch. 4 §5.5.2, contrast with secretary of the bushwalking club; Ch. 5 §8.5 [19], p. 409"
    relation: cites
    bears-on: projection
    note: "The role ascription and the identifying interpretation differ. Chapter 5 gives the stronger replacement claim."
kind:
  provisional: true
  projection:
    target: "In ordinary standard English, with a reading that ascribes or names an assignment, a nominal such as treasurer can remain bare in She stayed treasurer, They appointed her treasurer, and As treasurer, she signed. Reuse as a stand-alone referential object, as in They questioned the treasurer, normally calls for a determiner. The same bare office ascription can apply to more than one holder."
    evidence: "CGEL compares the same noun in predicative and object positions and documents the as and of uses. The Arizona State report documents shared tenure. The acceptability and reading of the article-insertion variants remain sensitive to the context."
    confidence: high
semanticRefs:
  - role
  - category
