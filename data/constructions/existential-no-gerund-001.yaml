id: existential-no-gerund-001
name: "Existential <i>no</i> with a Gerund-Participial"
pattern: there + BE + no + VP[gerund-participial]
type: mixed
meanings:
  '1':
    definition: Presents an action as unavailable in the circumstances.
    details: "<i>There was no moving it</i> normally suggests that moving it was impossible or impracticable. In a constructed context where moving the crate was easy and nobody chose to do it, <i>nobody moved it</i> fits directly and <i>there was no moving it</i> calls for further explanation. A rule can also be the obstacle, as in a prohibitive use. The availability and source of this modal force are open."
    examples:
      - form: '[There was no stopping her.]'
        note: Chapter 5 mentions the pattern in its survey of what can head an NP.
        grounds:
          - source: cgel-2002
            locator: Ch. 5 §2, p. 332 n. 3
            relation: attests
            bears-on: attestation
      - form: '[There was no telling what he might do next.]'
        note: The action at issue is telling what he might do.
        grounds:
          - source: cgel-2002
            locator: Ch. 14 §1.6(b), p. 1189 [57iia]
            relation: attests
            bears-on: attestation
      - form: '[There’ll be no stopping her.]'
        note: A future action is presented as unavailable.
        grounds:
          - source: cgel-2002
            locator: Ch. 14, p. 1189 [57iib]
            relation: attests
            bears-on: attestation
      - form: '[There was no moving it.]'
        note: Constructed test. Compare a crate bolted to the floor with one that people simply chose to leave.
relatedConstructions:
  - id: no-determiner-001
    relationship: related-to
    notes: The fixed form <i>no</i> is shared with ordinary negative NPs.
grounds:
  - source: cgel-2002
    locator: Ch. 14, p. 1189 [57ii]
    relation: cites
    bears-on: category-assignment
    note: Treats <i>no</i> plus a gerund-participial as hybrid and observes a strong restriction to existential <i>there</i>.
kind:
  provisional: true
  projection:
    target: On the impossibility reading, the form invites an explanation of what blocks the action even when its nonoccurrence is already given.
    evidence: CGEL's contrast between existential and nonexistential hosts supports the distribution. The feasibility comparison is a proposed test of the interpretation.
    confidence: low
