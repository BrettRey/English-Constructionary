id: stressed-some-exclamative-001
name: Exclamation with Stressed Some
pattern: Exclamation with PredComp:NP[stressed SOME + Nom]
type: pragmatic
meanings:
  '1':
    definition: Presents an instance as remarkable for its kind, with positive or negative evaluation.
    details: CGEL compares emotive one. Anderson’s wine comparison distinguishes this pattern from ordinary exclamation. The wine we drank can express surprise purely at quantity. That was some wine we drank resists that reading. Anderson develops an account from focus, some, and properties of exclamatives. The scope of the parallel with one remains open.
    examples:
      - form: '[SOME hotel that was!] An utter disgrace!'
        note: Negative evaluation, with stress as marked by CGEL.
        grounds:
          - source: cgel-2002
            locator: Ch. 5 §7.5(d) [30b]
            relation: attests
            bears-on: attestation
      - form: '[Those are SOME elephants!]'
        note: Plural nominal.
        grounds:
          - source: cgel-2002
            locator: Ch. 5 §7.5(d) [30a]
            relation: attests
            bears-on: attestation
      - form: '[That was SOME wine we drank!]'
        note: Anderson's mass-noun comparison constrains the available kind of surprise. Capitals mark stress here.
        grounds:
          - source: anderson-some-exclamatives
            locator: p. 41, (23)–(24)
            relation: attests
            bears-on: attestation
relatedConstructions:
  - id: exclamation-001
    relationship: implements
    notes: The pattern realizes exclamation as an utterance-level function.
  - id: some-n-or-other-001
    relationship: related-to
    notes: An independent use of some associates the NP with a different discourse contribution.
kind:
  provisional: true
  projection:
    target: The stressed predication favours noteworthy character or quality over surprise solely at quantity.
    evidence: CGEL's positive and negative examples and Anderson's contrast between stressed some and a plain nominal exclamation.
    confidence: medium
