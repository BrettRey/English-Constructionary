id: exclamative-word-001
name: Exclamative Use of Indeterminates
pattern: "what:Adj / how:Adv (exclamative packaging)"
type: semantic
dimensions:
  form: "Only <i>what</i> and <i>how</i> from the indeterminate series; exclamative <i>what</i> is an adjective, while exclamative <i>how</i> is adverbial"
  meaning: "The open variable is packaged as evaluation against a contextual norm"
  function: "Marks exclamative clause type and, in its core role, remarkable degree or quality"
  distribution: "Exclamative clauses (<i>What children they are!</i>, <i>How fast she ran!</i>) and exclamative NPs"
meanings:
  '1':
    definition: Expresses evaluation of the variable's value against a contextual standard or expectation
    details: "Membership is the tightest of the three packagings: <i>what</i> and <i>how</i> only. Exclamative <i>how</i> is adverbial, modifying an adjective, degree determinative, adverb, or verb. Exclamative <i>what</i> is an adjective functioning as external or internal modifier in NP structure; this contrasts with interrogative <i>what</i>, which is a determinative in determiner use but a pronoun when it heads an NP (CGEL pp. 397–98, 918–20). Exclamative uses pattern non-deitally on the deitality inventory; <i>such (a)</i> and <i>so many/much</i> pattern with them in exclamatory NPs without being indeterminates."
    examples:
      - form: "[what] children"
        note: Adjective in modifier function; notable children evaluated against a norm
      - form: "[how] fast"
        note: Adverb modifying an adjective; remarkable speed
      - form: "[What a] day it's been!"
        note: Exclamative NP with singular count noun
semanticRefs:
  - variable
  - evaluation
formRefs:
