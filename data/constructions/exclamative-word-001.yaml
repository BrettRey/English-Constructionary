    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "An independent <i>What a mess!</i> uses <i>a</i> in the singular count case, while <i>What awful weather!</i> does not. <i>How odd!</i> can supply its own exclamatory force without an overt subject. An ordinary open interrogative uses related forms in a different clause construction."
    evidence: "CGEL compares exclamatives with open interrogatives and gives the phrasal uses and internal NP restrictions."
    confidence: medium
