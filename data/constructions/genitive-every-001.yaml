id: genitive-every-001
name: Genitive with Every
pattern: NP[Det:NP[gen] + every + Nom[sg]]
type: mixed
meanings:
  '1':
    definition: Quantifies over instances delimited by their relation to the genitive.
    details: Her every move ranges over her movements. CGEL contrasts each in the same position. Postma and Rooryck discuss body-part nouns alongside actions and contrast the form with every move of John’s. To test how the genitive sets the domain, keep bone fixed and compare bones of a person’s skeleton with bones that person owns as specimens.
    examples:
      - form: They scrutinised [her every move].
        note: The genitive delimits the movements under consideration.
        grounds:
          - source: cgel-2002
            locator: Ch. 5 §7.4(g), p. 379 [25a]
            relation: attests
            bears-on: attestation
relatedConstructions:
  - id: subject-determiner-001
    relationship: interfaces-with
    notes: A genitive appears in determiner function before every.
grounds:
  - source: postma-rooryck-1996
    locator: §§2–4
    relation: discusses
    bears-on: projection
    note: Argues for a relational restriction and compares the oblique genitive.
kind:
  provisional: true
  projection:
    target: The kind of relation to the genitive can affect whether the pattern is available, even when the head noun is held fixed.
    evidence: CGEL's every versus each contrast and the published discussion of actions and body parts. The owned-specimen comparison is a proposed test.
    confidence: medium
