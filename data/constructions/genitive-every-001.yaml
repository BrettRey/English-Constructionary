id: genitive-every-001
name: "Genitive with <i>every</i>"
pattern: NP[Det:NP[gen] + every + Nom[sg]]
type: mixed
meanings:
  '1':
    definition: Quantifies over instances delimited by their relation to the genitive.
    details: "<i>Her every move</i> ranges over her movements. CGEL contrasts <i>each</i> in the same position. Postma and Rooryck discuss body-part nouns alongside actions and contrast the form with <i>every move of John’s</i>. To test how the genitive sets the domain, keep <i>bone</i> fixed and compare <i>bones of a person’s skeleton</i> with <i>bones that person owns as specimens</i>."
    examples:
      - form: They scrutinised [her every move].
        note: The genitive delimits the movements under consideration.
        grounds:
          - source: cgel-2002
            locator: Ch. 5 §7.4(g), p. 379 [25a]
            relation: attests
            bears-on: attestation
relatedConstructions:
  - id: subject-determiner-001
    relationship: interfaces-with
    notes: A genitive appears in determiner function before <i>every</i>.
grounds:
  - source: postma-rooryck-1996
    locator: §§2–4
    relation: discusses
    bears-on: projection
    note: Argues for a relational restriction and compares the oblique genitive.
kind:
  provisional: true
  projection:
    target: The kind of relation to the genitive can affect whether the pattern is available, even when the head noun is held fixed.
    evidence: CGEL's <i>every</i> versus <i>each</i> contrast and the published discussion of actions and body parts. The owned-specimen comparison is a proposed test.
    confidence: medium
