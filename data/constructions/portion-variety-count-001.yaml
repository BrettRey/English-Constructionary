id: portion-variety-count-001
name: Count NP for a Portion or Variety
pattern: NP[count determination + substance noun, with ordinary plural marking where appropriate]
type: mixed
meanings:
  '1':
    definition: Counts servings or other contextually standardized portions of a substance.
    details: In two coffees in a café, the relevant units are servings. Their size and the containers used are supplied by the situation. Two of the same blend can satisfy the request.
    examples:
      - form: Could we have [two coffees]?
        note: Constructed café example. Two portions can both be the same variety.
  '2':
    definition: Counts varieties of a substance.
    details: In two coffees at a tasting the units can be varieties. One small sample of each variety would suffice. A later third serving of the first variety does not add to the number of varieties.
    examples:
      - form: The roaster sells [two coffees] from that region.
        note: Constructed example foregrounding distinct varieties.
relatedConstructions:
  - id: n-non-count-001
    relationship: related-to
    notes: A normally non-count substance description supplies what is portioned or classified.
  - id: np-indef-001
    relationship: specialization-of
    notes: The examples use ordinary count NP syntax.
grounds:
  - source: fillmore-lee-goldman-rhomieux-2012
    locator: author draft, §4.8.3 (57–58)
    relation: discusses
    bears-on: projection
    note: Distinguishes portion and variety constructions and their sources of contextual interpretation.
kind:
  provisional: true
  projection:
    target: With the same counted noun and cardinal, portion and variety readings have different counting units. Identical servings count separately in the portion reading.
    evidence: FrameNet gives both readings with beer and treats them as two construals of a substance noun. The contrast adds an explicit constructional dependency to the existing non-count noun entry.
    confidence: high
