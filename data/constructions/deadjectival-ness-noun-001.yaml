id: deadjectival-ness-noun-001
name: "Deadjectival Noun in <i>-ness</i>"
pattern: N[adjective base + -ness]
type: mixed
meanings:
  '1':
    definition: Names a property or state characterized by the base adjective.
    details: The regular formation preserves the stress of the base. Novel formations are generally interpretable given a recognizable adjective. Some derivatives lexicalize specialized readings. Competing <i>-ity</i> may shift stress or alter the base.
    examples:
      - form: '[the clearness of the recording]'
        note: Constructed example with <i>-ness</i> from <i>clear</i>.
      - form: '[unexpected awkwardness]'
        note: Constructed example with the stress of <i>awkward</i> preserved.
relatedConstructions:
  - id: n-common-001
    relationship: specialization-of
    notes: The output is a common noun.
  - id: adjective-001
    relationship: related-to
    notes: The core pattern selects an adjective as its base.
  - id: deadjectival-ity-noun-001
    relationship: related-to
    notes: Both suffixes can create property nouns, as in <i>kindness</i> and <i>opacity</i>. The adjective base constrains the choice of suffix and can have a different stem form before <i>-ity</i>.
grounds:
  - source: casa-constructicon
    locator: records 152–153
    relation: discusses
    bears-on: projection
    note: Distinguishes the two derivational patterns.
  - source: cgel-2002
    locator: Ch. 19 §5.7.2(i)
    relation: discusses
    bears-on: projection
    note: Documents stress, stem alternations and productivity in the two patterns.
kind:
  provisional: true
  projection:
    target: The regular <i>-ness</i> output retains base stress, and the pattern supports novel property nouns. A competing <i>-ity</i> formation can change the stress or shape of the base.
    evidence: CASA gives separate <i>-ness</i> and <i>-ity</i> records. CGEL documents their formal and productivity contrast.
    confidence: high
