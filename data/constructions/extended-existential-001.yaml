id: extended-existential-001
name: Extended Existential with a Predicate
pattern: Clause[dummy there + be + pivot NP + integrated location or secondary predication]
type: mixed
meanings:
  '1':
    definition: Introduces a referent and characterizes its position or current situation.
    examples:
      - form: '[There were two alarms ringing].'
        note: Constructed illustration.
