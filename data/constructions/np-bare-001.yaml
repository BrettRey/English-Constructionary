id: np-bare-001
name: Bare NP Construction
pattern: NP[Head:Nom]
meanings:
  '1':
    definition: Refers to/predicates non-count substance
    details: Refers to or predicates non-count substance/material
    examples:
      - form: Water is essential
        note: Non-count substance reference
      - form: That is gold
        note: Non-count substance predication
    relations:
      - 1
      - 2
  '2':
    definition: Uses a bare plural for kind reference, classification, or an indefinite set
    details: "Bare plurals can receive a kind, generic, predicative, or episodic interpretation from the construction around them."
    examples:
      - form: Dogs are loyal
        note: Kind reference
      - form: Those are bears
        note: Classification
      - form: Dogs barked all night
        note: Episodic use with a contextually supplied set of dogs
    relations:
      - 2
  '3':
    definition: Ascribes a role with a bare singular count NP
    details: "A licensed role NP can be bare as a predicative, in certain prepositional frames, or as an ascriptive supplement. The same role noun generally needs a determiner when used as an ordinary argument referring to the incumbent."
    examples:
      - form: Lee stayed [president]
        note: Role predication
      - form: Jo became [chair]
        note: Role assumption
  '4':
    definition: Refers to individual
    details: Refers to uniquely identifiable individual through proper name
    examples:
      - form: John arrived
        note: Individual reference
      - form: That is Mary
        note: Individual identification
    relations:
      - 1
      - 4
  '5':
    definition: Refers to/predicates activity
    details: Refers to or predicates generic activity type
    examples:
      - form: Competitive swimming takes practice
        note: Activity reference (the adjectival modifier supports the noun analysis; bare "<i>playing piano</i>" is a gerund-participial clause, not an NP)
      - form: That is competitive swimming
        note: Activity identification
    relations:
      - 2
  '6':
    definition: Refers to/predicates time
    details: Refers to or predicates temporal point/period
    examples:
      - form: Monday works
        note: Time reference
      - form: That is noon
        note: Time identification
  '7':
    definition: Refers to/predicates place
    details: Refers to or predicates location/space
    examples:
      - form: "[Toronto] was the next stop."
        note: Articleless place name with a nominal head
      - form: "The venue is [Kingston]."
        note: Specifies a place by its name
  '8':
    definition: Refers to/predicates abstract concept
    details: Refers to or predicates abstract notion/quality
    examples:
      - form: Freedom isn't free
        note: Abstract reference
      - form: That is justice
        note: Abstract identification
    relations:
      - 2
relations:
  '1':
    construction: np-indef-001
    type: related-to
  '2':
    construction: n-non-count-001
    type: related-to
    notes: 'Original type: enables.'
  '4':
    construction: proper-name-001
    type: related-to
    notes: 'Original type: enables.'
semanticRefs:
  - kind
  - abstract
  - deictic
syntacticRefs:
  - bare-singular-exceptions
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§3.1, 8.5, 20.2"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "A bare NP can be singular count in a restricted role or naming use, while bare plurals and non-count nouns can normally be arguments. Compare <i>Lee became chair</i>, <i>Chair</i> called on the name reading, and <i>We bought chairs</i>."
    evidence: "CGEL provides independent distributional grounds for these kinds of bare uses. Absence of a determiner alone does not fix their interpretation."
    confidence: medium
relatedConstructions:
  - id: np-001
    relationship: specialization-of
    parthood: formal
    notes: The NP consists of its nominal and has no overt determiner.
  - id: np-det-001
    relationship: related-to
    notes: <i>Dogs barked</i> and <i>Those dogs barked</i> share the same nominal. The overt demonstrative in the second selects a contextually identifiable set.
