    relationship: specialization-of
    parthood: formal
  - id: exclamative-word-001
    relationship: interfaces-with
    notes: Exclamative what/how supplies both a core phrasal role and the feature marking the Clause as exclamative
  - id: exclamation-001
    relationship: interfaces-with
    notes: Exclamative clauses characteristically realize exclamatory force, but the pragmatic exclamation profile is broader than this clause type
  - id: open-interrogative-clause-001
    relationship: see-also
    notes: What and how can mark either type, but role, order, meaning, and context distinguish them
  - id: clause-analogue-001
    relationship: see-also
    notes: Phrase-only exclamatory expressions receive clausal interpretations without being headed Clauses
