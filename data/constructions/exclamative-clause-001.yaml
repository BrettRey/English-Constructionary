id: exclamative-clause-001
name: Exclamative Clause
pattern: "Clause: Exclamative:XP[what/how] + (Subject:XP +) Head:VP"
type: syntactic
semanticType: predication
dimensions:
  form: "Tensed Clause headed by a VP and marked by an exclamative phrase based on what or how; normally the exclamative phrase is initial and Subject precedes the Predicator"
  meaning: "Presents a proposition as holding to a remarkable degree or in a remarkable way relative to a contextual norm"
  function: "Characteristically makes an exclamatory statement, without being identical to the broader pragmatic category of exclamation"
  distribution: "Main clauses and subordinate exclamative content clauses"
meanings:
  '1':
    definition: A headed clause type marked by an exclamative what/how phrase and characteristically used for an exclamatory statement
    details: "Exclamative what and how mark clause type while also performing a core role inside the exclamative phrase. Headed exclamatives are normally tensed and usually have Subject–Predicator order, although subject postposing and subject–auxiliary inversion are possible. Clause type must be kept distinct from force: exclamative is one syntactic source of exclamatory statements, while the wider exclamation profile also includes interjections, NPs, and recruited declaratives. Phrase-only What a disaster! is not a headed Clause in this project and belongs with clause-analogue semantics (CGEL pp. 853–57, 918–23)."
    examples:
      - form: "[What a fine player she is!]"
        note: What-exclamative with Subject–Predicator order
      - form: "[How generous you are!]"
        note: How-exclamative expressing remarkable degree
      - form: "I realised [what a bargain it was]."
        note: Subordinate exclamative content clause
      - form: "[How happy would he be if he could see her once more!]"
        note: Marked but licensed subject–auxiliary inversion in a headed exclamative
constraints:
  - type: syntactic
    description: "The construction is a Clause headed by VP and contains an exclamative phrase based on what or how; Subject–Predicator order is usual but not invariant."
  - type: structural
    description: "A phrase-only expression such as What a disaster! is not an instance of this headed construction; its clausal interpretation belongs under clause-analogue-001."
  - type: pragmatic
    description: "Exclamatory statement is the characteristic use, but exclamative clause type is not coextensive with exclamation or with exclamatory prosody."
kind:
  provisional: true
  projection:
    target: "An exclamative what/how phrase inside a headed Clause predicts remarkable-degree interpretation, a strong preference for Subject–Predicator order, and availability in both main and subordinate exclamative environments"
    evidence: "What/how marking covaries with evaluative degree semantics across main and subordinate headed clauses, while the order possibilities distinguish this construction from open interrogatives without defining it by punctuation or force"
    confidence: high
    grounds:
      - source: cgel-2002
        locator: "pp. 853-57, 918-23"
        relation: cites
        bears-on: projection
        note: "Exclamative marking projects remarkable-degree interpretation and main/subordinate distribution"
      - source: cgel-2002
        locator: "pp. 853-57, 918-23"
        relation: cites
        bears-on: stability
        note: "The form-meaning-order profile recurs across headed exclamatives"
  secured: stable
  profile:
    core:
      - property: Exclamative what/how marking
        diagnostics: ["what with exclamative NP", "how with gradable phrase"]
        weight: high
      - property: Remarkable-degree interpretation
        diagnostics: ["evaluation against contextual norm", "exclamatory statement as characteristic use"]
        weight: high
      - property: Headed clausal structure
        diagnostics: ["overt VP head", "normally tensed", "main and subordinate distribution"]
        weight: high
  grain:
    level: meso
    parent_families:
      - clause-type
relatedConstructions:
