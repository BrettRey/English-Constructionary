id: no-determiner-001
name: "Negative determinative <i>no</i> in determiner function"
pattern: "no + N"
type: syntactic
meanings:
  '1':
    definition: Negatively quantifies a nominal by asserting zero instances
    examples:
      - form: "no books"
        note: Zero instances of books
      - form: "no evidence"
        note: Absence of evidence
constraints:
  - type: syntactic
    description: A DP headed by the determinative <i>no</i> functions as determiner within the NP.
  - type: semantic
    description: Construes the NP as having zero members or instances.
syntacticRefs:
  - clause-polarity-diagnostics
relatedConstructions:
  - id: primary-auxiliary-negation-001
    relationship: interfaces-with
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§7, 11; Ch. 9 §§3.2.1–3.2.2"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "<i>No</i> can determine a singular count, plural count, or non-count nominal. A clause with <i>We saw no damage</i> normally licenses a positive confirmation tag, linking the local determiner to wider clausal polarity."
    evidence: "CGEL documents the distributions of <i>no</i> and the distinct polarity diagnostics. Those are separable from the claim that a contextually relevant quantity is zero."
    confidence: medium
