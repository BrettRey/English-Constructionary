id: finite-do-support-001
name: "Finite <i>do</i> Support"
pattern: Clause[finite do + plain-form VP] in inversion or clause negation
type: syntactic
meanings:
  '1':
    definition: Supplies a finite auxiliary when the construction requires one and the ordinary positive clause has a lexical verb.
    examples:
      - form: '[Did you check] the hinge?'
        note: Constructed illustration.
      - form: '[Can you check] the hinge?'
        note: Constructed comparison. An available finite modal supplies the operator.
relatedConstructions:
  - id: clause-001
    relationship: specialization-of
    parthood: formal
  - id: imperative-negation-do-001
    relationship: related-to
    notes: Imperative <i>do</i> also occurs before <i>be</i>.
  - id: closed-interrogative-clause-001
    relationship: interfaces-with
    notes: <i>Did Jo leave?</i> inserts finite <i>do</i> when the clause needs inversion and has no other auxiliary. <i>Has Jo left?</i> inverts the auxiliary already present.
  - id: primary-auxiliary-negation-001
    relationship: interfaces-with
    notes: <i>Jo didn’t leave</i> uses <i>do</i> to host negation. <i>Jo hasn’t left</i> uses the existing auxiliary.
grounds:
  - source: cgel-2002
    locator: Ch. 3 §§2.1.1–2.1.2
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The tense feature is expressed on <i>do</i>, and <i>check</i> is plain. An available modal in <i>Can you check?</i> occupies the finite auxiliary position directly.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
