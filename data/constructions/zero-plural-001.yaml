id: zero-plural-001
name: Zero Plural of Selected Count Nouns
pattern: N[plural] realized with the same stem form as N[singular]
type: morphological
meanings:
  '1':
    definition: Realizes count plural without a distinct suffix on a restricted set of nouns.
    examples:
      - form: '[Three sheep] were left outside.'
        note: Constructed illustration.
