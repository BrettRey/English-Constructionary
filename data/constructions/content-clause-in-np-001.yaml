id: content-clause-in-np-001
name: Noun with a Declarative Content Complement
pattern: Nom[N + finite content clause]
type: mixed
meanings:
  '1':
    definition: Supplies the propositional content associated with a noun such as claim or fact.
    examples:
      - form: The [claim that Jo knew the code] surprised us.
        note: Constructed illustration.
      - form: The claim [that Jo rejected] surprised us.
        note: Constructed comparison. Integrated relative with a missing object corresponding to claim.
relatedConstructions:
  - id: nom-001
    relationship: specialization-of
    parthood: formal
  - id: declarative-content-clause-001
    relationship: contains
    parthood: formal
  - id: integrated-relative-modifier-001
    relationship: related-to
    notes: The rumour that Jo had left gives the content of the rumour, with no noun-linked gap. The rumour that Jo spread has an object gap linked to rumour.
grounds:
