kind:
  provisional: true
  projection:
    target: "Sixty can stand by itself and can supply the first component of sixty-four. The relation to six is transparent, but a new decade form cannot automatically be generated from any numerical expression by adding -ty."
    evidence: "CGEL treats the decade endings as lexical word formation. Reynolds uses decade-based compounds as evidence for the basic lexicon."
