id: demonstrative-determinative-fused-head-001
name: Demonstrative Determinative in Fused Determiner-Head Function
pattern: "NP[demonstrative determinative as fused determiner-head]"
type: syntactic
meanings:
  '1':
    definition: A demonstrative determinative realizes fused determiner-head function in an NP and refers deictically to a salient entity or situation
    details: CGEL treats <i>this</i>, <i>that</i>, <i>these</i>, and <i>those</i> as determinatives; independent NP use does not reclassify them as pronouns.
    examples:
      - form: "[That] is incredible!"
        note: <i>That</i> is a demonstrative determinative in fused determiner-head function, referring to the current situation.
constraints:
  - type: syntactic
    description: The fused determiner-head must be realized by <i>this</i>, <i>that</i>, <i>these</i>, or <i>those</i>.
semanticType: reference
relatedConstructions:
  - id: fused-determiner-head-001
    relationship: specialization-of
    parthood: formal
  - id: deitality-001
    relationship: related-to
    notes: The demonstratives are the prototype of the deital profile
  - id: demonstrative-distance-001
    relationship: related-to
lexiconRefs:
  - gold/determinatives
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§7.1, 9.2; Ch. 17 §§5.1–5.3"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "<i>That</i> can be an entire NP subject in <i>That is strange</i>. In <i>That plan is strange</i>, it instead determines a nominal. A prior proposition can supply the deictic target even with no physical object indicated."
    evidence: "CGEL treats the two syntactic realizations separately and documents discourse-deictic demonstratives."
    confidence: medium
