id: descriptor-identifier-001
name: Descriptor + Identifier Label
pattern: "NP[descriptor + identifier: number, letter name, or alphanumeric code]"
type: mixed
meanings:
  '1':
    definition: Identifies a bearer by an assigned label within a naming system.
    details: "The descriptor gives the kind of bearer. The following identifier picks out a bearer within the relevant naming system. <i>Gen</i> in <i>Gen Z</i> supplies the kind in the same way as <i>Ward</i> in CGEL’s <i>Ward 17</i>. Descriptor describes a contribution within the naming construction. In CGEL an embellishment is a semantically nonrestrictive dependent accompanying a proper name. The shared pattern leaves the syntactic head and the identifier’s word category open."
    examples:
      - form: "[Room 302A], [Multipurpose Room A]"
        note: Cornell gives these two designations for the same space in Appel Commons.
        grounds:
          - source: cornell-meeting-locations
            locator: Info Session Locations, Appel Commons Community Center
            relation: attests
            bears-on: attestation
      - form: "in [Gen Z]"
        note: <i>Gen</i> identifies the referent as a generation and <i>Z</i> supplies its conventional label. Cohort boundaries can vary across sources.
        grounds:
          - source: dimock-2023-generational-labels
            locator: First numbered point
            relation: attests
            bears-on: attestation
relatedConstructions:
  - id: proper-name-001
    relationship: implements
    notes: "<i>Room 302A</i> realizes naming through a type-denoting descriptor and an assigned code. The identification depends on the code assignment at the relevant site."
  - id: strong-proper-name-001
    relationship: related-to
    notes: "<i>Room 101</i> and <i>Kim</i> both occur as bare argument NPs. In <i>Room 101</i> the noun supplies the type of bearer and the assigned code supplies its identity."
  - id: title-personal-name-001
    relationship: related-to
    notes: "<i>Dr Patel</i> also places a nominal before an identifying form. <i>Dr</i> is an appellation giving the bearer’s status in a personal name. <i>Room</i> in <i>Room 101</i> gives the type of entity and the following code is interpreted within the site."
  - id: restrictive-appositive-name-001
    relationship: related-to
    notes: "Compare <i>Room 101</i> with <i>the river Wye</i>. Both pair a type expression with an identifier. The latter has an overt determiner and is analyzed as an integrated appositive. The comparison leaves the headedness of <i>Room 101</i> open."
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §20.2.2, pp. 518–519 [4v]"
    relation: discusses
    bears-on: projection
    note: Lists <i>Ward 17</i> among names with a descriptor that indicates the kind of entity named.
  - source: reynolds-2026-numerals
    locator: "§5.2, [7a–b] and n. 9"
    relation: discusses
    bears-on: projection
    note: "Calls <i>Room</i> an embellishment rather than an attributive modifier (n. 9). The wider construction uses CGEL’s descriptor for the type-denoting element, and CGEL’s embellishments include nominal attributive modifiers (p. 520)."
kind:
  provisional: true
  projection:
    target: "A descriptor can be followed by a number, a letter or a mixed code in the same naming role. Changing a label may change the bearer, or leave it fixed if the two labels are aliases. Any quantity or rank associated with the code depends on the local allocation convention."
    evidence: "Cornell uses <i>Room 101</i> and <i>Room 302A</i>, and gives <i>Multipurpose Room A</i> for the same space as <i>Room 302A</i>. CGEL gives <i>Ward 17</i>. Pew uses <i>Gen Z</i> as a cohort label."
    confidence: medium
  boundaries:
    known_boundary_items:
      - "In <i>101 rooms</i>, <i>101</i> determines how many rooms. In <i>Room 101</i>, it identifies a room."
      - "In a type specification such as <i>a type A personality</i>, the designation supplies a class inside an ordinary count NP. Compare bare <i>Gen Z</i> for an identified cohort."
