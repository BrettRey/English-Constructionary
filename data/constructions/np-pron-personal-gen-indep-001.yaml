id: np-pron-personal-gen-indep-001
name: Independent Personal Genitive Pronoun NP
pattern: mine/yours/his/hers/ours/theirs
type: syntactic
meanings:
  '1':
    definition: Independent personal genitive pronoun functioning as an NP
    examples:
      - form: "The red one is [mine]."
        note: Independent personal genitive
      - form: "Those seats are [theirs]."
        note: Independent personal genitive
relatedConstructions:
  - id: independent-genitive-pronoun-001
    relationship: related-to
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §16.4"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "A form such as mine can occupy an NP slot without an overt noun, as in mine fell. The dependent counterpart my requires a nominal. His is formally shared across the two slots."
    evidence: "CGEL lists independent and dependent forms and describes their different distributions."
    confidence: medium
