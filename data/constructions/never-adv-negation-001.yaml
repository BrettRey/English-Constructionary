id: never-adv-negation-001
name: "Adverbial Negation with <i>never</i>"
pattern: "never + VP"
type: syntactic
meanings:
  '1':
    definition: Negates occurrence over time (no instances at any time)
    examples:
      - form: "She [never] called."
        note: No calling events occurred
      - form: "I have [never] been there."
        note: No prior occurrences in experience
constraints:
  - type: syntactic
    description: Adverbial negator modifying VP.
  - type: semantic
    description: Negates the occurrence across the relevant time span.
syntacticRefs:
  - clause-polarity-diagnostics
grounds:
  - source: cgel-2002
    locator: "Ch. 9 §3.2.1 [20ii], §3.2.2; Ch. 8 §9"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "<i>They never replied</i> can take the positive tag <i>did they?</i> No auxiliary do is needed to host <i>never</i> in the declarative. Its temporal quantification and clausal polarity are independently testable."
    evidence: "CGEL supplies the confirmation tag and compares <i>never</i> with negation plus <i>ever</i>."
    confidence: medium
