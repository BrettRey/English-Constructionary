    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: <i>It</i> fills the object slot and need not refer to a prior NP. The corresponding sequence <i>found that the lights were on surprising</i> is heavily degraded.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
