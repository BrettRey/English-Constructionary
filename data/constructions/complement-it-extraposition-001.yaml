id: complement-it-extraposition-001
name: "Object <i>it</i> with an Extraposed Content Clause"
pattern: VP[V + it + predicative or other complement + content clause]
type: syntactic
meanings:
  '1':
    definition: Places propositional content after the other complements with <i>it</i> in an earlier object position.
    examples:
      - form: We [found it surprising that the lights were on].
        note: Constructed illustration.
