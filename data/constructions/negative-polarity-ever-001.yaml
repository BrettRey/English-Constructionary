id: negative-polarity-ever-001
name: "Polarity-Sensitive Temporal <i>ever</i>"
pattern: temporal ever in a licensing environment
type: mixed
meanings:
  '1':
    definition: Ranges over occasions or times, especially under negation or questioning.
    examples:
      - form: Has Lee [ever sailed] solo?
        note: Constructed illustration.
relatedConstructions:
  - id: experiential-perfect-001
    relationship: interfaces-with
  - id: durational-long-001
    relationship: related-to
  - id: never-adv-negation-001
    relationship: related-to
    notes: <i>Have you ever seen it?</i> licenses <i>ever</i> in a question and supplies no negative assertion. <i>Jo never saw it</i> has negation within the temporal adverb.
grounds:
  - source: cgel-2002
    locator: Ch. 9 §§4.1–4.4
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The affirmative counterpart <i>Lee has ever sailed solo</i> is marked without a special licensor. Superlatives and other suitable environments also permit <i>ever</i>.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
