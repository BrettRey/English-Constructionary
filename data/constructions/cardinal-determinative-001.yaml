id: cardinal-determinative-001
name: Cardinal Determinative
pattern: "Det[cardinal]"
type: syntactic
dimensions:
  form: "Basic (0-99) or magnitude determinative; no number inflection"
  meaning: "Supplies a cardinal value. Interpretation as an exact total or as a lower boundary depends on context."
  function: "Heads DPs functioning as determiners, factors, or fused heads"
  distribution: "Determiner in NP; factor in magnitude phrases; fused determiner-head"
meanings:
  '1':
    definition: Cardinal numerative that can determine a nominal by giving a numerical value
    examples:
      - form: "I saw [three] cats."
        note: Low cardinal determiner
      - form: "She has [twenty-six] students."
        note: Basic compound determiner
      - form: "The building has [one thousand twenty-four] rooms."
        note: Complex cardinal determiner
constraints:
  - type: syntactic
    description: Functions as determiner in NP structure; can appear as fused head (e.g., "I bought three").
semanticRefs:
  - cardinality
relatedConstructions:
  - id: cardinal-noun-001
    relationship: related-to
  - id: numerative-fused-head-001
    relationship: related-to
  - id: determination-001
    relationship: related-to
  - id: numerative-factor-modifier-001
    relationship: related-to
lexiconRefs:
  - gold/determinatives
grounds:
  - source: reynolds-2026-numerals
    relation: cites
    bears-on: category-assignment
  - source: reynolds-2026-numerals
    locator: "§5, Table 1; §4, factor versus determiner"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "A cardinal determiner in thirty copies can alternate with some copies. In two hundred, two is internal to the numerative and can coexist with an external determiner in a two hundred, on the token reading."
    evidence: "Reynolds uses coexistence with an external determiner to distinguish determiner function from multiplicative modification."
    confidence: medium
