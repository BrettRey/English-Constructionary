    locator: Ch. 4 §§5.5.1–5.5.2
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The permit supplies a value rather than a general property. The reverse order can preserve the identification while changing the informational packaging.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
