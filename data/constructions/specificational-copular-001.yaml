id: specificational-copular-001
name: Specificational Copular Clause
pattern: Clause[variable NP + be + value XP]
type: mixed
meanings:
  '1':
    definition: Identifies a value for a description made salient by the other copular expression.
    examples:
      - form: '[The main obstacle is the permit].'
        note: Constructed illustration.
      - form: '[The permit is the main obstacle].'
        note: Constructed comparison. The reversed copular order identifies the same obstacle.
