id: grammatical-definiteness-001
name: Grammatical Definiteness
pattern: Semantic feature implemented through nominal determination
type: semantic
dimensions:
  form: "Typically realized by deital determiners (the, this, that, dependent genitive pronouns, genitive NPs) or bare proper nouns"
  meaning: "Identifiability, uniqueness, discourse familiarity"
  function: "Establishes referent accessibility; anchors information structure"
  distribution: "NPs in argument and predicative positions"
meanings:
  '1':
    definition: Identifiability status
    details: Whether entity can be uniquely identified in context
    examples:
      - form: the/a cat
        note: Identifiable vs non-identifiable
      - form: John/some person
        note: Inherent vs non-identifiable
  '2':
    definition: Reference scope
    details: Whether reference exhausts contextual set
    examples:
      - form: the students/some students
        note: An established group versus a subset, on the ordinary referential readings
      - form: the/a winner
        note: Unique vs arbitrary
  '3':
    definition: Discourse status
    details: Whether entity is established in discourse
    examples:
      - form: the/a book
        note: Given vs new
      - form: it/something
        note: Known vs novel
relatedConstructions:
  - id: np-def-001
    relationship: interfaces-with
    notes: Bidirectional interface; definite interpretation cues deital form in production, deital form cues definite interpretation in comprehension
  - id: definite-001
    relationship: specialization-of
    parthood: semantic
    notes: Grammatical definiteness is realized through definite construction
  - id: indefinite-001
    relationship: alternates-with
    notes: Paradigmatic contrast in the definiteness system
  - id: activity-weak-definite-001
    relationship: related-to
semanticRefs:
  - identifiability
  - uniqueness
  - familiarity
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §6; Ch. 16 §6.2.2"
    relation: discusses
    bears-on: projection
  - source: reynolds-deitality
    locator: "Ranked formal diagnostics and interpretation mismatches"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "Shared knowledge can make the only exit identifiable at first mention. Conversely, the in take the train can mark the lexicalized activity without distinguishing a specific train. Familiarity, unique reference, and structural diagnostics need separate predictions."
    evidence: "CGEL and Reynolds document structural and interpretive departures from the simple definite/familiar mapping."
    confidence: medium
