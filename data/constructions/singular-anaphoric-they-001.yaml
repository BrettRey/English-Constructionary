    locator: Ch. 5 §17.2.5; Ch. 17 §2.3
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The antecedent can be singular while <i>they</i> takes ordinary <i>they</i>-agreement, such as <i>were</i>. The construction is compatible with bound readings and with specific references in suitable contexts.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
