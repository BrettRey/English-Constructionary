id: singular-anaphoric-they-001
name: "Singular Anaphoric <i>they</i>"
pattern: anaphoric NP[they/them/their] with a singular referent or antecedent
type: syntactic
meanings:
  '1':
    definition: Uses the <i>they</i> paradigm for a single antecedent, including a bound variable or a known person.
    examples:
      - form: Every applicant said [they were] ready.
        note: Constructed illustration.
relatedConstructions:
  - id: np-pron-001
    relationship: specialization-of
    parthood: formal
  - id: verb-number-agreement-001
    relationship: interfaces-with
grounds:
