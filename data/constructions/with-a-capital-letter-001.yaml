id: with-a-capital-letter-001
name: "<i>X with a capital Y</i> Construction"
pattern: "with + a + capital + Letter-name"
type: semantic
dimensions:
  form: "PP headed by <i>with</i>, followed by <i>capital</i> + letter name."
  meaning: "Signals uppercase orthography and a proper/institutional sense for the label."
  function: "Disambiguates official or proper-name use from ordinary descriptive use."
  distribution: "Postposed adjunct or parenthetical after a label."
meanings:
  '1':
    implements: letter-case-specification-001.1
    specialization: "Specifies uppercase orthography for the relevant label, favoring an institutional/proper sense."
    examples:
      - form: "democrat [with a capital D]."
        note: "Party-affiliated sense."
      - form: "church [with a capital C]."
        note: "Institutional sense."
