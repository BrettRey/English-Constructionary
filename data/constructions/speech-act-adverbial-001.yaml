    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: Frankly characterizes the speaker’s statement, not the repair's manner of failing. A paraphrase can mention speaking frankly without changing the content asserted.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
