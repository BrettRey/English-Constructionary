id: speech-act-adverbial-001
name: Speech-Act Adverbial
pattern: supplementary adverbial oriented to the utterance act
type: mixed
meanings:
  '1':
    definition: Characterizes the speaker’s manner or purpose in making the utterance.
    examples:
      - form: '[Frankly], the repair won’t last.'
        note: Constructed illustration.
relatedConstructions:
  - id: evaluative-sentence-adverb-001
    relationship: related-to
  - id: participial-clause-supplement-001
    relationship: related-to
grounds:
