id: subject-determiner-001
name: Subject-determiner (Genitive NP)
pattern: "NP[genitive] + N"
type: syntactic
meanings:
  '1':
    definition: Genitive NP realizes determiner function with a subject-like semantic relation to the head nominal
    examples:
      - form: "Brett's use of the microphone"
        note: Genitive NP corresponds to the subject/agent of the nominalization
      - form: "the committee's approval of the plan"
        note: Genitive NP corresponds to the notional subject of the event noun
constraints:
  - type: syntactic
    description: Genitive NP occupies the determiner position in NP structure.
  - type: semantic
    description: Genitive NP stands in a subject-like relation to the head noun (e.g., agent/experiencer of a nominalized predicate), not mere possession.
formRefs:
  - subject-determiner-genitive
syntacticRefs:
  - deitality-diagnostics
relatedConstructions:
  - id: determination-001
    relationship: specialization-of
  - id: genitive-s-001
    relationship: related-to
  - id: deverbal-noun-of-argument-001
    relationship: related-to
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§16.5.1–16.5.3"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "In the committee’s approval of the plan, the committee can map to the subject of approved the plan. In the committee’s photograph, an ownership or other relation remains possible. Genitive position alone does not license an agent interpretation."
    evidence: "CGEL contrasts argument-realizing genitives with the wider range of ordinary genitive relations."
    confidence: medium
