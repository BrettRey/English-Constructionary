id: np-det-001
name: Determined Noun Phrase
pattern: NP[Det Nom]
type: syntactic
meanings:
  '1':
    definition: Nominal with a determiner function, forming an NP marked as definite or indefinite
    examples:
      - form: the new car
        note: Definite determinative realization
      - form: one new car
        note: Indefinite determinative realization
      - form: Ally's new car
        note: Genitive NP realizing determiner function
      - form: what size hat
        note: Plain NP determiner in interrogatives
constraints:
  - type: syntactic
    description: Determiner function is a dependent in NP structure.
  - type: structural
    description: Singular count nominals generally require determination; bare plural and non-count nominals can be determinerless in some contexts.
relatedConstructions:
  - id: determination-001
    relationship: implements
    notes: The overt determiner in <i>the new car</i>, <i>a new car</i>, and <i>Jo’s new car</i> realizes the determiner function.
  - id: np-property-value-001
    relationship: related-to
  - id: np-001
    relationship: specialization-of
    parthood: formal
    notes: An overt determiner combines with the nominal.
  - id: np-def-001
    relationship: overlaps-with
    overlap-dimension: formal
    notes: <i>The book</i> satisfies both patterns. <i>A book</i> has a determiner and is indefinite. A referential bare name such as <i>London</i> can be definite.
  - id: np-indef-001
    relationship: overlaps-with
    overlap-dimension: formal
    notes: <i>A book</i> satisfies both patterns. <i>The book</i> has a determiner and is definite. The bare NP <i>dogs</i> in <i>We saw dogs</i> can be indefinite.
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §4, determiner function and non-DP realizations"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "Holding the target size fixed, <i>that size shoes</i> and <i>shoes that size</i> can share a property specification. Only the first puts the property NP before the head in determiner function in CGEL’s analysis."
    evidence: "CGEL provides the matching property-value forms and treats non-determinative realizations as restricted."
    confidence: medium
