id: n-sg-001
name: Singular Noun
pattern: N[Number:SG]
type: syntactic
meanings:
  '1':
    definition: Singular number form; selects singular agreement and singular-selecting determinatives. Typically construes the referent as a single unit, but the category is morphosyntactic, not semantic
    examples:
      - form: cat
        note: Single countable entity
      - form: book
        note: Singular count noun
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§3.1–3.4, 18"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "Cat combines with a and singular agreement, while rice can take singular agreement without permitting a in its substance use. Singular agreement by itself does not identify singular count syntax."
    evidence: "CGEL separates morphological number, countability, and formal agreement."
    confidence: medium
relatedConstructions:
  - id: n-non-count-001
    relationship: related-to
  - id: verb-number-agreement-001
    relationship: interfaces-with
