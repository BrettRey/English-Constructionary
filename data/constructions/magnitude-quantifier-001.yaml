id: magnitude-quantifier-001
name: Magnitude Quantifier Construction
pattern: "N[magnitude, plural] + of + NP"
type: syntactic
dimensions:
  form: "Plural magnitude noun (hundreds, thousands) with of-PP complement"
  meaning: "Approximate large quantity; vague quantification"
  function: "Quantifies without precise count; emphasizes scale"
  distribution: "Heads quantificational NPs in subject, object, and other NP positions"
meanings:
  '1':
    definition: Plural magnitude noun quantifies an approximate large number
    examples:
      - form: hundreds of people
        note: Vague large quantity
      - form: tens of thousands of dollars
        note: Nested magnitude quantification
      - form: millions of stars
        note: Very large approximate quantity
constraints:
  - type: structural
    description: The core pattern uses plural magnitude nouns such as hundreds and thousands. Non-magnitude quantity nouns such as dozens have a related quantified use.
  - type: structural
    description: Distinct from partitive (two of the cats) where numerative is DP in fused-head function.
  - type: syntactic
    description: The of-complement NP may be indefinite (unlike true partitives).
semanticRefs:
  - cardinality
  - quantifier
formRefs:
  - numerative-magnitude
relatedConstructions:
  - id: cardinal-noun-001
    relationship: specialization-of
  - id: n-common-001
    relationship: related-to
  - id: numerative-magnitude-head-001
    relationship: related-to
  - id: true-partitive-001
    relationship: related-to
  - id: measure-pseudopartitive-001
    relationship: related-to
grounds:
  - source: reynolds-2026-numerals
    locator: "§5, Table 2; §2, scope of magnitude class"
    relation: discusses
    bears-on: projection
  - source: cgel-2002
    locator: "Ch. 5 §7.6"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "Hundreds of enquiries permits a bare plural complement. Exact two of the enquiries instead selects a subset from an established group. Plural hundreds of can give an approximate scale without fixing how many groups of a hundred there were."
    evidence: "Reynolds distinguishes the plural magnitudes’ quantifier use from exact cardinal expressions and identifies dozen as outside the paper’s technical magnitude class."
    confidence: medium
