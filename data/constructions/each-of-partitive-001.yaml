id: each-of-partitive-001
name: "<i>each</i> in a Partitive NP"
pattern: NP[each + PP[of + plural definite NP]]
type: mixed
meanings:
  '1':
    definition: Distributes a predication over every member of an established group.
    examples:
      - form: '[Each of the six drawers] has a lock.'
        note: Constructed illustration.
relatedConstructions:
  - id: true-partitive-001
    relationship: specialization-of
    notes: <i>Each of the six drawers</i> uses a partitive domain and distributes the predication over every drawer in it.
  - id: grammatical-number-001
    relationship: related-to
grounds:
  - source: cgel-2002
    locator: Ch. 5 §§7.4, 9.2
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The <i>of</i>-phrase has a plural complement, while <i>each</i> favours singular verbal agreement. <i>Every</i> without a following <i>one</i> does not normally form the same construction.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
