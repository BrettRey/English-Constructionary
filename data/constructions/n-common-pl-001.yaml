id: n-common-pl-001
name: Plural Common Noun
pattern: N[Type:Common, Number:PL]
type: syntactic
meanings:
  '1':
    definition: Plural-marked common noun; plural agreement and determinative selection. Typically denotes more than one instance, though lexicalized and non-canonical plurals diverge
    examples:
      - form: dogs
        note: Plural count noun
      - form: cities
        note: Plural common noun
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§3.2–3.4"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "Cats licenses plural verbal agreement and cardinals greater than one. A plural-only form such as scissors also takes plural agreement, while counting individual instruments ordinarily uses pairs of scissors."
    evidence: "CGEL contrasts ordinary plurals and plural-only nouns, including restrictions on count determination."
    confidence: medium
relatedConstructions:
