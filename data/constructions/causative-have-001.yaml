id: causative-have-001
name: "Causative <i>have</i> with a Bare Infinitival"
pattern: VP[have + NP + bare infinitival]
type: mixed
meanings:
  '1':
    definition: Presents an event as arranged, instructed or brought about by the subject.
    examples:
      - form: I’ll [have Jo check the figures].
        note: Constructed illustration.
relatedConstructions:
  - id: vp-001
    relationship: specialization-of
    parthood: formal
  - id: perfect-have-001
    relationship: related-to
  - id: affected-have-participial-001
    relationship: related-to
    notes: <i>Had Kai replace the roof</i> makes Kai the understood replacer. <i>Had the roof replaced</i> presents the roof as affected and can describe an arrangement. <i>Had his phone stolen</i> can describe an unwanted experience.
grounds:
  - source: cgel-2002
    locator: Ch. 14 §5.4, have
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: Jo undertakes the checking. <i>Have Jo check</i> contrasts with perfect <i>have checked</i> and with affected <i>have the figures checked</i>.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
