id: same-as-comparison-001
name: "Identity Comparison with <i>same … as</i>"
pattern: NP[the same + nominal] + as-standard
type: mixed
meanings:
  '1':
    definition: Compares items for identity of referent or identity of relevant type.
    examples:
      - form: We chose [the same model as Lee].
        note: Constructed illustration.
