id: source-complement-001
name: Source Locative-Complement Construction
pattern: "Head:V + Comp:PP[locative, source]"
type: syntactic
semanticType: predication
dimensions:
  form: "Verb head with a source-denoting PP in locative-complement function, headed centrally by from, away, off, or out"
  meaning: "Origin or initial location of motion, derivation, or change"
  function: "Locative complement of the verb, bearing the semantic role source"
  distribution: "VP-internal with motion and change verbs; compatible with a following goal-role locative complement"
meanings:
  '1':
    definition: A VP contains a locative complement bearing the source role, marking the initial location of motion or change
    details: "Source is a semantic role, while locative complement is the CGEL syntactic function. Source complements are generally headed by <i>from</i>, <i>away</i>, <i>off</i>, or <i>out</i>. <i>From</i> takes an NP or locative-PP complement; the inner PP in <i>from under the bed</i> expresses the source location and is not another source complement. <i>Away</i> occurs alone or with a <i>from</i>-PP complement; <i>off</i> occurs alone or with an NP object; <i>out</i> occurs alone or with an <i>of</i>- or <i>from</i>-PP complement (CGEL pp. 257–59, 687)."
    examples:
      - form: "She came [from Toronto]."
        note: "<i>From</i>-PP in source-role locative-complement function"
      - form: "Ed emerged [from [under the car]]."
        note: "The whole <i>from</i>-PP is the source-role locative complement; the inner PP expresses the source location"
      - form: "She walked [away]."
        note: Complementless <i>away</i>-PP bearing the source role
      - form: "Kim jumped [off the pier]."
        note: "<i>Off</i>-PP bearing the source role"
      - form: "He came [out of the room]."
        note: "<i>Out</i>-PP bearing the source role"
      - form: "They flew [from Toronto] [to Ottawa]."
        note: Source- and goal-role locative complements co-occurring
constraints:
  - type: syntactic
    description: "The whole source-denoting PP is integrated as a locative complement of the verb, not added as a locative adjunct."
  - type: semantic
    description: "The complement denotes the initial location or state and can co-occur with a separate goal-role locative complement."
kind:
  provisional: true
  projection:
    target: "In their central motion uses, integrated locative PPs headed by <i>from</i>, <i>away</i>, <i>off</i>, or <i>out</i> predict an initial-location construal, head-specific complementation, and compatibility with a separate goal-role complement"
    evidence: "CGEL gives the four-head realization inventory and its distinct complement patterns on p. 687; spatial, state, and possession examples distinguish initial-location source from final-location goal on pp. 258–60"
    confidence: medium
    grounds:
      - source: cgel-2002
        locator: "Ch. 4 §5.2, pp. 258-60; Ch. 8 §4.3, p. 687"
        relation: cites
        bears-on: projection
        note: "Head choice projects initial-location interpretation, complementation, and source-goal compatibility"
      - source: cgel-2002
        locator: "Ch. 4 §5.2, pp. 258-60; Ch. 8 §4.3, p. 687"
        relation: cites
        bears-on: stability
        note: "The source-role profile recurs across motion, state, and possession domains"
  secured: stable
  profile:
    core:
      - property: Source role borne by a locative PP complement
        diagnostics: ["initial-location interpretation", "integration in a motion or change frame"]
        weight: high
      - property: Overt source marking
        diagnostics: ["<i>from</i>, <i>away</i>, <i>off</i>, or <i>out</i> as PP head", "head-specific object or PP complementation"]
        weight: high
    peripheral:
      - property: Source-goal co-occurrence
        diagnostics: ["<i>from Toronto to Ottawa</i>", "<i>from bad to worse</i>"]
        weight: medium
  boundaries:
    known_boundary_items:
      - "<i>Away from</i> can express retrospective direction, and <i>off</i> has restricted goal uses; the containing event distinguishes these from the central source uses"
      - "path or route complements such as <i>through the tunnel</i> and <i>via Chicago</i> instantiate the distinct path-complement construction"
      - "derivational sources such as <i>made from grapes</i>: extension beyond literal motion"
  grain:
    level: meso
    parent_families:
      - argument-structure
relatedConstructions:
  - id: vp-001
    relationship: specialization-of
    parthood: formal
    notes: The source-role locative complement is licensed within VP structure
  - id: pp-001
    relationship: contains
    parthood: formal
    notes: The source-role locative complement is a PP headed centrally by <i>from</i>, <i>away</i>, <i>off</i>, or <i>out</i>
lexiconRefs:
  - gold/prepositions
grounds:
  - source: cgel-2002
    locator: "Ch. 4 §5.2, pp. 258-60; Ch. 8 §4.3, p. 687"
    relation: cites
    bears-on: category-assignment
    note: "Source is a semantic role borne by a PP in locative-complement function"
