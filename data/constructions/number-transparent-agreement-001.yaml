id: number-transparent-agreement-001
name: Agreement through a Number-Transparent Nominal
pattern: Clause[Subject with number-transparent N + of-PP + finite agreement]
type: syntactic
meanings:
  '1':
    definition: Allows the number of an embedded complement to determine agreement in a licensed nominal frame.
    examples:
      - form: A number of applicants [were waiting].
        note: Constructed illustration.
