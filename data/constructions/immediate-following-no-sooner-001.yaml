id: immediate-following-no-sooner-001
name: No Sooner … Than
pattern: No sooner + inverted primary clause + than + second clause
type: mixed
meanings:
  '1':
    definition: Presents one event as occurring almost immediately after another.
    examples:
      - form: '[No sooner had we parked than the rain started].'
        note: Constructed illustration.
