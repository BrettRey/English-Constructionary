id: every-inch-predicative-001
name: "<i>every inch</i> with a Nominal Predicative"
pattern: PredComp:NP[every inch + a(n) + Nom]
type: mixed
meanings:
  '1':
    definition: Emphasizes that someone exemplifies a role or type in the relevant respects.
    details: <i>Every inch</i> marks completeness in the characterization. CGEL identifies this use as idiomatic and contrasts the predicative with an unacceptable use as a by-agent. The relation to <i>every bit as good</i> remains open.
    examples:
      - form: She is [every inch a philosopher].
        note: The relevant respects come from the description <i>philosopher</i>.
        grounds:
          - source: cgel-2002
            locator: Ch. 5 §13(d), p. 438 [6i]
            relation: attests
            bears-on: attestation
relatedConstructions:
  - id: degree-001
    relationship: related-to
    notes: <i>Every inch</i> strengthens the characterization.
  - id: bare-role-001
    relationship: related-to
    notes: Both concern nominal predication. The <i>every inch</i> pattern shown here contains an article.
grounds:
  - source: cgel-2002
    locator: Ch. 5 §7.4, p. 379 n. 22; §13(d), p. 438
    relation: cites
    bears-on: projection
    note: Identifies idiomatic <i>every inch</i> and compares its predicative and nonpredicative distribution.
kind:
  provisional: true
  projection:
    target: The idiomatic frame favours predicative use and an interpretation over respects in which the description applies.
    evidence: CGEL's predicative versus by-agent comparison and its note on idiomatic <i>every inch</i>. A constructed test replaces <i>inch</i> with <i>centimetre</i>.
    confidence: medium
