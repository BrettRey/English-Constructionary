id: quotative-inversion-001
name: Quotative Inversion
pattern: quoted utterance + V[speech] + non-pronominal or otherwise licensed Subject
type: mixed
meanings:
  '1':
    definition: Places a reporting verb before its subject after or within direct speech.
    examples:
      - form: “I can explain,” [said the clerk].
        note: Constructed illustration.
relatedConstructions:
  - id: direct-quotation-001
    relationship: specialization-of
    parthood: formal
  - id: presentational-dependent-inversion-001
    relationship: related-to
grounds:
  - source: cgel-2002
    locator: Ch. 11 §9.2, reporting clause order; Ch. 16 §5
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: Full NP subjects readily follow the reporting verb. Plain personal pronouns usually precede it in contemporary neutral prose, though literary inverted variants occur.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
