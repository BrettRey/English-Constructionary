id: indefinite-001
name: Indefinite Construction
pattern: Indefinite determination or contextually indefinite bare plural/non-count NP
type: semantic
meanings:
  '1':
    definition: Refers without presenting the referent as already uniquely identifiable
    details: "The speaker may know the identity. The construction does not require the hearer to resolve it from prior information."
    examples:
      - form: a dog
        note: Novel referent
      - form: some students
        note: Non-specific set
  '2':
    definition: New discourse entity
    details: Entity being introduced to discourse
    examples:
      - form: there is a solution
        note: First mention
      - form: some people say...
        note: Discourse-new source
  '3':
    definition: Arbitrary instance
    details: "Under certain directives or permissions an indefinite can leave the choice of individual open. Choice and permitted quantity are separate."
    examples:
      - form: take a card
        note: Any card
      - form: some help
        note: Any assistance
  '4':
    definition: Type membership
    details: Instance of category
    examples:
      - form: is a teacher
        note: Category instance
      - form: is some kind of expert
        note: Category type
semanticRefs:
  - indefiniteness
  - familiarity
  - variable
  - category
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§6.2, 8; Ch. 16 §6.2.2"
    relation: discusses
    bears-on: projection
  - source: reynolds-deitality
    locator: "Deital form and interpretation, including non-deital residual cases"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "A student phoned can refer to a particular student known to the speaker. A student can enter allows a general reading. The article alone does not rule out specific reference or supply an any-member permission."
    evidence: "CGEL distinguishes referential from non-referential uses and documents both specific and nonspecific interpretations. A determinerless role predication does not itself introduce a novel reference."
    confidence: medium
relatedConstructions:
  - id: deitality-001
    relationship: interfaces-with
  - id: np-indef-001
    relationship: related-to
