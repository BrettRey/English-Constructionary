id: measure-genitive-001
name: Measure Genitive Premodifier
pattern: Nom[measure NP.GEN + nominal]
type: mixed
meanings:
  '1':
    definition: Specifies a duration or monetary measure within a nominal.
    examples:
      - form: We had [another two hours’ wait].
        note: Constructed illustration.
