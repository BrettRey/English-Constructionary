id: backshift-past-perfect-001
name: Past Perfect Anteriority
pattern: Clause[preterite had + past-participial VP] with a past temporal anchor
type: mixed
meanings:
  '1':
    definition: Places the event or state before a distinct past reference point.
    examples:
      - form: When I arrived, Jo [had already left].
        note: Constructed illustration.
relatedConstructions:
  - id: perfect-have-001
    relationship: specialization-of
    parthood: formal
  - id: present-backshift-001
    relationship: related-to
grounds:
