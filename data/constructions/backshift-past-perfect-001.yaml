    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The departure precedes the arrival on the ordinary reading. The reference point can be supplied by the surrounding narrative without a separate time adjunct.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
