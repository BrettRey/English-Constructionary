id: content-container-alternation-001
name: Content and Container Subject Alternation
pattern: Clause[content + V + in-location PP ↔ location + V + with-content PP]
type: mixed
meanings:
  '1':
    definition: Presents an activity either through its participants or as a state of the place they occupy.
    examples:
      - form: '[The courtyard swarmed with bees].'
        note: Constructed illustration.
