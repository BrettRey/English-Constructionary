id: np-def-001
name: Definite NP Construction
pattern: Definite determiner + Nominal | referential personal pronoun | NP used as a proper name
type: syntactic
dimensions:
  form: "Deital determiner (the, this, that, dependent genitive pronoun, or genitive NP) + Nom, or personal pronoun, or bare proper-noun NP"
  meaning: "Identifiable, unique, or familiar referent; anchors discourse-established entity"
  function: "Topic-worthy argument; hosts identificational predication"
  distribution: "Argument positions; existential there-resistance; partitive licensing"
meanings:
  '1':
    definition: Refers to/predicates identifiable instance
    details: Refers to or predicates property of instance of nominal's type as uniquely identifiable in context
    examples:
      - form: The dog barked
        note: Refers to specific dog
      - form: She is the winner
        note: Predicates unique role
    relations:
      - 1
      - 2
  '2':
    definition: Refers to/predicates maximal set
    details: Refers to or predicates property of all contextually relevant instances of nominal's type
    examples:
      - form: The students passed
        note: The group is delimited by the context
      - form: They are the top performers
        note: Predicates maximal group property
    relations:
      - 1
      - 2
  '3':
    definition: Refers to/predicates unique role
    details: Refers to or predicates property of unique occupant/instance of role described by nominal
    examples:
      - form: The CEO resigned
        note: Refers to role-holder
      - form: That became the main issue
        note: Predicates unique status
    relations:
      - 1
      - 2
  '4':
    definition: Refers to/predicates kind
    details: Refers to or predicates property of entire species/type
    examples:
      - form: The dodo is extinct
        note: Refers to species
      - form: The wolf has returned to the region
        note: Kind-level statement in a context about species distribution
    relations:
      - 1
  '5':
    definition: Refers to/predicates generic property
    details: Refers to or predicates property taken as generally characteristic
    examples:
      - form: The lion is dangerous
        note: Refers to typical properties
      - form: He became the typical bureaucrat
        note: Predicates typical properties
    relations:
      - 1
relations:
  '1':
    construction: grammatical-definiteness-001
    type: implements
    notes: Implements meaning 1
  '2':
    construction: definite-001
    type: related-to
    notes: 'Original type: elaborates. Related to meaning 1.'
relatedConstructions:
  - id: grammatical-definiteness-001
    relationship: interfaces-with
    notes: The structural and interpretive profiles often co-occur. Weak definites and context-dependent identifications qualify the association.
  - id: np-001
    relationship: specialization-of
    parthood: formal
  - id: np-indef-001
    relationship: alternates-with
    notes: Paradigmatic contrast in the definiteness system
  - id: true-partitive-001
    relationship: related-to
  - id: activity-weak-definite-001
    relationship: related-to
semanticRefs:
  - quantifier
  - predication
  - kind
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§6.1, 8.4; Ch. 16 §6.2.2"
    relation: discusses
    bears-on: projection
  - source: reynolds-deitality
    locator: "Diagnostics and the weak-definite boundary cases"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "<i>The keys</i> normally identifies an accessible set and can supply a domain in <i>two of the keys</i>. <i>The radio</i> in <i>Jo listened to the radio</i> can still have a conventional activity reading without identifying one physical radio."
    evidence: "CGEL documents both ordinary definites and restricted non-referential readings. Reynolds uses partitive domain establishment as a structural test rather than relying on identifiability alone."
    confidence: medium
