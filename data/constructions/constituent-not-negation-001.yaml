id: constituent-not-negation-001
name: "Constituent Negation with <i>not</i>"
pattern: "not + XP (predicative)"
type: syntactic
meanings:
  '1':
    definition: Negates a non-verbal predicate or constituent within a clause
    examples:
      - form: "It is [not] happy."
        note: Negated predicative AdjP
      - form: "She is [not] in the box."
        note: Negated PP complement
      - form: "That is [not] a solution."
        note: Negated predicative NP
constraints:
  - type: syntactic
    description: Occurs with predicative XP (AdjP/PP/NP) in a copular or similar frame.
  - type: semantic
    description: Negates the property or relation expressed by the XP.
grounds:
  - source: cgel-2002
    locator: "Ch. 9 §3.1 [16–17]; Ch. 15 §2.6"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "In <i>Lee came not on Tuesday but on Wednesday</i>, the correction replaces a temporal expression while the coming remains asserted. The clause can take an ordinary negative tag expecting confirmation of that coming."
    evidence: "CGEL documents local scope of <i>not</i> inside coordinates and distinguishes it from primary finite negation."
    confidence: medium
relatedConstructions:
  - id: corrective-but-coordination-001
    relationship: related-to
  - id: primary-auxiliary-negation-001
    relationship: related-to
    notes: <i>Jo ordered tea, not coffee</i> targets a constituent. <i>Jo didn’t order coffee</i> puts the negation with the finite auxiliary.
