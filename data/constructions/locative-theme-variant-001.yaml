id: locative-theme-variant-001
name: Locative Theme-Object Frame
pattern: VP[verb + material/theme Od + goal PP]
type: mixed
meanings:
  '1':
    definition: Presents a material or moved entity as direct object and a location as goal.
    examples:
      - form: They [sprayed paint onto the panel].
        note: Constructed illustration.
relatedConstructions:
  - id: caused-motion-001
    relationship: specialization-of
    parthood: formal
  - id: locative-location-variant-001
    relationship: alternates-with
    notes: In <i>sprayed paint onto the panel</i> the material is the object. In <i>sprayed the panel with paint</i> the location is the object. The alternation depends on the verb and sense.
grounds:
  - source: cgel-2002
    locator: Ch. 4 §8.3.1
    relation: discusses
    bears-on: projection
  - source: goldberg-1995
    locator: Ch. 7, caused motion
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: <i>What was sprayed?</i> can ask about the material. The goal need not be understood as comprehensively affected, unlike the customary implication of the corresponding location-object variant.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
