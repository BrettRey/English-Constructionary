id: if-conditional-001
name: Open and Remote If-Conditionals
pattern: Clause with an adjunct PP[if + finite declarative clause]
type: mixed
meanings:
  '1':
    definition: Sets out a condition and presents a consequence in relation to it.
    details: The open variant treats the condition as an open possibility. The remote variant characteristically combines a preterite or irrealis form in the condition with a remote modal in the consequence. That preterite can be compatible with an explicitly future time. Present or past remotes often suggest that the condition fails, while a future remote can describe an unsettled possibility.
    examples:
      - form: '[If he takes the later plane tonight he won’t have to rush.]'
        note: Open variant with a future time.
        grounds:
          - source: cgel-2002
            locator: Ch. 3 §1.7 [30ii]
            relation: attests
            bears-on: attestation
      - form: '[If he took the later plane tonight he wouldn’t have to rush.]'
        note: Remote counterpart. Tonight keeps the condition in the future.
        grounds:
          - source: cgel-2002
            locator: Ch. 3 §1.7 [29ii]
            relation: attests
            bears-on: attestation
relatedConstructions:
  - id: clause-001
    relationship: specialization-of
    notes: The consequent and conditional adjunct are packaged in one construction.
  - id: past-tense-ed-001
    relationship: related-to
    notes: A regular preterite can mark remoteness as well as past time.
  - id: closed-interrogative-clause-001
    relationship: related-to
    notes: A separate use of if introduces an embedded yes/no question.
grounds:
  - source: casa-constructicon
    locator: records 148–150
    relation: discusses
    bears-on: projection
    note: Catalogues open and more remote condition frames.
  - source: cgel-2002
    locator: Ch. 8 §§14.1–2
    relation: discusses
    bears-on: projection
    note: Analyzes the open and remote forms and their interpretations.
kind:
  provisional: true
  projection:
    target: A preterite form in a remote if-clause can describe the same future time as the corresponding present in an open conditional. Remoteness can be marked without asserting that the condition is false.
    evidence: CGEL provides matched forms and separates the interpretation from context-dependent implicatures. CASA groups the open and remote variants in three records.
    confidence: high
