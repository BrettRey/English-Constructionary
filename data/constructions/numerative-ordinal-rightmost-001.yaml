kind:
  provisional: true
  projection:
    target: "In <i>two hundred forty-second</i>, the only overt ordinal form is the last part of the numerative, while the ordinal interpretation applies to the whole rank. Ordinalizing an earlier component cannot freely substitute for that realization."
    evidence: "Reynolds uses the placement of ordinal morphology among the constituency tests, independently of spelling conventions."
    confidence: medium
