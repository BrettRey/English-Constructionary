id: np-pron-001
name: Pronominal Noun Phrase
pattern: NP[Pron]
type: syntactic
meanings:
  '1':
    definition: Anaphoric reference - refers back to a previously mentioned entity (antecedent)
    details: "The interpretation can recover an earlier linguistic antecedent in the same sentence or the surrounding discourse."
    examples:
      - form: "John arrived. [He] looked tired."
        note: '''He'' refers back to ''John''.'
  '2':
    definition: Cataphoric reference - refers forward to an entity mentioned later in the discourse
    details: "A following antecedent is possible in suitable structural and discourse settings."
    examples:
      - form: "Before [he] entered the room, John switched off his phone."
        note: '''He'' refers forward to ''John'' in this reading.'
  '3':
    definition: Exophoric reference - refers to an entity in the extralinguistic context (situation, shared knowledge)
    details: "Salience in the situation can identify the referent without any antecedent expression."
    examples:
      - form: "[He]'s late again."
        note: Said about someone not present, referring to a shared understanding of who 'he' is.
  '4':
    definition: Bound variable reference - refers to an entity whose referent varies depending on a quantifier
    details: "The value can vary with the quantified antecedent."
    examples:
      - form: "Every student thinks [they] are smart."
        note: '''they'' refers to each student, and its referent varies with each student.'
  '5':
    definition: Dummy pronoun - has no referential meaning, serves a grammatical function
    details: "Dummy it and there occupy grammatical positions without identifying entities."
    examples:
      - form: "[It] is raining."
        note: '''It'' does not refer to anything; it''s a grammatical placeholder.'
      - form: "[There] is a problem."
        note: '''There'' does not refer to a place; it introduces the existence of something.'
constraints:
  - type: syntactic
    description: Must consist of a pronoun functioning as the head of the NP
semanticType: reference
relatedConstructions:
  - id: np-001
    relationship: inherits-from
  - id: fused-determiner-head-001
    relationship: see-also
    notes: Traditional 'indefinite pronouns' (everybody, something, nobody) are compound determinatives in fused determiner-head function, not pronouns
  - id: interrogative-word-001
    relationship: related-to
    notes: Some interrogative forms are pronouns.
  - id: relative-word-001
    relationship: related-to
    notes: Some relative forms are pronouns.
  - id: existential-there-001
    relationship: related-to
  - id: subject-extraposition-001
    relationship: related-to
lexiconRefs:
  - gold/pronouns
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§10, 16.2; Ch. 17 §2"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "They and them can pick up a prior referent but change realization with subject versus object function. Dummy it can fill a subject slot with no antecedent, so antecedence is neither necessary for pronominal NP status nor sufficient to pick its case."
    evidence: "CGEL separates pronominal form and syntax from anaphoric, deictic and dummy uses."
    confidence: medium
