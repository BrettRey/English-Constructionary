id: dispositional-middle-001
name: Dispositional Middle
pattern: Clause[Theme Subject + active transitive-capable V + optional ease/manner modifier]
type: mixed
meanings:
  '1':
    definition: Presents a referent as having a disposition affecting how an action can be carried out on it.
    examples:
      - form: '[This fabric washes well].'
        note: Constructed illustration.
      - form: The fabric [was washed at noon].
        note: Constructed comparison. An eventive passive with a specific occasion, in contrast to the dispositional middle.
