id: temporal-genitive-001
name: Temporal Genitive Determiner
pattern: NP[Det:time-denoting genitive NP + Nom]
type: mixed
meanings:
  '1':
    definition: Locates the nominal referent or event at a contextually identified time.
    examples:
      - form: They cancelled [tomorrow’s inspection].
        note: Constructed illustration.
relatedConstructions:
  - id: genitive-s-001
    relationship: specialization-of
    parthood: formal
  - id: calendar-deictic-np-001
    relationship: related-to
  - id: group-genitive-001
    relationship: overlaps-with
    overlap-dimension: formal
    notes: In <i>[the day after the election]’s agenda</i>, the genitive gives a time and the marker attaches at the edge of the phrase, after <i>election</i> rather than <i>day</i>.
grounds:
  - source: cgel-2002
    locator: Ch. 5 §§16.3, 16.5, relations expressed by genitive determination
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: <i>Tomorrow</i> dates the event without denoting a participant in the inspecting. <i>The inspector’s inspection</i> can instead relate an argument to the nominal predicate.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
