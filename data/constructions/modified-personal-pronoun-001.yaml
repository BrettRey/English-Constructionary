id: modified-personal-pronoun-001
name: Adjectivally Modified Personal Pronoun NP
pattern: "NP[(article) + attributive AdjP + personal-pronoun form]"
type: mixed
meanings:
  '1':
    definition: Picks out a stage or aspect of the person or group identified by a pronoun.
    details: "In <i>the five-year-old you</i>, the pronoun anchors the reference to the addressee and the adjective specifies an age. In subject position the whole NP can take third-person verbal agreement. A coreferential reflexive can still carry the person of the pronoun. Some age-modified uses are bare. The category of the head and the explanation for the agreement split remain open."
    examples:
      - form: "[The five-year-old you] was so cute!"
        note: <i>Was</i> contrasts with ordinary second-person <i>you were</i>.
        grounds:
          - source: halm-2022
            locator: "§8 [24a]"
            relation: cites
            bears-on: projection
      - form: "Questions [A Younger Me] Would Ask Myself"
        note: In the reported title, the object reflexive retains first person.
        grounds:
          - source: halm-2022
            locator: "§4 [6b]"
            relation: attests
            bears-on: attestation
  '2':
    definition: Characterizes the person identified by the pronoun as being in a particular state.
    details: "In <i>an exhausted me</i>, the speaker is still identified by <i>me</i>. The adjective adds the state in which the speaker experienced the situation. Halm compares this use with <i>a visibly irritated Mr Andrews</i> and distinguishes it from a reading that explicitly selects a stage or aspect."
    examples:
      - form: "[An exhausted me] has felt …"
        note: Excerpt from Halm’s example of the state-characterizing interpretation.
        grounds:
          - source: halm-2022
            locator: "§10 [31a]"
            relation: attests
            bears-on: attestation
relatedConstructions:
  - id: np-001
    relationship: specialization-of
    parthood: formal
    notes: The whole expression can occupy a subject or object slot. An attributive adjective combines with a form otherwise used as a personal pronoun.
  - id: np-det-001
    relationship: overlaps-with
    overlap-dimension: formal
    notes: "<i>The younger me</i> has overt determination. Halm also reports bare age-modified forms, including <i>12 year old me</i> as the subject of a relative clause."
  - id: indefinite-modified-name-001
    relationship: related-to
    notes: "<i>An exhausted me</i> and <i>a visibly shaken Giuliani</i> combine <i>a</i>/<i>an</i> with an adjective that characterizes a participant identified independently by the pronoun or name."
  - id: proper-name-secondary-use-001
    relationship: related-to
    notes: "<i>The young Isaac Newton</i> and <i>the five-year-old you</i> can each pick out a life stage, anchored by a name in the first case and by the addressee pronoun in the second."
  - id: personal-determiner-001
    relationship: related-to
    notes: "In <i>we linguists</i>, <i>we</i> occupies the determiner slot and precedes a lexical head. In <i>the younger us</i>, the article occupies that slot and <i>us</i> follows the modifier."
grounds:
  - source: halm-2022
    locator: "§§4, 8–10 [6], [23–31]"
    relation: discusses
    bears-on: projection
    note: Reports adjectivally modified forms across person and number, split agreement and third-person anaphora when stages are juxtaposed.
  - source: cgel-2002
    locator: "Ch. 5 §§10.2, 17.2.1, pp. 429–430 and 486"
    relation: discusses
    bears-on: projection
    note: The general personal-pronoun examples in CGEL restrict pre-head dependents and give ordinary subject–reflexive person agreement.
kind:
  provisional: true
  projection:
    target: The modified NP can take a singular verb form unavailable to ordinary <i>you</i>, while an antecedent containing <i>me</i> can support <i>myself</i>. A stage contrast can also support third-person anaphora.
    evidence: Halm’s contrasts separate finite agreement from the selection of coreferential forms. The article alone leaves the head’s lexical category open.
    confidence: medium
  boundaries:
    known_boundary_items:
      - "<i>Poor old me</i> is CGEL’s bare evaluative pattern. <i>The younger me</i> can pick out a life stage and occurs in a pattern that also permits <i>a younger me</i>."
      - "<i>A he</i> or <i>a she</i> can denote a person of a category and lacks the ordinary speaker or addressee anchoring tested here."
