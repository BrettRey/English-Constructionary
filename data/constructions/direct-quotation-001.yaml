id: direct-quotation-001
name: Direct Quotation with Reporting Predicate
pattern: quotation + reporting predicate or reporting predicate + quotation
type: mixed
meanings:
  '1':
    definition: Presents words as directly voiced or displayed against a reporting frame.
    examples:
      - form: '[“I’ll call tomorrow,” Jo said].'
        note: Constructed illustration.
relatedConstructions:
  - id: closed-interrogative-clause-001
    relationship: related-to
  - id: indirect-report-001
    relationship: related-to
    notes: <i>Jo said, “I’m ready”</i> presents a quotation in the original speaker’s terms. <i>Jo said that she was ready</i> reports content from the reporting context.
grounds:
  - source: cgel-2002
    locator: Ch. 11 §9.2
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: <i>I</i> and <i>tomorrow</i> are anchored to the quoted speech. A verbal question can retain root inversion inside the quote, unlike the ordinary indirect question complement.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
