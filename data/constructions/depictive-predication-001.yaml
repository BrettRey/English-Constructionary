id: depictive-predication-001
name: Depictive Secondary Predication
pattern: Clause[primary VP + secondary AdjP/NP predicated of a participant]
type: mixed
meanings:
  '1':
    definition: Ascribes a condition to a participant during the primary event.
    examples:
      - form: They carried the patient [unconscious].
        note: Constructed illustration.
