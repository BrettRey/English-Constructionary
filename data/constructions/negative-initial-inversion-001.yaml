id: negative-initial-inversion-001
name: Inversion after Preposed Negative or Restrictive Expression
pattern: Clause[preposed negative/restrictive dependent + finite Aux + Subject + VP]
type: mixed
meanings:
  '1':
    definition: Uses auxiliary-first order within the nucleus after certain negative or restrictive expressions.
    examples:
      - form: '[Only after the meeting did I find out].'
        note: Constructed illustration.
      - form: '[After the meeting I found out].'
        note: Constructed comparison. The non-restrictive fronted adjunct does not trigger inversion.
