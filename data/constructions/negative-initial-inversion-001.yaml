  - source: goldberg-2006
    locator: Ch. 8, the subject–auxiliary inversion family
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "<i>Only after the meeting</i> triggers inversion in this use. <i>After the meeting I found out</i> differs in auxiliary placement, and <i>only</i> modifying the subject does not trigger it."
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
