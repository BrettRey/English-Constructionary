id: going-to-future-001
name: "Prospective <i>be going to</i>"
pattern: VP[be + going + to-infinitival]
type: mixed
meanings:
  '1':
    definition: Presents an event as prospective in light of an intention or present indications.
    examples:
      - form: '[It’s going to freeze tonight].'
        note: Constructed illustration.
relatedConstructions:
  - id: vp-001
    relationship: specialization-of
    parthood: formal
  - id: present-futurate-001
    relationship: related-to
  - id: progressive-ing-001
    relationship: related-to
    notes: Compare <i>I’m going to leave</i> and <i>I’m going to the station</i>. The prospective construction takes an infinitival and allows subjects with no motion interpretation.
grounds:
  - source: cgel-2002
    locator: Ch. 3 §10.2
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The weather subject requires no mover and no physical destination. The prospective use can therefore be distinguished from motion in <i>going to the station</i>.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
