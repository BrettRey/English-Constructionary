id: numerative-fractional-001
name: Fractional Noun
pattern: Cardinal base → fractional noun (-th or suppletive)
type: morphological
dimensions:
  form: "Cardinal base + <i>-th</i> or suppletive (<i>half</i>, <i>quarter</i>); count noun"
  meaning: "Denotes denominator in fraction; partitive semantics"
  function: "Heads nominal in fraction NPs; numerator is determiner"
  distribution: "Inflects for number (<i>one fifth</i>, <i>two fifths</i>); licenses factors"
meanings:
  '1':
    definition: Fractional noun denoting a denominator; used in fraction NPs with a numeral determiner
    examples:
      - form: fifth
        note: Denominator noun
      - form: quarter
        note: Suppletive fractional noun
constraints:
  - type: structural
    description: Fractional noun heads a nominal; numerator functions as determiner in fraction NPs (e.g., <i>one fifth</i>).
  - type: morphological
    description: Fractional noun inflects for number (<i>one third</i> vs <i>two thirds</i>); <i>half</i>/<i>quarter</i> are suppletive.
