kind:
  provisional: true
  projection:
    target: "<i>Fifths</i> in <i>three fifths</i> accepts plural marking and a cardinal determiner. <i>Fifth</i> in <i>fifth place</i> is adjectival and does not take plural marking there. The two distributions persist where the forms are partly identical."
    evidence: "CGEL and Reynolds distinguish fractional nouns from ordinal adjectives despite the shared morphological material."
