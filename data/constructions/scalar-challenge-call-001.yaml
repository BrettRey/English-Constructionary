id: scalar-challenge-call-001
name: You Call That X Challenge
pattern: "You call that (a) [N/PRED]?"
type: mixed
meanings:
  '1':
    definition: Challenges the appropriateness of a category label in a dismissive or corrective context
    details: Challenges category membership rather than scalar degree (though the two are related via prototype structure). Implies "that doesn't deserve the label X" or "let me show you what X really is." A speaker can reject the label without offering a replacement exemplar. A literal inquiry about what to call an object is also possible.
    examples:
      - form: "[You call that a sandwich]? It's just bread with lettuce."
        note: Challenges category membership; implying it fails to meet criteria
      - form: "[You call that clean]? There's dust everywhere."
        note: With predicative adjective; challenges threshold for category
      - form: "[You call that music]?"
        note: Dismissive; implies speaker has higher standards
      - form: "[You call that an apology]? You didn't even say sorry."
        note: Challenges whether token meets criteria for type
constraints:
  - type: syntactic
    description: Declarative clause with 2nd person subject and "call" as main verb; typically layered with the declarative-question construction
  - type: semantic
    description: Complement is a category label (N or predicative expression)
  - type: pragmatic
    description: Challenges appropriateness of categorization
relatedConstructions:
  - id: declarative-clause-001
    relationship: specialization-of
    parthood: formal
    notes: The challenge frame retains declarative clause type
  - id: declarative-question-001
    relationship: interfaces-with
    notes: Question prosody conventionally layers onto the declarative challenge frame
  - id: scalar-recalibration-declarative-001
    relationship: overlaps-with
    overlap-dimension: functional
    notes: Shares addressee-directed challenge function; targets category membership rather than scalar degree
  - id: metalinguistic-negation-001
    relationship: related-to
grounds:
  - source: cgel-2002
    locator: "Ch. 10 §§4.7.2, 6.4, declarative questions and challenges to question presuppositions, for comparison"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "Keeping the wording You call that a repair? fixed, dismissive intonation and a visibly broken object invite a challenge to repair. In a cooperative question about terminology, the wording can instead check what label the addressee uses."
    evidence: "The source describes the surrounding question architecture. The proposed challenge reading is illustrated by a constructed contextual contrast and its conventionality remains open."
    confidence: medium
