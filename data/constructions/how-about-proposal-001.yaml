id: how-about-proposal-001
name: Proposal with How About
pattern: how about + NP, gerund-participial or licensed clause
type: pragmatic
meanings:
  '1':
    definition: Offers an item or course of action for consideration.
    examples:
      - form: '[How about a short break?]'
        note: Constructed illustration.
relatedConstructions:
  - id: question-001
    relationship: related-to
  - id: what-about-topic-001
    relationship: related-to
    notes: How about a short break? and What about a short break? can both propose a break. What about the budget? can also take up an outstanding topic.
  - id: why-not-proposal-001
    relationship: related-to
    notes: How about taking a break? proposes an option with a gerund-participial. Why not take a break? puts forward a proposal using a plain verbal predicate.
grounds:
  - source: cgel-2002
    locator: Ch. 10 §7.7, how about
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The response can accept or reject the proposal. The phrase need not ask how a break would be carried out.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
