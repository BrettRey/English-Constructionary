id: come-with-motion-participial-001
name: "<i>come</i> with a Motion or Sound Participial"
pattern: VP[Head:come + V-ing expression + (path expression)]
type: mixed
meanings:
  '1':
    definition: Presents an approach with its manner or accompanying sound.
    details: In <i>came running</i>, <i>running</i> supplies the manner. In <i>came roaring past</i>, <i>roaring</i> supplies sound during the movement and <i>past</i> supplies the path. The subject participates in the motion and the activity or sound. Compare <i>came looking for us</i>, where the participial can instead describe a purpose. This entry covers the manner and sound reading with <i>come</i>.
    examples:
      - form: Sally [came running excitedly into the room].
        note: Excerpt from the documented example. <i>Running</i> supplies manner.
        grounds:
          - source: fau-patel-come-ing
            locator: example A
            relation: attests
            bears-on: attestation
      - form: '[came roaring past]'
        note: Excerpt from a description of tanks. <i>Roaring</i> supplies the sound and <i>past</i> the path.
        grounds:
          - source: fau-patel-come-ing
            locator: example B
            relation: attests
            bears-on: attestation
relatedConstructions:
  - id: vp-001
    relationship: specialization-of
    notes: Both the participial and any path expression are part of the motion description.
  - id: goal-complement-001
    relationship: related-to
    notes: A goal expression can specify the destination of the movement.
grounds:
  - source: fanego-motion-participial
    locator: §§7–8, productivity and grammatical properties
    relation: discusses
    bears-on: projection
    note: Documents the motion frame and the distribution of manner and sound participles.
kind:
  provisional: true
  projection:
    target: A sound verb can describe how the movement unfolds, with a path expression that describes the movement rather than the direction of the sound.
    evidence: Patel’s Research Constructicon entry gives motion and sound examples. Fanego traces the corpus distribution of the broader movement-plus-participial pattern.
    confidence: high
