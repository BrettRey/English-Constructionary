id: time-measure-ago-001
name: Measure before Ago
pattern: PP[measure NP + ago]
type: mixed
meanings:
  '1':
    definition: Locates an event or point by measuring backwards from the relevant deictic time.
    examples:
      - form: The review arrived [four days ago].
        note: Constructed illustration.
