    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The time can usually be paraphrased as four days before now. Ago normally takes its measure before it, in contrast to temporal before with a following reference complement.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
