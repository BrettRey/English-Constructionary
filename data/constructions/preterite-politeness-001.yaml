id: preterite-politeness-001
name: Preterite with Present-Time Politeness
pattern: Clause[preterite of a request-related predicate + complement]
type: mixed
meanings:
  '1':
    definition: Softens a present request by presenting it as an already entertained thought or intention.
    examples:
      - form: '[I wanted to ask] if a seat was available.'
        note: Constructed illustration.
