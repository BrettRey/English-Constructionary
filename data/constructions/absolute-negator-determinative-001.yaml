id: absolute-negator-determinative-001
name: Absolute Negator Determinatives
pattern: "NP[absolute negator determinative as fused head]"
type: syntactic
meanings:
  '1':
    definition: Encodes clausal negation via an NP headed by an absolute negator determinative in fused determiner-head function
    details: "CGEL (Ch. 9, §3.2) treats <i>no</i> and <i>none</i> as dependent and independent forms of the determinative no, and <i>nobody</i>, <i>no one</i>, <i>nothing</i>, <i>nowhere</i>, <i>no place</i> as single-word compounds of <i>no</i>. These are determinatives, not pronouns; standing alone as NPs they occupy fused determiner-head function."
    examples:
      - form: "[Nobody] knew where Kim was."
        note: Compound determinative as negative subject
      - form: "Kim had done [nothing] about it."
        note: Compound determinative as negative object
      - form: "We liked [none] of them."
        note: Independent form of the determinative no
constraints:
  - type: syntactic
    description: Negative property percolates from the negator NP to the clause.
  - type: semantic
    description: Alternates with verbal negation plus <i>any</i>/<i>either</i>/<i>ever</i> (e.g., "<i>didn't do anything</i>").
formRefs:
  - absolute-negator-compound
syntacticRefs:
  - clause-polarity-diagnostics
relatedConstructions:
  - id: no-determiner-001
    relationship: related-to
    notes: Same determinative no in dependent (determiner) function
  - id: never-adv-negation-001
    relationship: related-to
  - id: negative-polarity-ever-001
    relationship: related-to
lexiconRefs:
  - gold/determinatives
grounds:
  - source: cgel-2002
    locator: "Ch. 9, SS3.2"
    relation: cites
    bears-on: category-assignment
    note: "<i>no</i>/<i>none</i> dependent and independent forms of the determinative <i>no</i>; compounds are single words"
  - source: cgel-2002
    locator: "Ch. 9 §3.2.1; Ch. 5 §9.6"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "<i>Nobody</i> and <i>nothing</i> can trigger a positive confirmation tag even when the finite VP has affirmative form. The same polarity cannot be inferred merely from the use of <i>few</i> or <i>little</i> in every context."
    evidence: "CGEL discusses positive tags and the relation between absolute negative expressions and approximate negation."
    confidence: medium
