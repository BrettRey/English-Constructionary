id: concealed-passive-ing-001
name: "Concealed Passive in an <i>-ing</i> Complement"
pattern: VP[need/want/require or other licensing V + gerund-participial]
type: mixed
meanings:
  '1':
    definition: Uses an active-shaped complement with a passive interpretation.
    examples:
      - form: The hinge [needs oiling].
        note: Constructed illustration.
      - form: The hinge [needs to be oiled].
        note: Constructed comparison. The infinitival counterpart displays the passive overtly.
relatedConstructions:
  - id: vp-001
    relationship: specialization-of
    parthood: formal
  - id: adjective-hollow-infinitival-001
    relationship: related-to
  - id: be-passive-001
    relationship: related-to
    notes: <i>The hinge needs oiling</i> has a passive interpretation with an active gerund-participial. <i>The hinge needs to be oiled</i> expresses the passive overtly.
grounds:
  - source: cgel-2002
    locator: Ch. 14 §2.3
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The hinge is understood as what someone oils. A <i>to</i>-infinitival with analogous meaning normally requires passive morphology, as in <i>needs to be oiled</i>.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
