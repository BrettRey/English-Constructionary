    relationship: contains
  - id: numerative-basic-lexeme-001
    relationship: contains
  - id: numerative-complex-001
    relationship: related-to
  - id: determination-001
    relationship: related-to
grounds:
  - source: reynolds-2026-numerals
    relation: cites
    bears-on: category-assignment
  - source: reynolds-2026-numerals
    locator: "§4, obligatory factors and their grammatical function"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "Two multiplies hundred in two hundred. It can be embedded under a separate determiner in a count noun use such as two two hundreds. A second determiner analysis would obscure why both numerals occur and contribute differently."
    evidence: "Reynolds tests factor modification against the co-occurrence of actual external determiners and against argument-selection tests."
    confidence: medium
