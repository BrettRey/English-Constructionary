id: polarity-short-answer-001
name: Finite Auxiliary in a Polar Short Answer
pattern: answer particle + Subject pronoun + finite Aux, optionally negated
type: mixed
meanings:
  '1':
    definition: Resolves an antecedent polar question with an overt indication of the proposition’s polarity.
    examples:
      - form: “Did Jo lock up?” “[Yes, she did].”
        note: Constructed illustration.
relatedConstructions:
  - id: auxiliary-vp-ellipsis-001
    relationship: interfaces-with
grounds:
  - source: cgel-2002
    locator: Ch. 9 §7.1; Ch. 10, polar questions
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: Did presents a positive answer and helps identify the elided predicate. Responses to negative questions can vary in the use of the answer particle across speakers and contexts.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
