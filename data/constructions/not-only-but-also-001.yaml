id: not-only-but-also-001
name: "Additive <i>not only … but also</i>"
pattern: coordination[not only XP + but (also) XP]
type: mixed
meanings:
  '1':
    definition: Asserts both contributions with the second presented as additional or noteworthy.
    examples:
      - form: She [not only signed it but also delivered it].
        note: Constructed illustration.
