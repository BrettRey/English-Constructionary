id: intransitive-preposition-001
name: Intransitive Preposition Use
pattern: "Head:P (no Obj:NP; + optional non-object Comp)"
type: syntactic
dimensions:
  form: "Preposition heading a PP without an NP object; it may be complementless or take a PP, clause, or predicative complement"
  meaning: "Varies with the head and complement: location, direction, time, reason, comparison, and other relations"
  function: "Heads an intransitive PP in complement, modifier, adjunct, or predicative function"
  distribution: "The full CGEL objectless class; complementless locative members occupy the same PP positions as full locative PPs"
meanings:
  '1':
    definition: A preposition used without an NP object, whether or not it has another kind of complement
    details: "Intransitive means no object, not no complement. A complementless member such as <i>outside</i> heads a one-word PP, but an intransitive preposition may instead take a PP complement (<i>owing to the rain</i>), a predicative complement (<i>as satisfactory</i>), or a clause complement (<i>because it rained</i>). <i>Ago</i> is intransitive-only and occurs with an obligatory pre-head measure modifier (<i>ten years ago</i>; cf. <i>ten years before Christ</i>). The category remains preposition throughout (CGEL p. 272); the analysis of <i>ago</i> deliberately rejects CGEL p. 632."
    examples:
      - form: "She waited [outside]."
        note: Complementless intransitive use; the same lexeme also has transitive <i>outside the door</i>
      - form: "This happened [owing [to the rain]]."
        note: Intransitive preposition with a PP complement
      - form: "That counts [as satisfactory]."
        note: Intransitive preposition with a predicative complement
      - form: "We left [because it rained]."
        note: Intransitive preposition with a clause complement
      - form: "ten years [ago]"
        note: "Intransitive-only, with an obligatory pre-head measure modifier (*<i>I went ago</i>); the measure phrase is a modifier, not a complement (cf. <i>ten years before Christ</i>)"
      - form: "Bill slept the afternoon [away]."
        note: Complementless intransitive preposition heading a one-word PP in particle use
constraints:
  - type: syntactic
    description: "The head has no NP object in this use; the presence of a non-object complement does not make the PP transitive."
  - type: syntactic
    description: "Within the complementless locative subset, <i>right</i>/<i>straight</i> modification and <i>from</i>-embedding help distinguish PPs from AdvPs (<i>right outside</i>, <i>straight home</i>, <i>from abroad</i>)."
relatedConstructions:
  - id: preposition-001
    relationship: specialization-of
    parthood: formal
  - id: pp-001
    relationship: related-to
lexiconRefs:
  - gold/prepositions
grounds:
  - source: cgel-2002
    locator: "Ch. 7 §§2, 4"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "<i>Outside</i> can occur alone in <i>We waited outside</i> or with a complement in <i>We waited outside the gate</i>. The ability to say <i>from outside</i> supplies a test beyond merely counting overt NP complements."
    evidence: "CGEL distinguishes intransitive uses and documents PP embedding by <i>from</i> and other prepositions."
    confidence: medium
