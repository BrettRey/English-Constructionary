id: preposed-predicate-001
name: Preposed Verbal Predicate
pattern: Clause[preposed VP + Subject + stranded licensing auxiliary]
type: mixed
meanings:
  '1':
    definition: Repeats or validates a salient predicate by putting the verbal material first.
    examples:
      - form: They said Jo would run, and [run she did].
