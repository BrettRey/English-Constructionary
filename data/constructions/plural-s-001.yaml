id: plural-s-001
name: Plural -s
pattern: Common noun + -s/-es
meanings:
  '1':
    implements: plural-001.1
    specialization: Realizes plural number on an eligible nominal stem
    examples:
      - form: cats
        note: Marks 'cat' as non-singular
    relations:
      - 1
  '2':
    implements: plural-001.3
    specialization: Realizes plural number when the noun is used to count types or varieties
    examples:
      - form: wines
        note: Types of wine
    relations:
      - 2
  '3':
    implements: plural-001.4
    specialization: Realizes plural number in a construction that describes recurring instances
    examples:
      - form: I get headaches
        note: Recurring condition
    relations:
      - 1
  '4':
    implements: plural-001.2
    specialization: Forms common nouns denoting groups from proper nouns used as names
    examples:
      - form: the Kennedys
        note: Kennedy family/dynasty members
    relations:
      - 3
relations:
  '1':
    construction: n-common-001
    type: related-to
    notes: Standard host
  '2':
    construction: n-non-count-001
    type: related-to
    notes: Non-count-to-count coercion source
  '3':
    construction: n-proper-001
    type: related-to
    notes: Proper-to-common coercion source
grounds:
  - source: cgel-2002
    locator: "Ch. 18 §4.1.1; Ch. 5 §§3.1–3.2"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "With transparent regular plural formation, the final sound of the stem predicts the suffix pronunciation. Compare the /s/ in cats, /z/ in dogs, and /ɪz/ in horses. A variety interpretation additionally depends on count use of the noun."
    evidence: "CGEL describes the sibilant allomorphy and separately documents contextual count readings."
    confidence: medium
relatedConstructions:
  - id: irregular-vowel-plural-001
    relationship: related-to
  - id: portion-variety-count-001
    relationship: related-to
