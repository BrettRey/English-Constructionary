id: degree-adjective-indefinite-001
name: Degree-Adjective-Indefinite (Big Mess Construction)
pattern: "[Deg + Adj + (of) + a(n) + N]"
type: syntactic
meanings:
  '1':
    definition: Degree word and adjective precede the indefinite article, expressing degree or extent of the adjectival property
    details: "A degree-marked adjective phrase, including certain comparatives, precedes the indefinite article, inverting the normal order (cf. \"a big mess\" → \"how big a mess\"). Only compatible with indefinite \"a(n)\", not definite \"the\" (*\"how big the mess\"). The \"how\" variant can function as an interrogative phrase, fronting to clause-initial position. Variants differ in register. An intervening of is especially familiar in North American varieties and is more available with some degree phrases than others."
    examples:
      - form: "[How big a mess] was it?"
        note: Interrogative; degree phrase fronted
      - form: "He's not [that good a teacher]."
        note: Degree word \"that\"; negative context common
      - form: "It was [too big a problem] to ignore."
        note: Degree word \"too\" with infinitival complement
      - form: "She's [so good a student] that she skipped a year."
        note: Degree word \"so\" with result clause
      - form: "It's not [as big a deal] as you think."
        note: Comparative \"as...as\" construction
      - form: "I've never seen [so big a crowd]."
        note: "\"So\" variant; more literary than other degree words"
      - form: "It's not [that big of a deal]."
        note: Of-insertion variant; common in North American English
      - form: "[more interesting a job] than I thought"
        note: "Published comparison. The fronted adjective phrase is comparative."
        grounds:
          - source: fillmore-lee-goldman-rhomieux-2012
            locator: "Author draft §4.7.1 (50e)"
            relation: attests
            bears-on: attestation
constraints:
  - type: syntactic
    description: "Eligible phrases include those with how, so, too, that and as and certain comparatives. Ordinary very uses a different word order."
  - type: syntactic
    description: "Article must be indefinite a(n); definite the is ungrammatical"
  - type: syntactic
    description: "\"How\" variant can be interrogative, fronting to clause-initial position"
  - type: pragmatic
    description: "Acceptability and register depend on the degree phrase and the availability of the intervening of variant."
dimensions:
  form: Degree word + adjective + indefinite article + noun
  meaning: "Expresses degree/extent of adjectival property; scalar semantics"
  function: Degree modification with displaced adjective
  distribution: "Common in speech and writing; competes with such a big N and a N that big"
relatedConstructions:
  - id: indefinite-001
    relationship: interfaces-with
    notes: "Requires indefinite article; incompatible with definite"
  - id: degree-001
    relationship: specialization-of
    notes: Specialized degree construction with unusual word order
  - id: too-degree-infinitival-001
    relationship: related-to
  - id: np-indef-001
    relationship: related-to
grounds:
  - source: fillmore-lee-goldman-rhomieux-2012
    locator: "Author draft §§4.7.1–4.7.2, examples 49–51"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "An eligible degree phrase can precede a in too serious a problem. Ordinary very yields a very serious problem. Comparatives are also documented, and acceptability of of varies with the particular degree expression and variety."
    evidence: "The FrameNet chapter gives the comparatives alongside so, as, how, that and too. It explicitly leaves the distribution of intervening of open."
    confidence: medium
