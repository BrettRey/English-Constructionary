id: degree-adjective-indefinite-001
name: Degree-Adjective-Indefinite (Big Mess Construction)
pattern: "[Deg + Adj + (of) + a(n) + N]"
type: syntactic
meanings:
  '1':
    definition: Degree word and adjective precede the indefinite article, expressing degree or extent of the adjectival property
    details: "A degree-marked adjective phrase, including certain comparatives, precedes the indefinite article, inverting the normal order (cf. \"<i>a big mess</i>\" → \"<i>how big a mess</i>\"). Only compatible with indefinite \"<i>a(n)</i>\", not definite \"<i>the</i>\" (*\"<i>how big the mess</i>\"). The \"<i>how</i>\" variant can function as an interrogative phrase, fronting to clause-initial position. Variants differ in register. An intervening <i>of</i> is especially familiar in North American varieties and is more available with some degree phrases than others."
    examples:
      - form: "[How big a mess] was it?"
        note: Interrogative; degree phrase fronted
      - form: "He's not [that good a teacher]."
        note: Degree word \"<i>that</i>\"; negative context common
      - form: "It was [too big a problem] to ignore."
        note: Degree word \"<i>too</i>\" with infinitival complement
      - form: "She's [so good a student] that she skipped a year."
        note: Degree word \"<i>so</i>\" with result clause
      - form: "It's not [as big a deal] as you think."
        note: Comparative \"<i>as...as</i>\" construction
      - form: "I've never seen [so big a crowd]."
        note: "\"<i>So</i>\" variant; more literary than other degree words"
      - form: "It's not [that big of a deal]."
        note: Of-insertion variant; common in North American English
      - form: "[more interesting a job] than I thought"
        note: "Published comparison. The fronted adjective phrase is comparative."
        grounds:
          - source: fillmore-lee-goldman-rhomieux-2012
            locator: "Author draft §4.7.1 (50e)"
            relation: attests
            bears-on: attestation
constraints:
  - type: syntactic
    description: "Eligible phrases include those with <i>how</i>, <i>so</i>, <i>too</i>, <i>that</i> and <i>as</i> and certain comparatives. Ordinary <i>very</i> uses a different word order."
  - type: syntactic
    description: "Article must be indefinite <i>a(n)</i>; definite <i>the</i> is ungrammatical"
  - type: syntactic
    description: "\"<i>How</i>\" variant can be interrogative, fronting to clause-initial position"
  - type: pragmatic
    description: "Acceptability and register depend on the degree phrase and the availability of the intervening <i>of</i> variant."
dimensions:
  form: Degree word + adjective + indefinite article + noun
  meaning: "Expresses degree/extent of adjectival property; scalar semantics"
  function: Degree modification with displaced adjective
  distribution: "Common in speech and writing; competes with <i>such a big N</i> and <i>a N that big</i>"
relatedConstructions:
  - id: indefinite-001
    relationship: interfaces-with
    notes: "Requires indefinite article; incompatible with definite"
  - id: degree-001
    relationship: specialization-of
    notes: Specialized degree construction with unusual word order
  - id: too-degree-infinitival-001
    relationship: related-to
  - id: np-indef-001
    relationship: related-to
grounds:
  - source: fillmore-lee-goldman-rhomieux-2012
    locator: "Author draft §§4.7.1–4.7.2, examples 49–51"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "An eligible degree phrase can precede <i>a</i> in <i>too serious a problem</i>. Ordinary <i>very</i> yields <i>a very serious problem</i>. Comparatives are also documented, and acceptability of <i>of</i> varies with the particular degree expression and variety."
    evidence: "The FrameNet chapter gives the comparatives alongside <i>so</i>, <i>as</i>, <i>how</i>, <i>that</i> and <i>too</i>. It explicitly leaves the distribution of intervening <i>of</i> open."
    confidence: medium
