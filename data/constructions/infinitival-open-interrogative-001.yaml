id: infinitival-open-interrogative-001
name: Infinitival Open Interrogative
pattern: interrogative XP + to-infinitival with a linked gap
type: mixed
meanings:
  '1':
    definition: Presents an unresolved choice about an envisaged action.
    examples:
      - form: They discussed [which route to take].
        note: Constructed illustration.
