id: adjectival-raising-001
name: Raising with an Adjectival Predicative
pattern: Clause[Subject:NPᵢ + be + PredComp:AdjP[Adj + to-infinitival with understood subjectᵢ]]
type: mixed
meanings:
  '1':
    definition: Locates likelihood or a related assessment in the situation expressed by the infinitival.
    details: Likely assesses the situation. It permits dummy there in the subject position because that position serves the infinitival predication. In determined to leave, the adjective ascribes determination to its subject and does not permit dummy there.
    examples:
      - form: '[There is likely to be enough food left.]'
        note: Dummy there is licensed within the existential situation assessed.
        grounds:
          - source: cgel-2002
            locator: Ch. 14 §8.1 [4ivb]
            relation: attests
            bears-on: attestation
      - form: '[Liz was likely to convince them.]'
        note: The situation remains the same in They were likely to be convinced by Liz.
        grounds:
          - source: cgel-2002
            locator: Ch. 14 §8.1 [3b], [4iib]
            relation: attests
            bears-on: attestation
relatedConstructions:
  - id: clause-001
    relationship: specialization-of
    notes: The matrix adjective takes an infinitival.
  - id: adjective-hollow-infinitival-001
    relationship: related-to
    notes: The tough construction instead links the matrix subject to a non-subject gap.
grounds:
  - source: casa-constructicon
    locator: record 50
    relation: discusses
    bears-on: projection
    note: Records likely with an infinitival in the raising frame.
kind:
  provisional: true
  projection:
    target: Dummy subjects are compatible with the raising pattern. Substituting a passive description of the same situation need not shift the target of likely.
    evidence: CGEL tests matched raising and non-raising adjectives with dummy subjects, passive alternation and selection. CASA records the likely construction.
    confidence: high
