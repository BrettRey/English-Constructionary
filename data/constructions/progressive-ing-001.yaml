id: progressive-ing-001
name: Progressive -ing
pattern: Aux BE + V-ing
type: morphological
meanings:
  '1':
    definition: Marks an ongoing or unfolding situation at a reference time (imperfective viewpoint; endpoints are not asserted)
    examples:
      - form: She is reading
        note: Situation in progress
      - form: They were walking home
        note: Ongoing event in past time frame
      - form: She was building a house
        note: Ongoing process; does not entail completion
      - form: She built a house
        note: Perfective contrast with completion entailment
  '2':
    definition: Marks current-phase or contingent construal (often contrasted with a default habitual/simple-present reading)
    examples:
      - form: He is living in Chicago
        note: Current-phase framing of residence
      - form: The server is running slow today
        note: Contingent framing of a state
      - form: I'm living in Mississauga
        note: Current/contingent residence framing
relatedConstructions:
  - id: vp-001
    relationship: specialization-of
    parthood: formal
    notes: The progressive auxiliary and gerund-participial complement form a VP headed by be
  - id: progressive-futurate-001
    relationship: related-to
  - id: genitive-ing-subject-001
    relationship: related-to
grounds:
  - source: cgel-2002
    locator: "Ch. 3 §§8.1–8.3; Ch. 14 §§1.5, 4.3"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "Be plus a gerund-participle typically presents an activity in progress or a current phase. An -ing complement in Jo avoided staying does not itself have progressive aspect. A future adjunct can instead give the progressive an arrangement reading."
    evidence: "CGEL distinguishes progressive be from other gerund-participial structures and discusses futurate uses."
    confidence: medium
