id: preposition-001
name: Preposition
pattern: P
type: syntactic
dimensions:
  form: "Mostly short, closed-class lexemes; no inflection"
  meaning: "Relates an entity or situation to another in space, time, or abstract structure"
  function: "Head of PP; PPs serve as complements, modifiers, and adjuncts"
  distribution: "NP objects and other complements are optional for much of the class; a few exceptional heads follow their complement"
meanings:
  '1':
    definition: Lexical category heading preposition phrases, with optional complements for much of the class
    details: "The CGEL category is much larger than the traditional one: it includes the traditional prepositions (<i>in</i>, <i>on</i>, <i>of</i>), objectless members traditionally called adverbs (<i>home</i>, <i>abroad</i>, <i>ashore</i>, <i>upstairs</i>; <i>ago</i>, with its obligatory pre-head measure modifier), the rare complement-head members (<i>notwithstanding</i>), and clause-taking members traditionally called subordinating conjunctions (<i>because</i>, <i>although</i>, <i>while</i>). See data/lexicon/gold/prepositions.yaml for the curated inventory."
    examples:
      - form: "[in] the garden"
        note: "Transitive: <i>the garden</i> bears the object function within the PP"
      - form: "She waited [outside]."
        note: Intransitive use (no object)
      - form: "ten years [ago]"
        note: "Intransitive, with an obligatory pre-head measure modifier (cf. <i>ten years before Christ</i>); the Constructionary rejects CGEL's complement analysis on p. 632"
      - form: "[because] it rained"
        note: Clause complement (traditional subordinating conjunction)
constraints:
  - type: syntactic
    description: Heads a PP; accepts <i>right</i>/<i>straight</i> modification in locative uses (<i>right outside</i>, <i>straight home</i>).
kind:
  provisional: true
  projection:
    target: "Category membership predicts PP distribution (goal and locative complement positions, from-embedding for locative members, modifier positions), <i>right</i>/<i>straight</i> modifiability for locatives, and non-inflection"
    evidence: "Distributional convergence across the traditional prepositions, the intransitive members, and the clause-taking members (CGEL Ch. 7)"
    confidence: medium
    grounds:
      - source: cgel-2002
        locator: "Ch. 7 §§2-4"
        relation: cites
        bears-on: projection
        note: "The expanded category projects PP-head distribution across traditional, objectless, and clause-taking members"
      - source: cgel-2002
        locator: "Ch. 7 §§2-4"
        relation: cites
        bears-on: stability
        note: "Shared distributional behavior supports the stable expanded preposition profile"
  secured: stable
lexiconRefs:
  - gold/prepositions
grounds:
  - source: cgel-2002
    locator: "Ch. 2 §7, p. 58; Ch. 7 §§2-4"
    relation: cites
    bears-on: category-assignment
    note: "Prepositions head PPs and include objectless and clause-taking members beyond the traditional class"
