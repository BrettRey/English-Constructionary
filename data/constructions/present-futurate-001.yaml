id: present-futurate-001
name: Present Futurate
pattern: Clause[present-tense predicate + future-time anchoring]
type: mixed
meanings:
  '1':
    definition: Presents a future occurrence as scheduled or fixed by an arrangement.
    examples:
      - form: '[The ferry leaves at dawn tomorrow].'
        note: Constructed illustration.
      - form: '[The Sun sets at five tomorrow].'
        note: Constructed comparison. A calculable future event with the simple present.
