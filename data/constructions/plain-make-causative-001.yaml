id: plain-make-causative-001
name: "<i>make</i> Causative with a Bare Infinitival"
pattern: VP[make + NP + bare infinitival]; passive be made + to-infinitival
type: mixed
meanings:
  '1':
    definition: Presents one participant as causing the other to undertake or undergo a situation.
    examples:
      - form: The joke [made Lee laugh].
        note: Constructed illustration.
relatedConstructions:
  - id: vp-001
    relationship: specialization-of
    parthood: formal
  - id: into-causative-001
    relationship: related-to
  - id: be-passive-001
    relationship: interfaces-with
    notes: Compare <i>They made Kai wait</i> and <i>Kai was made to wait</i>. The infinitival marker is required in the passive counterpart.
  - id: let-permissive-001
    relationship: overlaps-with
    overlap-dimension: formal
    notes: <i>Made Kai wait</i> and <i>let Kai wait</i> share an NP followed by a bare infinitival. <i>Make</i> presents a cause and <i>let</i> presents permission or non-prevention.
grounds:
  - source: cgel-2002
    locator: Ch. 14 §§1.4.3, 5.4, make
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: In the active <i>make</i> selects the bare infinitival, while the corresponding passive <i>Lee was made to laugh</i> uses <i>to</i>. The interpretation retains Lee as the laugher.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
