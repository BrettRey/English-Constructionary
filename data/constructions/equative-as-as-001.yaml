id: equative-as-as-001
name: "Scalar Equative <i>as … as</i>"
pattern: as + gradable expression + as-phrase/clause
type: mixed
meanings:
  '1':
    definition: Compares a degree with a standard without asserting a greater degree in the positive form.
    examples:
      - form: The new shelf is [as wide as the old one].
        note: Constructed illustration.
relatedConstructions:
  - id: gradation-001
    relationship: interfaces-with
  - id: than-reduced-clause-001
    relationship: related-to
grounds:
  - source: cgel-2002
    locator: Ch. 13 §§1.1, 4.3
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The first <i>as</i> sets up a degree standard and the second introduces it. <i>At least as wide</i> explicitly allows a greater width and <i>not as wide</i> ordinarily implies a lower degree.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
