id: evaluation-of-person-001
name: Evaluative Adjective with Of and an Infinitival
pattern: Clause[dummy it + be + Adj + PP[of + NPᵢ] + to-infinitival with understood subjectᵢ]
type: mixed
meanings:
  '1':
    definition: Evaluates a person’s conduct in doing or contemplating the action named by the infinitival.
    details: In It was kind of you to call, of you supplies the participant whose action is evaluated. Compare It was difficult for you to call, where the assessment concerns the difficulty of your calling. With the relevant evaluative adjectives a context can supply the action instead, as in That was kind of you.
    examples:
      - form: '[It is good of you to help.]'
        note: You is the understood helper as well as the person being evaluated.
        grounds:
          - source: cgel-2002
            locator: Ch. 7 §6.2 [18]
            relation: attests
            bears-on: attestation
      - form: '[It was careless of Pat to leave the gate open].'
        note: Constructed example with an unfavourable evaluation.
relatedConstructions:
  - id: subject-extraposition-001
    relationship: related-to
    notes: Both occur with it and a following infinitival.
  - id: exclamative-clause-001
    relationship: related-to
    notes: How kind of you to call uses the evaluative frame with exclamative packaging.
grounds:
  - source: casa-constructicon
    locator: records 52–53
    relation: discusses
    bears-on: projection
    note: Separates kind-of-you and difficult-for-you patterns.
kind:
  provisional: true
  projection:
    target: The of-phrase can remain with a referential that when the action is supplied by the context. In the corresponding difficult for pattern, who undertakes the difficult act is part of the clause with for.
    evidence: CASA lists this adjective-of frame separately from the it-for-event frame. The contrast can be tested using the same action and participant.
    confidence: high
