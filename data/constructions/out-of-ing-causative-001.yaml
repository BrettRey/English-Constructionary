id: out-of-ing-causative-001
name: "<i>out of</i> Causative with an <i>-ing</i> Clause"
pattern: VP[Head:V + Od:NPᵢ + Comp:PP[out of + gerund-participial Clause with understood subjectᵢ]]
type: mixed
meanings:
  '1':
    definition: Presents the object referent as caused to abandon an action or prevented from carrying it out.
    details: <i>Talk someone out of leaving</i> can prevent a prospective departure. Other uses involve stopping an ongoing course of action or losing an opportunity through deception. The object supplies the understood subject of the gerund-participial. A report of trying, intending, or planning to bring this about does not assert that the prevention occurred.
    examples:
      - form: They [talked Lee out of leaving].
        note: Constructed prospective action. Lee is understood as the person who would leave.
      - form: I [cheated you all out of being in my life].
        note: Published corpus example. The opportunity is lost rather than supplied.
        grounds:
          - source: kim-sim-2024-out-of
            locator: opening example
            relation: attests
            bears-on: attestation
relatedConstructions:
  - id: into-causative-001
    relationship: related-to
    notes: Both link the matrix object to the understood subject of a gerund-participial and contrast in the result.
  - id: caused-motion-001
    relationship: related-to
    notes: The literal counterpart can have a spatial source after out of.
grounds:
  - source: kim-sim-2024-out-of
    locator: corpus and constructional analyses
    relation: discusses
    bears-on: projection
    note: Examines the form and semantic range of the gerund-participial construction.
  - source: hunston-v-n-out-of-n
    locator: sense groups for the NP-taking form
    relation: discusses
    bears-on: projection
    note: Documents the separately analyzed NP complement.
kind:
  provisional: true
  projection:
    target: The affected object is understood as the participant in the action that is prevented, abandoned, or made unavailable. The paired <i>into</i>-frame can express the opposite outcome.
    evidence: Kim and Sim analyze 725 COCA examples. The noun-taking <i>out of</i> frame in Hunston’s inventory supplies a point of comparison.
    confidence: high
