id: preposition-pied-piping-001
name: Preposition Fronting in a Relative
pattern: relative [PP[P + relative NP] + clause with linked gap]
type: syntactic
meanings:
  '1':
    definition: Places a preposition and relative expression together at the front of the relative clause.
    examples:
      - form: The terminal [from which they departed] is closed.
        note: Constructed illustration.
relatedConstructions:
  - id: integrated-relative-modifier-001
    relationship: interfaces-with
  - id: prepositional-verb-frame-001
    relationship: related-to
  - id: prepositional-passive-001
    relationship: related-to
    notes: <i>To whom Jo spoke</i> fronts the preposition with its complement. <i>Jo was spoken to</i> leaves the preposition behind when its complement is realized as passive subject.
grounds:
  - source: cgel-2002
    locator: Ch. 12 §3.2, relative phrase formation; Ch. 7 §4.1
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: A fronted P can take <i>which</i> or <i>whom</i>. The comparable relative with <i>that</i> requires stranding rather than forming an initial PP from <i>that</i>.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
