kind:
  provisional: true
  projection:
    target: "The head remains the source of the nominal’s ordinary number possibilities. Compare dog breeders, where breeders pluralizes, with old books, where books pluralizes. Premodifier category can be tested independently."
    evidence: "CGEL’s account of nominal heads and internal modifiers separates the function from how an adjunct realizes it."
    confidence: medium
