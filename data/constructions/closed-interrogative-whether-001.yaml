id: closed-interrogative-whether-001
name: "Subordinate Closed Interrogative with <i>whether</i>"
pattern: whether + subordinate declarative-order nucleus, or whether + to-infinitival
type: syntactic
meanings:
  '1':
    definition: Introduces an embedded closed question or choice between alternatives.
    examples:
      - form: '[Whether to reschedule] still needs discussion.'
        note: Constructed illustration.
