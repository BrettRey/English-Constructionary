id: primary-auxiliary-negation-001
name: Finite Auxiliary with Not
pattern: Clause[finite Aux + not + remaining predicate]
type: syntactic
meanings:
  '1':
    definition: Expresses clausal negation with not associated with the finite auxiliary.
    examples:
      - form: She [has not received] it.
        note: Constructed illustration.
