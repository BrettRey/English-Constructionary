id: gradation-001
name: Gradation
pattern: X < {tall, deep, quick, ...} >
type: semantic
meanings:
  '1':
    definition: Denotes scalar property
    details: Core semantic features encoding measurable dimensions
    examples:
      - form: tall
        note: Height scale
      - form: quick
        note: Speed scale
  '2':
    definition: Denotes scale structure
    details: Semantic features encoding scale topology
    examples:
      - form: full/empty
        note: Closed scale
      - form: long/short
        note: Open scale
  '3':
    definition: Denotes standard reference
    details: Semantic features encoding comparison class
    examples:
      - form: tall for a child
        note: Class-relative
      - form: perfectly clean
        note: Absolute standard
semanticRefs:
  - scale
  - measure
  - comparison
  - standard
grounds:
  - source: cgel-2002
    locator: "Ch. 6, gradability; Ch. 13 §§1.1, 4.3–4.4"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "Positive tall relies on a contextually set standard. Six feet tall can place someone on the scale without settling whether they count as tall for a basketball player."
    evidence: "CGEL distinguishes scalar comparison and standards from positive-grade property ascription."
    confidence: medium
relatedConstructions:
  - id: measure-adjective-001
    relationship: related-to
  - id: equative-as-as-001
    relationship: related-to
