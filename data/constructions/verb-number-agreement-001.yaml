id: verb-number-agreement-001
name: Verb Number Agreement
pattern: Subject NP[singular/plural] + finite verb agreeing in number
type: syntactic
meanings:
  '1':
    definition: Finite verb inflects to match the grammatical number of the subject NP
    examples:
      - form: This dog runs
        note: Singular subject with singular verb
      - form: These dogs run
        note: Plural subject with plural verb
constraints:
  - type: syntactic
    description: Agreement is realized on finite verbs/auxiliaries that bear number morphology (e.g., present -s, is/are).
  - type: pragmatic
    description: Collective and notional agreement can override strict grammatical number in some varieties.
relatedConstructions:
  - id: clause-001
    relationship: interfaces-with
    notes: Agreement links an overt Subject to the finite verbal head within Clause structure
  - id: vp-001
    relationship: interfaces-with
    notes: Number is realized on the finite verb or auxiliary in the VP head of the Clause
  - id: singular-001
    relationship: related-to
  - id: plural-001
    relationship: related-to
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§18.1–18.4"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "In the key to the cabinets is missing, agreement tracks the subject head rather than the nearest plural noun. The number-transparent pattern a number of keys are missing needs a separate account."
    evidence: "CGEL distinguishes ordinary agreement and independently conditioned overrides."
    confidence: medium
