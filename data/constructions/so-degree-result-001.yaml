id: so-degree-result-001
name: "Degree <i>so</i> with a Result Content Clause"
pattern: so + gradable expression + (that) content clause
type: mixed
meanings:
  '1':
    definition: Identifies a high degree through a resulting or evidentially linked situation.
    examples:
      - form: The street was [so narrow that the van couldn’t turn].
        note: Constructed illustration.
relatedConstructions:
  - id: declarative-content-clause-001
    relationship: contains
    parthood: formal
  - id: too-degree-infinitival-001
    relationship: related-to
  - id: such-nominal-result-001
    relationship: overlaps-with
    overlap-dimension: functional
    notes: <i>So cold that the locks froze</i> has degree marking on an adjective. <i>Such a cold morning that the locks froze</i> uses a nominal expression. Both specify degree or kind through a stated result.
grounds:
  - source: cgel-2002
    locator: Ch. 11 §4.6; Ch. 8 §12.4
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The result clause identifies the relevant scale threshold and ordinarily presents a realized situation. Compare <i>too narrow to turn</i>, which describes an obstacle without reporting an attempt.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
