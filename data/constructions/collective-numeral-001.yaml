id: collective-numeral-001
name: Collective Numeral Construction
pattern: "in + N[cardinal, plural] + (and + N[cardinal, plural])"
type: syntactic
dimensions:
  form: "Plural cardinal noun in PP, often coordinated (twos and threes)"
  meaning: "Grouping or distribution by numerical size"
  function: "Specifies manner of grouping or arrangement"
  distribution: "Adverbial PP modifying manner of action"
meanings:
  '1':
    definition: Cardinal nouns denote group sizes for collective arrangement
    examples:
      - form: in twos and threes
        note: Arriving/arranged in small groups
      - form: by the hundreds
        note: Magnitude reading, often large numbers rather than batches of exactly one hundred
      - form: count by fives
        note: Grouping for counting
constraints:
  - type: syntactic
    description: Cardinal noun is a common noun; takes plural morphology.
  - type: structural
    description: Typically in PP with '<i>in</i>' or '<i>by</i>'.
semanticRefs:
  - cardinality
  - category
formRefs:
  - numerative-single-digit
relatedConstructions:
  - id: cardinal-noun-001
    relationship: specialization-of
  - id: n-common-001
    relationship: related-to
  - id: distributive-rate-apiece-001
    relationship: related-to
  - id: magnitude-quantifier-001
    relationship: related-to
grounds:
  - source: reynolds-2026-numerals
    locator: "§5, Table 2, collective"
    relation: discusses
    bears-on: projection
  - source: cgel-2002
    locator: "Ch. 5 §7.6"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "<i>People entered in threes</i> can describe an arbitrarily large crowd. <i>Three</i> counts the members in each group even though <i>threes</i> is itself grammatically plural. A phrase such as <i>by the hundreds</i> can instead indicate large numbers without fixed groups."
    evidence: "Reynolds assigns the grouping use its own semantic role among cardinal nouns. The constructed contrast checks whether the number applies to the total or to the groups."
    confidence: medium
