id: irregular-vowel-plural-001
name: Stem-Vowel Alternation in Noun Plurals
pattern: selected noun stem alternation, e.g. tooth ↔ teeth
type: morphological
meanings:
  '1':
    definition: Realizes a lexical noun plural by internal vowel change.
    examples:
      - form: One tooth had broken and [two teeth] were loose.
        note: Constructed illustration.
