id: comparative-er-001
name: "Comparative <i>-er</i>"
pattern: XP[X + -er] where X < {tall, deep, soon, near, few, ...} >
type: morphological
meanings:
  '1':
    definition: Denotes scalar superiority
    details: Semantic operation comparing two points on scale denoted by base
    examples:
      - form: taller/deeper
        note: Property comparison
      - form: sooner/nearer
        note: Relation comparison
      - form: fewer
        note: Quantity comparison
  '2':
    definition: Denotes scalar difference
    details: Semantic operation measuring interval between compared points
    examples:
      - form: much taller
        note: Relative interval
      - form: two inches taller
        note: Measured interval
  '3':
    definition: Denotes comparison basis
    details: Semantic operation establishing reference point
    examples:
      - form: taller than Bill
        note: Explicit reference
      - form: the taller building
        note: Contextual reference
semanticRefs:
  - comparison
  - scale
  - measure
  - standard
grounds:
  - source: cgel-2002
    locator: "Ch. 6, grade inflection; Ch. 13 §§4.1, 4.4; Ch. 18 §§3.1–3.2"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "The same comparative relation can be expressed by a suffix with <i>tall</i> or by <i>more</i> with <i>expensive</i>. The suffix does not freely spread from one gradable adjective to another. Either realization can introduce a <i>than</i>-standard and accept a differential where the adjective allows it."
    evidence: "CGEL treats comparative realization and the form of the standard as distinct choices and documents lexical variation in grade inflection."
    confidence: medium
relatedConstructions:
  - id: differential-measure-comparative-001
    relationship: related-to
  - id: than-reduced-clause-001
    relationship: interfaces-with
    notes: "<i>Longer than we expected</i> pairs a comparative adjective with a <i>than</i>-clause whose missing degree is interpreted through the comparison."
  - id: comparative-adjective-suppletion-001
    relationship: related-to
    notes: "<i>Longer</i> marks comparative grade with the regular suffix. <i>Better</i> expresses comparative grade with a suppletive form."
