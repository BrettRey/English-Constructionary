id: quasi-count-noun-001
name: Quasi-count Plural Noun
pattern: "N[plural-only quasi-count]"
type: semantic
meanings:
  '1':
    definition: Denotes aggregates of discrete individuals with weakened individuation, yielding a mixed countability profile
    examples:
      - form: many cattle
        note: Loose count property
      - form: "*a cattle"
        note: Tight property rejected
      - form: three head of cattle
        note: Specialized singulative counting frame
constraints:
  - type: syntactic
    description: Plural-only morphology with plural agreement; resists singular and <i>a</i>/<i>an</i>.
  - type: semantic
    description: Individuation is weakened; tight count properties (low cardinals, distributives) are degraded.
  - type: pragmatic
    description: Tight cardinality uses surface mainly in specialized registers.
formRefs:
  - quasi-count-nouns
semanticRefs:
  - countability
  - individuation
  - individuation-precision
syntacticRefs:
  - countability-diagnostics
  - countability-hierarchy
relatedConstructions:
  - id: non-count-material-construal-001
    relationship: related-to
    notes: "<i>Many cattle</i> has a lexically restricted plural count profile. <i>Some rabbit</i> uses a noun productively in non-count syntax to refer to material."
kind:
  provisional: true
  secured: stable
  profile:
    core:
      - property: "Plural-only morphology with loose count diagnostics"
        diagnostics: ["<i>many</i>/<i>few</i> N", "plural agreement", "high round numerals"]
        weight: high
      - property: "Rejection of tight count diagnostics"
        diagnostics: ["<i>a</i>/<i>an</i>", "low cardinals", "distributives"]
        weight: high
    peripheral:
      - property: "Functional singulative anchoring"
        diagnostics: ["<i>cow</i>/<i>officer</i> for <i>cattle</i>/<i>police</i>", "<i>head of</i> N"]
        weight: medium
  stabilisers:
    - type: entrenchment
      evidence: "High-frequency quasi-count lexemes stabilize the profile."
    - type: functional-pressure
      evidence: "Singulative reference is offloaded to functional alternatives (<i>cow</i>, <i>officer</i>)."
    - type: transmission
      evidence: "Iterated transmission preserves the ordered dissociation pattern."
  projection:
    target: "<i>Cattle</i> admits <i>many</i> and plural agreement, while an individual count normally uses a classifier or counting expression such as <i>three head of cattle</i>. No claim about novel forms follows automatically from those facts."
    evidence: "CGEL documents the restricted cardinal patterns and plural agreement of plural-only nouns."
    confidence: medium
  maintenance:
    perturbations:
      - "Loss of functional singulatives pushes toward full count or non-count profiles."
  variation:
    activation_states:
      - context: "specialized counting registers"
        effect: "Occasional low-cardinal tokens are tolerated."
    speaker_variation: "Boundary items (e.g., <i>folks</i>) show instability."
  boundaries:
    overlaps_with:
      - grammatical-number-001
      - n-non-count-001
    known_boundary_items:
      - "<i>folks</i>"
      - "<i>people</i>"
  grain:
    level: meso
    parent_families:
      - countability
  coupling:
    linked_cluster: "individuation construal"
    mechanism: "bidirectional inference between construal and count morphosyntax"
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§3.2, 3.4, plural-only nouns"
    relation: discusses
    bears-on: projection
