id: negative-concord-001
name: Negative Concord
pattern: clause with verbal negation and/or multiple negative expressions interpreted together
type: mixed
meanings:
  '1':
    definition: Expresses a single negation through more than one negative-marked item in the relevant variety.
    examples:
      - form: I [didn’t tell nobody] about it.
        note: Constructed illustration.
