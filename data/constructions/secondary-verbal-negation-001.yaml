id: secondary-verbal-negation-001
name: Secondary Verbal Negation
pattern: "not + VP[secondary]"
type: syntactic
meanings:
  '1':
    definition: Negates a non-finite or subjunctive clause without <i>do</i>-support
    examples:
      - form: "It is vital that he [not] be told."
        note: Subjunctive clause
      - form: "[Not] locking the doors is unwise."
        note: Gerund-participial clause
      - form: "a plan [not] approved by the board"
        note: Past-participial clause
      - form: "It looks bad for them [not] to smile."
        note: Infinitival clause
constraints:
  - type: syntactic
    description: <i>Not</i> premodifies the secondary VP; <i>do</i>-support is unavailable.
  - type: position
    description: In <i>to</i>-infinitivals, <i>not</i> may appear before or after <i>to</i> (e.g., "<i>for them to not smile</i>").
relatedConstructions:
  - id: vp-001
    relationship: contains
    parthood: formal
    notes: Secondary <i>not</i> premodifies the VP that heads the non-finite or subjunctive Clause
  - id: clause-001
    relationship: interfaces-with
    notes: Secondary verbal negation applies within headed non-finite and subjunctive Clauses
  - id: constituent-not-negation-001
    relationship: related-to
  - id: subjunctive-mandative-001
    relationship: interfaces-with
grounds:
  - source: cgel-2002
    locator: "Ch. 9 §2.3; Ch. 11 §7.1, subjunctive negation"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "The negative <i>to</i>-infinitival in <i>a plan not to leave</i> and the mandative <i>that Lee not leave</i> both keep the following verb in the plain form without <i>do</i>. The corresponding finite declarative <i>Lee did not leave</i> uses <i>do</i>."
    evidence: "CGEL treats these as secondary verbal negation and distinguishes them by form from primary negation."
    confidence: medium
