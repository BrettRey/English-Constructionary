id: until-time-boundary-001
name: "Temporal <i>until</i> with an Endpoint"
pattern: PP[until + date/NP/finite clause]
type: mixed
meanings:
  '1':
    definition: Supplies the boundary up to which a situation holds or an occurrence is delayed.
    examples:
      - form: We waited [until the shutters opened].
        note: Constructed illustration.
