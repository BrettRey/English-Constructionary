id: long-distance-open-interrogative-001
name: Long-Distance Open Interrogative
pattern: fronted interrogative XPᵢ + clause containing a subordinate clause with gapᵢ
type: mixed
meanings:
  '1':
    definition: Questions a dependent associated with a predicate inside an embedded clause.
    examples:
      - form: '[Which tool did Lee say Jo had borrowed?]'
        note: Constructed illustration.
      - form: '[Which tool did Jo borrow?]'
        note: Constructed comparison. Local counterpart. The same interrogative is associated directly with the main verb.
