id: letter-case-specification-001
name: "Letter-Case Specification Construction"
pattern: "Case-specifying phrase or modifier attached to a label (e.g., with a small X, with a lowercase X, small-X)"
type: semantic
dimensions:
  form: "PP or adjectival modifier naming a letter and its case (small/big/capital/uppercase/lowercase)."
  meaning: "Specifies orthographic case to disambiguate the sense or status of a label."
  function: "Metalinguistic instruction about how a label should be written and interpreted."
  distribution: "Adjunct to category labels; often parenthetical after the label."
meanings:
  '1':
    definition: "Specifies the capitalization of a letter in a label."
    details: "Capitalization can distinguish institutional and descriptive uses. Name conventions and ordinary spelling supply other uses. The capital-letter format can also emphatically present an example as fully deserving its label."
    examples:
      - form: "Catholic [with a small c]."
        note: "Non-institutional, descriptive sense."
      - form: "She is a [Big-D] Democrat."
        note: "Institutional or party-affiliated sense."
semanticRefs:
  - metalinguistic
  - orthographic-case
  - category
  - reference
relatedConstructions:
  - id: n-common-001
    relationship: related-to
    notes: "Lowercase specifications align with common-noun readings."
  - id: proper-name-001
    relationship: related-to
    notes: "Case specification often disambiguates proper-name readings."
  - id: n-proper-001
    relationship: related-to
    notes: "Letter-case cues interact with proper-noun orthography."
grounds:
  - source: cambridge-dictionary-capital
    locator: "Entries for capital letter and its contrast with small letter"
    relation: discusses
    bears-on: projection
  - source: cambridge-dictionary-with-a-capital
    locator: "Idiom entry, attributing a strong degree"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "<i>With a capital R</i> can distinguish the Romantic movement from a descriptive adjective. A quality with a capital letter can also express emphatic exemplarity. Neither the letter case nor the verbal specification determines noun subclass independently."
    evidence: "The dictionary contrasts labels by written case and lists the emphatic idiom separately."
    confidence: medium
