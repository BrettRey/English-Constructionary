id: n-proper-001
name: Proper Noun
pattern: "N[proper]"
type: syntactic
dimensions:
  form: "Noun specialized to head proper names; morphologically simple or compound. Normally written with an initial capital, subject to lexical and stylistic exceptions."
  meaning: "Individual-specific, archetypal, institutional, or geographical features"
  function: "Head of proper NP; licenses bare NP without determiner"
  distribution: "Heads Nom in proper NPs; modifier position in N-N compounds"
meanings:
  '1':
    definition: Denotes individual-specific feature bundle
    details: Core semantic features characterizing a particular individual
    examples:
      - form: Einstein-
        note: Features of <i>Einstein-ness</i>
      - form: Shakespeare-
        note: Features of <i>Shakespeare-ness</i>
    relations:
      - 1
      - 5
  '2':
    definition: Denotes archetypal feature bundle
    details: Characteristic semantic features that can ground metaphorical extension
    examples:
      - form: Waterloo-
        note: Defeat-related features
      - form: Marathon-
        note: Endurance-related features
    relations:
      - 1
  '3':
    definition: Denotes institutional feature bundle
    details: Semantic features associated with institutional entities
    examples:
      - form: Harvard-
        note: University-related features
      - form: Congress-
        note: Legislative-related features
  '4':
    definition: Denotes geographical feature bundle
    details: Semantic features associated with locations
    examples:
      - form: Pacific-
        note: Ocean-related features
      - form: Everest-
        note: Mountain-related features
relations:
  '1':
    construction: np-proper-001
    type: related-to
    notes: 'Original type: projects-to.'
  '5':
    construction: proper-name-001
    type: related-to
    notes: Semantic counterpart
relatedConstructions:
  - id: proper-name-001
    relationship: interfaces-with
    notes: Bidirectional syntax-semantics interface; proper nouns cue proper-name interpretation, proper-name intention licenses proper noun choice
  - id: np-proper-001
    relationship: contains
    parthood: formal
    notes: Proper noun formally heads proper NP (via Nom)
  - id: proper-name-secondary-use-001
    relationship: related-to
semanticRefs:
  - metaphor-source
  - institution-type
  - location-type
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§20.1–20.4"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "Proper noun and proper name need not have the same extent. <i>New Zealand</i> is a multiword name, and a noun normally used as a name can appear in an explicitly descriptive NP such as <i>another Einstein</i>."
    evidence: "CGEL separates the word category from the whole designation and documents secondary uses."
    confidence: medium
