id: god-knows-indeterminate-001
name: "<i>God knows</i> with an Indeterminate Expression"
pattern: fixed authority expression + knows + indeterminate XP, including inside an argument or modifier
type: mixed
meanings:
  '1':
    definition: Marks a value as unknown or left unspecified, often with an emphatic stance.
    details: In <i>He filed God knows how many pages</i>, the expression supplies an indefinite quantity inside the object NP. In <i>She put God knows what in the soup</i>, it supplies the unknown item. The source lists variants with <i>Heaven</i>, <i>the Lord</i> and <i>goodness</i>. An independent sentence such as <i>God knows how many pages he filed</i> can also make a literal claim about knowledge.
    examples:
      - form: They packed [God knows what] in these boxes.
        note: Constructed NP object use with an unknown item.
      - form: He filed [goodness knows how many pages].
        note: Constructed example where the unknown value is the number inside the object NP.
relatedConstructions:
  - id: indeterminate-word-001
    relationship: related-to
    notes: An indeterminate identifies the open value.
  - id: open-interrogative-clause-001
    relationship: related-to
    notes: An independent verb of knowing can instead take an ordinary embedded question.
grounds:
  - source: casa-constructicon
    locator: record 63
    relation: discusses
    bears-on: projection
    note: Records the stance formula and attested slot types.
kind:
  provisional: true
  projection:
    target: An expression with the shape of a finite clause can occur within the matrix object NP and mark an unknown content or quantity. A fully literal knowledge clause does not generally have that distribution.
    evidence: CASA lists the formula and the range of indeterminates. The constructed insertion contrasts test the embedded use. Its internal constituency is open.
    confidence: medium
