id: such-nominal-result-001
name: Degree Such with Nominal and Result Clause
pattern: such + nominal expression + (that) content clause
type: mixed
meanings:
  '1':
    definition: Characterizes the extent or kind of something through an associated result.
    examples:
      - form: It was [such a cold morning that the locks froze].
        note: Constructed illustration.
