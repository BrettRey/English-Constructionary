id: np-common-001
name: Common Noun Phrase
pattern: 'NP[N-Type: Common]'
type: syntactic
meanings:
  '1':
    definition: NP whose nominal head is a common noun; compatible with definite or indefinite, and unique or non-unique, reference
    examples:
      - form: dog
        note: General reference to the kind
      - form: the books
        note: Specific reference to a set of books
constraints:
  - type: syntactic
    description: The nominal head must be a common noun
semanticType: reference
relatedConstructions:
  - id: np-001
    relationship: inherits-from
  - id: strong-proper-name-001
    relationship: related-to
  - id: np-bare-001
    relationship: overlaps-with
    overlap-dimension: formal
    notes: Dogs can be both bare and headed by a common noun. The dogs has the same head category with an overt determiner.
  - id: np-det-001
    relationship: overlaps-with
    overlap-dimension: formal
    notes: The dogs is both determined and headed by a common noun. Dogs has the same head category without an overt determiner.
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§1–3, 20"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "A common noun such as river heads either the river or a river. A particular identifiable referent need not therefore be named through a proper noun."
    evidence: "CGEL contrasts the lexical noun classes and distinguishes referential status from noun class."
    confidence: medium
