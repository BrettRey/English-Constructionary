id: n-common-001
name: Common Noun
pattern: N[Type:Common]
type: syntactic
dimensions:
  form: "Noun stem; typically uncapitalized; takes number and case inflection"
  meaning: "Denotes class or category of entities; supports count/non-count distinction"
  function: "Head of Nom; provides descriptive content for reference"
  distribution: "Heads Nom in common NPs; modifier position in N-N compounds"
meanings:
  '1':
    definition: Provides a nominal description usable with ordinary NP determination when the count and number profile permits it
    examples:
      - form: dog
        note: Common noun denoting a kind
      - form: city
        note: Category-level reference
relatedConstructions:
  - id: n-proper-001
    relationship: related-to
    notes: Parallel noun category
  - id: np-common-001
    relationship: related-to
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§1–3, 20"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "A use like the tallest building can identify a unique referent while keeping a common lexical head. Identification alone therefore does not predict the distribution of a proper noun."
    evidence: "CGEL separates proper-noun specialization from syntactic determination and reference."
    confidence: medium
