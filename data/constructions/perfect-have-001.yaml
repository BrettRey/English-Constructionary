id: perfect-have-001
name: "Perfect <i>have</i> + V-en"
pattern: Aux HAVE + V-en
type: syntactic
meanings:
  '1':
    definition: Places a prior situation relative to a temporal anchor
    examples:
      - form: She has finished the report
        note: Prior completion relevant now
      - form: They had already left
        note: Prior event relative to a past reference time
    details: "The present perfect has a present anchor and often suggests current relevance. In many varieties it resists an explicitly finished past-time setting. The preterite perfect instead uses a past anchor."
  '2':
    definition: Marks experiential or repeatable prior occurrence
    examples:
      - form: I have visited Japan
        note: Experiential perfect
      - form: We have met before
        note: Prior occurrence with relevance
  '3':
    definition: Marks a continuing situation spanning up to the reference time (universal/continuative perfect)
    examples:
      - form: I have lived there for three years
        note: Residence continues up to now
      - form: She has worked here since 2020
        note: Ongoing state with inception in the past
relatedConstructions:
  - id: vp-001
    relationship: specialization-of
    parthood: formal
    notes: The perfect auxiliary and participial complement form a VP headed by <i>have</i>
grounds:
  - source: cgel-2002
    locator: "Ch. 3 §§5.1–5.4"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "Perfect <i>have</i> selects a past participle. With a past anchor, <i>had left</i> precedes that past time. A present anchor is only one possibility, even when no time expression is overt."
    evidence: "CGEL separates perfect anteriority from primary tense and from the contextual interpretation of current relevance."
    confidence: medium
