id: imperative-negation-do-001
name: Imperative Negation with do-support
pattern: "Do not/Don't + VP (imperative)"
type: syntactic
meanings:
  '1':
    definition: Issues a negative directive (prohibitive imperative)
    details: Uses do-support for negation in imperatives, even when an auxiliary could negate in declaratives.
    examples:
      - form: "[Don't] look at me."
        note: Prohibitive directive
      - form: "[Don't] be afraid."
        note: do-support despite auxiliary be
      - form: "[Don't] you look at me!"
        note: Emphatic negative imperative with subject
      - form: "[Don't] everyone shout it out."
        note: Negative imperative with quantified subject
constraints:
  - type: syntactic
    description: Imperative clause with base-form VP.
  - type: structural
    description: Negation is expressed with do-support (do not/don't) in imperatives.
relatedConstructions:
  - id: imperative-clause-001
    relationship: specialization-of
    parthood: formal
    notes: Negative imperative retains imperative clause type and its special do-support requirement
  - id: secondary-verbal-negation-001
    relationship: related-to
  - id: finite-do-support-001
    relationship: related-to
  - id: lets-inclusive-001
    relationship: related-to
grounds:
  - source: cgel-2002
    locator: "Ch. 9 §2.2; Ch. 10 §§9.2–9.3"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "A prohibitive imperative can use don’t with be, as in Don’t be late, while an ordinary finite declarative uses She isn’t late. The negative inclusive Let’s not leave instantiates a different imperative subtype."
    evidence: "CGEL documents the distinctive imperative do distribution and the order alternatives in negatives with let’s."
    confidence: medium
