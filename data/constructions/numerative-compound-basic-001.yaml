id: numerative-compound-basic-001
name: Compound Basic Numerative (Decade + Single-digit)
pattern: "Det[decade] + Det[single-digit] (typically hyphenated)"
type: morphological
dimensions:
  form: "Decade + single-digit compound; hyphenated; lexically atomic"
  meaning: "Specifies cardinality from <i>twenty-one</i> to <i>ninety-nine</i>"
  function: "Same distribution as simple basic numeratives"
  distribution: "Determiner, factor, addition; resists internal coordination (*<i>twenty and one</i>)"
meanings:
  '1':
    definition: Specifies a cardinality formed by additive composition of tens and ones
    examples:
      - form: twenty-one
        note: 20 + 1
      - form: forty-two
        note: 40 + 2
      - form: ninety-nine
        note: 90 + 9
constraints:
  - type: structural
    description: Requires a decade base with a single-digit addition; excludes *<i>twenty-ten</i>.
formRefs:
  - numerative-compound-basic
  - numerative-decade
  - numerative-single-digit
  - compounding
semanticRefs:
  - cardinality
  - additive-composition
syntacticRefs:
  - basic-numerative-atomicity
relatedConstructions:
