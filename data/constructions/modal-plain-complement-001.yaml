kind:
  provisional: true
  projection:
    target: <i>Might</i> selects plain <i>have</i>, and the modal itself has no third-person singular suffix. Ordinary central modals cannot occupy the complement slot of perfect <i>have</i>.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
