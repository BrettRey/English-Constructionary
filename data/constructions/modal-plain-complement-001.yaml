id: modal-plain-complement-001
name: Central Modal with a Plain-Form Complement
pattern: VP[central modal + plain-form VP]
type: syntactic
meanings:
  '1':
    definition: Combines central modal marking with a plain-form verbal complement.
    examples:
      - form: Jo [might have missed] the train.
        note: Constructed illustration.
relatedConstructions:
