id: even-if-concessive-conditional-001
name: "Concessive Conditional <i>even if</i>"
pattern: adjunct[even if + finite clause]
type: mixed
meanings:
  '1':
    definition: Holds a consequence fixed under a condition presented as unfavourable or extreme.
    examples:
      - form: '[Even if it rains], we’ll go.'
        note: Constructed illustration.
relatedConstructions:
  - id: if-conditional-001
    relationship: specialization-of
    parthood: formal
grounds:
  - source: cgel-2002
    locator: Ch. 8 §14.1.3
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: The sentence can be uttered while rain is uncertain. The plan is presented as holding even in that case, unlike the ordinary expectation suggested by a bare conditional.
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
