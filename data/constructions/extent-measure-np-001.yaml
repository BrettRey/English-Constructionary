id: extent-measure-np-001
name: Spatial Extent with a Measure NP
pattern: VP[motion/spatial V + measure NP]
type: mixed
meanings:
  '1':
    definition: Measures traversed distance or the spatial extent of a configuration.
    examples:
      - form: We walked [three kilometres] before lunch.
        note: Constructed illustration.
