kind:
  provisional: true
  projection:
    target: "<i>London</i> can occur without an article when it identifies the city. A construction such as <i>two Kims</i> uses a nomenclatural form with numeral determination and plural marking, so name form alone need not determine the NP’s referential status."
    evidence: "CGEL distinguishes proper nouns from whole names and documents secondary uses and complex names."
    confidence: medium
