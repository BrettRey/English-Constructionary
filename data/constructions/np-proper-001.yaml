id: np-proper-001
name: Proper Noun Phrase
pattern: "NP[Head:N[proper]]"
type: syntactic
meanings:
  '1':
    definition: NP whose nominal head is a proper noun; prototypically used as a proper name identifying a unique entity
    examples:
      - form: London
        note: Proper name NP
      - form: the Thames
        note: Proper name phrase
relatedConstructions:
