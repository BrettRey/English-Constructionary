id: vp-001
name: Verb Phrase
pattern: "Head:V (+ complements) (+ modifiers)"
type: syntactic
semanticType: predication
dimensions:
  form: "Phrase headed by a verb, with complements and modifiers licensed in the VP; no Subject occurs within the VP"
  meaning: "A situation profile contributed by the head verb and elaborated by its internal dependents"
  function: "Head (Predicate) of a Clause, or dependent in constructions that license a VP"
  distribution: "Occurs as the Head of a Clause and in selected embedded or modifying environments"
meanings:
  '1':
    definition: A phrase headed by a verb, containing any complements and modifiers but excluding the Subject
    details: "The verb is the Head of the VP and the ultimate Head of any Clause headed by that VP. Its lexical sense and constructional frame jointly determine which complements are required or permitted. The Subject, when present, is a dependent of Clause rather than VP; a VP can therefore serve as the Head of a Clause with an overt Subject or as the whole overt content of a subjectless Clause."
    examples:
      - form: "Kim [left early]."
        note: "Head V left with modifier early; Kim is Subject of Clause, not part of the VP"
      - form: "I [sent Sue a copy]."
        note: "Head V sent with indirect and direct object complements"
      - form: "They [slept the afternoon away]."
        note: "Head V slept with a construction-licensed object and PP complement"
constraints:
  - type: head
    description: "The Head is a verb; its inflectional form and lexical sense constrain the VP's internal syntax."
  - type: syntactic
    description: "Complements and VP-level modifiers are dependents within the VP."
  - type: structural
    description: "A Subject is never a dependent within VP structure; it belongs to the Clause headed by the VP."
kind:
  provisional: true
  projection:
    target: "Once a constituent is identified as a VP, the head verb and its constructional frame predict the inventory and order of internal complements, while the constituent type is eligible to serve as the Head of both subject-bearing and subjectless Clauses"
    evidence: "CGEL states that the verb is Head of VP and that properties of the verb determine which other elements are required or permitted; the Clause/VP contrast independently locates Subject outside the VP"
    confidence: high
    grounds:
      - source: cgel-2002
        locator: "Ch. 2 §3, pp. 50-51"
        relation: cites
        bears-on: projection
        note: "The verbal head and its sense license complement inventory, while VP category predicts Clause-head distribution"
      - source: cgel-2002
        locator: "Ch. 2 §3, pp. 50-51"
        relation: cites
        bears-on: stability
        note: "Verb as Head of VP and ultimate Head of Clause; verb properties govern permitted and required dependents"
  secured: stable
  profile:
    core:
      - property: "Verb Head"
        diagnostics: ["distribution as a verbal constituent", "verbal inflection on the Head"]
        weight: high
      - property: "Subject-external structure"
        diagnostics: ["Subject combines with VP at Clause level", "subjectless Clause realization"]
        weight: high
      - property: "Head-governed complementation"
        diagnostics: ["verb-sense valency", "complement category and order"]
        weight: high
    peripheral:
      - property: "Optional VP-level modification"
        diagnostics: ["manner, temporal, aspectual, and other integrated modifiers"]
        weight: medium
  grain:
    level: macro
    parent_families:
      - constituent-structure
relatedConstructions:
  - id: phrase-001
    relationship: specialization-of
    parthood: formal
    notes: "VP specializes the headed Phrase pattern with V as Head"
grounds:
  - source: cgel-2002
    locator: "Ch. 1 §4.2.2, pp. 22-23; Ch. 2 §3, pp. 50-51"
    relation: cites
    bears-on: category-assignment
    note: "VP is a phrasal category headed by V and serves as the Predicate/Head of Clause"
