id: still-yet-aspectual-001
name: "Aspectual <i>still</i> and Negative <i>yet</i>"
pattern: clause with still or polarity-sensitive yet and a temporal reference point
type: mixed
meanings:
  '1':
    definition: Locates persistence or non-occurrence against an expected course of events.
    examples:
      - form: The alarm [hasn’t stopped yet].
        note: Constructed illustration.
relatedConstructions:
  - id: durational-long-001
    relationship: related-to
  - id: continuative-perfect-001
    relationship: related-to
grounds:
