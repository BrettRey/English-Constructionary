    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "<i>Not yet</i> says that stopping has failed to occur up to the reference point and can suggest it remains expected. <i>Still</i> can instead present the existing state as persisting."
    evidence: See the cited discussion and the constructed illustration.
    confidence: medium
