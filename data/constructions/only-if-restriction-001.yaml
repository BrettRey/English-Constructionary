id: only-if-restriction-001
name: "Necessary Condition <i>only if</i>"
pattern: (main clause) + only if + finite clause
type: mixed
meanings:
  '1':
    definition: Restricts the circumstances in which a consequence holds or a permission applies.
    examples:
      - form: We’ll go [only if the ferry runs].
        note: Constructed illustration.
