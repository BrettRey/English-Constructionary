id: prenominal-modifier-001
name: Bare Plural with Prenominal Modifier
pattern: "NP[Head:Nom[Modifier:AdjP + Head:N[plural]]]"
type: syntactic
meanings:
  '1':
    definition: Category/kind modification with property attribution
    examples:
      - form: old men
        note: Prototypical property-denoting usage; Direct property modification (age attribute)
      - form: other men
        note: Requires contextual reference set; Complementary set relation
constraints:
  - type: syntactic
    description: The modifier function must be realized by an AdjP; the lexical head is the plural noun
  - type: morphological
    description: Head must be plural
semanticType: reference
relatedConstructions:
  - id: np-def-001
    relationship: related-to
    notes: "The old men shows the same modification inside an article-marked NP."
  - id: nom-adjp-mod-001
    relationship: related-to
  - id: nom-prehead-mod-001
    relationship: related-to
grounds:
  - source: cgel-2002
    locator: "Ch. 5 §§14.2, 15; Ch. 6, attributive adjectives"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "In a clause such as Old men were waiting, the modified bare plural can be an ordinary subject without an article. In the same episodic use an old man needs the article. The difference in bare licensing follows the head’s count and number profile and survives expansion to very old."
    evidence: "CGEL gives the range of attributive AdjPs and the ordinary order within the nominal."
    confidence: medium
