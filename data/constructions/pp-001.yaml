id: pp-001
name: Preposition Phrase
pattern: "Head:P (+ Obj:NP / PredComp:NP/AdjP / Comp:PP/AdvP/clause; or no complement)"
type: syntactic
dimensions:
  form: "Phrase headed by a preposition; NP complements may be objects or predicatives, and PP, AdvP, or clause complements are also licensed"
  meaning: "Relates an entity or situation to another in space, time, comparison, reason, or abstract structure"
  function: "Complement, modifier, adjunct, or predicative complement in a containing construction"
  distribution: "Complement of verbs and nouns, modifier in NPs and clauses, and complement of prepositions"
meanings:
  '1':
    definition: Phrase headed by a preposition, with or without a complement
    details: "The head may take an NP object (<i>in the garden</i>), a predicative NP or AdjP (<i>as a liability</i>, <i>as reasonable</i>), an AdvP (<i>until recently</i>), a clause (<i>because it rained</i>), a PP (<i>from under the bed</i>), or no complement (<i>outside</i>). A single complementless preposition constitutes a complete PP (CGEL Ch. 2 §7, p. 58)."
    examples:
      - form: "[in the garden]"
        note: P with NP object
      - form: "[as a liability]"
        note: P with predicative NP complement
      - form: "[until recently]"
        note: P with AdvP complement
      - form: "[because it rained]"
        note: P with clause complement
      - form: "[from under the bed]"
        note: P with PP complement; <i>under the bed</i> expresses the source location
      - form: "[outside]"
        note: Complete PP consisting of one complementless preposition
constraints:
  - type: syntactic
    description: "The phrase is headed by a preposition; locative members accept such modifiers as <i>right</i> and <i>straight</i>."
relatedConstructions:
  - id: phrase-001
    relationship: specialization-of
    parthood: formal
  - id: preposition-001
    relationship: contains
    parthood: formal
    notes: The head is a preposition
lexiconRefs:
  - gold/prepositions
grounds:
  - source: cgel-2002
    locator: "Ch. 7 §§2, 4–5"
    relation: discusses
    bears-on: projection
kind:
  provisional: true
  projection:
    target: "A preposition can head a phrase even without an NP after it, as in <i>We waited outside</i>. Some heads take a different category, as with <i>because it rained</i>, and a PP can itself be selected, as with <i>from under the stairs</i>."
    evidence: "CGEL classifies PPs by their heads and documents complement types and functions rather than identifying them through the presence of an NP alone."
    confidence: medium
